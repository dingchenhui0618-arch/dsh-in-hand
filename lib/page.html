  if (typeof t === 'number' && isFinite(t)) return t
  if (typeof t === 'string') {
    var n = Date.parse(t)
    if (isFinite(n)) return n
  }
  return 0
}
function fmtDuration(ms){
  ms = Math.max(0, Number(ms) || 0)
  if (ms < 1000) return Math.max(1, Math.round(ms)) + ' ms'
  if (ms < 10000) return (ms / 1000).toFixed(1) + ' 秒'
  if (ms < 60000) return Math.round(ms / 1000) + ' 秒'
  var min = Math.floor(ms / 60000)
  var sec = Math.round((ms % 60000) / 1000)
  return min + ' 分 ' + sec + ' 秒'
}
function responseStartAt(){
  return S.stepStartedAt || S.turnStartedAt || S.lastUserAt || 0
}
function responseDurationAt(at){
  var start = responseStartAt()
  return start && at && at >= start ? at - start : 0
}
function finalizeTurn(at, repaint){
  var i = S.lastAssistantIndex
  if (i < 0 || !S.turnStartedAt || !at || at < S.turnStartedAt) return
  S.items[i].durationMs = at - S.turnStartedAt
  if (repaint) renderAt(i)
}
function shortId(id){ id = String(id||''); return id.length > 12 ? id.slice(0,8)+'…' : id }

// 工具名 → 人话。表里没有就显示原名，不隐藏、不猜。
var TOOL = {
  pwsh:'运行命令', read:'读取文件', write:'写入文件', edit:'修改文件',
  glob:'查找文件', grep:'搜索内容', web_search:'联网搜索', web_fetch:'打开网页',
  subagent:'派发子任务', subagent_fork:'派发子任务', todo_write:'更新任务清单',
  skill:'加载技能', job_output:'读取后台任务', job_kill:'结束后台任务',
  job_list:'查看后台任务', create_goal:'建立目标', update_goal:'更新目标',
  present:'交付文件', ask_user_question:'向你提问', read_image:'看图',
  cordis_define:'定义插件', cordis_run:'启动插件', cordis_inspect_self:'检查插件',
  workflow:'运行工作流', ralph:'运行迭代循环'
}
function toolLabel(name){ return TOOL[name] || name || '操作' }

// 从工具参数里挑出**完整原文**（命令 / 路径 / 提示词…）。
// 2026-10-21 改动：摘要态不再显示它，所以这里不再截 160 字、也不再压掉换行 ——
// 展开后要看到的就是"当时真正发出去的那段命令"，复制拿到的也必须是全文。
function argHint(raw){
  var s = '', o = null
  if (raw && typeof raw === 'object') o = raw
  else {
    s = String(raw == null ? '' : raw)
    if (!s) return ''
    try { o = JSON.parse(s) } catch (e) { /* 不是 JSON：按原文 */ }
  }
  if (o && typeof o === 'object') {
    var keys = ['command','file_path','path','pattern','query','url','prompt','description','id','name']
    for (var i = 0; i < keys.length; i++) {
      var v = o[keys[i]]
      if (typeof v === 'string' && v) return v
    }
    var ks = Object.keys(o)
    if (ks.length && typeof o[ks[0]] === 'string') return o[ks[0]]
    try { return JSON.stringify(o) } catch (e2) { return s }
  }
  return s
}

// 只认 text 块；其它类型不硬塞成文字。
function blocksText(blocks){
  var out = ''
  if (!Array.isArray(blocks)) return out
  for (var i = 0; i < blocks.length; i++) {
    var b = blocks[i]
    if (b && b.type === 'text' && typeof b.text === 'string') out += (out ? '\n' : '') + b.text
  }
  return out
}

// ---------------------------------------------------------------------------
// 状态
// ---------------------------------------------------------------------------
var S = {
  sessionId: '',
  // 主对话所在的根会话；看子代理时 sessionId 会变，但它保持不变，返回时靠它。
  rootId: '',
  // 正在二级视图里查看的子代理 id（空 = 主对话）。路由 #subagents/<id> 与它对应。
  viewingAgent: '',
  // 子代理对话是**只读历史快照**（宿主 /taskwatch/session），不走 SSE，也不能发消息。
  agentView: false,
  inputPh: '',
  // 每次切会话 +1：异步回包凭它判断"这还是不是当初那次请求"。
  epoch: 0,
  // 上一次会话与其中最后一条正文的开头：自检用它断言"切完没有残留"。
  prevSessionId: '',
  prevSessionSample: '',
  title: '',
  workspace: '',
  provider: '',
  model: '',
  sessions: [],
  items: [],
  seq: 0,
  running: false,
  es: null,
  // 连接质量（三点指示器）：事件流是否开着、最近一帧的时间、成功重连次数。
  esOpen: false,
  esEverOpen: false,
  esError: false,
  lastFrameAt: 0,
  reconnects: 0,
  httpOk: true,
  streaming: null,
  pending: null,
  pendingAttachments: [],
  attachments: [],
  chatReady: true,
  // 只看对话：隐藏工具步骤与注入上下文（偏好存 localStorage['tw-chat-only']）。
  chatOnly: false,
  // DSH 的事件时间是 epoch ms。step 优先于 turn，这样助手气泡显示的是本步耗时；
  // 没有 step 帧时退回整轮，流式兜底也能给出真实的用时。
  turnStartedAt: 0,
  stepStartedAt: 0,
  lastUserAt: 0,
  lastAssistantIndex: -1
}

// 消息队列（宿主 /taskwatch/chat/queue）的本地视图。
// supported === false 表示宿主没注册这条路由（404）—— 整块 UI 不渲染，也不报错。
// state: 'unknown' | 'ok' | 'error' | 'off'
var Q = {
  sid: '', supported: null, state: 'unknown', checkedSid: '',
  running: false, items: [], steering: [], counts: { queued: 0, steering: 0 },
  truncated: false, open: false, busy: false, note: '', noteBad: false
}

// 冷会话标题缓存。
//
// 宿主侧 SessionSummary **没有** title 字段，所以列表里冷会话只能退化成目录名
// （实测 60 条全叫 "Projects"，完全没法挑）。真标题要从事件日志里取一次
// （/taskwatch/chat/titles）。结果缓存在本机 localStorage：
// 只有第一次打开列表会慢一下，之后直接命中。
var titles = {}
try { titles = JSON.parse(localStorage.getItem('taskwatch.titles') || '{}') || {} } catch (e) { titles = {} }

// ---------------------------------------------------------------------------
// 归一化
// ---------------------------------------------------------------------------
function contentAttachments(blocks){
  var out = []
  if (!Array.isArray(blocks)) return out
  for (var i = 0; i < blocks.length; i++) {
    var b = blocks[i]
    if (!b || typeof b !== 'object' || !b.attachment || typeof b.attachment !== 'object') continue
    var ref = b.attachment
    if (!ref.attachmentId) continue
    if (b.type === 'image') out.push({ kind:'image', id:String(ref.attachmentId), name:String(ref.name || '图片'), mime:String(ref.mediaType || 'image/png') })
    else if (b.type === 'file') out.push({ kind:'file', id:String(ref.attachmentId), name:String(ref.name || '文件'), bytes:Number(ref.bytes) || 0 })
  }
  return out
}
/** 判断一条 role:'user' 消息是不是**宿主注入的上下文**，而不是用户打的字。
 *
 *  这不是内容审查：命中时原文完整保留，只是在气泡里默认收起（点开照读）。
 *  判据只认几种开头，宁可漏判也不误折叠用户自己写的话 —— 误判的代价是
 *  "我说的东西被藏起来了"，比多显示一段注入更难接受。 */
function injectionKind(text){
  var s = String(text == null ? '' : text).replace(/^\s+/, '')
  if (/^<system-reminder>/i.test(s)) return '系统注入'
  if (/^<available_skills>/i.test(s)) return '技能清单'
  if (/^This is an automatically generated checkpoint/i.test(s)) return '会话摘要'
  if (/^<compacted-summary>/i.test(s)) return '会话摘要'
  if (/^Current runtime context\./i.test(s)) return '运行上下文'
  if (/^Time sampled (while|at) /i.test(s)) return '运行上下文'
  if (/^Current working directory:/i.test(s)) return '运行上下文'
  return ''
}
function normUser(d, ev){
  // 工具结果同样是 role:'user'，但它不是"人说的话"，必须挡掉。
  if (d && d.source && d.source.kind === 'tool') return null
  var text = blocksText(d && d.content)
  var attachments = contentAttachments(d && d.content)
  if (!text && !attachments.length) return null
  return { kind:'user', text:text, attachments:attachments, time:eventTime(ev), injected:injectionKind(text) }
}
function normAssistant(d, ev){
  var m = d && d.message
  var text = blocksText(m && m.content)
  if (!text) return null
  var at = eventTime(ev)
  return {
    kind:'assistant', text:text, interrupted: !!(d && d.interrupted), time:at,
    durationMs: responseDurationAt(at)
  }
}
// collapsed 只活在内存里（S.items[i].collapsed），不进 localStorage：
// 展开/收起是"这一眼看什么"的临时选择，不是跨设备偏好。
// 默认 true = 收成一行摘要；markTool 只改 status、不碰 collapsed，
// 所以同一 callId 从 pending → ok/no 时，用户展开过的卡不会被弹回折叠。
function toolItem(name, args, callId, status, time){
  return {
    kind:'tool', callId:String(callId||''), name:name||'', hint:argHint(args),
    status:status, time:Number(time) || 0, collapsed:true
  }
}
// tool/result 的 callId 在 data.message.source.callId —— **不在顶层**。
// 2026-09-22 实测踩过：按顶层 d.callId 读会拿到 undefined，于是每来一个工具结果
// 都会新插一张错卡，而不是把原来那张改成「完成」。这类错误静态检查看不见，
// 只有真跑一轮带工具调用的对话才会暴露。
function resultCallId(d){
  if (!d) return ''
  if (d.message && d.message.source && d.message.source.callId) return String(d.message.source.callId)
  var c = d.message && Array.isArray(d.message.content) ? d.message.content : null
  if (c && c[0] && c[0].toolCallId) return String(c[0].toolCallId)
  return ''
}
function markTool(callId, failed, time){
  var id = String(callId||'')
  for (var i = S.items.length - 1; i >= 0; i--) {
    if (S.items[i].kind === 'tool' && S.items[i].callId === id) {
      S.items[i].status = failed ? 'no' : 'ok'
      if (time) S.items[i].time = Number(time) || S.items[i].time
      return i
    }
  }
  S.items.push(toolItem('', '', id, failed ? 'no' : 'ok', time))
  return S.items.length - 1
}

function acceptEvent(ev, sid){
  if (!ev || typeof ev !== 'object') return
  // 旧会话的 SSE 帧绝不能落进新会话（切会话的竞态就靠这一行 + SEQ 双保险）。
  if (sid && sid !== S.sessionId) return
  var t = ev.type, d = ev.data
  if (typeof ev.seq === 'number' && ev.seq > S.seq) S.seq = ev.seq
  if (t === 'user/message') {
    var u = normUser(d, ev)
    if (u && u.time) S.lastUserAt = u.time
    if (u) { S.items.push(u); dropPending(); renderAt(S.items.length - 1) }
  } else if (t === 'assistant/message') {
    var a = normAssistant(d, ev)
    // 顺序很重要：先落进 S.items，再收流式气泡。反过来 finishStreaming() 会以为
    // 服务端没给正式消息而补一条，同一段话于是建两条。
    if (a) { S.items.push(a); S.lastAssistantIndex = S.items.length - 1 }
    finishStreaming()
    if (a) renderAt(S.items.length - 1)
  } else if (t === 'tool/call') {
    S.items.push(toolItem(d && d.name, d && d.arguments, d && d.callId, 'run', eventTime(ev)))
    renderAt(S.items.length - 1)
  } else if (t === 'tool/result') {
    renderAt(markTool(resultCallId(d), !!(d && d.error), eventTime(ev)))
  } else if (t === 'session/title') {
    setTitle(d && d.title)
  } else if (t === 'step/start') {
    S.stepStartedAt = eventTime(ev) || Date.now()
  } else if (t === 'step/end') {
    // assistant/message 已经用 step/start → message.time 算出耗时；这里只保留
    // stepStartedAt，供没有正式消息、只有流式增量的兜底路径使用。
  } else if (t === 'turn/start') {
    S.turnStartedAt = eventTime(ev) || Date.now()
    S.stepStartedAt = 0
    S.lastAssistantIndex = -1
    S.running = true; syncSend()
  } else if (t === 'turn/end') {
    var endedAt = eventTime(ev) || Date.now()
    S.running = false; finishStreaming(endedAt); finalizeTurn(endedAt, true); syncSend()
    S.turnStartedAt = 0
    S.stepStartedAt = 0
    S.lastAssistantIndex = -1
  }
}

function applySnapshot(f, sid){
  // 快照是整段替换：回包如果属于旧会话，直接丢，绝不能拿它覆盖新会话的列表。
  if (sid && sid !== S.sessionId) return
  S.items = []
  S.seq = typeof f.cursor === 'number' ? f.cursor : 0
  S.turnStartedAt = 0
  S.stepStartedAt = 0
  S.lastUserAt = 0
  S.lastAssistantIndex = -1
  var recs = Array.isArray(f.records) ? f.records : []
  for (var i = 0; i < recs.length; i++) {
    var r = recs[i]
    if (!r || r.type !== 'event' || !r.event) continue
    var ev = r.event, d = ev.data
    if (typeof ev.seq === 'number' && ev.seq > S.seq) S.seq = ev.seq
    if (ev.type === 'user/message') { var u = normUser(d, ev); if (u) { if (u.time) S.lastUserAt = u.time; S.items.push(u) } }
    else if (ev.type === 'assistant/message') { var a = normAssistant(d, ev); if (a) { S.items.push(a); S.lastAssistantIndex = S.items.length - 1 } }
    else if (ev.type === 'tool/call') S.items.push(toolItem(d && d.name, d && d.arguments, d && d.callId, 'run', eventTime(ev)))
    else if (ev.type === 'tool/result') markTool(resultCallId(d), !!(d && d.error), eventTime(ev))
    else if (ev.type === 'session/title') pendingTitle = d && d.title
    else if (ev.type === 'step/start') S.stepStartedAt = eventTime(ev) || S.turnStartedAt
    else if (ev.type === 'step/end') { /* 见 acceptEvent：正式消息已计算耗时 */ }
    else if (ev.type === 'turn/start') { S.turnStartedAt = eventTime(ev) || 0; S.stepStartedAt = 0; S.lastAssistantIndex = -1; S.running = true }
    else if (ev.type === 'turn/end') { finalizeTurn(eventTime(ev), false); S.running = false; S.turnStartedAt = 0; S.stepStartedAt = 0; S.lastAssistantIndex = -1 }
  }
  S.pending = null
  S.streaming = null
  renderAll()
  if (pendingTitle) setTitle(pendingTitle)
  pendingTitle = ''
  syncSend()
}

// ---------------------------------------------------------------------------
// 渲染
// ---------------------------------------------------------------------------
var log = $('log')
var pendingTitle = ''

function nearBottom(){ return log.scrollHeight - log.scrollTop - log.clientHeight < 90 }
function toBottom(){ log.scrollTop = log.scrollHeight }

// ── 回到底部 ──────────────────────────────────────────────────────────────
// 长对话被冲到下面之后，必须有个东西能一键回到最新，并告诉用户期间来了几条。
// 这里的 scroll 监听是 **passive + requestAnimationFrame 节流** 的：每次滚动
// 最多做一次布尔判断，既不读也不写布局，所以不会拖慢滚动。
var unseen = 0
var tbTick = 0
function tbEl(){ return document.getElementById('tobottom') }
function syncUnseen(){
  var b = tbEl(); if (!b) return
  var n = b.querySelector('.n'); if (!n) return
  if (unseen > 0) { n.hidden = false; n.textContent = unseen > 99 ? '99+' : String(unseen) }
  else n.hidden = true
}
function syncToBottom(){
  var b = tbEl(); if (!b) return
  if (nearBottom()) { b.classList.remove('on'); unseen = 0; syncUnseen() }
  else b.classList.add('on')
}
/** 有新内容落进日志时调用：没贴在底部就累计未读，并让按钮浮出来。 */
function noteIncoming(){
  if (!nearBottom()) { unseen++; syncUnseen() }
  syncToBottom()
}
log.addEventListener('scroll', function(){
  if (tbTick) return
  tbTick = requestAnimationFrame(function(){ tbTick = 0; syncToBottom() })
}, { passive:true })
if (tbEl()) tbEl().addEventListener('click', function(){ toBottom(); unseen = 0; syncUnseen(); syncToBottom() })
function rowNode(cls){ var r = document.createElement('div'); r.className = 'row ' + cls; return r }
/** 复制到剪贴板。navigator.clipboard 在非 HTTPS 或旧 WebView 里可能不存在，
 *  所以留一条 execCommand 的老路；两条都失败就明说"复制失败"，不假装成功。 */
function copyText(s, btn){
  function done(ok){
    if (!btn) return
    var old = btn.getAttribute('data-label') || btn.textContent
    btn.setAttribute('data-label', old)
    btn.textContent = ok ? '已复制' : '复制失败'
    setTimeout(function(){ btn.textContent = old }, 1500)
  }
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(s).then(function(){ done(true) }, function(){ done(false) })
      return
    }
  } catch (e) {}
  try {
    var ta = document.createElement('textarea')
    ta.value = s; ta.setAttribute('readonly','')
    ta.style.position = 'fixed'; ta.style.top = '-1000px'
    document.body.appendChild(ta); ta.select()
    var ok = document.execCommand('copy')
    document.body.removeChild(ta); done(ok)
  } catch (e) { done(false) }
}

/** 代码块：``` 围栏之间的内容，放进一个自己会横竖滚的 <pre>，头上一行可复制。
 *  内容依旧走 textContent —— "模型文本绝不进 innerHTML" 这条铁律不变。 */
function codeNode(lang, body, fold){
  var box = document.createElement('div'); box.className = 'code'
  var bar = document.createElement('div'); bar.className = 'codebar'
  var lg = document.createElement('span'); lg.className = 'lang'
  lg.textContent = lang || '代码'
  var cp = document.createElement('button')
  cp.type = 'button'; cp.setAttribute('aria-label','复制这段代码')
  cp.textContent = '复制'
  cp.addEventListener('click', function(){ copyText(body, cp) })
  bar.appendChild(lg)
  // 长行给一句明说。手机上横向滚动没有滚动条，不提示的话用户会以为
  // 那一行"本来就是这么断的"。只在真有长行时才出现，不占常驻空间。
  var lines = String(body).split('\n'), longLine = false
  for (var i = 0; i < lines.length; i++) if (lines[i].length > 46) { longLine = true; break }
  // 用户气泡里的代码转储（>3 行）默认只露 3 行：先给行数，点开看全。
  // 不删字、不截断数据，只是把可视高度收起来。
  if (fold && lines.length > 3) {
    box.classList.add('clip')
    var cx = document.createElement('button')
    cx.type = 'button'; cx.className = 'cx'
    cx.setAttribute('aria-expanded','false')
    cx.setAttribute('aria-label','展开这段代码（共 ' + lines.length + ' 行）')
    cx.textContent = '展开'
    cx.addEventListener('click', function(){
      var open = box.classList.toggle('open')
      cx.setAttribute('aria-expanded', open ? 'true' : 'false')
      cx.setAttribute('aria-label', (open ? '收起' : '展开') + '这段代码（共 ' + lines.length + ' 行）')
      cx.textContent = open ? '收起' : '展开'
    })
    bar.appendChild(cx)
  }
  if (longLine) {
    var sh = document.createElement('span')
    sh.className = 'scrollhint'
    sh.textContent = '可横滑'
    bar.appendChild(sh)
  }
  bar.appendChild(cp)
  var pre = document.createElement('pre'); pre.textContent = body
  box.appendChild(bar); box.appendChild(pre)

}

/** 折叠按钮：默认收起，点开看全文。aria-expanded 让读屏知道当前状态。 */
function foldBtn(bub, chars){
  var btn = document.createElement('button')

  btn.setAttribute('aria-expanded','false')
  btn.innerHTML = ICON_CHEV          // 文件内常量，非模型文本
  btn.appendChild(document.createTextNode('展开全文（约 ' + chars + ' 字）'))

    var open = bub.classList.toggle('open')

  })

}

var FOLD_CHARS = 620

/** 从**文件内**的 SVG 常量造一个节点。html 参数只接受上面的 ICON_*，
 *  模型文本与宿主文本永远不走这里（那两类只走 textContent）。 */
function iconSvg(html){
  var box = document.createElement('span')
  box.innerHTML = html
  return box.firstChild || document.createTextNode('')
}

/** 气泡。返回的是 .bubwrap 包裹层（里面才是 .bub），这样折叠按钮不会被
 *  max-height 一起裁掉。
 *
 *  两种渲染：
 *   - 不含 ``` 围栏：整段一个文本节点。流式期间只改 textContent，代价最低。
 *   - 含围栏：拆成「文字 · 代码块 · 文字」，代码块自己会滚，不用把页面顶宽。 */
/** 行内标记：`代码`、**粗体**，以及**交付文件**（图片 / 链接 / 裸路径）。
 *
 *  安全要点（不变）：模型文本**永远不进 innerHTML**，全部走 createTextNode / textContent。
 *  这里用一次 exec 扫描，而不是多次 split —— 多次 split 会互相破坏：先按 ** 切开、
 *  再按 ` 切，粗体里的反引号就会把标记配错，页面上冒出半截星号。
 *
 *  路径识别只做一件事：把「看起来是这台电脑上的文件」的文本换成同源的
 *  /taskwatch/file 链接。**能不能读由服务端白名单裁决** —— 不在白名单里的路径，
 *  info 探测会失败，页面原样保留那段文字，看不出任何差别。
 */
/** 长 token（URL / 路径 / 哈希 / 文件名）的断行点：在分隔符后插 <wbr>。
 *
 *  为什么不是只靠 overflow-wrap:anywhere：anywhere 允许在**任意字符**间断，
 *  中文混排时会把 URL 拦腰截成两段（`https://exa` / `mple.com/...`）。
 *  <wbr> 只在 / \ _ - ? & = # . : 之后给机会，既能换行又保住可读的分段。
 *  <wbr> 不产生字符，textContent 与复制内容都不变。
 *  只对 ≥28 字符的连续非空白串动手，短 token 保持原样。
 */
function appendLongToken(el, tok){
  var re = /[\/\\_\-?&=#.:]+/g, m, last = 0
  while ((m = re.exec(tok)) !== null) {
    var end = m.index + m[0].length
    if (end >= tok.length) break          // 末尾分隔符后面没有内容，插 wbr 没意义
    if (end - last < 8) continue          // 太密的分隔符不插，免得一段字碎成十几块
    el.appendChild(document.createTextNode(tok.slice(last, end)))
    el.appendChild(document.createElement('wbr'))
    last = end
  }
  if (last < tok.length) el.appendChild(document.createTextNode(tok.slice(last)))
}
function appendPlain(el, text){
  if (!text) return
  var re = /[^\s]{28,}/g, last = 0, m
  while ((m = re.exec(text)) !== null) {
    if (m.index > last) el.appendChild(document.createTextNode(text.slice(last, m.index)))
    appendLongToken(el, m[0])
    last = m.index + m[0].length
  }
  if (last < text.length) el.appendChild(document.createTextNode(text.slice(last)))
}

function inlineInto(el, text){
  var re = /(!\[[^\]\n]*\]\([^)\n]+\))|(\[[^\]\n]+\]\([^)\n]+\))|(`[^`\n]+`)|(\*\*[^*\n]+\*\*)|((?:[A-Za-z]:[\\/]|~[\\/])[^\s<>"'`)\]]+\.(?:png|jpe?g|webp|gif|pdf|txt|md|json|csv|log|mp4|zip))/gi

  while ((m = re.exec(text)) !== null) {
    if (m.index > last) appendPlain(el, text.slice(last, m.index))
    var tok = m[0]
    if (m[1]) {
      el.appendChild(imageFromMarkdown(tok))
    } else if (m[2]) {
      appendLink(el, tok)
    } else if (m[3]) {
      var c = document.createElement('code')
      c.textContent = tok.slice(1, -1)
      el.appendChild(c)
    } else if (m[4]) {
      var st = document.createElement('strong')
      st.textContent = tok.slice(2, -2)
      el.appendChild(st)
    } else {
      el.appendChild(probePath(tok))
    }
    last = m.index + tok.length
  }
  if (last < text.length) appendPlain(el, text.slice(last))
  return el
}

// ── 交付文件 ────────────────────────────────────────────────────────────────
//
// 为什么值得做：手机上「生成了一张图」如果只表现为一个文件名，等于没看见结果；
// PDF 这类没法内嵌预览的，至少要把名字、大小、类型讲清楚，再给一个能点开的入口。
//
// 为什么路径探测要缓存：一段回复里可能有十几个路径，而流式渲染每帧都会重跑
// blocksInto —— 不缓存就是每帧十几个请求打在本机插件上。一个路径只问一次。
var FILE_ROUTE = '/taskwatch/file'
var PATH_CACHE = {}          // 路径 -> info 对象 / 0（已知不可读）

function fmtBytes(n){
  var b = Number(n) || 0
  if (b < 1024) return b + ' B'
  if (b < 1048576) return (b / 1024).toFixed(b < 10240 ? 1 : 0) + ' KB'
  return (b / 1048576).toFixed(b < 10485760 ? 1 : 0) + ' MB'
}
function extOf(p){
  var m = /\.([A-Za-z0-9]{1,6})(?=$|[?#])/.exec(String(p == null ? '' : p))
  return m ? m[1].toLowerCase() : ''
}
function kindLabel(p){
  var e = extOf(p)
  if (e === 'jpeg') e = 'jpg'
  return e ? e.toUpperCase() : 'FILE'
}
function baseName(p){
  var s = String(p == null ? '' : p).replace(/[\\/]+$/, '')
  var i = Math.max(s.lastIndexOf('/'), s.lastIndexOf('\\'))

}
function looksLikeFile(p){ return /^[A-Za-z]:[\\/]/.test(p) || /^~[\\/]/.test(p) }
function fileUrlFor(p){

}
function targetOf(raw){
  var s = String(raw == null ? '' : raw).trim()
  if (!s) return null
  if (/^data:image\//i.test(s)) return { url: s, kind: 'data' }
  if (s.indexOf(FILE_ROUTE) === 0) return { url: s, kind: 'route' }
  if (/^https?:\/\//i.test(s)) return { url: s, kind: 'web' }
  if (looksLikeFile(s)) return { url: fileUrlFor(s), kind: 'file' }
  return null
}
function imageFromMarkdown(tok){
  var m = /^!\[([^\]\n]*)\]\(([^)\n]+)\)$/.exec(tok)
  var t = m ? targetOf(m[2]) : null
  if (!t) return document.createTextNode(tok)
  return imgNode(t.url, (m[1] || '').trim() || baseName(m[2]))
}
function appendLink(el, tok){
  var m = /^\[([^\]\n]+)\]\(([^)\n]+)\)$/.exec(tok)
  var t = m ? targetOf(m[2]) : null
  if (!t) { el.appendChild(document.createTextNode(tok)); return }
  if (t.kind === 'web') {
    var a = document.createElement('a')
    a.className = 'md-a'
    a.href = t.url
    a.target = '_blank'
    a.rel = 'noopener noreferrer'
    a.textContent = m[1]
    el.appendChild(a)
    return
  }
  if (t.kind === 'data') { el.appendChild(imgNode(t.url, m[1])); return }
  el.appendChild(fileCard(t.url, m[1], kindLabel(m[2])))
}
/** 裸路径：先问服务端能不能读；读得到才换成图或卡片，读不到就保持纯文本。 */
function probePath(p){
  var holder = document.createElement('span')
  holder.textContent = p

  var url = fileUrlFor(p)
  if (PATH_CACHE[p] === 0) return holder
  if (PATH_CACHE[p]) {
    var info = PATH_CACHE[p]
    return info.kind === 'image' ? imgNode(url, info.name || p) : fileCard(url, info.name || p, kindLabel(p))
  }
  try {
    fetch(url + '&info=1', { cache: 'no-store' })
      .then(function(r){ return r.ok ? r.json() : null })
      .then(function(j){
        if (!j || j.error) { PATH_CACHE[p] = 0; return }
        PATH_CACHE[p] = j
        if (!holder.parentNode) return
        var node = j.kind === 'image' ? imgNode(url, j.name || p) : fileCard(url, j.name || p, kindLabel(p))
        holder.parentNode.replaceChild(node, holder)
      })
      .catch(function(){ PATH_CACHE[p] = 0 })
  } catch (e) { /* 忽略 */ }

}
/** 破图提示条里的图标。走 createElementNS —— markdown 渲染段内不拼 HTML 字符串
 *  （契约测试会扫这一段），所以这里也不破例。 */
function brokenImgIconNode(){
  var NS = 'http://www.w3.org/2000/svg'
  var svg = document.createElementNS(NS, 'svg')
  svg.setAttribute('viewBox', '0 0 24 24')
  svg.setAttribute('aria-hidden', 'true')
  // 相框 + 山形 + 一道斜杠：一眼读作"图裂了"，不依赖任何字体字形。
  var ds = ['M4 5h16v14H4z', 'M4 16.5l4.5-4.5 3.5 3.5 3-3 4.5 4.5', 'M3.5 3.5l17 17']
  for (var i = 0; i < ds.length; i++) {
    var p = document.createElementNS(NS, 'path')
    p.setAttribute('d', ds[i])
    svg.appendChild(p)
  }
  return svg
}

/** 图能不能"打开原图"：只有同源路由 / http(s) 才给 <a>；data: / blob: 只能就地重试。 */
function canReopenImage(url){
  var s = String(url || '')
  return /^https?:\/\//i.test(s) || s.charAt(0) === '/'
}

/** 图片加载失败的兜底 UI（v1.7.7）。
 *
 *  以前这里换成一张整宽的 .filecard（63px、两行说明）：视觉上仍是一块"占位框"，
 *  把一段话从中间截断。现在统一成一条 **36px 单行提示条**：
 *    · 能打开原地址的给 <a target=_blank>（"图片未能加载 · 打开原图"）；
 *    · data: / blob: 这类重开没意义的给 <button>，点一下就地重新加载。
 *  高度写死在 CSS（36px / max 44px），文字单行 ellipsis，所以不会再撑高正文。
 */
function brokenImgBar(url, alt){
  var reopen = canReopenImage(url)
  var el = document.createElement(reopen ? 'a' : 'button')
  el.className = 'imgerr'
  if (reopen) {
    el.href = url
    el.target = '_blank'
    el.rel = 'noopener noreferrer'
  } else {
    el.type = 'button'
    el.addEventListener('click', function(){
      if (!el.parentNode) return
      var fresh = imgNode(url, alt)
      el.parentNode.replaceChild(fresh, el)
    })
  }
  el.setAttribute('aria-label', (alt ? alt + '：' : '') + '图片未能加载，' + (reopen ? '点一下打开原图' : '点一下重试'))
  el.title = (alt ? alt + ' · ' : '') + (url || '')
  el.appendChild(brokenImgIconNode())
  var t = document.createElement('span')
  t.className = 't'
  t.textContent = '图片未能加载 · ' + (reopen ? '打开原图' : '点一下重试')
  el.appendChild(t)
  return el
}

/** 把失败的 <img>（连同它的 .md-imgwrap）换成提示条。幂等：已被换掉就什么都不做。 */
function swapBrokenImg(img, url, alt){
  if (!img || !img.parentNode) return false
  var wrap = img.closest ? img.closest('.md-imgwrap') : null
  if (wrap && !wrap.parentNode) return false      // 已经换过一次了，别再动
  var target = wrap || img
  if (!target.parentNode) return false
  target.parentNode.replaceChild(brokenImgBar(url, alt), target)
  return true
}

function imgNode(url, alt){
  var wrap = document.createElement('button')
  wrap.type = 'button'
  wrap.className = 'md-imgwrap'
  wrap.setAttribute('aria-label', alt ? ('查看大图：' + alt) : '查看大图')
  var img = document.createElement('img')
  img.className = 'md-img'
  img.loading = 'lazy'
  img.decoding = 'async'
  img.alt = alt || ''
  // 事件必须**先挂再赋 src**：同一条坏 URL 第二次出现时（浏览器已经记住这次失败），
  // error 可能在赋值那一刻就排队，挂晚了就再也收不到，页面上只留一个破图空框。
  img.addEventListener('error', function(){ swapBrokenImg(img, url, alt) })
  img.src = url
  wrap.appendChild(img)
  wrap.addEventListener('click', function(){ openLightbox(url, alt) })
  // 兜底二：命中"失败缓存"时 complete 会立刻为 true 且 naturalWidth 还是 0，
  // 而那一次 error 可能已经错过 —— 追加进 DOM 之后补一刀（此时 wrap 已有父节点）。
  setTimeout(function(){
    if (img.complete && !img.naturalWidth) swapBrokenImg(img, url, alt)
  }, 0)
  return wrap
}
function fileCard(url, label, kind){
  var a = document.createElement('a')
  a.className = 'filecard'
  a.href = url
  a.target = '_blank'
  a.rel = 'noopener'
  var ic = document.createElement('span')
  ic.className = 'fi'
  ic.textContent = kind || 'FILE'
  var fm = document.createElement('span')
  fm.className = 'fm'
  var fn = document.createElement('span')
  fn.className = 'fn'
  fn.textContent = label || '文件'
  var fs = document.createElement('span')
  fs.className = 'fs'
  fs.textContent = '点开查看'
  fm.appendChild(fn)
  fm.appendChild(fs)
  a.appendChild(ic)
  a.appendChild(fm)
  if (url.indexOf('blob:') !== 0) fillInfo(fs, url)
  return a
}
/** 卡片第二行先用「点开查看」，元数据回来再补上类型 / 大小 / 尺寸。 */
function fillInfo(fs, url){
  try {
    fetch(url + (url.indexOf('?') >= 0 ? '&' : '?') + 'info=1', { cache: 'no-store' })
      .then(function(r){ return r.ok ? r.json() : null })
      .then(function(j){
        if (!j || j.error) return
        var bits = []
        if (j.kind) bits.push(String(j.kind).toUpperCase())
        if (j.bytes) bits.push(fmtBytes(j.bytes))
        if (j.width && j.height) bits.push(j.width + '×' + j.height)
        if (bits.length) fs.textContent = bits.join(' · ')
      })
      .catch(function(){ /* 拿不到就保持"点开查看" */ })
  } catch (e) { /* 忽略 */ }
}
function brokenFileNode(label){
  var d = document.createElement('div')
  d.className = 'filecard'
  var ic = document.createElement('span')
  ic.className = 'fi'
  ic.textContent = 'ERR'
  var fm = document.createElement('span')
  fm.className = 'fm'
  var fn = document.createElement('span')
  fn.className = 'fn'
  fn.textContent = label
  var fs = document.createElement('span')
  fs.className = 'fs'
  fs.textContent = '这份内容现在读不到了（可能已移走或不在白名单里）'
  fm.appendChild(fn)
  fm.appendChild(fs)
  d.appendChild(ic)
  d.appendChild(fm)
  return d
}
/** 点图放大。手机上原图往往只有几百像素宽，看不清代码截图里的字。 */
function openLightbox(url, alt){
  var lb = document.getElementById('lb')
  if (!lb) {
    lb = document.createElement('div')
    lb.id = 'lb'
    var big = document.createElement('img')
    big.alt = ''
    var x = document.createElement('button')
    x.type = 'button'
    x.className = 'x'
    x.setAttribute('aria-label', '关闭')
    // 关闭图标走 SVG，不用 ✕ 字符：字符图标在不同字体下大小与基线都不一样，
    // 换台设备就变形 —— 这个仓库的结构图标一律矢量（契约测试也会拦下来）。
    var xg = document.createElementNS('http://www.w3.org/2000/svg', 'svg')
    xg.setAttribute('viewBox', '0 0 24 24')
    xg.setAttribute('width', '18')
    xg.setAttribute('height', '18')
    xg.setAttribute('fill', 'none')
    xg.setAttribute('stroke', 'currentColor')
    xg.setAttribute('stroke-width', '2')
    xg.setAttribute('stroke-linecap', 'round')
    xg.setAttribute('aria-hidden', 'true')
    var xp = document.createElementNS('http://www.w3.org/2000/svg', 'path')
    xp.setAttribute('d', 'M6 6l12 12M18 6L6 18')
    xg.appendChild(xp)
    x.appendChild(xg)
    x.addEventListener('click', function(){
      lb.classList.remove('on')
      big.removeAttribute('src')
    })
    lb.appendChild(big)
    lb.appendChild(x)
    lb.addEventListener('click', function(e){ if (e.target === lb) x.click() })
    document.addEventListener('keydown', function(e){ if (e.key === 'Escape') x.click() })
    document.body.appendChild(lb)
  }
  var img = lb.querySelector('img')
  img.alt = alt || ''
  img.src = url
  lb.classList.add('on')
}

function messageAttachmentNode(a){
  var id = encodeURIComponent(a.id)
  if (a.kind === 'image') return imgNode(FILE_ROUTE + '?id=' + id, a.name || '图片')
  return fileCard(FILE_ROUTE + '?id=' + id + '&kind=file&name=' + encodeURIComponent(a.name || '文件'), a.name || '文件', kindLabel(a.name || ''))
}
function messageAttachmentsNode(list){
  if (!Array.isArray(list) || !list.length) return null
  var wrap = document.createElement('div'); wrap.className = 'message-attachments'
  for (var i = 0; i < list.length; i++) wrap.appendChild(messageAttachmentNode(list[i]))
  return wrap
}
function pendingAttachmentNode(a){
  var wrap = document.createElement('div'); wrap.className = 'message-attachments'
  if (a.kind === 'image') wrap.appendChild(imgNode(a.previewURL, a.name || '图片'))
  else wrap.appendChild(fileCard(a.previewURL, a.name || '文件', kindLabel(a.name || '')))
  return wrap
}

/** GFM 表格（v1.7.6）：`| 列 | 列 |` + `| --- | --- |` + 若干行。
 *
 *  以前这些行按普通段落逐行铺开，手机上看到的是 `| 字段 | 值 |` 一串竖线，
 *  列一多就横向挤成一条。现在包进 .tablewrap：**列宽由内容决定，放不下时

 */
function tableCells(line){
  var s = String(line).trim()

  if (s.charAt(s.length - 1) === '|') s = s.slice(0, -1)
  return s.split('|').map(function(x){ return x.trim() })
}
function isTableSep(line){
  var s = String(line).trim()
  if (s.indexOf('|') < 0) return false
  var cells = tableCells(s)
  if (cells.length < 2) return false
  for (var i = 0; i < cells.length; i++) if (!/^:?-{2,}:?$/.test(cells[i])) return false

}
function tableNode(headLine, rowLines){

  table.className = 'md-table'
  var head = tableCells(headLine)

  table.appendChild(thead)
  var tbody = document.createElement('tbody')
  for (var r = 0; r < rowLines.length; r++) {
    var cells = tableCells(rowLines[r]), tr = document.createElement('tr')
    var cols = Math.max(head.length, cells.length)
    for (var k = 0; k < cols; k++) {
      var td = document.createElement('td')
      td.appendChild(inlineInto(document.createDocumentFragment(), cells[k] == null ? '' : cells[k]))
      tr.appendChild(td)
    }
    tbody.appendChild(tr)
  }
  table.appendChild(tbody)
  wrap.appendChild(table)
  return wrap
}

/** 块级标记：`## 标题`、`- 列表项`、空行留白。
 *
 *  只认这几种。每多认一种就多一处可能显示错的地方，而这几种覆盖了模型输出的绝大
 *  多数；真正的重活（代码块）由 bubNode 按 ``` 分流处理，不走这里。
 */
function blocksInto(el, text){
  var lines = String(text).split('\n')
  for (var i = 0; i < lines.length; i++) {
    var ln = lines[i]
    if (!ln.trim()) {
      var gap = document.createElement('div'); gap.className = 'md-blank'
      el.appendChild(gap); continue
    }
    // 表格先判：表头 + 分隔行 + 连续带 | 的行。列数按表头对齐，
    // 多出来的单元格不丢（第 4 列仍渲染），少的部分补空 td。
    if (ln.indexOf('|') >= 0 && i + 1 < lines.length && isTableSep(lines[i + 1]) &&
        tableCells(ln).length === tableCells(lines[i + 1]).length) {
      var rows = [], j = i + 2
      while (j < lines.length && lines[j].trim() && lines[j].indexOf('|') >= 0) {
        rows.push(lines[j]); j++
      }
      el.appendChild(tableNode(ln, rows))
      i = j - 1
      continue
    }
    var h = /^(#{1,4})\s+(.+)$/.exec(ln)
    if (h) {
      var hd = document.createElement('div'); hd.className = 'md-h'
      hd.setAttribute('data-lv', String(h[1].length))
      el.appendChild(inlineInto(hd, h[2])); continue
    }
    var li = /^\s*[-*]\s+(.+)$/.exec(ln)
    if (li) {
      var it = document.createElement('div'); it.className = 'md-li'
      el.appendChild(inlineInto(it, li[1])); continue
    }
    // 引用与分隔线：以前它们会原样显示成 "> 某句话" / "---"，是"密密麻麻"的一部分。
    var bq = /^>\s?(.*)$/.exec(ln)
    if (bq) {
      var qt = document.createElement('div'); qt.className = 'md-bq'
      el.appendChild(inlineInto(qt, bq[1])); continue
    }
    if (/^\s*(?:-{3,}|\*{3,}|_{3,})\s*$/.test(ln)) {
      var hr = document.createElement('div'); hr.className = 'md-hr'
      el.appendChild(hr); continue
    }
    var p = document.createElement('div'); p.className = 'md-p'
    el.appendChild(inlineInto(p, ln))
  }
  return el
}

/* DSH 把「用户贴了一个附件」序列化成一段**信封文本**给模型看：
     <path>C:\…\a.png</path><type>image</type><content>image/png image, 1398x1542 px, 437517 bytes</content>
   这段协议在手机上也原样显示过 —— 用户看到的是 XML 标签（2026-10-22 的
   「Token Router 说明书与印刷 PDF」会话，第一条消息整条都是它）。v1.7.8 解析成
   真正的图片 / 文件卡（同样走 imgNode 的失败兜底），文本里不再留标签。 */
var ENVELOPE_RE = /<path>([\s\S]*?)<\/path>\s*<type>\s*(image|file)\s*<\/type>\s*<content>([\s\S]*?)<\/content>/g
function splitAttachmentEnvelopes(text){
  var images = [], files = []
  var clean = String(text == null ? '' : text).replace(ENVELOPE_RE, function(all, p, kind, meta){
    var path = String(p || '').trim()
    if (!path) return ''
    var info = { path:path, meta:String(meta || '').replace(/\s+/g, ' ').trim() }
    if (kind === 'image') images.push(info)
    else files.push(info)
    return ''
  })
  return {
    text: clean.replace(/\n{3,}/g, '\n\n').replace(/^\s+|\s+$/g, ''),
    images: images,
    files: files
  }
}
function envelopeAttachmentsNode(env){
  var wrap = document.createElement('div'); wrap.className = 'message-attachments'
  var i
  for (i = 0; i < env.images.length; i++) {
    var a = env.images[i]
    var node = imgNode(fileUrlFor(a.path), baseName(a.path))
    if (a.meta) node.title = (node.title ? node.title + ' · ' : '') + a.meta
    wrap.appendChild(node)
  }
  for (i = 0; i < env.files.length; i++) {
    var f = env.files[i]
    wrap.appendChild(fileCard(fileUrlFor(f.path), baseName(f.path), '文件'))
  }
  return wrap.children.length ? wrap : null
}

function bubNode(text, opts){
  var o = opts || {}
  var wrap = document.createElement('div'); wrap.className = 'bubwrap'
  var b = document.createElement('div')
  b.className = 'bub'
  var s = String(text == null ? '' : text)
  var env = splitAttachmentEnvelopes(s)
  if (env.images.length || env.files.length) s = env.text
  var attach = envelopeAttachmentsNode(env)
  if (attach) b.appendChild(attach)
  var parts = s.split('```')
  if (parts.length > 1) {
    for (var i = 0; i < parts.length; i++) {
      if (i % 2 === 0) {
        var plain = parts[i].replace(/^\n+|\n+$/g, '')
        if (plain.trim()) blocksInto(b, plain)
      } else {
        var seg = parts[i]
        var nl = seg.indexOf('\n')
        var lang = nl >= 0 ? seg.slice(0, nl).trim() : ''
        var body = nl >= 0 ? seg.slice(nl + 1) : seg
        b.appendChild(codeNode(lang, body.replace(/\n+$/, ''), !!o.foldCode))
      }
    }
  } else {
    blocksInto(b, s)
  }
  wrap.appendChild(b)
  if (!o.noFold && s.length > FOLD_CHARS) {
    b.classList.add('fold')
    wrap.appendChild(foldBtn(b, s.length))
  }
  return wrap
}

/** 注入上下文：一行摘要 + 默认 hidden 的原文。
 *  和工具卡的折叠同一条原则：收起时正文真的不在可视树里（hidden），
 *  但一个字都不删 —— 点开就能读，复制/选区的行为也和普通气泡一致。 */
function injectionNode(it){
  var wrap = document.createElement('div'); wrap.className = 'bubwrap injwrap'
  var open = !!it.injOpen
  var head = document.createElement('button')
  head.type = 'button'; head.className = 'injhead'
  head.setAttribute('aria-expanded', open ? 'true' : 'false')
  head.setAttribute('aria-label', (open ? '收起' : '展开') + '注入上下文（' + it.injected + '）')

  var ic = document.createElement('span'); ic.className = 'ic'
  ic.appendChild(iconSvg(ICON_CTX))
  head.appendChild(ic)

  var tag = document.createElement('span'); tag.className = 'tag'
  tag.textContent = it.injected || '注入内容'
  head.appendChild(tag)

  var cnt = document.createElement('span'); cnt.className = 'cnt'
  cnt.textContent = '约 ' + String(it.text).length + ' 字'
  head.appendChild(cnt)

  var act = document.createElement('span'); act.className = 'act'
  var actTxt = document.createElement('span')
  actTxt.textContent = open ? '收起' : '展开'
  act.appendChild(actTxt)
  act.appendChild(iconSvg(ICON_CHEV))
  head.appendChild(act)

  var body = bubNode(it.text, { noFold:true })
  body.hidden = !open

  head.addEventListener('click', function(){
    it.injOpen = !it.injOpen
    body.hidden = !it.injOpen
    head.setAttribute('aria-expanded', it.injOpen ? 'true' : 'false')
    head.setAttribute('aria-label', (it.injOpen ? '收起' : '展开') + '注入上下文（' + it.injected + '）')
    actTxt.textContent = it.injOpen ? '收起' : '展开'
  })

  wrap.appendChild(head)
  wrap.appendChild(body)
  return wrap
}
function toolNode(it){
  // 收起 = 默认。it.collapsed 只由用户点击改写；markTool 只改 status，
  // 所以 pending → ok/no 的重渲染会照原样恢复展开/收起。
  var collapsed = it.collapsed !== false
  var d = document.createElement('div')
  d.className = 'tool ' + (it.status === 'run' ? 'run' : it.status === 'no' ? 'no' : 'ok') + (collapsed ? '' : ' open')

  var label = toolLabel(it.name)
  var statusTxt = it.status === 'run' ? '进行中' : (it.status === 'no' ? '失败' : '完成')
  var hasBody = !!it.hint
  var lineCount = hasBody ? String(it.hint).split('\n').length : 0
  var head = document.createElement(hasBody ? 'button' : 'div')
  head.className = 'th'
  if (hasBody) {
    head.type = 'button'
    head.setAttribute('aria-expanded', collapsed ? 'false' : 'true')
    // 摘要在收起态**不出现命令正文**；读屏拿到的是工具名 + 状态 + 时间 + 行数。
    head.setAttribute('aria-label', (collapsed ? '展开完整内容：' : '收起完整内容：') +
      label + ' · ' + statusTxt + (it.time ? ' · ' + hhmm(it.time) : '') +
      (lineCount ? ' · ' + lineCount + ' 行' : ''))
    head.title = label + ' · ' + statusTxt
  }

  if (it.status === 'run') {
    var sp = document.createElement('span'); sp.className = 'sp'; head.appendChild(sp)
  } else {
    // 状态图标同样用 SVG —— 字符 ✓ ✕ 在不同字体下粗细和垂直位置都不一样。
    var ic = document.createElement('span')
    ic.className = 'ti'
    ic.appendChild(iconSvg(it.status === 'no' ? ICON_FAIL : ICON_OK))
    head.appendChild(ic)
  }
  var nm = document.createElement('span'); nm.className = 'n'; nm.textContent = toolLabel(it.name)
  head.appendChild(nm)
  if (it.time) {
    var tm = document.createElement('span'); tm.className = 'tm'; tm.textContent = hhmm(it.time)
    head.appendChild(tm)
  }
  // 「N 行」：展开前就知道这块有多长，比「展开」两个字有用。
  if (lineCount) {
    var ln = document.createElement('span'); ln.className = 'lines'
    ln.textContent = lineCount + ' 行'
    head.appendChild(ln)
  }

  var body = null
  if (hasBody) {
    var ch = document.createElement('span'); ch.className = 'ch'
    ch.appendChild(iconSvg(ICON_CHEV))
    head.appendChild(ch)

    body = document.createElement('div')
    body.className = 'tb'
    body.hidden = collapsed

    var a = document.createElement('div'); a.className = 'a'
    var codeEl = document.createElement('code'); codeEl.textContent = it.hint
    a.appendChild(codeEl)
    body.appendChild(a)

    // 复制的是**完整原文**，不是摘要。按钮留在展开后的正文块里。
    var acts = document.createElement('div'); acts.className = 'acts'
    var cp = document.createElement('button')
    cp.type = 'button'; cp.className = 'more'
    cp.setAttribute('aria-label','复制这条命令')
    cp.textContent = '复制'
    cp.addEventListener('click', function(){ copyText(it.hint, cp) })
    acts.appendChild(cp)
    body.appendChild(acts)

    head.addEventListener('click', function(){
      it.collapsed = !it.collapsed
      body.hidden = it.collapsed
      d.classList.toggle('open', !it.collapsed)
      head.setAttribute('aria-expanded', it.collapsed ? 'false' : 'true')
      head.setAttribute('aria-label', (it.collapsed ? '展开完整内容：' : '收起完整内容：') +
        label + ' · ' + statusTxt + (it.time ? ' · ' + hhmm(it.time) : '') +
        (lineCount ? ' · ' + lineCount + ' 行' : ''))
    })
  }

  d.appendChild(head)
  if (body) d.appendChild(body)
  return d
}
/** 连续工具调用的分组阈值：连续 ≥3 个才收成一组，1~2 个直接平铺（收起反而多一次点击）。 */
var TOOL_GROUP_MIN = 3

/** 取 idx 所在的"连续工具段"。返回 null 表示这段不够长、不该分组。 */
function toolRunAt(idx){
  if (idx < 0 || idx >= S.items.length || S.items[idx].kind !== 'tool') return null
  var start = idx, end = idx
  while (start > 0 && S.items[start - 1].kind === 'tool') start--
  while (end + 1 < S.items.length && S.items[end + 1].kind === 'tool') end++
  if (end - start + 1 < TOOL_GROUP_MIN) return null
  return { start: start, end: end }
}

/** 把一段连续工具调用收成一行摘要。
 *
 *  默认展开还是收起，按状态定（这是"小白也看得懂"的关键，不是装饰）：
 *    有步骤在跑 → 默认展开，看得见进度
 *    有失败      → 默认展开，**失败绝不能被折叠藏起来**
 *    全部完成    → 默认收起成一行，把屏幕让给对话
 */
function groupNode(run){
  var items = S.items.slice(run.start, run.end + 1)
  var running = 0, failed = 0
  for (var i = 0; i < items.length; i++) {
    if (items[i].status === 'run') running++
    else if (items[i].status === 'no') failed++
  }
  var opened = running > 0 || failed > 0

  var box = document.createElement('div')
  box.className = 'toolgroup' + (running ? ' busy' : failed ? ' bad' : '')

  var head = document.createElement('button')
  head.type = 'button'
  head.className = 'gh'
  head.setAttribute('aria-expanded', opened ? 'true' : 'false')

  var dot = document.createElement('span'); dot.className = 'dot'
  head.appendChild(dot)

  var sum = document.createElement('span'); sum.className = 'sum'
  var strong = document.createElement('b'); strong.textContent = items.length + ' 个步骤'
  sum.appendChild(strong)
  sum.appendChild(document.createTextNode(
    running ? ' · ' + running + ' 项进行中'
      : failed ? ' · ' + failed + ' 项失败'
        : ' · 全部完成'))
  head.appendChild(sum)

  var ch = document.createElement('span')
  ch.innerHTML = ICON_CHEV                       // 文件内常量，非模型文本
  var csvg = ch.firstChild
  if (csvg && csvg.setAttribute) csvg.setAttribute('class', 'ch')
  head.appendChild(ch)

  var body = document.createElement('div')
  body.className = 'gb'
  for (var k = 0; k < items.length; k++) body.appendChild(toolNode(items[k]))
  body.hidden = !opened

  head.addEventListener('click', function () {
    var collapsing = !body.hidden
    body.hidden = collapsing
    head.setAttribute('aria-expanded', collapsing ? 'false' : 'true')
  })

  box.appendChild(head)
  box.appendChild(body)
  return box
}

function messageMeta(it){
  var who = it.kind === 'user'
    ? (it.injected || '你')
    : (it.interrupted ? '助手 · 已中断' : '助手')
  var bits = [who]
  if (it.time) bits.push(hms(it.time))
  if (it.kind === 'assistant' && it.durationMs > 0) bits.push('用时 ' + fmtDuration(it.durationMs))
  return bits.join(' · ')
}

/** 找「视觉上」的上一条：只看对话时工具行与注入上下文都不渲染，分组要把它们跳过去。 */
function prevVisibleItem(idx){
  var i = idx - 1
  if (S.chatOnly) {
    while (i >= 0 && (S.items[i].kind === 'tool' || S.items[i].injected)) i--
  }
  return i >= 0 ? S.items[i] : null
}

function nodeFor(it, idx){
  var r = rowNode(it.kind === 'user' ? 'me' : 'ai')
  r.setAttribute('data-i', String(idx))
  if (it.kind !== 'tool') {
    // 消息分组：同一发送者连续多条 → 组内 8px、只在组首留时间 meta；
    // 换发送者 → 组间 24px。工具步骤不算「发送者」，它们前后沿用默认 12px。
    var prev = prevVisibleItem(idx)
    var same = prev && prev.kind === it.kind && !it.injected && !prev.injected
    if (same) r.classList.add('group-next')
    else if (prev && prev.kind !== 'tool') r.classList.add('group-first')
  }
  if (it.kind === 'tool') { r.appendChild(toolNode(it)); return r }
  var files = messageAttachmentsNode(it.attachments)
  if (files) r.appendChild(files)
  if (it.text) {
    if (it.injected) r.appendChild(injectionNode(it))
    // 用户气泡里的代码转储（>3 行）默认折 3 行；助手正文不动 —— 那是要读的内容。
    else r.appendChild(bubNode(it.text, it.kind === 'user' ? { foldCode:true } : null))
  }
  var m = document.createElement('div')
  m.className = 'meta'
  m.textContent = messageMeta(it)
  r.appendChild(m)
  return r
}

/** 分组外面那层 .row：data-i 用这一段工具的**起点**（增量更新靠它定位），
 *  另挂一个 data-g 标记"这是一行分组"，好和单条工具卡区分开。 */
function groupRow(run){
  var r = rowNode('ai')
  r.setAttribute('data-i', String(run.start))
  r.setAttribute('data-g', String(run.start))
  r.appendChild(groupNode(run))
  return r
}

/** 全量重建：只在开场快照时用。 */
function renderAll(){
  // data-session 是"这一屏属于哪个会话"的唯一凭据：自检和排障都读它，
  // 任何异步回包覆盖之前，先看它还是不是当前会话。
  log.setAttribute('data-session', String(S.sessionId || ''))
  log.innerHTML = ''
  if (!S.items.length && S.chatReady) { renderEmpty(); return }
  var frag = document.createDocumentFragment()
  for (var i = 0; i < S.items.length; i++) {
    var item = S.items[i]
    if (S.chatOnly && (item.kind === 'tool' || item.injected)) continue
    if (item.kind === 'tool') {
      var run = toolRunAt(i)
      if (run) {
        frag.appendChild(groupRow(run))
        i = run.end                 // 这一段已经收进分组，跳过剩下的
        continue
      }
    }
    frag.appendChild(nodeFor(item, i))
  }
  log.appendChild(frag)
  // 「只看对话」把工具步骤全藏掉时，可能一行都不剩：给一句说明，不留白屏。
  if (S.chatOnly && !log.children.length && S.chatReady) {
    var note = document.createElement('div')
    note.className = 'note'
    note.textContent = '这个会话目前只有工具步骤 · 在「对话」抽屉里关掉「只看对话」可查看'
    log.appendChild(note)
  }
  renderPending()
  toBottom()
}

/** 排版 / 会话隔离自检（v1.7.6）。
 *
 *  为什么把它放进页面而不是只写测试脚本：手机上的真实溢出只在真机的视口、
 *  字体、安全区下出现；把断言暴露成一个函数，真机连 USB / 用 CDP 就能跑同一套。
 *  只读 DOM 与 S，不写任何状态，失败也不抛错。
 *
 *  用法：twSelfCheck() → { ok, width, checks:[{name,ok,detail}] }
 */
function twSelfCheckRun(){
  var checks = []
  function ck(name, ok, detail){
    checks.push({ name:name, ok:!!ok, detail:String(detail == null ? '' : detail).slice(0, 240) })
  }
  var vw = Math.round(window.innerWidth)
  var doc = document.documentElement, body = document.body
  var box = $('log')
  ck('document.scrollWidth ≤ innerWidth', doc.scrollWidth <= vw + 1, doc.scrollWidth + ' / ' + vw)
  ck('body.scrollWidth ≤ innerWidth', body.scrollWidth <= vw + 1, body.scrollWidth + ' / ' + vw)
  if (box) {
    ck('对话容器无横向滚动', box.scrollWidth <= box.clientWidth + 1, box.scrollWidth + ' / ' + box.clientWidth)
    ck('只显示当前会话', String(box.getAttribute('data-session') || '') === String(S.sessionId || ''),
      (box.getAttribute('data-session') || '(空)') + ' vs ' + (S.sessionId || '(空)'))
    // 内容块不许越出对话区的左右边界。.code pre / .tablewrap 内部可以自己滚，
    // 所以这里只看容器盒，不看它们的 scrollWidth —— 那正是"允许横滑"的地方。
    var r0 = box.getBoundingClientRect()
    var nodes = box.querySelectorAll('.row,.bubwrap,.bub,.tool,.toolgroup,.md-table,.tablewrap,.filecard,.message-attachments')
    var spill = []
    for (var i = 0; i < nodes.length; i++) {
      var r = nodes[i].getBoundingClientRect()
      if (!r.width && !r.height) continue
      if (r.left < r0.left - 0.5 || r.right > r0.right + 0.5) {
        spill.push((nodes[i].className || nodes[i].tagName) + ' ' + Math.round(r.left) + '–' + Math.round(r.right))
      }
    }
    ck('内容块不越出对话区', spill.length === 0, spill.slice(0, 3).join(' | '))
    // 左基线：助手正文 / 流式行 / 工具卡三者左缘必须一致（v1.7.6 的核心排版约束）。
    var edges = []
    var bub = box.querySelector('.row.ai > .bubwrap')
    if (bub) edges.push(['正文', bub.getBoundingClientRect().left])
    var st = box.querySelector('.row.stream > .bubwrap')
    if (st) edges.push(['流式', st.getBoundingClientRect().left])
    var tool = box.querySelector('.row.ai > .tool,.row.ai > .toolgroup')
    if (tool) edges.push(['工具', tool.getBoundingClientRect().left])
    var same = true
    for (var e = 1; e < edges.length; e++) if (Math.abs(edges[e][1] - edges[0][1]) > 1) same = false
    ck('助手正文/流式/工具卡同一左基线', same,
      edges.map(function(x){ return x[0] + ':' + Math.round(x[1]) }).join(' '))
    // 助手内容一律左对齐（用户气泡允许右对齐，不在此列）。
    var leftAligned = true
    var texts = box.querySelectorAll('.row.ai .bub,.row.stream .bub,.row.ai .tool,.row.ai .toolgroup')
    for (var t = 0; t < texts.length; t++) {
      if (getComputedStyle(texts[t]).textAlign !== 'left') leftAligned = false
    }
    ck('助手内容 text-align:left', leftAligned, texts.length + ' 个节点')
  }
  // 切会话残留：拿上一次会话最后一条正文的前 48 字去当前 DOM 里找。
  if (S.prevSessionId && S.prevSessionId !== S.sessionId && S.prevSessionSample) {
    var has = box ? box.textContent.indexOf(S.prevSessionSample) >= 0 : false
    ck('切会话后 DOM 不含上一会话正文', !has, has ? ('残留：' + S.prevSessionSample.slice(0, 24)) : '干净')
  }
  var ok = true

function renderAt(idx){
  if (idx < 0 || idx >= S.items.length) return
  // 「只看对话」期间工具与注入上下文不进 DOM —— 但状态仍在 S.items 里照常更新，
  // 关掉开关后 renderAll() 会把它们按真实顺序补回来。
  if (S.chatOnly && (S.items[idx].kind === 'tool' || S.items[idx].injected)) return
  if (log.querySelector('.empty')) log.innerHTML = ''
  var stick = nearBottom()

  // 工具条目可能属于一个分组：那时要整段重建，而不是只换这一条。
  var run = S.items[idx].kind === 'tool' ? toolRunAt(idx) : null
  if (run) {
    var head = log.querySelector('.row[data-g="' + run.start + '"]')

      // 这一段里可能已经单独渲染过几行（刚够格成组的那一刻），先清掉再插入 ——
      // 否则会出现「分组 + 残留旧行」同时挂在页面上，同一批步骤显示两遍。
      for (var j = run.start; j <= run.end; j++) {

    if (S.items[idx].kind !== 'tool') {

}

var SEQ = 0

  if (S.agentView) { loadAgentTranscript(); return }
  var mine = ++SEQ
  var sid = S.sessionId
  var es = new EventSource('/taskwatch/chat/stream?sessionId=' + encodeURIComponent(sid))
  S.es = es
  es.onopen = function(){
    if (mine !== SEQ || sid !== S.sessionId) return
    S.esOpen = true
    S.esError = false
    S.lastFrameAt = Date.now()
    if (S.esEverOpen) S.reconnects++      // 第一次打开不算「重连」
    S.esEverOpen = true
    setSub('')
    renderNet()
  }
  es.onmessage = function(msg){
    // 双保险：SEQ 拦「同一页面里又开了一条」，sid 拦「会话已经换了」。
    // 后者是 EventSource 关闭前最后一帧仍可能排队进来的窗口 —— 只靠 SEQ 时，
    // 极端时序下旧帧会落进新会话，这正是"切会话还残留上一条"的来源。
    if (mine !== SEQ || sid !== S.sessionId) return
    S.esOpen = true
    S.lastFrameAt = Date.now()

    try { f = JSON.parse(msg.data) } catch (e) { return }
    if (!f) return
    if (f.type === 'snapshot') { applySnapshot(f, sid); setSub(''); return }
    if (f.type === 'event') { acceptEvent(f.event, sid); return }
    if (f.type === 'assistant-stream') {
      var fr = f.frame
      if (fr && fr.type === 'start') { S.running = true; syncSend() }
      else if (fr && fr.type === 'end') { finishStreaming(undefined, sid) }

    if (mine !== SEQ || sid !== S.sessionId) return
    S.esOpen = false
    S.esError = true

  if (!lastData) statsAdd(el, '读取中…', false)
  else if (lastData.error || lastData.offline) statsAdd(el, '读不到状态', false)
  else {
    var t = lastData.totals || {}
    statsAdd(el, '会话 ' + (t.sessions || 0), false)
    // 「在跑」是这三个加粗项里最该先看到的：它回答"现在有没有活儿"。
    if (t.running || t.jobsRunning) statsAdd(el, '在跑 ' + ((t.running || 0) + (t.jobsRunning || 0)), true)
    if (t.subagents) statsAdd(el, '子代理 ' + t.subagents, false)
    if (t.pending) statsAdd(el, '待处理 ' + t.pending, false)
  }
  if (USAGE && USAGE.live) {
    if (typeof USAGE.turns === 'number') statsAdd(el, '轮次 ' + fmtCount(USAGE.turns), false)
    if (typeof USAGE.steps === 'number') statsAdd(el, '步数 ' + fmtCount(USAGE.steps), false)
    if (typeof USAGE.tokensPerSecond === 'number' && isFinite(USAGE.tokensPerSecond)) {
      statsAdd(el, fmtRate(USAGE.tokensPerSecond) + ' tok/s', false)
    }
    var consumed = typeof USAGE.tokenConsumption === 'number' ? USAGE.tokenConsumption : USAGE.totalTokens
    if (typeof consumed === 'number') statsAdd(el, 'Token ' + fmtTok(consumed), false)
    var context = contextPercent(USAGE)
    if (context !== null) statsAdd(el, '上下文 ' + Math.floor(context) + '%', true)
    var hit = cacheHitPercent(USAGE)
    // 向下取整，不四舍五入：99.5% 显示成 "100%" 是在往上抬，
    // 监控页宁可少报也不能多报。DSH 自己的状态栏也是这个口径（99%）。
    if (hit !== null) statsAdd(el, '缓存命中 ' + Math.floor(hit) + '%', true)
  }
  // 展开箭头是这条可点行的唯一提示；aria-expanded 跟明细面板同步。
  var box = $('statsDetail')
  var open = !!(box && !box.hidden)
  var chev = document.createElement('span')
  chev.className = 'schev'
  chev.appendChild(iconSvg(ICON_CHEV))
  el.appendChild(chev)
  el.setAttribute('aria-expanded', open ? 'true' : 'false')
  el.setAttribute('aria-label', '指标：' + el.textContent.replace(/\s+/g, ' ').trim() +
    (open ? '。收起明细' : '。点按查看明细'))
  if (open) renderStatsDetail()
}

/** 指标明细：只显示宿主**真的返回**的字段；缺的项不补 0、不猜。 */
function renderStatsDetail(){
  var box = $('statsDetail')
  if (!box || box.hidden) return
  box.textContent = ''
  var rows = 0
  function row(k, v){
    if (v === null || v === undefined || v === '') return
    var d = document.createElement('div'); d.className = 'sd-row'
    var kk = document.createElement('span'); kk.className = 'k'; kk.textContent = k
    var vv = document.createElement('span'); vv.className = 'v'; vv.textContent = String(v)
    d.appendChild(kk); d.appendChild(vv); box.appendChild(d); rows++
  }
  var d = lastData || {}
  var t = d.totals || {}
  if (!d.error && !d.offline) {
    row('会话', t.sessions)
    row('在跑', (Number(t.running) || 0) + (Number(t.jobsRunning) || 0))
    row('子代理', t.subagents)
    row('待处理', t.pending)
  }
  if (USAGE && USAGE.live) {
    if (typeof USAGE.turns === 'number') row('轮次', fmtCount(USAGE.turns))
    if (typeof USAGE.steps === 'number') row('步数', fmtCount(USAGE.steps))
    if (typeof USAGE.toolCalls === 'number') row('工具调用', fmtCount(USAGE.toolCalls) + ' 次')
    if (typeof USAGE.tokensPerSecond === 'number') row('生成速度', fmtRate(USAGE.tokensPerSecond) + ' tok/s')
    if (typeof USAGE.tokenConsumption === 'number') row('Token 消耗', fmtCount(USAGE.tokenConsumption))
    else if (typeof USAGE.totalTokens === 'number') row('Token 合计', fmtCount(USAGE.totalTokens))
    if (typeof USAGE.uncachedInputTokens === 'number') row('未缓存输入', fmtCount(USAGE.uncachedInputTokens))
    else if (typeof USAGE.inputTokens === 'number') row('输入 token', fmtCount(USAGE.inputTokens))
    if (typeof USAGE.outputTokens === 'number') row('输出 token', fmtCount(USAGE.outputTokens))
    if (typeof USAGE.cacheReadTokens === 'number') row('缓存读取', fmtCount(USAGE.cacheReadTokens))
    if (typeof USAGE.cacheWriteTokens === 'number') row('缓存写入', fmtCount(USAGE.cacheWriteTokens))
    var hit = cacheHitPercent(USAGE)
    if (hit !== null) row('缓存命中', Math.floor(hit) + '%')
    var used = typeof USAGE.contextTokens === 'number' ? USAGE.contextTokens :
      (typeof USAGE.projectedTokens === 'number' ? USAGE.projectedTokens : USAGE.pressureTokens)
    var cp = contextPercent(USAGE)
    row('上下文', (typeof used === 'number' ? fmtCount(used) : '') +
      (USAGE.contextWindow ? ' / ' + fmtCount(USAGE.contextWindow) : '') +
      (cp === null ? '' : ' · ' + Math.floor(cp) + '%'))
    if (typeof USAGE.llmMs === 'number') row('模型用时', fmtMs(USAGE.llmMs))
    if (typeof USAGE.toolMs === 'number') row('工具用时', fmtMs(USAGE.toolMs))
    if (typeof USAGE.ttftMs === 'number') {
      row('平均首 token', fmtMs(USAGE.ttftSteps > 0 ? USAGE.ttftMs / USAGE.ttftSteps : USAGE.ttftMs))
    }
  }
  if (!rows) {
    var hint = document.createElement('div'); hint.className = 'hint'
    hint.textContent = '宿主还没有返回可用的指标'
    box.appendChild(hint)
  } else {
    var src = document.createElement('div'); src.className = 'hint'
    src.textContent = '只显示宿主真实返回的字段；没给的不补 0。'
    box.appendChild(src)
  }
}

function syncStatus(){
  var t = $('statusTxt'), box = $('status')
  renderStats()
  // 子代理入口跟着 /taskwatch/data 的最新一次心跳走（没有子代理时整条隐藏）。
  renderSubagentBar()
  loadUsage()
  if (!lastData) {
    box.className = ''
    t.textContent = '正在读取状态…'
    box.title = '正在读取状态'
    return
  }
  var d = lastData
  if (d.error) {
    box.className = 'bad'
    t.textContent = '读不到状态'
    box.title = '读不到状态：' + d.error
    return
  }
  // service worker 的离线兜底用的是 offline:true + errors[]（见 lib/sw.js）。
  // 不认这个形状的话，断网时会显示成"一切正常，没有任务在跑" —— 对监控来说，
  // 把"读不到"说成"没事"是最坏的一种错。
  if (d.offline || (d.errors && d.errors.length)) {
    box.className = 'bad'
    t.textContent = '连不上电脑'
    box.title = '连不上电脑：' + (d.errors && d.errors[0] ? d.errors[0] : '读不到状态')
    return
  }
  var tot = d.totals || {}
  var busy = (tot.jobsRunning || 0) + (tot.running || 0)
  if ((tot.pending || 0) > 0) {
    box.className = 'warn'
    t.textContent = tot.pending + ' 件事待你处理'
    box.title = '有 ' + tot.pending + ' 件事待桌面处理 · 点按查看详情'
  } else if (busy > 0) {
    box.className = 'busy'
    t.textContent = busy + ' 个任务正在运行'
    box.title = busy + ' 个任务正在运行 · 点按查看详情'
  } else {
    box.className = ''
    t.textContent = '没有任务在运行'
    box.title = '当前没有任务在运行 · 点按查看详情'
  }
  box.setAttribute('aria-expanded', sheet && !sheet.hidden ? 'true' : 'false')
}

// ---------------------------------------------------------------------------
// 网络
// ---------------------------------------------------------------------------
async function postRaw(url, body){
  var r = await fetch(url, {
    method:'POST',
    headers:{ 'content-type':'application/json' },
    body: JSON.stringify(body || {}),
    cache:'no-store'
  })
  var d = await r.json().catch(function(){ return { error:'HTTP ' + r.status } })
  return { status:r.status, ok:r.ok, data:d }
}

async function post(url, body){
  var res = await postRaw(url, body)
  var d = res.data
  if (res.status === 404) throw new Error('宿主没有注册这个接口')
  if (!res.ok || (d && d.error)) {
    var e = new Error((d && d.error) || ('HTTP ' + res.status))
    e.status = res.status
    e.code = d && d.code
    e.data = d
    throw e
  }
  return d
}

/** opts: { now:true } 插队但不打断；{ now:true, interrupt:true } 先打断再发。
 *  后者失败时消息**没有发出**，提示必须如实说"没发出"，不能假装成功。 */
async function send(text, opts){
  var o = opts || {}
  text = String(text == null ? $('input').value : text)
  if (S.agentView) { notice('子代理会话只读，不能发送', 2000); return }
  if (sendingSessions[S.sessionId]) return
  if (!text.trim() && !S.attachments.length) return
  if (S.attachments.some(function(a){ return a.status === 'uploading' })) { attachmentNotice('附件还在上传，请稍等'); return }
  if (S.attachments.some(function(a){ return a.status === 'error' })) { attachmentNotice('请重试或移除上传失败的附件'); return }
  if (!S.sessionId) await ensureSession()
  if (!S.sessionId) { attachmentNotice('请先新建或选择一个会话'); return }
  var sessionId = S.sessionId, draft = S.attachments, attached = draft.slice()
  sendingSessions[sessionId] = true
  S.pending = text
  S.pendingAttachments = attached
  renderPending()
  $('input').value = ''
  autoGrow(); syncSend(); attachmentNotice('')
  try {
    var payload = {
      sessionId: sessionId,
      text: text,
      attachments: attached.map(function(a){ return a.upload }),
      timeZone: (Intl.DateTimeFormat().resolvedOptions().timeZone || '')
    }
    if (o.now) payload.now = true
    if (o.now && o.interrupt) payload.interrupt = true
    var result = await post('/taskwatch/chat/send', payload)
    if (!result || result.accepted !== true) throw new Error('宿主尚未接受消息，请重试')
    attached.forEach(function(a){ var i = draft.indexOf(a); if (i >= 0) draft.splice(i, 1) })
    // 发送成功才清草稿：失败时下面会把原文放回输入框，草稿必须还在。
    clearDraft(sessionId)
    if (S.sessionId === sessionId) { S.running = true; renderAttachmentTray(); wakeComposer() }
    else attached.forEach(releaseAttachment)
    refreshQueue(true)
  } catch (e) {
    if (S.sessionId === sessionId) {
      S.pending = null; S.pendingAttachments = []; renderPending()
      if (e.code === 'interrupt-timeout') {
        notice('打断超时，消息没有发出；可以先停止再发', 6000)
        setSub('打断超时，消息没有发出')
      } else {
        attachmentNotice('发送失败：' + e.message)
      }
      if (!$('input').value) $('input').value = text
      autoGrow()
      queueDraftSave()
    } else if (attachmentDrafts[sessionId]) {
      if (!attachmentDrafts[sessionId].text) attachmentDrafts[sessionId].text = text
      attachmentDrafts[sessionId].error = '发送失败：' + e.message
    }
  } finally {
    delete sendingSessions[sessionId]
    syncSend()
  }
}

async function stop(){
  var sid = S.sessionId
  try {
    await post('/taskwatch/chat/cancel', { sessionId: sid })
    if (S.sessionId === sid) {
      S.running = false
      finishStreaming()
      syncSend()
      refreshQueue(true)
    }
    notice('已停止当前任务', 1800)
  } catch (e) {
    // 失败不静默：按钮留在停止态（任务可能还在跑），并在输入框上方说清原因。
    notice('停止失败：' + e.message, 4000)
    setSub('停止失败：' + e.message)
  }
}

function autoGrow(){
  var el = $('input')
  el.style.height = 'auto'
  el.style.height = Math.min(132, el.scrollHeight) + 'px'
}

var MAX_ATTACHMENTS = 4
var MAX_ATTACHMENT_BYTES = 32 * 1024 * 1024
var attachmentDrafts = Object.create(null), sendingSessions = Object.create(null)
function attachmentNotice(text){ $('attachmentNotice').textContent = text || '' }
/** 一句中文提示，可定时收回。失败一律走这里，不靠 console。 */
var NOTICE_TIMER = 0
function notice(text, ms){
  var el = $('attachmentNotice')
  if (!el) return
  el.textContent = text || ''
  clearTimeout(NOTICE_TIMER)
  if (text && ms) {
    NOTICE_TIMER = setTimeout(function(){
      if (el.textContent === text) el.textContent = ''
    }, ms)
  }
}
// ── 草稿自动保存（按 sessionId）─────────────────────────────────────────
// 输入框内容在切会话 / 刷新后恢复；发送成功才删。附件草稿仍只在内存里
// （附件有一次性 token，跨会话持久化会拿到失效引用，不如不存）。
var DRAFT_TIMER = 0
function draftKey(id){ return 'tw-draft:' + id }
function getDraft(id){
  if (!id) return ''
  try { return localStorage.getItem(draftKey(id)) || '' } catch (e) { return '' }
}
function clearDraft(id){
  if (!id) return
  try { localStorage.removeItem(draftKey(id)) } catch (e) {}
}
function saveDraftNow(){
  if (!S.sessionId) return
  var v = $('input') ? $('input').value : ''
  try {
    if (v) localStorage.setItem(draftKey(S.sessionId), v)
    else localStorage.removeItem(draftKey(S.sessionId))
  } catch (e) {}
}
function queueDraftSave(){
  clearTimeout(DRAFT_TIMER)
  DRAFT_TIMER = setTimeout(saveDraftNow, 250)
}

var FONT_NAMES = { small:'小', medium:'中', large:'大' }
function applyFont(v, remember){
  if (!FONT_NAMES[v]) v = 'medium'
  // 字号变化会让同一段文字重新折行：原本停在底部的，改完还得停在底部，
  // 否则会突然停在半截消息上（还会冒出「最新」浮标挡住正文）。
  var wasBottom = nearBottom()

  for (var i = 0; i < btns.length; i++) {
    btns[i].setAttribute('aria-pressed', btns[i].getAttribute('data-font') === v ? 'true' : 'false')
  }
  autoGrow()
  requestAnimationFrame(function(){ if (wasBottom) toBottom() })
}

  renderAll()

// ── 消息队列 UI ──────────────────────────────────────────────────────────
function qSources(item){
  var bits = []
  if (item && item.images) bits.push(item.images + ' 图')
  if (item && item.files) bits.push(item.files + ' 文件')
  return bits.join(' · ')
}
function queueOrderFromIds(ids){
  var by = Object.create(null)
  for (var i = 0; i < Q.items.length; i++) by[String(Q.items[i].id)] = Q.items[i]
  var out = []
  for (var j = 0; j < ids.length; j++) {
    var it = by[String(ids[j])]
    if (it) { out.push(it); delete by[String(ids[j])] }
  }
  for (var k = 0; k < Q.items.length; k++) {
    var id = String(Q.items[k].id)
    if (by[id]) { out.push(Q.items[k]); delete by[id] }
  }
  return out
}
function qMoveBtn(dir, disabled, id, label){
  var b = document.createElement('button')
  b.type = 'button'; b.className = 'qmove'; b.disabled = !!disabled
  b.setAttribute('aria-label', label); b.title = label
  b.appendChild(iconSvg(dir < 0 ? ICON_UP : ICON_DOWN))
  b.addEventListener('click', function(){ moveQueue(id, dir) })
  return b
}
function renderQueue(){
  var bar = $('queueBar')
  if (!bar) return
  if (Q.supported !== true) { bar.hidden = true; Q.open = false; return }
  var sum = $('queueSummary'), list = $('queueList'), note = $('queueNote')
  if (Q.state === 'error') {
    bar.hidden = false; sum.hidden = true; list.hidden = true
    note.textContent = Q.note || '队列暂时不可用'
    note.className = 'qnote' + (Q.noteBad ? ' bad' : '')
    return
  }
  var n = Q.items.length, s = Q.steering.length
  if (!n && !s && !Q.running) { bar.hidden = true; Q.open = false; return }
  bar.hidden = false; sum.hidden = false
  var count = $('queueCount')
  count.textContent = n ? ('排队 ' + n + ' 条' + (s ? ' · 已插队 ' + s + ' 条' : ''))
    : (Q.running ? '正在运行 · 队列为空' : '队列为空')
  $('queueHint').textContent = Q.open ? '收起' : '展开'
  sum.setAttribute('aria-expanded', Q.open ? 'true' : 'false')
  list.hidden = !Q.open
  note.textContent = Q.note || ''
  note.className = 'qnote' + (Q.noteBad ? ' bad' : '')
  if (!Q.open) return
  list.textContent = ''
  function row(item, idx, canMove){
    var r = document.createElement('div'); r.className = 'qitem'
    var no = document.createElement('span'); no.className = 'qidx'; no.textContent = String(idx + 1)
    r.appendChild(no)
    var t = document.createElement('span'); t.className = 'qt'
    t.textContent = item.text ? String(item.text) : '（无文本）'
    t.title = item.text ? String(item.text) : ''
    r.appendChild(t)
    var meta = qSources(item)
    if (meta) { var m = document.createElement('span'); m.className = 'qmeta'; m.textContent = meta; r.appendChild(m) }
    if (canMove) {
      r.appendChild(qMoveBtn(-1, idx === 0, String(item.id), '上移这条排队消息'))
      r.appendChild(qMoveBtn(1, idx === Q.items.length - 1, String(item.id), '下移这条排队消息'))
    }
    list.appendChild(r)
  }
  for (var i = 0; i < n; i++) row(Q.items[i], i, Q.items[i].source === 'user')
  if (s) {
    var sh = document.createElement('div'); sh.className = 'qempty'
    sh.textContent = '已插队 · 由宿主决定顺序'
    list.appendChild(sh)
    for (var j = 0; j < s; j++) {
      var st = Q.steering[j]
      var sr = document.createElement('div'); sr.className = 'qitem'
      var sn = document.createElement('span'); sn.className = 'qidx'; sn.textContent = '·'
      sr.appendChild(sn)
      var stt = document.createElement('span'); stt.className = 'qt'
      stt.textContent = st.text ? String(st.text) : '（无文本）'; stt.title = stt.textContent
      sr.appendChild(stt)
      var sbd = document.createElement('span'); sbd.className = 'qbadge steer'; sbd.textContent = '已插队'
      sr.appendChild(sbd)
      list.appendChild(sr)
    }
  }
  if (Q.truncated) {
    var tr = document.createElement('div'); tr.className = 'qempty'
    tr.textContent = '队列较长，只显示前 200 条'
    list.appendChild(tr)
  }
}
async function refreshQueue(silent){
  if (!S.chatReady || !S.sessionId) { Q.supported = null; Q.state = 'off'; renderQueue(); return }
  if (Q.sid !== S.sessionId) {
    Q.sid = S.sessionId; Q.supported = null; Q.state = 'unknown'
    Q.open = false; Q.checkedSid = ''; Q.items = []; Q.steering = []
    Q.running = false; Q.note = ''
  }
  // 404 之后不再每 5 秒打一次：宿主没这条路由，重试没有意义，只等切会话再试。
  if (Q.supported === false && Q.checkedSid === S.sessionId) return
  if (Q.busy) return
  var sid = S.sessionId
  Q.busy = true
  try {
    var r = await fetch('/taskwatch/chat/queue?sessionId=' + encodeURIComponent(sid) +
      '&t=' + Date.now(), { cache:'no-store' })
    // 队列也是会话私有的：切走之后，旧回包只允许丢掉，不许写进新会话的队列条。
    if (sid !== S.sessionId) return
    if (r.status === 404) {
      Q.supported = false; Q.state = 'off'; Q.checkedSid = sid
      Q.items = []; Q.steering = []; Q.running = false; Q.note = ''
      renderQueue(); return
    }
    var j = await r.json().catch(function(){ return null })
    if (sid !== S.sessionId) return
    if (!r.ok) {
      Q.supported = true; Q.state = 'error'
      var lead = r.status === 501 ? '宿主不支持消息队列：'
        : r.status === 409 ? '队列暂时不可用：'
        : r.status === 400 ? '请求无效：' : '读取队列失败：'
      Q.note = lead + ((j && j.error) || ('HTTP ' + r.status))
      Q.noteBad = true
      renderQueue(); return
    }
    if (!j || j.ok !== true) {
      // 200 但形状不对：当作「这个宿主没有队列接口」，整块隐藏。
      // 404 之外的失败才会有上面那段中文说明；这里不制造占位噪音。
      Q.supported = false; Q.state = 'off'; Q.checkedSid = sid
      renderQueue(); return
    }
    Q.supported = true; Q.state = 'ok'
    Q.running = !!j.running
    Q.items = Array.isArray(j.items) ? j.items : []
    Q.steering = Array.isArray(j.steering) ? j.steering : []
    Q.counts = j.counts || { queued: Q.items.length, steering: Q.steering.length }
    Q.truncated = !!j.truncated
    if (!Q.noteBad) Q.note = ''
    renderQueue()
  } catch (e) {
    if (!silent) {
      Q.supported = true; Q.state = 'error'; Q.note = '读取队列失败：' + e.message; Q.noteBad = true
      renderQueue()
    }
  } finally { Q.busy = false }
}
async function moveQueue(id, delta){
  var idx = -1
  for (var i = 0; i < Q.items.length; i++) if (String(Q.items[i].id) === String(id)) { idx = i; break }
  var to = idx + delta
  if (idx < 0 || to < 0 || to >= Q.items.length) return
  var before = Q.items.slice()
  var next = Q.items.slice()
  var tmp = next[idx]; next[idx] = next[to]; next[to] = tmp
  Q.items = next
  Q.note = ''; Q.noteBad = false
  renderQueue()                             // 乐观更新：先动 UI
  try {
    var res = await postRaw('/taskwatch/chat/queue/reorder', {
      sessionId: S.sessionId,
      ids: Q.items.map(function(x){ return String(x.id) })
    })
    if (res.status === 404) {
      Q.supported = false; Q.state = 'off'; Q.items = before; renderQueue()
      notice('宿主没有注册队列重排接口', 4000)
      return
    }
    var j = res.data || {}
    if (res.status === 409 && j.code === 'queue-changed' && Array.isArray(j.current)) {
      Q.items = queueOrderFromIds(j.current)
      Q.note = '队列已变化，已按最新顺序显示'; Q.noteBad = true
      renderQueue()
      return
    }
    if (!res.ok || j.error) throw new Error(j.error || ('HTTP ' + res.status))
    if (Array.isArray(j.items)) Q.items = j.items
    if (Array.isArray(j.steering)) Q.steering = j.steering
    if (j.counts) Q.counts = j.counts
    Q.running = !!j.running
    Q.note = ''; Q.noteBad = false
    renderQueue()
  } catch (e) {
    Q.items = before                        // 失败回滚到乐观更新前的顺序
    Q.note = '重排失败：' + e.message; Q.noteBad = true
    renderQueue()
  }
}

function attachmentId(){ return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2) }
function releaseAttachment(a){
  if (a && a.controller) a.controller.abort()
  if (a && a.previewURL && a.previewURL.indexOf('blob:') === 0) {
    try { URL.revokeObjectURL(a.previewURL) } catch (e) {}
  }
}
function wakeComposer(){
  var b = $('send'), i = $('input')
  if (b && i) b.classList.toggle('awake', !!i.value.trim() || S.attachments.some(function(a){ return a.status === 'ready' }))
}
function renderAttachmentTray(){
  var tray = $('attachmentTray')
  if (!tray) return
  tray.textContent = ''
  tray.hidden = !S.attachments.length
  S.attachments.forEach(function(a){
    var chip = document.createElement('div'); chip.className = 'attach-chip' + (a.status === 'error' ? ' bad' : '')
    if (a.kind === 'image') {
      var thumb = document.createElement('img'); thumb.className = 'thumb'; thumb.src = a.previewURL; thumb.alt = ''
      // 预览图（blob:）也可能失败：删掉它，留格式徽标占位，绝不在 32px 的框里显示破图标。
      thumb.addEventListener('error', function(){
        if (!thumb.parentNode) return
        var badge = document.createElement('span'); badge.className = 'kind'; badge.textContent = 'IMG'
        thumb.parentNode.replaceChild(badge, thumb)
      })
      chip.appendChild(thumb)
    } else {
      var kind = document.createElement('span'); kind.className = 'kind'; kind.textContent = kindLabel(a.name)
      chip.appendChild(kind)
    }
    var label = document.createElement('span'); label.style.minWidth = '0'
    var name = document.createElement('span'); name.className = 'name'; name.textContent = a.name; name.title = a.name
    var state = document.createElement('span'); state.className = 'state'
    state.textContent = a.status === 'uploading' ? '上传中…' : a.status === 'error' ? (a.error || '上传失败') : fmtBytes(a.bytes) + ' · 已就绪'
    label.appendChild(name); label.appendChild(state); chip.appendChild(label)
    if (a.status === 'error') {
      var retry = document.createElement('button'); retry.type = 'button'; retry.className = 'retry'; retry.textContent = '重试'
      retry.addEventListener('click', function(){ runUpload(a) }); label.appendChild(retry)
    }
    var remove = document.createElement('button'); remove.type = 'button'; remove.className = 'remove'; remove.setAttribute('aria-label', '移除 ' + a.name)
    remove.disabled = !!sendingSessions[S.sessionId]
    remove.innerHTML = ICON_CLOSE
    remove.addEventListener('click', function(){
      var i = S.attachments.indexOf(a)
      if (i >= 0) { a.removed = true; releaseAttachment(a); S.attachments.splice(i, 1) }
      renderAttachmentTray(); wakeComposer()
    })
    chip.appendChild(remove); tray.appendChild(chip)
  })
}
async function uploadAttachment(a){
  var q = '?sessionId=' + encodeURIComponent(a.sessionId) + '&kind=' + encodeURIComponent(a.kind) +
    '&name=' + encodeURIComponent(a.name) + (a.kind === 'image' ? '&mime=' + encodeURIComponent(a.mime) : '')
  var r = await fetch('/taskwatch/chat/upload' + q, {
    method:'POST', headers:{ 'content-type':'application/octet-stream' }, body:a.file,
    signal:a.controller.signal, cache:'no-store'
  })
  var d = await r.json().catch(function(){ return { error:'HTTP ' + r.status } })
  if (!r.ok || !d || d.error || !d.upload) throw new Error((d && d.error) || ('HTTP ' + r.status))
  return d.upload
}
async function runUpload(a){
  a.status = 'uploading'; a.error = ''; a.controller = new AbortController()
  if (S.sessionId === a.sessionId) renderAttachmentTray()
  try { a.upload = await uploadAttachment(a); if (!a.removed) a.status = 'ready' }
  catch (e) { if (!a.removed) { a.status = 'error'; a.error = e.message || '上传失败' } }
  if (S.sessionId === a.sessionId) { renderAttachmentTray(); wakeComposer() }
}
function chooseFiles(list, kind){
  var files = Array.prototype.slice.call(list || []), sessionId = S.sessionId
  if (!files.length) return
  if (!sessionId) { attachmentNotice('请先新建或选择一个会话'); return }
  if (sendingSessions[sessionId]) return
  attachmentNotice('')
  var total = S.attachments.reduce(function(n,a){ return n + a.bytes }, 0)
  var images = { png:'image/png', jpg:'image/jpeg', jpeg:'image/jpeg', webp:'image/webp', gif:'image/gif' }
  var queued = []
  for (var i = 0; i < files.length; i++) {
    var f = files[i]
    if (S.attachments.length >= MAX_ATTACHMENTS) { attachmentNotice('每条消息最多添加 4 个附件'); break }
    if (f.size > MAX_ATTACHMENT_BYTES || total + f.size > MAX_ATTACHMENT_BYTES) { attachmentNotice('每条消息的附件总大小不能超过 32 MB'); continue }
    var mime = f.type || images[extOf(f.name)] || ''
    if (kind === 'image' && !/^image\/(png|jpeg|webp|gif)$/i.test(mime)) {
      attachmentNotice('图片支持 PNG、JPG、WEBP、GIF；其他格式可用“导入文件”添加'); continue
    }
    var a = { id:attachmentId(), sessionId:sessionId, kind:kind || 'file', mime:mime, name:f.name || '附件',
      bytes:f.size, file:f, status:'uploading', previewURL:URL.createObjectURL(f), upload:null, error:'' }
    S.attachments.push(a); queued.push(a); total += f.size
  }
  renderAttachmentTray(); wakeComposer()
  queued.forEach(runUpload)
}

var sheet = $('sheet'), card = $('card')

function closeSheet(){
  sheet.hidden = true

  if (typeof SEND_PRESS !== 'undefined' && SEND_PRESS) SEND_PRESS.fired = false

sheet.addEventListener('keydown', function(e){
  if (e.key === 'Escape') { e.preventDefault(); closeSheet(); return }
  if (e.key !== 'Tab') return
  var focusable = card.querySelectorAll('button,input,textarea,[tabindex]:not([tabindex="-1"])')
  if (!focusable.length) return
  var first = focusable[0], last = focusable[focusable.length - 1]
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus() }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus() }
})

/** 批量补标题：**分小批**请求，每回来一批就就地改一次标签。
 *
 *  为什么分批：宿主补一个标题要 1~2 次持久化读（实测约 0.5s/次），一批 12 个
 *  要 5 秒多。与其让用户对着 12 个 "Projects" 干等 5 秒，不如每 4 个刷一次 ——
 *  一两秒后前几条就有名字了。宿主侧和本机都有缓存，所以只有第一次会这样。
 */
async function fillTitles(ids){
  for (var i = 0; i < ids.length; i += 4) {
    var chunk = ids.slice(i, i + 4)
    var got
    try {
      var r = await fetch('/taskwatch/chat/titles?ids=' + encodeURIComponent(chunk.join(',')), { cache:'no-store' })
      if (!r.ok) continue
      got = await r.json()
    } catch (e) { continue }
    if (!got || !got.titles) continue
    for (var id in got.titles) {
      if (!got.titles[id]) continue
      titles[id] = got.titles[id]
      var el = card.querySelector('[data-sess="' + id + '"] .t')
      if (el) el.textContent = titles[id]
      if (id === S.sessionId) $('sessTitle').textContent = titles[id]
    }
    try { localStorage.setItem('taskwatch.titles', JSON.stringify(titles)) } catch (e) {}
  }
}

    for (var w = 0; w < workflows.length; w++) h += kv(workflows[w].phase || '未知', workflows[w].name || workflows[w].id)

  }
