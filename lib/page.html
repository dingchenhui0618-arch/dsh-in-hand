// ---------------------------------------------------------------------------
// 会话切换
// ---------------------------------------------------------------------------
/** 切会话。opts.agent 明确表示"这是子代理二级视图"（路由进来时用），
 *  opts.root 表示"回到主对话"。两者都不传时按会话自身的 origin/depth 判断。
 *
 *  只显示当前会话的保证分三层：
 *   1. 同步清空 S.items 与 DOM（renderAll），旧条目不可能继续挂着；
 *   2. S.epoch +1 并打 data-session 戳，异步回包凭它丢弃；
 *   3. SSE 的 SEQ 与 sid 双保险（见 openStream）。
 */
function selectSession(id, opts){
  var o = opts || {}
  var oldSession = S.sessionId
  // 自检取样：切走之前，记住旧会话最后一条正文的开头。下一次自检据此断言
  // 新会话的 DOM 里**不含**这段文字（不是"看起来没混"，而是能算出来的断言）。
  S.prevSessionId = oldSession || ''
  S.prevSessionSample = ''
  if (S.items.length) {
    var lastIt = S.items[S.items.length - 1]
    var sample = String((lastIt && lastIt.text) || '').replace(/\s+/g, ' ').trim()
    if (sample.length >= 8) S.prevSessionSample = sample.slice(0, Math.min(48, sample.length))
  }
  var agent = !!o.agent || (!o.root && isSubAgentId(id))
  // 切会话时清掉尚未交给服务端的临时预览。正在发送的请求由 send() 的
  // finally 分支收尾；这样既不泄漏 blob URL，也不会把旧会话的缩略图留在新会话里。
  if (oldSession && S.pendingAttachments.length && !sendingSessions[oldSession]) dropPending()
  if (oldSession) {
    saveDraftNow()                       // 先按旧 sessionId 落盘，再切
    attachmentDrafts[oldSession] = { attachments:S.attachments, text:$('input').value }
  }
  S.sessionId = id
  S.epoch++
  S.agentView = agent
  // 看子代理时不动 rootId：返回主对话要回到原来那条根会话。
  if (agent) S.viewingAgent = id
  else { S.viewingAgent = ''; S.rootId = id }
  // 子代理对话只读：宿主拒绝往子代理会话发 prompt，输入框留着只会让人白试一次。
  var inp = $('input')
  if (inp) {
    if (!S.inputPh) S.inputPh = inp.getAttribute('placeholder') || ''
    inp.disabled = agent
    inp.setAttribute('placeholder', agent ? '子代理会话 · 只读' : S.inputPh)
  }
  // 草稿优先取内存里的（同一页面内切来切去），没有就取 localStorage（刷新后恢复）。
  var draft = attachmentDrafts[id] || { attachments:[], text:getDraft(id) }
  S.attachments = draft.attachments
  $('input').value = draft.text || getDraft(id)
  attachmentNotice(draft.error || '')
  renderAttachmentTray(); autoGrow(); wakeComposer()
  try { localStorage.setItem('taskwatch.session', id) } catch (e) {}
  var label = shortId(id)
  S.workspace = ''
  for (var i = 0; i < S.sessions.length; i++) {
    if (S.sessions[i].id === id) {
      label = S.sessions[i].title || titles[id] || S.sessions[i].fallback || label
      S.workspace = S.sessions[i].cwd || S.sessions[i].workspace || ''
      break
    }
  }
  // 子代理会话不在 /chat/sessions 里（宿主有意过滤），标题得从 /taskwatch/data 取，
  // 否则顶栏只剩一串 uuid 前缀。
  if (agent) {
    var info = liveSessionById(id)
    if (info) {
      label = info.title || titles[id] || info.fallback || label
      S.workspace = info.cwd || info.workspace || ''
    } else {
      var entries = subagentEntries()
      for (var k = 0; k < entries.length; k++) if (entries[k].id === String(id)) { label = entries[k].label || label; break }
    }
  }
  S.provider = ''; S.model = ''; USAGE = null
  S.title = label
  $('sessTitle').textContent = label
  renderContext()
  S.items = []; S.seq = 0; S.running = false; S.streaming = null; S.pending = null; S.pendingAttachments = []
  S.turnStartedAt = 0; S.stepStartedAt = 0; S.lastUserAt = 0; S.lastAssistantIndex = -1
  renderAll()
  // USAGE 在上面的分支里被清掉了；这里要立刻把指标行重画一遍，否则切到子代理后
  // 底栏还挂着父会话的 tok/s / 上下文，看起来像子代理自己的消耗。
  renderStats()
  syncSend()
  openStream()
  // 队列跟会话走：换会话就重新问一次（404 的宿主不会因为重复请求变成可用）。
  if (agent) {
    // 子代理会话没有可发消息的队列；把上一条会话的队列条清掉，不留假 UI。
    Q.items = []; Q.steering = []; Q.running = false; Q.note = ''; Q.noteBad = false
    renderQueue()
  } else {
    Q.sid = ''
    refreshQueue(true)
    loadUsage()
  }
  renderSubagentBar()
}

/** 子代理对话：只读历史快照。
 *
 *  为什么不能像根会话那样开 SSE：宿主的 sessionController 对 origin=subagent 的
 *  会话要求「durable parent address」，而 /taskwatch/chat/stream 只传 sessionId，
 *  会直接回 `subagent Sessions require their durable parent address`。
 *  但只读的 /taskwatch/session?id= 走的是内存 store，**活的子代理会话读得到**
 *  （已用真实 DSH 验证：193 条消息），所以子代理页用这份快照渲染，不发、不流式。
 *
 *  限制如实告诉用户：宿主每会话最多回 60 条、每条正文最多 4000 字；这不是页面裁的。
 */
function agentMessageItems(messages){
  var out = [], seq = 0
  for (var i = 0; i < messages.length; i++) {
    var m = messages[i] || {}
    var at = Number(m.at) || 0
    var tools = Array.isArray(m.tools) ? m.tools : []
    for (var t = 0; t < tools.length; t++) {
      out.push({
        kind: 'tool', callId: 'sa' + (seq++), name: String(tools[t] || 'tool'),
        hint: '', status: 'ok', time: at
      })
    }
    var text = String(m.text == null ? '' : m.text)
    if (text.trim()) {
      out.push({ kind: m.role === 'user' ? 'user' : 'assistant', text: text, time: at })
    }
  }
  return out
}
function renderAgentError(msg){
  var box = $('log')
  if (!box) return
  box.innerHTML = ''
  var note = document.createElement('div')
  note.className = 'note'
  note.textContent = msg
  box.appendChild(note)
}
async function loadAgentTranscript(){
  var sid = S.sessionId, epoch = S.epoch
  setSub('正在读取子代理会话…')
  try {
    var r = await fetch('/taskwatch/session?id=' + encodeURIComponent(sid) + '&limit=60', { cache:'no-store' })
    var j = await r.json()
    if (epoch !== S.epoch || sid !== S.sessionId) return    // 已切走
    if (!j || j.error) {
      renderAgentError('读不到这个子代理的对话：' + ((j && j.error) || '未知错误'))
      setSub('只读 · 读取失败')
      return
    }
    var msgs = Array.isArray(j.messages) ? j.messages : []
    S.items = agentMessageItems(msgs)
    S.running = false; S.streaming = null
    renderAll()
    if (!S.items.length) {
      renderAgentError('这个子代理还没有对话记录')
      setSub('只读 · 没有对话')
    } else if (j.total > msgs.length) {
      setSub('只读 · 最近 ' + msgs.length + '/' + j.total + ' 条')
    } else {
      setSub('只读 · 共 ' + msgs.length + ' 条')
    }
    renderSubagentBar()
  } catch (e) {
    if (epoch !== S.epoch || sid !== S.sessionId) return
    renderAgentError('读不到这个子代理的对话：' + e.message)
    setSub('只读 · 读取失败')
  }
}

async function ensureSession(){
  var r
  try {
    var res = await fetch('/taskwatch/chat/sessions', { cache:'no-store' })
    if (res.status === 404) { S.chatReady = false; setSub('对话功能不可用（宿主未注册接口）'); renderAll(); return }
    r = await res.json()
  } catch (e) {
    S.chatReady = false; setSub('对话功能不可用：' + e.message); renderAll(); return
  }
  if (r && r.error) { S.chatReady = false; setSub('对话功能不可用：' + r.error); renderAll(); return }
  S.sessions = (r && r.sessions) || []
  var saved = ''
  try { saved = localStorage.getItem('taskwatch.session') || '' } catch (e) {}
  // 主界面只自动落到**根会话**上；子代理会话只能从「子代理」入口进，
  // 否则刷新一次就可能把二级视图当成主对话，返回键也就无处可回。
  var roots = S.sessions.filter(function(s){ return !isSubSession(s) })
  var pool = roots.length ? roots : S.sessions
  var pick = ''
  for (var i = 0; i < pool.length; i++) { if (pool[i].id === saved) { pick = saved; break } }
  if (!pick && pool.length) pick = pool[0].id
  if (pick) selectSession(pick, { root:true })
  else setSub('还没有会话，点右上角开一个')
  renderSubagentBar()
}

// ---------------------------------------------------------------------------
// 子代理：工具条入口 + 全屏二级页（v1.7.6）
//
// 数据来源是真实的，不猜字段：
//   /taskwatch/data 的 sessions[] 带 origin / parent / depth（宿主 lib/index.js:540-553），
//   子代理会话 = origin === 'subagent' 或 depth > 0；
//   data.subagents[] 是 subagents 服务投影出来的子代理清单（agent 侧可能有、会话侧未必有）。
// 两边按 id 去重合并：有会话的可以点进去看，没有会话的只显示状态，不伪造对话。
//
// 路由：#subagents（列表）/ #subagents/<id>（该子代理的对话）。
// 看子代理对话时主界面的 sessionId 就是它，返回时切回 S.rootId —— 会话隔离仍然
// 由 selectSession 的同一套清空 + 戳记保证，不另开一条渲染管线。
// ---------------------------------------------------------------------------
function isSubSession(s){
  if (!s) return false
  if (String(s.origin || '') === 'subagent') return true
  return (Number(s.depth) || 0) > 0
}
function sessionById(id){
  var sid = String(id || '')
  for (var i = 0; i < S.sessions.length; i++) if (String(S.sessions[i].id) === sid) return S.sessions[i]
  return null
}
function liveSessionById(id){
  var sid = String(id || '')
  var arr = (lastData && Array.isArray(lastData.sessions)) ? lastData.sessions : []
  for (var i = 0; i < arr.length; i++) if (String(arr[i].id) === sid) return arr[i]
  return null
}
function isSubAgentId(id){ return isSubSession(sessionById(id)) }
function firstRootId(){
  for (var i = 0; i < S.sessions.length; i++) if (!isSubSession(S.sessions[i])) return S.sessions[i].id
  return S.sessions.length ? S.sessions[0].id : ''
}
function subagentEntries(){
  var out = [], seen = Object.create(null)
  function addSession(s){
    if (!isSubSession(s)) return
    var sid = String(s.id)
    if (seen[sid]) return
    seen[sid] = 1
    out.push({
      id: sid,
      label: s.title || titles[sid] || s.fallback || shortId(sid),
      activity: s.running ? 'running' : 'idle',
      running: !!s.running,
      parent: s.parent ? String(s.parent) : '',
      depth: Number(s.depth) || 1,
      hasSession: true
    })
  }
  // S.sessions 来自 /chat/sessions，宿主**故意过滤掉**子代理（lib/index.js:1143）；
  // /taskwatch/data 的 sessions 才是含子代理的完整 live 列表，必须并进来，
  // 否则「子代理」页只能看到状态、点不进任何一条对话。
  for (var i = 0; i < S.sessions.length; i++) addSession(S.sessions[i])
  var live = (lastData && Array.isArray(lastData.sessions)) ? lastData.sessions : []
  for (var j = 0; j < live.length; j++) addSession(live[j])
  var agents = (lastData && Array.isArray(lastData.subagents)) ? lastData.subagents : []
  for (var k = 0; k < agents.length; k++) {
    var a = agents[k] || {}
    var id = String(a.id || '')
    if (!id || seen[id]) continue
    seen[id] = 1
    out.push({
      id: id,
      label: a.label || (a.mode === 'workflow' ? '工作流子代理' : '子代理'),
      activity: a.activity || '',
      running: a.activity === 'running',
      parent: a.parent ? String(a.parent) : '',
      depth: Number(a.depth) || 1,
      // 只有登记在 live sessions 里的子代理才读得到对话（见 loadAgentTranscript）。
      hasSession: false
    })
  }
  out.sort(function(x, y){
    if (x.running !== y.running) return x.running ? -1 : 1
    return String(x.label) < String(y.label) ? -1 : String(x.label) > String(y.label) ? 1 : 0
  })
  return out
}
function renderSubagentBar(){
  var bar = $('subbar')
  if (!bar) return
  var btn = $('subagentsBtn'), back = $('backMainBtn')
  var title = $('agentTitle'), listBtn = $('agentListBtn'), count = $('subagentsCount')
  var entries = subagentEntries()
  var viewing = !!S.viewingAgent
  if (viewing) {
    bar.hidden = false
    if (btn) btn.hidden = true
    if (back) { back.hidden = false; back.setAttribute('aria-label', '返回主对话') }
    if (listBtn) listBtn.hidden = entries.length === 0
    if (title) {
      title.hidden = false
      var cur = sessionById(S.viewingAgent) || liveSessionById(S.viewingAgent)
      title.textContent = cur ? (cur.title || titles[cur.id] || shortId(cur.id)) : ('子代理 ' + shortId(S.viewingAgent))
    }
    return
  }
  if (!entries.length) { bar.hidden = true; return }
  bar.hidden = false
  if (btn) { btn.hidden = false; btn.setAttribute('aria-label', '子代理 ' + entries.length + ' 个，单独查看') }
  if (back) back.hidden = true
  if (title) title.hidden = true
  if (listBtn) listBtn.hidden = true
  if (count) count.textContent = entries.length > 99 ? '99+' : String(entries.length)
}
function chevRightNode(){

  svg.setAttribute('viewBox', '0 0 24 24')
  svg.setAttribute('class', 'ago')

}
function agentRowNode(e){
  var b = document.createElement('button')
  b.type = 'button'
  b.className = 'agentrow' + (e.running ? ' run' : '')
  var dot = document.createElement('span'); dot.className = 'adot'; b.appendChild(dot)
  var ab = document.createElement('span'); ab.className = 'ab'
  var an = document.createElement('span'); an.className = 'an'; an.textContent = e.label
  var am = document.createElement('span'); am.className = 'am'
  var bits = []
  bits.push(e.running ? '运行中' : (e.activity === 'idle' ? '空闲' : (e.activity || '状态未知')))
  if (e.parent) {
    var ps = sessionById(e.parent)
    bits.push('父会话 ' + (ps ? (ps.title || titles[ps.id] || shortId(ps.id)) : shortId(e.parent)))
  }

  // 这个函数**不允许抛错**：一旦抛，整块渲染中断，牌桌就点不动了。

function pkAct(action){

  // 它对未知字段是静默忽略的 —— 猜错字段名不报错、只表现为"点了没反应"，
  // 所以两个名字一起发，哪个是它对都能生效。

    // 插件的加注金额字段名若是 to 而不是 amount，这里兜一次，免得手机上"加注"永远失败。
    .catch(function(err){

      var b2 = { action: 'raise', to: +$('pkRange').value }
      return pkCall('/act', b2).then(function(s){ PK.snap = s; pkDraw() })
        .catch(function(e2){ pkToast('加注失败：' + e2.message) })

/** 右上角「+」：先选工作区，再新建并切过去。
 *
 *  清单来自 /taskwatch/chat/workspaces，是**服务端列出来的**：客户端能挑，但挑不了清单外的
 *  路径（宿主侧只采纳逐字命中的那一条）。所以"手机上想开在哪儿"和"手机能碰哪些磁盘"
 *  是两件事，后者仍然由服务端决定。
 */
async function openWsPicker(){
  if (S.running) { setSub('当前有任务在跑，先停下再新建'); return }
  var el = $('wsp')
  if (!el) {
    el = document.createElement('div')
    el.id = 'wsp'
    el.innerHTML = '<div class="box" role="dialog" aria-modal="true" aria-label="选择新对话的工作区">' +
      '<div class="ws-head"><h4>新对话开在哪个工作区</h4><button class="sheet-close" type="button" data-ws-close aria-label="关闭">' + ICON_CLOSE + '</button></div><div class="list"></div></div>'
    el.addEventListener('click', function(e){ if (e.target === el) closeWsPicker() })
    el.querySelector('[data-ws-close]').addEventListener('click', closeWsPicker)
    document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeWsPicker() })
    document.body.appendChild(el)
  }
  var list = el.querySelector('.list')
  list.textContent = ''
  setSub('正在取工作区…')
  var rows = []
  try {
    var r = await fetch('/taskwatch/chat/workspaces', { cache:'no-store' }).then(function(x){ return x.json() })
    rows = (r && r.workspaces) || []
    setSub(rows.length ? '' : ((r && r.error) ? ('取工作区失败：' + r.error) : '没有可选工作区，只能用默认'))
  } catch (e) { setSub('取工作区失败：' + e.message) }

  var mkItem = function(label, sub, tag, path){
    var b = document.createElement('button')
    b.type = 'button'
    b.className = 'it'
    var txt = document.createElement('span'); txt.className = 'txt'
    var nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = label
    txt.appendChild(nm)
    if (sub) { var p = document.createElement('span'); p.className = 'pt'; p.textContent = sub; txt.appendChild(p) }
    b.appendChild(txt)
    if (tag) { var t = document.createElement('span'); t.className = 'tag'; t.textContent = tag; b.appendChild(t) }
    b.addEventListener('click', function(){ closeWsPicker(); newSession(path) })
    return b
  }
  rows.forEach(function(w){
    list.appendChild(mkItem(w.name || w.path, w.path, w.why === 'pinned' ? '常用' : '最近', w.path))
  })
  list.appendChild(mkItem('默认工作区', '不指定 —— 交给宿主决定', '', ''))
  el.classList.add('on')
}

/** 新建会话并立刻切过去。path 为空 = 不指定工作区（用宿主的默认值）。 */
async function newSession(path){
  if (S.running) { setSub('当前有任务在跑，先停下再新建'); return }
  setSub('正在新建…')
  try {
    var r = await post('/taskwatch/chat/create', path ? { workspace: path } : {})
    if (!r || !r.sessionId) { setSub('新建失败：' + ((r && r.error) || '宿主没返回 sessionId')); return }
    var list = await fetch('/taskwatch/chat/sessions', { cache:'no-store' }).then(function(x){ return x.json() })
    S.sessions = (list && list.sessions) || []
    selectSession(r.sessionId)
    if (r.workspace) flashSub('已开在 ' + r.workspace)
    else setSub('')
  } catch (e) { setSub('新建失败：' + e.message) }
}

// ── 深浅色切换 ────────────────────────────────────────────────────────────
// 默认跟随系统；用户手动切过之后以手动为准，并记住选择。
// 状态栏颜色从令牌里读，不在这里写死 hex —— 令牌改了它自动跟着改。
function applyTheme(t, remember){
  var dark = (t === 'dark')
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
  $('themeBtn').setAttribute('aria-pressed', dark ? 'true' : 'false')
  // 图标本身表达"当前是什么主题"，但图标没有文字标签，读屏和第一眼都容易误会，
  // 所以把当前状态和点击结果都写进 aria-label。
  $('themeBtn').setAttribute('aria-label', dark ? '当前暗色，点击切到亮色' : '当前亮色，点击切到暗色')
  var bgc = ''
  try {
    bgc = getComputedStyle(document.documentElement).getPropertyValue('--dsw-alias-bg-base').trim()
  } catch (e) {}
  if (bgc) {
    var ms = document.querySelectorAll('meta[name="theme-color"]')
    for (var i = 0; i < ms.length; i++) {
      var mm = ms[i].getAttribute('media') || ''
      // 带 media 的两个 meta 分别对应系统亮/暗；手动覆盖时改与当前主题相符的那个。
      if ((/dark/i.test(mm)) === dark) ms[i].setAttribute('content', bgc)
    }
  }
  if (remember) { try { localStorage.setItem('taskwatch.theme', dark ? 'dark' : 'light') } catch (e) {} }
}
applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light', false)
// 字号与「只看对话」的偏好：由 <head> 的引导脚本先设好 data-font，这里只同步状态。
applyFont(document.documentElement.getAttribute('data-font') || 'medium', false)
try { S.chatOnly = localStorage.getItem('tw-chat-only') === '1' } catch (e) {}
$('themeBtn').addEventListener('click', function(){
  var dark = document.documentElement.getAttribute('data-theme') === 'dark'
  applyTheme(dark ? 'light' : 'dark', true)
})
// 用户没手动选过时，跟随系统的切换。老 Safari 没有 addEventListener，用 try 兜住。
try {
  window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change', function(e){
    var saved = ''
    try { saved = localStorage.getItem('taskwatch.theme') || '' } catch (err) {}
    if (saved !== 'light' && saved !== 'dark') applyTheme(e.matches ? 'dark' : 'light', false)
  })
} catch (e) {}

// ── 统一兜住"登录没了" ────────────────────────────────────────────────────
// 任何一个请求回 401，就送去配对页。装在 fetch 上而不是散在每个调用点：
// 漏掉一处就会出现「页面永远卡在连接中」，而那种状态在手机上**没有任何自救路径**
// —— 用户既不知道该去哪，也没法清 cookie。这里一次装好，全部覆盖。
//
// 但跳之前必须确认配对页真的存在：中继可能是还没重启的旧版本，那时
// /taskwatch/pair 会 404 —— 跳过去等于把「卡在连接中」换成「一片 not found」，
// 反而更糟。新中继对该路径免鉴权回 200，旧中继回 404，所以启动探一次就够。
var pairPageOk = false
var rawFetch = window.fetch.bind(window)
rawFetch('/taskwatch/pair', { method: 'HEAD' })
  .then(function (r) { pairPageOk = (r.status === 200) })
  .catch(function () { /* 探测失败就当没有，保守降级 */ })
window.fetch = function (u, o) {
  return rawFetch(u, o).then(function (r) {
    if (r.status === 401) {
      if (pairPageOk) location.replace('/taskwatch/pair')
      throw new Error('unauthorized')
    }
    return r
  })
}

/* ── 纸墨微动 · 行为层 ──────────────────────────────────────────────────
   这一层只管"什么时候"，不管"长什么样"（长什么样在上面第 10 节 CSS 里）。

   它是纯渐进增强：整段不执行时，页面必须**完全静态且完整** —— 图片不会被藏起来、
   失败卡片不会反复抖、指标行不会闪。所以这里没有"先隐藏、等 JS 显示"的写法：
   所有动画类都是这里加上去的，CSS 里默认一个都没有。
   ───────────────────────────────────────────────────────────────────── */
;(function () {
  var doc = document
  var RM = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)

  /* 1. 按压：从指尖洇开一点墨。用事件委托，所以将来新加的按钮只要写进选择器
        就自动有这个反馈，不用一个个挂事件。 */
  var INKY = '#send,.pillbtn,.iconbtn,.item,.toolgroup .gh,.tool .more,.filecard'
  doc.addEventListener('pointerdown', function (e) {
    if (RM || !e.target || !e.target.closest) return
    var t = e.target.closest(INKY)
    if (!t) return
    var r = t.getBoundingClientRect()
    if (getComputedStyle(t).position === 'static') t.style.position = 'relative'
    t.style.overflow = 'hidden'
    var d = doc.createElement('span')
    d.className = 'inkdot'
    var s = Math.max(r.width, r.height) * 2.4
    d.style.width = s + 'px'
    d.style.height = s + 'px'
    d.style.left = (e.clientX - r.left) + 'px'
    d.style.top = (e.clientY - r.top) + 'px'
    t.appendChild(d)
    /* 下一帧再加 .go：同一帧里插入并加类，动画的 from 帧会被跳过，
       看起来像"凭空出现"而不是"洇开"。 */
    requestAnimationFrame(function () { d.classList.add('go') })
    setTimeout(function () { try { d.remove() } catch (err) {} }, 460)
  }, { passive: true })

  /* 2. 主题切换的那一滴墨。主题按钮是唯一带 aria-pressed 的 .iconbtn，所以不必
        知道它的 id；在捕获阶段先摆好墨滴，再让原来的处理器翻主题 —— CSS 变量是
        活的，这层墨取到的就是**新**主题的底色。 */
  var moire = null
  doc.addEventListener('pointerdown', function (e) {
    if (RM || !e.target || !e.target.closest) return
    if (!e.target.closest('.iconbtn[aria-pressed]')) return
    if (!moire) {
      moire = doc.createElement('div')
      moire.id = 'moire'
      doc.body.appendChild(moire)
    }
    moire.style.setProperty('--mx', e.clientX + 'px')
    moire.style.setProperty('--my', e.clientY + 'px')
    moire.classList.remove('go')
    void moire.offsetWidth
    moire.classList.add('go')
    setTimeout(function () { moire.classList.remove('go') }, 420)
  }, { passive: true, capture: true })

  /* 3. 输入框里有字 → 发送键醒过来。用 input 委托，不必知道输入框的 id。 */
  function wake () {
    var s = doc.getElementById('send')
    var i = doc.querySelector('.composer #input')
    if (!s || !i) return
    s.classList.toggle('awake', !!i.value.trim() || S.attachments.some(function(a){ return a.status === 'ready' }))
  }
  doc.addEventListener('input', wake, { passive: true })
  setTimeout(wake, 300)

  /* 4. 剩下都是"状态刚刚变化"的标记。没有 MutationObserver 就到此为止 ——
        页面退回纯静态，功能一个不少。 */
  if (!window.MutationObserver) return

  var toolState = new Map()   /* 工具卡身份 -> 上一次的状态 */
  var statsText = null
  var firstPass = true

  function mark () {
    /* 4a. 工具卡：只在状态**真的变了**那一次加 .fresh。否则整段重渲染会让每个
           动画反复重放，观感从"灵动"变"抽搐"。 */
    var cards = doc.querySelectorAll('.tool')
    for (var i = 0; i < cards.length; i++) {
      var c = cards[i]
      var st = c.classList.contains('run') ? 'run' : (c.classList.contains('no') ? 'no' : 'ok')
      var name = c.querySelector('.n')
      var args = c.querySelector('.a')
      var key = (name ? name.textContent : '#' + i) + '|' + (args ? args.textContent.slice(0, 60) : '')
      var was = toolState.get(key)
      toolState.set(key, st)
      if (!firstPass && was !== undefined && was !== st) {
        c.classList.remove('fresh')
        void c.offsetWidth        /* 强制回流：同一个类直接加回去不会重放动画 */
        c.classList.add('fresh')
        setTimeout(function (el) { return function () { el.classList.remove('fresh') } }(c), 700)
      }
    }

    /* 4b. 指标行：文字变了轻轻闪一下 */
    var s = doc.querySelector('.stats')
    if (s) {
      var txt = s.textContent
      if (!firstPass && statsText !== null && txt !== statsText) {
        s.classList.remove('tick')
        void s.offsetWidth
        s.classList.add('tick')
        setTimeout(function () { s.classList.remove('tick') }, 420)
      }
      statsText = txt
    }

    /* 4c. 图片：没加载完的才标 .loading（骨架流光），加载完 .done 显影。
           注意 .loading 是这里**加上**的 —— JS 不跑时图片本来就直接可见。
           2026-10-22（v1.7.8）：只给**贴着视口**的图挂流光。长会话里几十张懒加载图
           永远在视口外，以前它们会一直挂着 .loading，流光动画也就永远在跑（闪屏）。 */
    var wraps = doc.querySelectorAll('.md-imgwrap')
    var vh = window.innerHeight || 800
    for (var j = 0; j < wraps.length; j++) {
      var w = wraps[j]
      if (w.classList.contains('done')) continue
      var im = w.querySelector('.md-img')
      if (!im) continue
      if (im.complete) {
        w.classList.remove('loading')
        w.classList.add('done')
      } else {
        var wr = w.getBoundingClientRect()
        var near = wr.bottom > -vh && wr.top < vh * 2
        if (near) w.classList.add('loading')
        else w.classList.remove('loading')
      }
    }

    firstPass = false
  }

  /* 图片的 load/error 不冒泡，必须用捕获阶段才收得到 */
  function settle (e) {
    var im = e.target
    if (!im || im.tagName !== 'IMG' || !im.closest) return
    var w = im.closest('.md-imgwrap')
    if (!w) return
    w.classList.remove('loading')
    w.classList.add('done')
    // v1.7.7 兜底三：任何一条路径（包括以后新加的渲染代码）插进来的图，
    // 只要 error 之后 naturalWidth 还是 0，就在这里统一换成提示条。
    // 这样"页面上不留破图 img"是页面级的不变量，而不是某个函数的自觉。
    if (e.type === 'error' && !im.naturalWidth) {
      swapBrokenImg(im, im.getAttribute('src') || '', im.alt || '')
    }
  }
  doc.addEventListener('load', settle, true)
  doc.addEventListener('error', settle, true)

  /* 5. 抽屉每打开一次，条目依次落下（每档 14ms）。
        两个触发点都要：hidden 属性变化（程序里打开时）+ 点左上角那颗胶囊
        （真机上走的就是这条路）。只靠 hidden 的话，若抽屉本来就是打开状态、
        或者条目是打开后才渲染的，这一档就漏掉了。 */
  var sheet = doc.getElementById('sheet')
  function stagger () {
    if (!sheet || sheet.hidden) return
    var items = sheet.querySelectorAll('.item')
    for (var k = 0; k < items.length && k < 9; k++) {
      (function (it, delay) {
        it.classList.remove('fresh')
        void it.offsetWidth
        it.style.animationDelay = delay + 'ms'
        it.classList.add('fresh')
        setTimeout(function () { it.classList.remove('fresh') }, 520 + delay)
      })(items[k], k * 14)
    }
  }
  if (sheet) {
    new MutationObserver(stagger).observe(sheet, { attributes: true, attributeFilter: ['hidden'] })
    doc.addEventListener('click', function (e) {
      if (e.target && e.target.closest && e.target.closest('.pillbtn')) setTimeout(stagger, 0)
    }, { passive: true })
  }

  /* 6. 观察整棵 body，用 rAF 合并：流式生成时 DOM 每秒会变很多次，
        不合并的话每来一个 chunk 都要跑一轮 mark()。 */
  var queued = false
  function schedule () {
    if (queued) return
    queued = true
    requestAnimationFrame(function () { queued = false; mark() })
  }
  new MutationObserver(schedule).observe(doc.body, {
    childList: true, subtree: true, characterData: true,
  })
  /* 7. 右下浮标要站在页脚**之上**。页脚高度是个变量（指标行随内容折成一行或两行），
        写死 bottom 的后果就是它压住指标行中间那几个字 —— 这是 2026-10-09 从截图里
        看出来的。用 ResizeObserver 拿页脚真实高度写进 --foot-h，定位交给 CSS；
        没有 ResizeObserver 就退回窗口 resize，两样都没有就还是手册里的旧值。 */
  var foot = doc.querySelector('footer')
  if (foot) {
    var putFoot = function () {
      try {
        doc.documentElement.style.setProperty('--foot-h', Math.round(foot.getBoundingClientRect().height) + 'px')
      } catch (err) {}
    }
    if (window.ResizeObserver) new ResizeObserver(putFoot).observe(foot)
    else doc.addEventListener('resize', putFoot, { passive: true })
    putFoot()
  }

  mark()   /* 第一轮只记基线（firstPass 为真时不放动画），但会把未加载的图标记成 .loading */
})()

<script>
/* ROUTE-SAFETY-BEGIN
   ── 双入口：清单只读；换路只能由用户点选触发（2026-10-21 v1.7.5）──────────

   为什么以前会反复刷新：v1.6.0 起，页面把「该走哪条路」的判断写进 apply()，
   而 apply() 不只在点按钮时调用 —— 初始加载读完入口清单会调一次，每 12 秒的
   上游体检回来还会调一次。判断出「该换」就直接改地址跳走。两条路对「这条路
   通不通」的判断一旦不一致（一条体检失败、另一条请求报错），A→B→A 就会无限
   往返，手机看到的就是地址栏来回变、页面反复刷新。

   v1.7.5 把这条自动路径整个删掉，只保留三件事：
    1. 读一次 GET /taskwatch/entries，把两条路列进胶囊菜单 —— 只渲染，不导航；
    2. 用户点另一个入口 → 向中继签一张换路票据 → 跳一次；整个脚本只有这一处
       会改 location；
    3. 跳之前写 sessionStorage 时间戳：8 秒内已有跳转标记就拒绝再跳，只给静态
       提示（第二重保险）。
   另外，带 ?t= 落地时立刻用 history.replaceState 清掉参数，并把入口锁成这
   一项；锁定后它不再参与任何判断。这里没有定时器，也没有任何自动跳转。

   为什么自动模式被删掉：浏览器禁止 https 页面探测 http:// 的局域网地址，中继
   经隧道看到的来源又永远是 127.0.0.1，页面拿不到「手机在哪个网络」这种事实。
   用「刚才通不通」去猜，只能猜出方向，猜不出「该不该动」—— 猜错的代价是整页
   反复刷新，远大于省下的一次点击。所以自动只保留在人的脑子里：胶囊列出两条路，
   当前是哪条、另一条在哪，由用户自己点。
   */
(function () {
  try {
    var LOCK_KEY = 'tw-route-lock'
    var JUMP_KEY = 'tw-route-jump'
    var JUMP_GUARD_MS = 8000
    var REMOTE_KEY = 'tw-remote-url'

    var items = []          // [{kind,label,url}]，顺序固定：远端在前
    var current = ''        // 入口清单 / 地址判断出的当前入口
    var locked = ''         // 票据落地后锁定的入口；锁定期间只信它
    var landed = false      // 本次加载是不是票据落地
    var degraded = false    // 宿主没有换路接口：静态降级，不再重试
    var busy = false
    var lastJumpAt = 0      // 同文档内的第二道保险（sessionStorage 不可用时仍有效）
    var pill = null
    var menu = null
    var scrim = null

    function readStore(store, key) {
      try { return store.getItem(key) || '' } catch (e) { return '' }
    }
    function writeStore(store, key, value) {
      try { store.setItem(key, value) } catch (e) {}
    }
    function dropStore(store, key) {
      try { store.removeItem(key) } catch (e) {}
    }
    function readSession(key) { return readStore(sessionStorage, key) }
    function writeSession(key, value) { writeStore(sessionStorage, key, value) }

    function asKind(v) { return v === 'lan' || v === 'remote' ? v : '' }

    /** 上次成功切换 / 打开过的远端地址。只认 http(s)，避免 localStorage 被第三方
     *  写进 javascript: 一类的东西后，这个链接变成一个可点的执行入口。 */
    function rememberedRemote() {
      var value = readStore(localStorage, REMOTE_KEY)
      return /^https?:\/\//i.test(value) ? value : ''
    }
    function rememberRemote(url) {
      if (!url) return
      var base = String(url).split('?')[0]
      if (/^https?:\/\//i.test(base)) writeStore(localStorage, REMOTE_KEY, base)
    }

    /** 把入口 URL 补成「…/taskwatch」。只做显示与同源判断；真正跳转用票据给的地址。 */
    function withRoute(url) {
      var s = String(url || '').trim()
      if (!/^https?:\/\//i.test(s)) return ''
      if (!/\/taskwatch\/?$/i.test(s)) s = s.replace(/\/+$/, '') + '/taskwatch'
      return s
    }
    function shortUrl(url) {
      try { return new URL(url, location.href).origin } catch (e) {
        return String(url || '').replace(/\/taskwatch\/?$/, '')
      }
    }
    function originOf(url) {
      try { return new URL(url, location.href).origin } catch (e) { return '' }
    }

    /** 票据落地：URL 上的 ?t= 立刻清掉，不留在地址栏、历史记录和分享出去的链接里。 */
    function stripTicketParam() {
      var u
      try { u = new URL(location.href) } catch (e) { return false }
      var params = u.searchParams
      if (!params.has('t') && !params.has('T')) return false
      params.delete('t')
      params.delete('T')
      var search = params.toString()
      var clean = u.pathname + (search ? '?' + search : '') + u.hash
      try { history.replaceState(null, '', clean) } catch (e) {}
      return true
    }

    function readJump() {
      var raw = readSession(JUMP_KEY)
      if (!raw) return null
      try {
        var j = JSON.parse(raw)
        return j && typeof j.at === 'number' ? j : null
      } catch (e) { return null }
    }

    /** 8 秒护栏还差多久（毫秒）。0 = 现在可以跳。时钟回拨按「刚刚跳过」处理。 */
    function guardWait() {
      var now = Date.now()
      var wait = 0
      var j = readJump()
      if (j) {
        wait = j.at > now ? JUMP_GUARD_MS : Math.max(0, JUMP_GUARD_MS - (now - j.at))
      }
      if (lastJumpAt) {
        var mem = lastJumpAt > now ? JUMP_GUARD_MS : Math.max(0, JUMP_GUARD_MS - (now - lastJumpAt))
        if (mem > wait) wait = mem
      }
      return wait
    }

    /** 换路的唯一出口：先过护栏、写带时间戳的标记，然后才跳。 */
    function navigateOnce(url, kind) {
      var wait = guardWait()
      if (wait > 0) {
        busy = false
        status('刚刚切换过，' + Math.ceil(wait / 1000) + ' 秒后才能再切')
        return false
      }
      var at = Date.now()
      lastJumpAt = at
      writeSession(JUMP_KEY, JSON.stringify({ at: at, to: kind }))
      location.href = url
      return true
    }

    function isGone(code) { return code === 404 || code === 405 }

    function currentKind() {
      // 地址是事实；地址匹配不上（多网卡 / 服务端看到的 Host 不可信）才用票据锁。
      var here = guessCurrent()
      if (here) return here
      if (locked && hasKind(locked)) return locked
      return current
    }
    function hasKind(kind) {
      for (var i = 0; i < items.length; i++) if (items[i].kind === kind) return true
      return false
    }
    function itemOf(kind) {
      for (var i = 0; i < items.length; i++) if (items[i].kind === kind) return items[i]
      return null
    }
    function hasChoice() { return items.length >= 2 }

    /** 兼容两种 entries 形状：中继的 {remote, lan, current} 与新契约的
     *  {entries:[{kind, label, url, current}]}。同一份页面在中继和宿主下都能跑。 */
    function parseEntries(j) {
      if (!j || j.ok !== true) return false
      var list = []
      var declared = ''
      if (Array.isArray(j.entries)) {
        var seenKind = {}
        for (var i = 0; i < j.entries.length; i++) {
          var e = j.entries[i]
          if (!e || typeof e.url !== 'string') continue
          if (e.kind !== 'remote' && e.kind !== 'lan') continue
          if (seenKind[e.kind]) continue
          var url = withRoute(e.url)
          if (!url) continue
          seenKind[e.kind] = true
          list.push({
            kind: e.kind,
            label: typeof e.label === 'string' ? e.label : '',
            url: url,
          })
          if (e.current === true) declared = e.kind
        }
      } else {
        var remote = withRoute(j.remote)
        if (remote) list.push({ kind: 'remote', label: '', url: remote })
        if (Array.isArray(j.lan)) {
          var seen = {}
          for (var k = 0; k < j.lan.length; k++) {
            var lanUrl = withRoute(j.lan[k])
            if (!lanUrl || seen[lanUrl]) continue
            seen[lanUrl] = true
            list.push({ kind: 'lan', label: '', url: lanUrl })
            break   // 胶囊只需要一条局域网入口，多网卡不在这里堆
          }
        }
        declared = asKind(j.current)
      }
      if (!list.length) return false
      // 远端永远排第一，局域网第二：顺序稳定，用户不必每次重新找。
      list.sort(function (a, b) {
        if (a.kind === b.kind) return 0
        return a.kind === 'remote' ? -1 : 1
      })
      items = list
      current = guessCurrent() || declared
      if (landed) {
        if (!locked) locked = current
        if (locked) writeSession(LOCK_KEY, locked)
      }
      if (current === 'remote') rememberRemote(location.origin + '/taskwatch')
      return true
    }

    /** 「我现在在哪条路上」优先按地址判断，不轻信服务端看到的 Host：
     *  中继经隧道看到的来源永远是 127.0.0.1，Host 判断可能落到别的分支。 */
    function guessCurrent() {
      var here = location.origin
      for (var i = 0; i < items.length; i++) {
        if (originOf(items[i].url) === here) return items[i].kind
      }
      return ''
    }

    function status(message) {
      var el = menu && menu.querySelector('.tw-mstatus')
      if (!el) return
      el.textContent = message || ''
    }

    /** 降级：宿主没有换路接口。清掉胶囊、不报错、不重试。 */
    function degrade() {
      if (degraded) return
      degraded = true
      closeMenu()
      if (pill) { pill.style.display = 'none'; pill.setAttribute('aria-hidden', 'true') }
    }

    /** 降级态在设置 / 详情里的一行说明。宿主页面没有中继接口这件事本身不是错误，
     *  所以这里只陈述事实，并把「上次成功用过的远端地址」留成手动入口。 */
    function noteHtml() {
      if (!degraded) return ''
      var last = rememberedRemote()
      var text = '当前页面由插件宿主提供，远端切换需要中继接口'
      if (last) text += '；也可直接打开 <a href="' + esc(last) + '">' + esc(last) + '</a>'
      return '<div class="note route-note">' + text + '</div>'
    }
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
      })
    }
    window.twRouteNote = noteHtml

    function mount() {
      // 胶囊待的**标题行**里（标题与连接三点之间）。它只是 .hrow 的 flex 子项，
      // 不参与绝对/浮动定位，结构上不可能盖住内容。
      var host = document.getElementById('hrow') || document.querySelector('.hrow') || document.querySelector('header') || document.body
      var before = document.getElementById('netq') || document.getElementById('newBtn') || null
      if (!pill) {
        pill = document.createElement('button')
        pill.id = 'tw-route-pill'
        pill.type = 'button'
        pill.setAttribute('aria-haspopup', 'dialog')
        pill.setAttribute('aria-expanded', 'false')
        pill.setAttribute('aria-label', '连接入口')
        pill.addEventListener('click', openMenu)
      }
      if (pill.parentNode !== host || (before && pill.nextSibling !== before)) {
        if (before && before.parentNode === host) host.insertBefore(pill, before)
        else host.appendChild(pill)
      }
      return pill
    }

    function buildMenu() {
      if (menu) return
      scrim = document.createElement('div')
      scrim.id = 'tw-route-scrim'
      scrim.setAttribute('aria-hidden', 'true')
      scrim.addEventListener('click', closeMenu)
      document.body.appendChild(scrim)

      menu = document.createElement('div')
      menu.id = 'tw-route-menu'
      menu.setAttribute('role', 'dialog')
      menu.setAttribute('aria-label', '连接入口')
      var head = document.createElement('div')
      head.className = 'tw-mhead'
      head.textContent = '连接入口'
      var list = document.createElement('div')
      list.className = 'tw-mlist'
      var foot = document.createElement('div')
      foot.className = 'tw-mfoot'
      var statusEl = document.createElement('div')
      statusEl.className = 'tw-mstatus'
      statusEl.setAttribute('role', 'status')
      statusEl.setAttribute('aria-live', 'polite')
      menu.appendChild(head)
      menu.appendChild(list)
      menu.appendChild(foot)
      menu.appendChild(statusEl)
      document.body.appendChild(menu)
      document.addEventListener('keydown', onKey)
    }

    function renderMenu() {
      if (!menu) return
      var list = menu.querySelector('.tw-mlist')
      while (list.firstChild) list.removeChild(list.firstChild)
      var here = currentKind()
      for (var i = 0; i < items.length; i++) {
        var it = items[i]
        var isHere = it.kind === here
        var row = document.createElement('button')
        row.type = 'button'
        row.className = 'tw-entry'
        row.setAttribute('data-kind', it.kind)
        row.setAttribute('aria-current', isHere ? 'true' : 'false')
        var kind = document.createElement('span')
        kind.className = 'tw-kind'
        kind.textContent = it.label || (it.kind === 'lan' ? '局域网' : '远端')
        var url = document.createElement('span')
        url.className = 'tw-url'
        url.textContent = shortUrl(it.url)
        var chip = document.createElement('span')
        chip.className = 'tw-chip'
        chip.textContent = isHere ? '当前' : '切换'
        row.appendChild(kind)
        row.appendChild(url)
        row.appendChild(chip)
        if (!isHere) row.addEventListener('click', onPick)
        list.appendChild(row)
      }
      var foot = menu.querySelector('.tw-mfoot')
      foot.textContent = locked && locked === here
        ? '已锁定为票据落地入口；页面不会自动切换，只在你点另一个入口时才跳一次。'
        : '只在你点选时切换；页面不会自动跳转。'
    }

    function positionMenu() {
      if (!menu || !pill) return
      var r = pill.getBoundingClientRect()
      var top = Math.round(r.bottom + 6)
      if (top < 8) top = 8
      // 右对齐到胶囊，但**必须夹在视口内**：胶囊在标题行中间偏右，直接按它右对齐
      // 会把 330px 宽的菜单推到屏幕左侧外面（390 宽实测会裁掉入口名）。
      var margin = 12
      var width = menu.offsetWidth || Math.min(330, window.innerWidth - margin * 2)
      var right = Math.max(margin, Math.round(window.innerWidth - r.right))
      if (window.innerWidth - right - width < margin) {
        right = Math.max(margin, window.innerWidth - width - margin)
      }
      menu.style.top = top + 'px'
      menu.style.right = right + 'px'
      menu.style.left = 'auto'
      menu.style.maxHeight = Math.max(180, Math.round(window.innerHeight - top - margin)) + 'px'
    }

    function openMenu() {
      if (degraded || !hasChoice()) return
      buildMenu()
      renderMenu()
      status('')
      positionMenu()
      scrim.classList.add('on')
      menu.classList.add('on')
      pill.setAttribute('aria-expanded', 'true')
    }

    function closeMenu() {
      if (menu) menu.classList.remove('on')
      if (scrim) scrim.classList.remove('on')
      if (pill) pill.setAttribute('aria-expanded', 'false')
    }

    function onKey(e) {
      if (e && e.key === 'Escape') closeMenu()
    }

    function onPick() {
      jump(this.getAttribute('data-kind'))
    }

    /** 用户点「另一个入口」：签一张票，跳一次。失败只改菜单里的静态提示。 */
    function jump(kind) {
      if (busy || degraded) return
      var target = itemOf(kind)
      if (!target) { status('这条入口现在不可用'); return }
      if (kind === currentKind()) { status('已经在这个入口上'); return }
      // 同源目标跳过去只是刷新一次页面，没有意义（也会绕开 8 秒护栏的直觉）。
      if (originOf(target.url) === location.origin) {
        status('这条入口和当前地址是同一个源，无需切换')
        return
      }
      // 护栏提前到签票之前：被拦下时连票都不该签。
      var wait = guardWait()
      if (wait > 0) {
        status('刚刚切换过，' + Math.ceil(wait / 1000) + ' 秒后才能再切')
        return
      }
      busy = true
      status('正在签票…')
      fetch('/taskwatch/ticket', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ to: kind }),
      }).then(function (r) {
        // 宿主没有换路接口（405）或这条路由不存在（404）：静态降级，绝不重试。
        if (isGone(r.status)) { degrade(); return null }
        if (!r.ok) throw new Error('HTTP ' + r.status)
        return r.json()
      }).then(function (j) {
        if (j === null) return
        if (!j || j.ok !== true || typeof j.url !== 'string' || !/^https?:\/\//i.test(j.url)) {
          busy = false
          status((j && j.error) || '没有拿到换路地址')
          return
        }
        if (kind === 'remote') rememberRemote(j.url)
        navigateOnce(j.url, kind)
      }).catch(function (e) {
        busy = false
        status('切换失败：' + ((e && e.message) || '网络错误'))
      })
    }

    /** 只渲染，不判断、不跳。加载路径上调用它是安全的。 */
    function apply() {
      var el = mount()
      if (degraded) { el.style.display = 'none'; el.setAttribute('aria-hidden', 'true'); return }
      var here = currentKind()
      if (!hasChoice() || !here) { el.style.display = 'none'; el.setAttribute('aria-hidden', 'true'); return }
      var text = here === 'lan' ? '局域网' : '远端'
      while (el.firstChild) el.removeChild(el.firstChild)
      var label = document.createElement('span')
      label.textContent = text
      var caret = document.createElement('span')
      caret.className = 'tw-caret'
      caret.setAttribute('aria-hidden', 'true')
      el.appendChild(label)
      el.appendChild(caret)
      el.removeAttribute('aria-hidden')
      el.setAttribute('aria-label', '连接入口：' + text + '。点按查看另一条入口')
      el.style.display = 'inline-flex'
    }

    // 样式随手挂上，不依赖页面里已有的 class（两份外壳的样式表可能不同）
    var css = document.createElement('style')
    var FONT = '-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",system-ui,sans-serif'
    css.textContent = '#tw-route-pill{display:none;align-items:center;gap:5px;'
      + 'flex:0 0 auto;margin:0;max-width:38vw;overflow:hidden;'
      + 'height:44px;min-height:44px;line-height:1;padding:0 10px;border-radius:999px;'
      + 'font:600 12.5px/1.25 ' + FONT + ';'
      + 'color:inherit;background:color-mix(in srgb,currentColor 8%,transparent);'
      + 'border:1px solid color-mix(in srgb,currentColor 24%,transparent);cursor:pointer;white-space:nowrap}'
      + '#tw-route-pill[aria-expanded="true"]{background:color-mix(in srgb,currentColor 15%,transparent)}'
      + '#tw-route-pill:active{transform:translateY(1px)}'
      + '#tw-route-pill .tw-caret{flex:0 0 auto;width:0;height:0;opacity:.62;'
      + 'border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid currentColor}'
      // 点空白处关闭：一层透明遮罩，而不是给 document 挂 click（后者会误吞页面上的点击）。
      + '#tw-route-scrim{position:fixed;inset:0;z-index:70;background:rgba(8,10,14,.22);display:none}'
      + '#tw-route-scrim.on{display:block}'
      // 菜单：固定在胶囊下方右对齐；宽度跟着视口收，390 宽下不会顶到屏幕外。
      + '#tw-route-menu{position:fixed;z-index:80;display:none;box-sizing:border-box;'
      + 'width:min(330px,calc(100vw - 20px));padding:8px;overflow-y:auto;'
      + 'border-radius:16px;background:var(--panel,Canvas);color:inherit;'
      + 'border:1px solid color-mix(in srgb,currentColor 16%,transparent);'
      + 'box-shadow:0 18px 44px -12px rgba(0,0,0,.38),0 2px 8px rgba(0,0,0,.12);'
      + 'font:400 13px/1.4 ' + FONT + '}'
      + '#tw-route-menu.on{display:block}'
      + '#tw-route-menu .tw-mhead{padding:5px 10px 8px;font:600 11.5px/1 ' + FONT + ';'
      + 'letter-spacing:.06em;color:color-mix(in srgb,currentColor 48%,transparent)}'
      + '#tw-route-menu .tw-entry{display:flex;align-items:center;gap:8px;width:100%;'
      + 'min-height:56px;padding:8px 10px;border:0;border-radius:12px;background:none;'
      + 'color:inherit;text-align:left;cursor:pointer;font:inherit}'
      + '#tw-route-menu .tw-entry+.tw-entry{margin-top:2px}'
      + '#tw-route-menu .tw-kind{flex:0 0 auto;font-weight:600;font-size:13.5px}'
      + '#tw-route-menu .tw-url{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;'
      + 'white-space:nowrap;font-size:11.5px;color:color-mix(in srgb,currentColor 55%,transparent);'
      + 'font-variant-numeric:tabular-nums}'
      + '#tw-route-menu .tw-chip{flex:0 0 auto;padding:4px 8px;border-radius:999px;'
      + 'font-size:11.5px;font-weight:600;white-space:nowrap;'
      + 'border:1px solid color-mix(in srgb,currentColor 20%,transparent)}'
      + '#tw-route-menu .tw-entry[aria-current="true"]{background:color-mix(in srgb,currentColor 6%,transparent)}'
      + '#tw-route-menu .tw-entry[aria-current="true"] .tw-chip{background:color-mix(in srgb,currentColor 10%,transparent);border-color:transparent}'
      + '#tw-route-menu .tw-entry:not([aria-current="true"]) .tw-chip{color:var(--accent,#2f6df6)}'
      + '#tw-route-menu .tw-entry:not([aria-current="true"]):active{background:color-mix(in srgb,currentColor 10%,transparent)}'
      + '#tw-route-menu .tw-mfoot{padding:8px 10px 4px;font-size:11.5px;line-height:1.45;'
      + 'color:color-mix(in srgb,currentColor 52%,transparent)}'
      + '#tw-route-menu .tw-mstatus{padding:6px 10px 4px;font-size:11.5px;line-height:1.4;'
      + 'color:var(--warn,#a35b00)}'
      + '#tw-route-menu .tw-mstatus:empty{display:none}'
      + '@media (prefers-reduced-motion:reduce){#tw-route-pill:active{transform:none}}'
    document.head.appendChild(css)

    // ?t= 落地：先把参数清掉并把入口锁成这一项，再去做任何别的事。
    landed = stripTicketParam()
    locked = asKind(readSession(LOCK_KEY))
    if (landed) {
      var jumped = readJump()
      var jumpKind = jumped ? asKind(jumped.to) : ''
      if (jumpKind) locked = jumpKind
      if (locked) writeSession(LOCK_KEY, locked)
    }

    // 入口清单只取一次：404/405 → 静态降级并不再重试；其它错误 → 记一条日志后收手。
    // 这里只渲染。没有任何分支会改地址，所以初始加载路径上不可能发生导航。
    fetch('/taskwatch/entries', { cache: 'no-store' })
      .then(function (r) {
        if (isGone(r.status)) { degrade(); return null }
        if (!r.ok) throw new Error('HTTP ' + r.status)
        return r.json()
      })
      .then(function (j) {
        if (j === null) return
        if (!parseEntries(j)) { console.warn('taskwatch: 入口清单形状不认识，双入口胶囊不显示'); return }
        apply()
      })
      .catch(function (e) {
        console.warn('taskwatch: 入口清单读取失败', (e && e.message) || e)
      })
  } catch (e) { console.warn('taskwatch: 双入口切换未启用', e) }
})()
/* ROUTE-SAFETY-END */
</script>
</body>
</html>
