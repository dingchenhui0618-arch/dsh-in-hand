<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f5f6f7" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#151517" media="(prefers-color-scheme:dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="掌上 DSH">
<title>掌上 DSH</title>
<!-- 主题与字号引导：必须在 <style> 之前跑，否则会先闪一下默认值。
     主题默认跟随系统，手动切过之后以手动为准（存 localStorage）；
     字号三档同理，存在 localStorage['tw-font']。 -->
<script>
(function () {
  var t = ''
  try { t = localStorage.getItem('taskwatch.theme') || '' } catch (e) {}
  if (t !== 'light' && t !== 'dark') {
    t = (window.matchMedia && window.matchMedia('(prefers-color-scheme:dark)').matches) ? 'dark' : 'light'
  }
  document.documentElement.setAttribute('data-theme', t)
  var f = ''
  try { f = localStorage.getItem('tw-font') || '' } catch (e) {}
  if (f !== 'small' && f !== 'medium' && f !== 'large') f = 'medium'
  document.documentElement.setAttribute('data-font', f)
})()
</script>
<link rel="manifest" href="/taskwatch/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/taskwatch/icon-192.png">
<link rel="apple-touch-icon" href="/taskwatch/icon-192.png">
<style>
/* ---------------------------------------------------------------------------
   手机对话页。

   设计目标只有一句：**小白点进来也看得懂**。
   所以这里刻意不做仪表盘 —— 顶部一行说人话的状态，中间是对话，
   底部是输入框；数据表格收进抽屉，想看才展开。

   三条铁律（改这个文件时请保持）：
     1. 宿主或模型来的文本一律先 esc() 再进 DOM。
     2. 流式增量只追加到**那一个**气泡节点，不整页重建。
     3. 工具名先翻译成人话再显示。
--------------------------------------------------------------------------- */
/* ══ 设计令牌 ══════════════════════════════════════════════════════════════
   真值全部取自 DSH 客户端安装包（app.asar 里的 --dsw-static-* / --dsw-alias-*），
   变量名与客户端保持一致。这不是"照着感觉调得像"，而是同一套令牌 ——
   客户端以后换主题，改这一个块就行。

   两条规矩（改这个文件时请保持）：
     1. hex / rgba **只准出现在这个块里**；块外一律用 var()，不许逐屏硬编码颜色。
     2. 亮色是默认值，暗色覆盖在 :root[data-theme='dark'] 里，只有一份。

   抄自客户端的原值：
     蓝调中性 00 #fff · 50 #f9fafb · 60 #f5f6f7 · 75 #f1f3f5 · 100 #ebeef2
              150 #e9ecf2 · 200 #e1e5ee · 300 #cfd3d6 · 400 #adb2b8 · 500 #979da6
              600 #81858c · 650 #6b7076 · 700 #61666b · 750 #43454a · 800 #353638 · 850 #2c2c2e
      （650 是本页新增的一档：600 压在白底上只有 3.71:1，当正文不够，压暗一档到 4.99:1）
              875 #232324 · 900 #1b1b1c · 950 #151517 · 1000 #0f1115
     品牌蓝 #4176e6（--dsw-alias-brand-primary-new-color）
     状态 绿 #22c55e · 琥珀 #f59e0b · 红 #ec1313（暗色用红 400 #f25a5a）
   ════════════════════════════════════════════════════════════════════════ */
:root{
  /* ── 客户端静态色阶（原值照抄，一个都没改） ── */
  --nb-00:#fff;      --nb-50:#f9fafb;   --nb-60:#f5f6f7;   --nb-75:#f1f3f5;
  --nb-100:#ebeef2;  --nb-150:#e9ecf2;  --nb-200:#e1e5ee;  --nb-300:#cfd3d6;
  --nb-400:#adb2b8;  --nb-500:#979da6;  --nb-600:#81858c;  --nb-650:#6b7076;
  --nb-700:#61666b;
  --nb-750:#43454a;  --nb-800:#353638;  --nb-850:#2c2c2e;  --nb-875:#232324;
  --nb-900:#1b1b1c;  --nb-950:#151517;  --nb-1000:#0f1115;
  --blue-450:#4d93f8; --blue-600:#2563eb;
  --green-500:#22c55e; --amber-500:#f59e0b; --red-600:#ec1313; --red-400:#f25a5a;

  /* ── 客户端圆角与字体（原值） ── */
  --dsw-radius-xs:4px; --dsw-radius-sm:8px; --dsw-radius-md:12px;
  --dsw-radius-lg:16px; --dsw-radius-xl:20px;
  --dsw-font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --dsw-font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;

  /* ── 本页的间距 / 圆角 / 字号尺度（改这个文件时请守这一条） ────────────────
     界面上只准出现下面这几档，不要再写 5px / 7px / 9px / 11px / 13px 这种
     "看着差不多" 的数 —— 单看一处看不出来，一屏里凑齐五种就是"哪里不对"的来源。
     间距 4/8/12/16/24 · 圆角沿用客户端那五档 + 胶囊 · 字号五档。
     全页只有两处例外，各自在原地写了理由：#input / .sheet-search input 的 16px
     （iOS 聚焦不缩放的下限），以及 .md-* 的内容排版（那是"读起来不晕"的尺度）。 */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px;
  --r-pill:999px;
  /* 字号三档（小 / 中 / 大）：**只改这一个倍率**，不改布局、不用 zoom /
     transform: scale —— 那两种写法会模糊文字、也会把 44px 命中区一起缩放。
     倍率挂在 :root[data-font] 上，由 <head> 的引导脚本和抽屉里的 小/中/大 按钮写。
     界面尺度全部走 calc(基准 * var(--ui-scale))，所以三档之间比例一致。 */
  --ui-scale:1;
  --fs-1:calc(11.5px * var(--ui-scale));   /* 脚注：时间戳、指标行、徽标 */
  --fs-2:calc(12.5px * var(--ui-scale));   /* 次要：卡片副标题、工具参数、抽屉条目说明 */
  --fs-3:calc(13.5px * var(--ui-scale));   /* 次级正文：状态条、工具卡、折叠按钮、输入区 */
  --fs-4:calc(15.5px * var(--ui-scale));   /* 正文：消息、列表条目、胶囊按钮 */
  --fs-5:calc(17px * var(--ui-scale));     /* 标题：抽屉标题、空态标题 */

  /* ── 「能当文字用」的状态色 ────────────────────────────────────────────────
     --ok / --warn 是**填充色**：绿 #22c55e 压在白底上只有 2.28:1，"完成"两个字
     和那枚勾都不合格（文字要 4.5:1、有意义图形要 3:1）。下面两个是同色相压暗后
     的文字版，只给文字和图标用；纯色块（脉搏条、圆点）仍用填充色。 */
  --ok-ink:#15803d;        /* 绿，白底 5.02:1 */
  --warn-ink:#b45309;      /* 琥珀底，压白字 5.02:1 */
  --warn-ink-fg:#fff;
  --bad-ink:#cc1111;       /* 红，白底 5.74:1（--red-600 #ec1313 是 4.50，正卡在门槛线上） */
  /* 焦点环 / 运行中描边：块外不许再出现 rgba(76,141,255,…) 字面量。 */
  --ring-line:rgba(76,141,255,.5);
  --ring-soft:rgba(76,141,255,.3);
  --ring-glow:rgba(76,141,255,.14);
  --ring-none:rgba(76,141,255,0);

  /* ── 表面层（reactbits 式渐变描边 / 内高光 / 极光底） ────────────────────
     参考的是 pro.reactbits.dev 的实做：Frame Border 的「1px 渐变线 + 向内衰减的
     辉光 + 噪声 + 点击脉冲」，以及站点按钮的 conic 描边与 150ms/300ms 缓动。
     手机上只借"线、光、层次"这三件事，不搬 canvas、不搬 3D。 */
  --edge-idle-a:rgba(15,17,21,.10);
  --edge-idle-b:rgba(15,17,21,.02);
  --edge-run-a:rgba(37,99,235,.55);
  --edge-run-b:rgba(37,99,235,.05);
  --edge-warn-a:rgba(180,83,9,.50);
  --edge-warn-b:rgba(180,83,9,.04);
  --edge-bad-a:rgba(204,17,17,.50);
  --edge-bad-b:rgba(204,17,17,.04);
  --hi:rgba(255,255,255,.9);
  --glass:rgba(255,255,255,.78);
  --sel-fill:rgba(15,17,21,.055);
  --aura-1:rgba(76,141,255,.055);
  --aura-2:rgba(45,49,57,.035);
  --shadow-card:0 1px 2px rgba(15,17,21,.04),0 10px 28px -22px rgba(15,17,21,.35);

  /* ── 语义令牌 · 亮色（默认） ── */
  --dsw-alias-bg-base:var(--nb-00);
  --dsw-alias-bg-layer-1:var(--nb-00);
  --dsw-alias-bg-layer-2:var(--nb-00);
  --dsw-alias-bg-overlay:var(--nb-150);
  --dsw-alias-label-primary:var(--nb-1000);
  --dsw-alias-label-secondary:var(--nb-700);
  --dsw-alias-label-tertiary:var(--nb-600);
  --dsw-alias-border-l1:#0000000a;
  --dsw-alias-border-l2:#0000001a;
  /* 别被名字骗了：客户端的 --dsw-alias-brand-primary 其实是**中性色**
     （亮 #0f1115 / 暗 #f9fafb），不是蓝色。蓝色是 -new-color。
     2026-10-08 全量提取 246 个令牌时逐条核对出来的，详见 lib/tokens.css。 */
  --dsw-alias-brand-primary-new-color:#4176e6;
  --dsw-alias-state-success-primary:var(--green-500);
  --dsw-alias-state-warn-primary:var(--amber-500);
  --dsw-alias-state-error-primary:var(--red-600);
  /* 强调色改成 DSH 图标自己的两个颜色，像素实测：
       虎鲸本体 #2d3139、图标底 #e6eaf0（取自 DeepSeek Harness.exe 的 1024px 图标，
       去掉近白背景后的直方图前二名）。
     顺带一个佐证：客户端令牌里的 --dsw-alias-brand-primary **就是**这对中性色
     （亮 #0f1115 / 暗 #f9fafb），不是那个蓝 —— 所以跟着虎鲸走，
     视觉上和 DSH 本尊本来就是一套。蓝色 -new-color 仍然保留给需要"可点"的地方。 */
  --whale-ink:#2d3139;
  --whale-paper:#e6eaf0;
  /* 用户气泡用客户端更深的蓝 600：白字压在品牌蓝 450 上只有 3.9:1，
     过不了正文 4.5:1 的门槛；#2563eb 是 5.2:1。品牌蓝留给强调与焦点。 */
  --bubble-user-fill:var(--blue-600);

  /* ── 页面内部短名 = 令牌别名 ── */
  --bg:var(--dsw-alias-bg-base);
  --panel:var(--dsw-alias-bg-layer-1);
  --panel2:var(--dsw-alias-bg-layer-2);
  --line:var(--dsw-alias-border-l1);
  --line2:var(--dsw-alias-border-l2);
  --fg:var(--dsw-alias-label-primary);
  --dim:var(--dsw-alias-label-secondary);
  /* 全页最淡的那一档文字（时间戳、指标行、卡片副标题）：
     客户端的三级文字 #81858c 压在白底上只有 3.71:1，当正文不合格，压暗一档到 4.99:1。
     ⚠ 只改这个**别名**，不动上面的 --dsw-alias-label-tertiary —— 那一层必须与
     lib/tokens.css 逐条一致（scripts/check-bundle.mjs 会逐条比）。 */
  --faint:var(--nb-650);
  --accent:var(--whale-ink);
  --accent-fg:var(--whale-paper);
  --link:var(--dsw-alias-brand-primary-new-color);
  --ok:var(--dsw-alias-state-success-primary);
  --warn:var(--dsw-alias-state-warn-primary);
  --bad:var(--dsw-alias-state-error-primary);
  --bubble-user:var(--bubble-user-fill);
  --bubble-ai:var(--dsw-alias-bg-layer-1);
  /* 行内代码统一底色：以前它取 --panel2，落在「用户气泡（强调色 15%）」和
     「助手正文（透明）」里深浅不一样，同一段话里一块深一块浅。改成独立令牌，
     两种气泡里都用同一层墨色。 */
  --inline-code-bg:rgba(15,17,21,.055);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
  /* 横屏时挖孔在左右两侧：viewport-fit=cover 之后内容会一路铺到屏幕边缘 */
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
}
/* 暗色：只有这一份。由 <head> 里的小脚本按系统偏好设 data-theme，手动切换覆盖它。 */
:root[data-theme='dark']{
  --dsw-alias-bg-base:var(--nb-950);
  --dsw-alias-bg-layer-1:var(--nb-875);
  --dsw-alias-bg-layer-2:var(--nb-850);
  --dsw-alias-bg-overlay:var(--nb-700);
  --dsw-alias-label-primary:var(--nb-50);
  --dsw-alias-label-secondary:var(--nb-300);
  --dsw-alias-label-tertiary:var(--nb-400);
  /* --faint 是页面别名、不随 --dsw-alias-* 走，暗色必须显式给一遍：
     漏了的话暗色会继承亮色那支 #6b7076，在暗底上只有 2.9:1。 */
  --faint:var(--nb-400);
  --dsw-alias-border-l1:#ffffff0f;
  --dsw-alias-border-l2:#ffffff1f;
  /* 包内暗色对品牌蓝有**真实覆盖** #5686fe（= --dsw-static-deepseek-450），
     不是我把亮色值搬过来的 —— 全量提取时核对过。 */
  --dsw-alias-brand-primary-new-color:#5686fe;
  --dsw-alias-state-error-primary:var(--red-400);
  --bubble-ai:var(--nb-850);
  --inline-code-bg:rgba(255,255,255,.075);
  /* 暗色下强调色反过来用图标的底色：近黑的炭蓝在暗背景上等于隐形，
     而 #e6eaf0 正是同一个图标里的另一个颜色，成对使用不会跑味。 */
  --accent:var(--whale-paper);
  --accent-fg:var(--whale-ink);
  /* 文字版状态色：暗底上反过来用**亮**的那一支 */
  --ok-ink:var(--green-500);
  --warn-ink:var(--amber-500);
  --warn-ink-fg:#20160a;
  --bad-ink:#ff8080;      /* 亮一档的红：#f25a5a 在 --panel2 上只有 4.24 */
  /* 暗色品牌蓝 #5686fe 对应的焦点环 */
  --ring-line:rgba(86,134,254,.55);
  --ring-soft:rgba(86,134,254,.32);
  --ring-glow:rgba(86,134,254,.18);
  --ring-none:rgba(86,134,254,0);
  /* 暗色下描边要更亮、内高光更弱：黑底上一点点白边就够，多了会发灰。 */
  --edge-idle-a:rgba(255,255,255,.12);
  --edge-idle-b:rgba(255,255,255,.02);
  --edge-run-a:rgba(86,134,254,.65);
  --edge-run-b:rgba(86,134,254,.06);
  --edge-warn-a:rgba(245,158,11,.55);
  --edge-warn-b:rgba(245,158,11,.04);
  --edge-bad-a:rgba(242,90,90,.55);
  --edge-bad-b:rgba(242,90,90,.04);
  --hi:rgba(255,255,255,.07);
  --glass:rgba(35,35,36,.82);
  --sel-fill:rgba(255,255,255,.06);
  --aura-1:rgba(86,134,254,.10);
  --aura-2:rgba(255,255,255,.025);
  --shadow-card:0 1px 2px rgba(0,0,0,.4),0 12px 30px -22px rgba(0,0,0,1);
}
/* 字号三档：只动倍率。小 0.92 / 中 1 / 大 1.14 —— 相邻两档约差 10%，
   在手机上「一眼看得出变了」而不会把两行标题挤成三行。 */
:root[data-font='small']{--ui-scale:.92}
:root[data-font='large']{--ui-scale:1.14}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
:root{color-scheme:light}
:root[data-theme='dark']{color-scheme:dark}
body{
  /* 极光底：两团极淡的径向光，静态、不参与动画、不挡任何内容。
     它只负责让纯色面板有一点点"纸后面有光"的深度，对比度仍由面板自己保证。 */
  background:
    radial-gradient(120% 70% at 8% -12%,var(--aura-1),transparent 62%),
    radial-gradient(90% 60% at 102% -6%,var(--aura-2),transparent 58%),
    var(--bg);
  color:var(--fg);
  /* 正文基准也吃字号倍率；输入框另有 16px 下限（见 #input，iOS 聚焦不缩放）。 */
  font:calc(16px * var(--ui-scale))/1.6 var(--dsw-font-family);
  display:flex;flex-direction:column;overflow:hidden;
  /* 只关掉系统那层蓝色高亮蒙版；按压反馈由各组件自己的 :active 给，
     这样行为和桌面客户端一致，也不会在触屏上留下残留色块。 */
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
textarea{font:inherit}

/* 按压反馈：80–150ms 内出现，且只改背景色 / 透明度，**不动布局尺寸** ——
   缩放或位移动画会把周围内容带得一起抖，是移动端廉价感的主要来源之一。 */
button{transition:background-color .12s ease-out,color .12s ease-out,opacity .12s ease-out}
button:disabled{cursor:default}

/* 键盘焦点必须看得见。用 :focus-visible 而不是 :focus，
   触屏点按就不会留下一个难看的光圈。 */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--dsw-radius-sm)}
:focus:not(:focus-visible){outline:none}

/* 减小动效：不是可选项。前庭敏感的用户会被无限脉冲和旋转弄难受，
   所以这里把全部动画压成瞬变。 */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
    scroll-behavior:auto !important;
  }
}

/* ── 顶部 ───────────────────────────────────────────────────────────── */
header{
  flex:0 0 auto;background:var(--panel);border-bottom:1px solid var(--line);
  padding-top:var(--safe-t);
  /* 横屏时挖孔在左右两侧，viewport-fit=cover 之后内容会钻到它下面 */
  padding-left:var(--safe-l);padding-right:var(--safe-r);
}
/* 第一行：菜单 · 标题 · 路由胶囊 · 连接三点 · 新建 · 月亮。
   每个可点元素都是 44px 命中区，间距 8px —— 一行放下，不再让标题单独占一行。 */
.hrow{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-1) var(--sp-3) 0}
/* 左上角「对话」入口：从带文字的胶囊收成 44×44 的图标按钮。
   理由是这一行现在要塞下标题、路由胶囊和两个按钮 —— 文字标签会先把标题挤没。
   aria-label 仍然是「对话列表」，读屏不丢信息。 */
.sessbtn{flex:0 0 auto}
.sessbtn svg{width:20px;height:20px;display:block;stroke:currentColor;fill:none;
  stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.sess{
  flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:1px;
  text-align:left;padding:2px;border-radius:var(--dsw-radius-sm);
}
.sess .t{font-size:var(--fs-4);font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.01em}
/* 第二行小字：只用来临时说明（连接中断、模型已切换…）。没有内容时不占高度。 */
.sess .s{font-size:var(--fs-1);color:var(--faint);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sess .s:empty{display:none}

/* 连接质量三点：4px 圆点 ×3，绿 / 黄 / 红 / 灰（灰 = 还没连上，不算故障）。
   它是状态指示，不是按钮；点一下会把同一句说明写进标题下的小字，给触屏一条
   读 tooltip 的路（手机上没有 hover）。 */
.netq{position:relative;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;gap:3px;
  width:26px;height:44px;padding:0;color:var(--faint);background:none}
/* 三点本身只有 18px 宽；把命中区用伪元素横向补到 44（±9px），
   既满足 44×44 的触屏下限，又不为三个小点多占标题行的横向空间。 */
.netq::after{content:'';position:absolute;top:0;bottom:0;left:-9px;right:-9px}
.netq .qd{width:4px;height:4px;border-radius:50%;background:var(--line2);transition:background var(--mo-base) var(--mo-ease)}
.netq.green .qd{background:var(--ok)}
.netq.yellow .qd{background:var(--warn)}
.netq.red .qd{background:var(--bad)}
.netq.idle .qd{background:var(--line2)}
.netq:active .qd{opacity:.55}
/* 触碰区 ≥44×44 —— iOS/Android 的硬性下限，检索库里标为 Critical。
   图标本身 20px，靠按钮本身撑到 44；相邻按钮之间留够间距。 */
.iconbtn{
  flex:0 0 auto;width:44px;height:44px;border-radius:var(--dsw-radius-md);
  display:grid;place-items:center;color:var(--dim);
}
.iconbtn:active{background:var(--panel2);color:var(--fg)}
.iconbtn svg{width:20px;height:20px;display:block;stroke:currentColor;fill:none;
  stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.iconbtn[aria-pressed='true']{color:var(--accent)}

/* 状态卡：一句话说清现在什么情况。
   外壳借 Frame Border 的做法：1px 渐变线 + 顶边内高光 + 很轻的投影。
   线用伪元素画（不占布局、不加 CLS），运行时线里的光缓慢横移；
   脉动/流光都只改 background-position / opacity，不触发布局。
   2026-10-21：它从「独占一行」变成第二行右侧的一张卡（左侧让给工作区·模型），
   并去掉三段虚线色块 —— 那三格没传达任何可行动的信息，只占地方。 */
#status{
  position:relative;display:flex;align-items:center;gap:var(--sp-2);
  flex:0 1 auto;min-width:0;max-width:62%;margin:0 0 0 auto;padding:0 var(--sp-2) 0 var(--sp-3);
  min-height:44px;width:auto;
  background:var(--glass);border:1px solid transparent;border-radius:var(--r-pill);
  box-shadow:inset 0 1px 0 var(--hi),var(--shadow-card);
  font-size:var(--fs-2);color:var(--fg);text-align:left;
  transition:transform var(--mo-fast) var(--mo-ease),box-shadow var(--mo-base) var(--mo-ease);
}
#status::before{
  content:'';position:absolute;inset:-1px;border-radius:inherit;padding:1px;
  background:linear-gradient(120deg,var(--edge-idle-a),var(--edge-idle-b) 46%,var(--edge-idle-a));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;
}
#status.busy::before{
  background:linear-gradient(110deg,var(--edge-run-b),var(--edge-run-a),var(--edge-run-b));
  background-size:200% 100%;animation:edgeFlow 5.5s var(--mo-ease) infinite;
}
#status.warn::before{background:linear-gradient(110deg,var(--edge-warn-b),var(--edge-warn-a),var(--edge-warn-b))}
#status.bad::before{background:linear-gradient(110deg,var(--edge-bad-b),var(--edge-bad-a),var(--edge-bad-b))}
#status:active{transform:scale(.995)}
@keyframes edgeFlow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
#status .dot{flex:0 0 auto;width:8px;height:8px;border-radius:50%;background:var(--ok)}
#status.busy .dot{background:var(--accent)}
#status.warn .dot{background:var(--warn)}
#status.bad .dot{background:var(--bad)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
#status .txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#status .chev{flex:0 0 auto;display:grid;place-items:center;color:var(--faint)}
#status .chev svg{width:14px;height:14px;display:block;stroke:currentColor;fill:none;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* 第二行：左侧「工作区 · 模型」降级为 12.5px 次要色文字（不再是胶囊），
   右侧是状态卡。两者同处一行、共用同一条左/右内边距。 */
.subrow{display:flex;align-items:center;gap:var(--sp-2);padding:0 var(--sp-3) var(--sp-2)}
/* 命中区仍然 ≥44×44：字变小了，可点区域不能跟着小。 */
.ctxline{display:flex;align-items:center;gap:var(--sp-1);min-height:44px;min-width:0;
  flex:1 1 auto;max-width:none;padding:0 var(--sp-1);border-radius:var(--dsw-radius-sm);
  color:var(--dim);font-size:12.5px;text-align:left;
  transition:color var(--mo-fast) var(--mo-ease),background var(--mo-fast) var(--mo-ease)}
.ctxline .ws{flex:0 0 auto;max-width:58%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctxline .model{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctxline .sep{flex:0 0 auto;color:var(--faint)}
.ctxline svg{width:12px;height:12px;flex:0 0 auto;stroke:currentColor;fill:none;
  stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ctxline:active{background:var(--panel2);color:var(--fg)}
#modelBtn[hidden]{display:none}
.subnote{flex:1;min-width:0;min-height:44px;line-height:44px;
  font-size:12.5px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.subnote[hidden]{display:none}

/* ── 消息区 ─────────────────────────────────────────────────────────── */
main{
  flex:1 1 auto;min-width:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  padding:var(--sp-3) calc(var(--sp-3) + var(--safe-r)) var(--sp-2) calc(var(--sp-3) + var(--safe-l));
  display:flex;flex-direction:column;gap:0;
}
/* 消息分组：同一发送者连续多条时，组内 8px、组间 24px。
   间距改由每一行自己的 margin-top 给（main 的 gap 置 0），因为 flex gap 无法
   "同组更小"；负 margin 也能凑，但会干扰滚动容器的 scrollHeight 计算，不划算。 */
.row{display:flex;flex-direction:column;max-width:100%;min-width:0;margin-top:var(--sp-3)}
.row.group-first{margin-top:var(--sp-4)}
.row.group-next{margin-top:var(--sp-2)}
/* 组内不重复时间 meta：只在组首出现一次（读屏也少听一遍）。 */
.row.group-next > .meta{display:none}
.row.me{align-items:flex-end}
.row.ai{align-items:flex-start}
/* 气泡外面包一层 .bubwrap：折叠按钮必须待在 max-height 之外，
   否则会被 overflow:hidden 一起裁掉，点都点不到。 */
.bubwrap{max-width:84%;display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.me .bubwrap{align-items:flex-end}
/* 助手消息**不装气泡**：手机上正文才是主体，多一层底色加一圈描边只是噪音。
   所以 ai 一侧放开到整宽，层级改由字重与留白承担 —— 和客户端会话页一致。

   2026-10-22（v1.7.6）：助手侧所有内容共用**一条左基线、一种宽度**。
   以前 .bubwrap 是 shrink-to-fit，流式短句会缩成一小块、工具卡又撑满整行，
   同一屏里两套左缘；现在正文、流式气泡、工具卡、工具分组都走 100% 宽 + 左对齐。
   用户消息仍靠右（.row.me），"我 / 助手"的区分不变。 */
.row.ai > .bubwrap{width:100%;max-width:100%;align-items:flex-start}
.row.ai > .bubwrap > .bub{width:100%;text-align:left}
.row.ai > .tool,.row.ai > .toolgroup{width:100%;max-width:100%;text-align:left}
.row.ai .meta{text-align:left}
.bub{
  max-width:100%;min-width:0;padding:var(--sp-3);border-radius:var(--dsw-radius-lg);white-space:pre-wrap;
  word-break:break-word;font-size:var(--fs-4);overflow-wrap:anywhere;
}
/* 用户消息保留轻气泡（要和正文区分开），但不再是整块高饱和蓝：
   底色取强调色的 15% 混合、正文用前景色 —— 对比度比原来的"白字压蓝"更高。
   第一行是不支持 color-mix 时的旧写法，第二行才是新样式。 */
.me .bub{
  background:var(--bubble-user);color:var(--accent-fg);
  background:color-mix(in srgb,var(--accent) 15%,transparent);
  color:var(--fg);border:1px solid color-mix(in srgb,var(--accent) 24%,transparent);
  border-radius:var(--dsw-radius-lg) var(--dsw-radius-lg) var(--dsw-radius-xs) var(--dsw-radius-lg);
}
.ai .bub{background:transparent;border:0;padding:0 1px;border-radius:0}
/* 注入上下文（system-reminder / 运行上下文 / 技能清单）：
   它们也是 role:'user'，但**不是用户打的字**，铺在对话里就是最吵的那一类噪点。
   所以默认收成一行「注入内容 · 约 N 字 · 展开」，原文一个字都不删，
   点开才渲染（.bub 用 hidden，读屏和选区都拿不到收起时的正文）。 */
.row.me .bubwrap.injwrap{max-width:100%;width:100%;align-items:stretch;margin-top:var(--sp-1)}
.injhead{
  display:flex;align-items:center;gap:var(--sp-2);width:100%;min-height:44px;
  padding:0 var(--sp-3);text-align:left;color:var(--dim);font-size:var(--fs-2);
  background:var(--panel2);border:1px dashed var(--line2);border-radius:var(--dsw-radius-md);
  box-shadow:inset 0 1px 0 var(--hi);
  transition:background var(--mo-fast) var(--mo-ease),transform var(--mo-fast) var(--mo-ease);
}
.injhead:active{background:var(--panel);transform:translateY(1px)}
.injhead .ic{flex:0 0 auto;display:grid;place-items:center;color:var(--faint)}
.injhead .ic svg{width:15px;height:15px;display:block;stroke:currentColor;fill:none;
  stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.injhead .tag{flex:0 0 auto;font-weight:600;color:var(--fg)}
.injhead .cnt{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  color:var(--faint);font-size:var(--fs-1)}
.injhead .act{margin-left:auto;flex:0 0 auto;display:flex;align-items:center;gap:var(--sp-1);
  color:var(--dim);font-size:var(--fs-1)}
.injhead .act svg{width:14px;height:14px;display:block;stroke:currentColor;fill:none;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform var(--mo-fast) var(--mo-ease)}
.injhead[aria-expanded='true'] .act svg{transform:rotate(180deg)}
.row.me .injwrap .bubwrap{max-width:100%;width:100%;align-items:flex-start;margin-top:var(--sp-2)}
.row.me .injwrap .bubwrap[hidden]{display:none}
.row.me .bubwrap.injwrap .bub{
  background:var(--panel2);border:1px dashed var(--line2);color:var(--fg);
  border-radius:var(--dsw-radius-md);padding:var(--sp-3);font-size:var(--fs-3);
}
.row.me .bubwrap.injwrap .bub[hidden]{display:none}
.meta{font-size:var(--fs-1);color:var(--faint);margin:var(--sp-1) var(--sp-1) 0;font-variant-numeric:tabular-nums;line-height:1.35}

/* 工具卡片：把内部工具名翻成人话，这是"看得懂进度"的关键。
   ───────────────────────────────────────────────────────────────────────────
   默认**一整行摘要（44px）**：状态图标 · 人话工具名 · 时间 · 状态 · 展开。
   摘要在任何状态下都不出现命令正文；正文在 .tb 里用 hidden 真正拿掉，不是靠
   透明度藏起来 —— 藏起来的东西仍然会被选中、被读屏念出来。

   外壳的 1px 渐变 + 顶部内高光是 Frame Border 的简化版：只留"线 + 光"，
   不加噪声、不跑 canvas。运行中的卡片用 2.6s 呼吸的外圈辉光表示"还在干活"，
   减小动效时退回静态描边（见文末 reduced-motion 块）。 */
.tool{
  /* 整宽：助手的正文本来就是整宽，工具卡再收 10% 就成了两套边距。
     宽度必须显式 100%：.row.ai 是 align-items:flex-start，block 子项不给宽度
     会收缩到内容宽，短命令就变成一颗胶囊、长命令又撑满，同一屏里两套尺度。 */
  position:relative;width:100%;max-width:100%;min-width:0;margin-top:var(--sp-1);
  background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:1px solid var(--line);
  border-radius:var(--dsw-radius-md);padding:0;font-size:var(--fs-3);
  box-shadow:inset 0 1px 0 var(--hi),var(--shadow-card);
  overflow:hidden;
}
/* 摘要行本身是按钮：44px，点一下原地展开。键盘焦点走全局 :focus-visible。 */
.tool .th{
  display:flex;align-items:center;gap:var(--sp-2);width:100%;min-height:44px;
  padding:0 var(--sp-2) 0 var(--sp-3);text-align:left;color:var(--fg);
  transition:background var(--mo-fast) var(--mo-ease),transform var(--mo-fast) var(--mo-ease);
}
.tool .th:active{background:var(--panel2);transform:scale(.995)}
/* 统一成「操作条」：图标 · 12px 等宽工具名 · 时间 · N 行 · 箭头。
   工具名用等宽是好认：`read` / `edit` / `pwsh` 这类内部名长短不一，
   比例字体下每次换工具卡片里的文字都在跳；等宽后左缘对齐，扫一眼就知道换了动作。
   摘要行里**没有命令正文**（正文在 .tb 里 hidden），这条从上一批起就是这样。 */
.tool .th .n{font-family:var(--dsw-font-mono);font-size:calc(12px * var(--ui-scale));font-weight:600;
  letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tool .th .tm{flex:0 0 auto;color:var(--faint);font-size:var(--fs-1);font-variant-numeric:tabular-nums}
.tool .th .lines{flex:0 0 auto;color:var(--faint);font-size:var(--fs-1);font-variant-numeric:tabular-nums}
.tool .th .st{flex:0 0 auto;font-size:var(--fs-1);color:var(--faint)}
.tool .th .ch{
  margin-left:auto;flex:0 0 auto;display:flex;align-items:center;gap:var(--sp-1);
  color:var(--dim);font-size:var(--fs-1);
}
.tool .th .ch svg{width:14px;height:14px;display:block;stroke:currentColor;fill:none;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
  transition:transform var(--mo-fast) var(--mo-ease)}
.tool.open .th{box-shadow:inset 0 -1px 0 var(--line)}
.tool.open .th .ch svg{transform:rotate(180deg)}
/* 正文容器：收起时整块 hidden（display:none），命令文本不渲染在可视/可选中。 */
.tool .tb{padding:0 var(--sp-2) var(--sp-2);background:var(--panel)}
.tool .tb[hidden]{display:none}
.tool.run{border-color:var(--ring-line)}
.tool.run .sp{
  flex:0 0 auto;width:12px;height:12px;border-radius:50%;
  border:2px solid var(--ring-soft);
  border-top-color:var(--accent);animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
/* 运行中：外圈辉光呼吸。只动 box-shadow，不动尺寸 —— 不推布局、不加 CLS。 */
.tool.run{animation:runGlow 2.6s var(--mo-ease) infinite}
@keyframes runGlow{
  0%,100%{box-shadow:inset 0 1px 0 var(--hi),0 0 0 0 var(--ring-glow),var(--shadow-card)}
  50%{box-shadow:inset 0 1px 0 var(--hi),0 0 0 4px var(--ring-glow),var(--shadow-card)}
}
/* 「完成」既是文字也是那枚勾：--ok 那个绿压在白底上只有 2.28:1，两处都得换成文字版 */
.tool.ok .th .st{color:var(--ok-ink)}
.tool.no .th .st{color:var(--bad-ink)}
.tool.run .th .st{color:var(--warn-ink)}
/* 状态图标：同一套描边风格、同一个尺寸令牌，filled/outline 不混用。 */
.tool .ti{flex:0 0 auto;display:grid;place-items:center;color:var(--ok-ink)}
.tool.no .ti{color:var(--bad-ink)}
.tool .ti svg{width:16px;height:16px;display:block;stroke:currentColor;fill:none;
  stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
/* 展开后的命令原文：一块自己会滚的代码井，不把页面顶宽、不无限拉长。 */
.tool .a{
  margin:var(--sp-2) 0 0;padding:var(--sp-2) var(--sp-3);
  background:var(--panel2);border:1px solid var(--line);border-radius:var(--dsw-radius-sm);
  color:var(--dim);font-size:var(--fs-2);font-family:var(--dsw-font-mono);
  max-height:min(42vh,26rem);max-width:100%;min-width:0;
  overflow:auto;overscroll-behavior-x:contain;white-space:pre-wrap;overflow-wrap:anywhere;
  scrollbar-width:thin;scrollbar-color:var(--line2) transparent;
  -webkit-overflow-scrolling:touch;
}
.tool .acts{display:flex;align-items:center;justify-content:flex-end;gap:var(--sp-2);margin-top:var(--sp-2)}
/* 复制键做成 reactbits 那种「细边幽灵按钮」：44px 命中区，按下有 1px 沉。 */
.tool .more{
  display:flex;align-items:center;justify-content:center;gap:var(--sp-1);
  min-height:44px;min-width:44px;padding:0 var(--sp-3);
  border:1px solid var(--line);border-radius:var(--dsw-radius-sm);
  background:var(--panel2);color:var(--dim);font-size:var(--fs-2);
  transition:background var(--mo-fast) var(--mo-ease),transform var(--mo-fast) var(--mo-ease);
}
.tool .more:active{background:var(--panel);transform:translateY(1px)}

/* 空状态：第一眼必须知道"这是干什么的" */
.empty{margin:auto 0;padding:var(--sp-5) var(--sp-2);text-align:center}
.empty .brand{width:64px;height:64px;border-radius:var(--dsw-radius-lg);margin:0 auto var(--sp-4);display:block}
.empty h2{margin:0 0 var(--sp-2);font-size:var(--fs-5)}
.empty p{margin:0 0 var(--sp-4);color:var(--dim);font-size:var(--fs-4);line-height:1.65}
.chips{display:flex;flex-direction:column;gap:var(--sp-2)}
.chip{
  background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);
  border-radius:var(--dsw-radius-md);padding:var(--sp-3) var(--sp-4);font-size:var(--fs-4);text-align:left;
  box-shadow:inset 0 1px 0 var(--hi),var(--shadow-card);
  transition:background var(--mo-fast) var(--mo-ease),transform var(--mo-fast) var(--mo-ease);
}
.chip:active{background:var(--panel2);transform:translateY(1px)}

.note{font-size:var(--fs-2);color:var(--faint);text-align:center;padding:var(--sp-2) var(--sp-4)}

/* ── 子代理入口与二级页（v1.7.6）────────────────────────────────────────
   子代理会话不再混在主流 / 主会话列表里。主界面只在**确实存在**子代理时
   多出一条 44px 的工具条；点开是全屏二级页（列表），点某条就把主对话切到
   那条会话，工具条变成「‹ 主对话」。路由用 #subagents / #subagents/<id>，
   浏览器返回键与页面返回键走同一条 hashchange。 */
.subbar{
  flex:0 0 auto;display:flex;align-items:center;gap:var(--sp-2);
  padding:0 calc(var(--sp-2) + var(--safe-r)) 0 calc(var(--sp-2) + var(--safe-l));
  border-bottom:1px solid var(--line);background:var(--panel);
}
.subbar[hidden]{display:none}
.subbar .sb{
  display:flex;align-items:center;gap:var(--sp-2);min-height:44px;min-width:0;
  padding:0 var(--sp-2);border-radius:var(--dsw-radius-sm);
  color:var(--dim);font-size:var(--fs-2);text-align:left;
}
.subbar .sb:active{background:var(--panel2);color:var(--fg)}
.subbar .sb svg{width:16px;height:16px;flex:0 0 auto;display:block;stroke:currentColor;fill:none;
  stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.subbar .sb .lbl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.subbar .sb .n{
  flex:0 0 auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;
  display:grid;place-items:center;background:var(--panel2);color:var(--fg);
  font-size:11.5px;font-variant-numeric:tabular-nums;
}
.subbar .sb .chev{width:14px;height:14px;opacity:.7}
.subbar .agenttitle{
  flex:1;min-width:0;font-size:var(--fs-2);color:var(--dim);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.subbar .agenttitle[hidden]{display:none}
.subbar .sb[hidden]{display:none}
.subview{
  position:fixed;inset:0;z-index:36;display:flex;flex-direction:column;
  background:var(--bg);padding-top:var(--safe-t);padding-bottom:var(--safe-b);
}
.subview[hidden]{display:none}
.subview-head{
  flex:0 0 auto;display:flex;align-items:center;gap:var(--sp-2);
  padding:var(--sp-2) calc(var(--sp-3) + var(--safe-r)) var(--sp-2) calc(var(--sp-1) + var(--safe-l));
  border-bottom:1px solid var(--line);background:var(--panel);
}
.subview-title{flex:1;min-width:0;font-size:var(--fs-4);font-weight:600;letter-spacing:-.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.subview-title small{display:block;margin-top:1px;font-size:var(--fs-1);font-weight:400;
  color:var(--faint);letter-spacing:0}
.subview-body{flex:1;min-width:0;overflow-y:auto;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  padding:var(--sp-3) calc(var(--sp-3) + var(--safe-r)) var(--sp-4) calc(var(--sp-3) + var(--safe-l))}
.sub-intro{margin:0 0 var(--sp-3);font-size:var(--fs-2);color:var(--dim);line-height:1.65;
  overflow-wrap:anywhere}
.agentrow{
  display:flex;align-items:center;gap:var(--sp-3);width:100%;min-width:0;min-height:64px;
  margin:0 0 var(--sp-2);padding:var(--sp-2) var(--sp-3);
  border:1px solid var(--line);border-radius:var(--dsw-radius-md);
  background:linear-gradient(180deg,var(--panel2),var(--panel));
  box-shadow:inset 0 1px 0 var(--hi);text-align:left;
}
.agentrow:active{background:var(--panel2)}
.agentrow .adot{flex:0 0 auto;width:8px;height:8px;border-radius:50%;background:var(--faint)}
.agentrow.run .adot{background:var(--warn);animation:pulse 1.4s var(--mo-ease) infinite}
.agentrow .ab{flex:1;min-width:0}
.agentrow .an{display:block;font-size:var(--fs-3);font-weight:600;line-height:1.45;
  overflow-wrap:anywhere;word-break:break-word}
.agentrow .am{display:block;margin-top:2px;font-size:var(--fs-1);color:var(--faint);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.agentrow .ago{flex:0 0 auto;width:14px;height:14px;stroke:var(--faint);fill:none;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.agentrow[disabled]{opacity:.55}
.agentrow[disabled]:active{background:linear-gradient(180deg,var(--panel2),var(--panel))}
.agentrow .muted{color:var(--faint);font-weight:400}
.agentempty{padding:var(--sp-5) var(--sp-3);text-align:center;color:var(--faint);font-size:var(--fs-3)}

/* 双入口的静态降级说明（2026-10-21，v1.7.1）。
   页面由插件宿主提供、宿主没有中继的换路接口时，这里只留一句说明 + 一个手动回跳链接；
   链接的 padding/margin 是让 44px 的命中区不把这一行撑高（视觉仍是一行）。 */
.route-note{
  margin:var(--sp-2) 0;padding:var(--sp-2) var(--sp-3);text-align:left;line-height:1.65;
  color:var(--faint);font-size:var(--fs-2);background:color-mix(in srgb,currentColor 6%,transparent);
  border:1px solid color-mix(in srgb,currentColor 16%,transparent);
  border-radius:var(--dsw-radius-sm);overflow-wrap:anywhere;
}
.route-note a{
  color:var(--accent);text-decoration:underline;text-underline-offset:2px;
  display:inline-block;padding:12px 2px;margin:-12px 2px;
}

/* ── 输入区 ─────────────────────────────────────────────────────────── */
footer{
  flex:0 0 auto;background:var(--panel);border-top:1px solid var(--line);
  padding:var(--sp-2) calc(var(--sp-3) + var(--safe-r)) calc(var(--sp-2) + var(--safe-b)) calc(var(--sp-3) + var(--safe-l));
}
.attachment-tray{display:flex;gap:var(--sp-2);overflow-x:auto;padding:0 var(--sp-1) var(--sp-2);
  -webkit-overflow-scrolling:touch}
.attachment-tray[hidden]{display:none}
.attach-chip{position:relative;display:flex;align-items:center;gap:var(--sp-2);flex:0 0 auto;min-width:0;
  max-width:240px;min-height:48px;padding:var(--sp-1) 48px var(--sp-1) var(--sp-2);
  border:1px solid var(--line);border-radius:var(--dsw-radius-md);background:var(--panel2);color:var(--fg)}
.attach-chip .thumb{width:32px;height:32px;flex:0 0 32px;object-fit:cover;border-radius:var(--dsw-radius-sm);background:var(--panel)}
/* 格式徽标（PNG / JSON / WEBP…）是**图形标签**不是正文：32px 的方框塞不下 11.5px
   的五字母组合，所以这两个徽标字号不参与上面的界面尺度。 */
.attach-chip .kind{width:32px;height:32px;flex:0 0 32px;display:grid;place-items:center;border-radius:var(--dsw-radius-sm);
  background:var(--panel);color:var(--dim);font-size:10px;font-weight:700}
.attach-chip .name{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:var(--fs-2)}
.attach-chip .state{display:block;margin-top:2px;color:var(--faint);font-size:var(--fs-1)}
.attach-chip .remove{position:absolute;right:0;top:0;width:44px;height:44px;display:grid;place-items:center;
  border-radius:var(--dsw-radius-sm);color:var(--dim)}
.attach-chip .remove svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.attach-chip.bad{border-color:var(--bad)}
/* 重试也是可点元素，44 是底线（原来是 32） */
.attach-chip .retry{min-height:44px;color:var(--accent);font-size:var(--fs-2);text-align:left}
.attachment-notice{padding:0 var(--sp-1) var(--sp-2);font-size:var(--fs-2);line-height:1.5;color:var(--dim)}
.attachment-notice:empty{display:none}

/* ── 队列（输入框上方）────────────────────────────────────────────────
   宿主 404 时整块不渲染（连占位都不留）；501/409 只留一句中文说明；
   正常时是一行摘要「排队 2 条 · 展开」，展开后每行 44px。
   重排按钮只给 source==='user' 的 queued 行；steering 行标注「已插队」不可排。 */
.queuebar{margin:0 0 var(--sp-1)}
.queuebar[hidden]{display:none}
.qsum{display:flex;align-items:center;gap:var(--sp-2);width:100%;min-height:44px;
  padding:0 var(--sp-2);border:1px solid var(--line);border-radius:var(--dsw-radius-md);
  background:var(--panel2);color:var(--dim);font-size:var(--fs-2);text-align:left}
.qsum:active{background:var(--panel)}
.qsum .qcount{color:var(--fg);font-weight:600}
.qsum .qdot{flex:0 0 auto;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.qsum[hidden]{display:none}
.qsum .qhint{margin-left:auto;flex:0 0 auto;color:var(--faint)}
.qsum svg{width:14px;height:14px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;transition:transform var(--mo-fast) var(--mo-ease)}
.qsum[aria-expanded='true'] svg{transform:rotate(180deg)}
.qlist{border:1px solid var(--line);border-top:0;border-radius:0 0 var(--dsw-radius-md) var(--dsw-radius-md);
  background:var(--panel);max-height:38vh;overflow-y:auto;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch}
/* 条目文本截断 1 行；完整文本在 title 属性里，点按不展开（避免和重排按钮抢手势）。 */
.qitem{display:flex;align-items:center;gap:var(--sp-1);min-height:44px;padding:0 var(--sp-1) 0 var(--sp-3);
  border-top:1px solid var(--line)}
.qitem .qidx{flex:0 0 auto;width:18px;color:var(--faint);font-size:var(--fs-1);
  font-variant-numeric:tabular-nums;text-align:right}
.qitem .qt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:var(--fs-3);color:var(--fg)}
.qitem .qmeta{flex:0 0 auto;color:var(--faint);font-size:var(--fs-1);white-space:nowrap}
.qitem .qbadge{flex:0 0 auto;color:var(--faint);font-size:var(--fs-1);white-space:nowrap;
  border:1px solid var(--line);border-radius:var(--r-pill);padding:1px var(--sp-2)}
.qitem .qbadge.steer{color:var(--warn-ink);border-color:var(--edge-warn-a)}
.qmove{flex:0 0 auto;width:44px;height:44px;display:grid;place-items:center;color:var(--dim);
  border-radius:var(--dsw-radius-sm)}
.qmove:active{background:var(--panel2);color:var(--fg)}
.qmove:disabled{opacity:.3}
.qmove svg{width:16px;height:16px;display:block;stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
.qempty{padding:var(--sp-2) var(--sp-3);font-size:var(--fs-2);color:var(--faint)}
.qnote{padding:var(--sp-1) var(--sp-3) 0;font-size:var(--fs-2);color:var(--dim);overflow-wrap:anywhere}
.qnote:empty{display:none}
.qnote.bad{color:var(--bad-ink)}
.attach-menu{display:flex;gap:var(--sp-2);padding:0 var(--sp-4) var(--sp-2)}
.attach-menu button{flex:1;min-height:76px;border:1px solid var(--line);border-radius:var(--dsw-radius-md);
  background:var(--panel2);text-align:left;padding:var(--sp-3) var(--sp-4);font-weight:600}
.attach-menu small{display:block;margin-top:var(--sp-1);font-size:var(--fs-2);font-weight:400;color:var(--dim)}
#input{min-width:0}
.composer{display:flex;align-items:flex-end;gap:var(--sp-2)}
#attach{flex:0 0 auto;width:44px;height:44px;border:1px solid var(--line);border-radius:var(--dsw-radius-md);
  background:var(--panel2);color:var(--dim);display:grid;place-items:center}
#attach svg{width:20px;height:20px;display:block;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
#attach:active{background:var(--panel)}
/* 指标行：数字用等宽数字对齐，跳数时不会左右抖。
   2026-10-21：主次分开 —— 在跑 / 上下文 / 缓存命中加粗（一眼要看的三个数），
   其余退到次要色；整行是 44px 的可点条，点开是宿主真实返回的明细。 */
.stats{
  display:flex;align-items:center;flex-wrap:wrap;gap:var(--sp-1) var(--sp-2);
  width:100%;min-height:44px;padding:0 var(--sp-1);
  font-size:var(--fs-1);color:var(--faint);font-variant-numeric:tabular-nums;text-align:left;
}
.stats .si{white-space:nowrap}
.stats .si.strong{color:var(--fg);font-weight:600}
.stats .si + .si::before{content:'';display:inline-block;width:3px;height:3px;border-radius:50%;
  background:var(--line2);margin:0 var(--sp-2) 2px 0;vertical-align:middle}
.stats .schev{margin-left:auto;flex:0 0 auto;display:grid;place-items:center;color:var(--faint);
  padding-left:var(--sp-1)}
.stats .schev svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;transition:transform var(--mo-fast) var(--mo-ease)}
.stats[aria-expanded='true'] .schev svg{transform:rotate(180deg)}
.stats[aria-expanded='true']{color:var(--dim)}
/* 指标明细：只在点开时插入 DOM，收起时整块 hidden（不是透明度藏起来）。 */
.stats-detail{border:1px solid var(--line);border-radius:var(--dsw-radius-md);
  background:var(--panel2);margin:0 0 var(--sp-2);padding:var(--sp-1) var(--sp-3);
  max-height:36vh;overflow-y:auto;overscroll-behavior:contain}
.stats-detail[hidden]{display:none}
.sd-row{display:flex;align-items:baseline;gap:var(--sp-3);min-height:32px;padding:var(--sp-1) 0;
  border-top:1px solid var(--line);font-size:var(--fs-2)}
.sd-row:first-child{border-top:0}
.sd-row .k{flex:0 0 42%;color:var(--dim)}
.sd-row .v{flex:1;min-width:0;color:var(--fg);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stats-detail .hint{color:var(--faint);font-size:var(--fs-1);padding:var(--sp-1) 0}
#input{
  flex:1;min-height:44px;max-height:132px;resize:none;overflow-y:auto;
  background:var(--panel2);color:var(--fg);border:1px solid var(--line);
  border-radius:var(--dsw-radius-md);padding:var(--sp-2) var(--sp-3);
  /* 16px 不是随便定的：iOS 上聚焦时小于 16px 会自动把整页放大一下，改小就抖 */
  font-size:16px;line-height:1.5;
}
#input:focus{outline:none;border-color:var(--ring-line)}
#send{
  flex:0 0 auto;width:44px;height:44px;border-radius:var(--dsw-radius-md);background:var(--accent);
  color:var(--accent-fg);display:grid;place-items:center;
}
/* SVG 必须显式给尺寸：不给的话浏览器按 300×150 的默认替换尺寸渲染，按钮会被撑爆。 */
#send svg{width:20px;height:20px;display:block;stroke:currentColor;fill:none;
  stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
/* 发送 / 停止：同一个位置、同一个 44px 方块。停止用强调色 + 方形图标，
   按下去有 1px 下沉（不是缩放——位移告诉手指「按到了硬的东西」）。 */
#send:active{opacity:.85}
#send:disabled{opacity:.4}
#send.stop{background:var(--accent);color:var(--accent-fg)}
#send.stop svg rect{fill:currentColor;stroke:none}
#send.stop:active{transform:translateY(1px);opacity:.9}

/* ── 抽屉 ───────────────────────────────────────────────────────────── */
#sheet{
  position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);
  display:flex;align-items:flex-end;
}
#sheet[hidden]{display:none}
.card{
  width:100%;max-height:82vh;overflow-y:auto;background:var(--panel);
  border-radius:var(--dsw-radius-lg) var(--dsw-radius-lg) 0 0;
  padding:var(--sp-2) 0 calc(var(--sp-3) + var(--safe-b));
  border-top:1px solid var(--line);
}
.card .grab{width:38px;height:4px;border-radius:var(--r-pill);background:var(--line);margin:var(--sp-2) auto var(--sp-3)}
.sheet-head{display:flex;align-items:center;gap:var(--sp-3);margin:var(--sp-1) var(--sp-4) var(--sp-3)}
.sheet-head h3{flex:1;margin:0;font-size:var(--fs-5);color:var(--fg);font-weight:600;letter-spacing:0}
.sheet-head .count{margin-left:var(--sp-1);font-size:var(--fs-2);color:var(--faint);font-weight:400}
/* 关闭键 36 → 44：抽屉里最该一次点中的就是它 */
.sheet-close{display:grid;place-items:center;width:44px;height:44px;flex:0 0 44px;border:1px solid var(--line);
  border-radius:50%;color:var(--dim);background:transparent}
.sheet-close:active{background:var(--panel2)}
.sheet-close svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.sheet-search{display:flex;align-items:center;gap:var(--sp-2);margin:0 var(--sp-4) var(--sp-3);
  padding:0 var(--sp-3);min-height:44px;
  border:1px solid var(--line);border-radius:var(--dsw-radius-md);background:var(--panel2);color:var(--faint)}
.sheet-search svg{width:16px;height:16px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
/* 同样 16px：这是输入框，iOS 聚焦时小于 16px 会放大整页。
   还要 min-height:44：外层 44 的命中区不算数 —— 点在外层空白上并不会聚焦 */
.sheet-search:focus-within{border-color:var(--accent);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}
.sheet-search input{width:100%;min-width:0;min-height:44px;background:transparent;color:var(--fg);
  border:0;font:inherit;font-size:16px;outline:0}
.sheet-search input::placeholder{color:var(--faint)}
.session-group{margin:0 0 var(--sp-3)}
.session-group .group-label{margin:0 var(--sp-4) var(--sp-1);font-size:var(--fs-1);color:var(--faint);font-weight:600;letter-spacing:.04em}
.card h3{margin:var(--sp-4) var(--sp-4) var(--sp-2);font-size:var(--fs-2);color:var(--faint);font-weight:600;letter-spacing:.04em}
.item{
  display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3) var(--sp-4);font-size:var(--fs-4);
  text-align:left;width:100%;
}
.item:active{background:var(--panel2)}
/* 当前会话：借 reactbits 选中段的语言 —— 一条 2px 的实心左缘 + 向右淡出的底色，
   不整行反色，列表其余条目仍然读得清。 */
.item.on{
  background:linear-gradient(90deg,var(--sel-fill),transparent 72%);
  box-shadow:inset 2px 0 0 var(--accent);
}
.item .g{flex:1;min-width:0}
.item .g .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.item .g .s{font-size:var(--fs-2);color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.item .r{flex:0 0 auto;font-size:var(--fs-2);color:var(--faint)}
.item.on .g .t{color:var(--accent);font-weight:600}
.kv{display:flex;gap:var(--sp-3);padding:var(--sp-2) var(--sp-4);font-size:var(--fs-3);border-top:1px solid var(--line)}
.kv .k{flex:0 0 88px;color:var(--dim)}
.kv .v{flex:1;min-width:0;word-break:break-word}
.detail-section{border-top:1px solid var(--line);margin-top:var(--sp-3)}
.detail-section summary{min-height:48px;padding:var(--sp-4);font-size:var(--fs-3);font-weight:600;color:var(--dim);cursor:pointer}
.detail-section .kv{font-size:var(--fs-2)}
.detail-section .v{white-space:pre-wrap}
.pill{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-3) var(--sp-4);border:1px solid var(--line);
  border-radius:var(--dsw-radius-md);margin:0 var(--sp-4) var(--sp-2);font-size:var(--fs-4);
  width:calc(100% - var(--sp-4) * 2);text-align:left}
.pill:active{background:var(--panel2)}
.pill .label{flex:1;min-width:0}
.pill .hint{flex:0 0 auto;color:var(--faint);font-size:var(--fs-2);white-space:nowrap}
/* 显示设置：字号三档 + 只看对话。放在会话抽屉顶部，44px 可点、一眼能找到。 */
.setting-row{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-1) var(--sp-4) var(--sp-2)}
.setting-row .setting-label{flex:1;min-width:0;font-size:var(--fs-3);color:var(--fg)}
.seg{display:flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:var(--r-pill);background:var(--panel2)}
.segbtn{min-width:52px;min-height:44px;padding:0 var(--sp-3);border-radius:var(--r-pill);
  font-size:var(--fs-3);color:var(--dim);text-align:center}
.segbtn:active{background:var(--panel)}
.segbtn[aria-pressed='true']{background:var(--panel);color:var(--fg);font-weight:600;
  box-shadow:inset 0 1px 0 var(--hi),var(--shadow-card)}
.pending-card{display:flex;gap:var(--sp-3);margin:0 var(--sp-4) var(--sp-2);padding:var(--sp-3);
  border:1px solid var(--line);border-radius:var(--dsw-radius-md);background:var(--panel2)}
/* 待批准徽标：原来琥珀底 + 近白字只有 2.2:1，换成压暗的琥珀底 + 白字（5.0:1） */
.pending-card .badge{flex:0 0 auto;align-self:flex-start;padding:var(--sp-1) var(--sp-2);
  border-radius:var(--r-pill);background:var(--warn-ink);color:var(--warn-ink-fg);
  font-size:var(--fs-1);line-height:1.2}
.pending-card .body{flex:1;min-width:0}
.pending-card .title{display:block;font-size:var(--fs-4);font-weight:600;line-height:1.45;overflow-wrap:anywhere}
.pending-card .summary{display:block;margin-top:var(--sp-1);font-size:var(--fs-2);color:var(--dim);line-height:1.5;overflow-wrap:anywhere}

/* 小屏把次要主题控制移进会话抽屉，给标题和任务状态留下可读宽度。 */
@media (max-width:380px){
  /* 小屏再收一档：字号回到 --fs-1/--fs-2，内边距回到 --sp-1/--sp-2；
     min-height 仍然是 44，小屏也不许把命中区一起收掉。 */
  #themeBtn{display:none}
  .sess .t{font-size:var(--fs-3)}
  .sess .s{font-size:var(--fs-1)}
  #status{gap:var(--sp-1);padding:0 var(--sp-1) 0 var(--sp-2);max-width:66%}
  .ctxline{max-width:32%}
}

/* ══ 溢出与折叠（内容放不下时的八条策略） ══════════════════════════════
   原则：**任何长内容都不许撑破布局，但也不许无声无息地被截掉** ——
   要么折叠后能展开，要么给一个自己会滚的容器，要么给复制按钮。
   ══════════════════════════════════════════════════════════════════ */

/* 1. 超长回复：折叠 + 底部渐隐。折叠与否按字符数预判，不等布局算完再改，
      否则会先闪一下全文再收起来。 */
.bub.fold{max-height:22rem;overflow:hidden;padding-bottom:20px;
  -webkit-mask-image:linear-gradient(180deg,#000 calc(100% - 44px),transparent);
  mask-image:linear-gradient(180deg,#000 calc(100% - 44px),transparent)}
.bub.fold.open{max-height:none;-webkit-mask-image:none;mask-image:none}
.foldbtn{display:flex;align-items:center;justify-content:center;gap:var(--sp-2);width:100%;
  min-height:44px;margin-top:var(--sp-1);color:var(--accent);font-size:var(--fs-3);
  font-weight:500;border-radius:var(--dsw-radius-sm)}
.foldbtn:active{background:var(--panel2)}
.foldbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;transition:transform .15s ease-out}
.foldbtn[aria-expanded='true'] svg{transform:rotate(180deg)}

/* 2. 代码块：内部自己横竖滚，绝不撑破气泡；右上角可复制。
   v1.7.6：滚动条显式做细，横向滚动才有"这块还能往右看"的可视凭据；
   overscroll-behavior-x:contain 防止滑到尽头继续甩动整页。 */
.code{margin:var(--sp-1) 0;border:1px solid var(--line);border-radius:var(--dsw-radius-md);
  overflow:hidden;background:var(--panel2);max-width:100%;min-width:0}
.codebar{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-1) var(--sp-2) var(--sp-1) var(--sp-3);
  border-bottom:1px solid var(--line);font-size:var(--fs-2);color:var(--faint)}
.codebar .lang{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.codebar .scrollhint{flex:0 0 auto;color:var(--faint);font-size:var(--fs-1);letter-spacing:.02em}
/* 代码块右上角的复制键原来是 40×36，撑到 44×44 */
.codebar button{display:flex;align-items:center;justify-content:center;gap:var(--sp-1);
  min-height:44px;min-width:44px;padding:0 var(--sp-3);
  color:var(--dim);border-radius:var(--dsw-radius-sm);font-size:var(--fs-2)}
.codebar button:active{background:var(--panel)}
.codebar svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.code pre{margin:0;padding:var(--sp-3);max-height:20rem;max-width:100%;overflow:auto;
  overscroll-behavior:contain;
  font:var(--fs-2)/1.6 var(--dsw-font-mono);color:var(--fg);white-space:pre;
  scrollbar-width:thin;scrollbar-color:var(--line2) transparent;
  -webkit-overflow-scrolling:touch}
/* 细滚动条：6px，颜色取分隔线令牌 —— 不抢正文，但滑过时看得见。
   iOS 的覆盖式滚动条由系统画，这两条只作用于桌面 / Android WebView。 */
.code pre::-webkit-scrollbar{width:6px;height:6px}
.code pre::-webkit-scrollbar-track{background:transparent}
.code pre::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px}
.code pre::-webkit-scrollbar-thumb:active{background:var(--dim)}
/* 用户气泡里的长代码块：默认只露 3 行，点「展开」看全。
   原文一个字不删，只是把可视高度压到 3 行；行数写在按钮上，不做无声截断。
   v1.7.6 修正：横向**保持可滚**。原来 overflow:hidden 把 3 行以外的长行右侧
   也一起裁掉了 —— 竖着折、横着也折，用户拿不到剩下的内容。 */
.code.clip pre{
  max-height:calc(var(--fs-2) * 1.6 * 3 + var(--sp-3) * 2);
  overflow-x:auto;overflow-y:hidden;
  -webkit-mask-image:linear-gradient(180deg,#000 calc(100% - 14px),transparent);
  mask-image:linear-gradient(180deg,#000 calc(100% - 14px),transparent);
}
.code.clip.open pre{max-height:20rem;overflow:auto;-webkit-mask-image:none;mask-image:none}
.code.clip .cx{color:var(--accent)}

/* 3. 工具卡里的长命令：摘要态只留一行，展开后才渲染命令原文（见上面的 .tool 块）。
      这里只保留代码字体，避免正文被换行规则拆坏。 */
.tool .a code{font:var(--fs-2)/1.6 var(--dsw-font-mono);white-space:pre-wrap;overflow-wrap:anywhere}

/* 4. 流式输出中：尾部渐隐，表示"还在往下长"（客户端也是用 mask-image 做的）。
   v1.7.6：流式行和正式回复同一条左基线、同宽；不再按内容收缩。 */
.row.stream > .bubwrap{width:100%;max-width:100%;align-items:flex-start}
.row.stream > .bubwrap > .bub{width:100%;text-align:left}
.bub.streaming{-webkit-mask-image:linear-gradient(180deg,#000 calc(100% - 20px),transparent);
  mask-image:linear-gradient(180deg,#000 calc(100% - 20px),transparent);
  text-align:left}

/* 5. 回到底部：离开底部才出现，并显示期间来了几条新消息。
   bottom 用 --foot-h —— 行为层用 ResizeObserver 从**页脚真实高度**写进来。
   原先是写死的 78px，后果是浮标出现时正好压住指标行中间那几个字；而指标行折成
   一行还是两行随内容变，写死就一定会在某些屏/某些数据下压住。拿不到 --foot-h 时
   （JS 没跑）回落成旧值，位置与以前一致，不会更差。 */
#tobottom{position:fixed;right:calc(14px + var(--safe-r));bottom:calc(var(--foot-h) + var(--sp-3));z-index:30;
  display:none;align-items:center;gap:var(--sp-2);min-height:44px;padding:0 var(--sp-4);
  border-radius:var(--r-pill);background:var(--panel);border:1px solid var(--line2);
  color:var(--fg);font-size:var(--fs-3);box-shadow:0 6px 20px rgba(0,0,0,.18);
  transition:bottom var(--mo-base) var(--mo-ease)}
#tobottom.on{display:flex}
#tobottom svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
#tobottom .n{min-width:18px;height:18px;padding:0 5px;border-radius:9px;
  background:var(--accent);color:var(--accent-fg);font-size:11.5px;
  display:grid;place-items:center}
#tobottom .n[hidden]{display:none}

/* 6. 全页禁止横向滚动：长 URL / 宽表格 / 长代码都不许把页面顶宽。 */
html,body{overflow-x:clip}
.bub,.tool,.code pre{overflow-wrap:anywhere}

/* 7. 连续多个工具调用折叠成一行「N 个步骤」。
      这一条是"内容放不下"里最占地方的：一个回合常常十几步，每步一张卡，
      几十条下来把对话整个冲掉。折叠后一行讲清「几步、什么状态」，
      点开才逐条看。运行中默认展开（要看得见进度），全部结束自动收起来。 */
.toolgroup{position:relative;width:100%;min-width:0;border:1px solid var(--line);
  border-radius:var(--dsw-radius-md);
  background:linear-gradient(180deg,var(--panel2),var(--panel));overflow:hidden;
  box-shadow:inset 0 1px 0 var(--hi),var(--shadow-card)}
/* 分组头也是 44px 的可点行：与工具摘要同一种"行"的语法，点开逐条看。 */
.toolgroup .gh{display:flex;align-items:center;gap:var(--sp-2);width:100%;min-height:44px;
  padding:0 var(--sp-3);text-align:left;color:var(--dim);font-size:var(--fs-3);
  transition:background var(--mo-fast) var(--mo-ease),transform var(--mo-fast) var(--mo-ease)}
.toolgroup .gh:active{background:var(--panel);transform:scale(.995)}
.toolgroup .gh .sum{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toolgroup .gh .sum b{color:var(--fg);font-weight:600}
.toolgroup .gh .dot{flex:0 0 auto;width:8px;height:8px;border-radius:50%;background:var(--ok)}
.toolgroup.busy{animation:runGlow 2.6s var(--mo-ease) infinite}
.toolgroup.busy .gh .dot{background:var(--warn);animation:pulse 1.4s var(--mo-ease) infinite}
.toolgroup.bad .gh .dot{background:var(--bad)}
.toolgroup .gh svg{width:16px;height:16px;flex:0 0 auto;stroke:currentColor;fill:none;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s ease-out}
.toolgroup .gh svg.ch{transition:transform .15s ease-out}
.toolgroup .gh[aria-expanded='true'] svg.ch{transform:rotate(180deg)}
.toolgroup .gb{padding:0 var(--sp-2) var(--sp-2)}
.toolgroup .gb .tool{margin-top:var(--sp-2)}
.toolgroup .gb[hidden]{display:none}

/* 8. 轻量 markdown：标题 / 粗体 / 行内代码 / 列表 / 引用 / 分隔线 / 空行留白。
      做这个是因为模型输出里 ## 和 ** 到处都是 —— 不渲染的话，手机上看到的
      就是一堆符号，对"点进来想看懂发生了什么"的人是纯粹的噪音。
      只认这几种，理由见 JS 里 blocksInto 的注释。

      ⚠ 以下尺度是按**"读起来不晕"**定的，不是按"一屏塞多少字"定的（2026-10-09 重排）：
        · 行高 1.72 —— 中文没有西文那种字升部/降部留白，1.6 会读成一整块；
        · 段间 16px —— 原来只有 8px，而 .md-p 自己 margin:0，几段连起来就是一堵墙；
        · 标题上 16 / 下 7 —— 原来 3/2，标题贴在正文上，层次看不出来；
        · 列表项 5px —— 原来 1px，多行列表挤成一片；
        · line-break:strict —— 别在中文标点前后断行。
      这些数字改小很容易；改小之前先想清楚为什么在这儿。
      ⚠ 另外：这一节的字号**不参与**界面那五档尺度（--fs-1…--fs-5）——
      内容排版和界面层级是两件事，混在一起改一定有一头会坏。 */
.md-h{font-weight:600;font-size:15.5px;line-height:1.4;margin:16px 0 7px;
  text-wrap:balance;line-break:strict;min-width:0;max-width:100%;overflow-wrap:anywhere}
.md-h[data-lv='1']{font-size:17px}
.md-h[data-lv='2']{font-size:16px}
.md-li{position:relative;padding-left:17px;margin:5px 0;line-height:1.7;line-break:strict;
  min-width:0;max-width:100%;overflow-wrap:anywhere}
.md-li::before{content:'';position:absolute;left:4px;top:.72em;width:4px;height:4px;
  border-radius:50%;background:currentColor;opacity:.5}
.md-p{margin:0 0 3px;line-height:1.72;text-wrap:pretty;line-break:strict;min-width:0;max-width:100%;overflow-wrap:anywhere}
.md-blank{height:16px}
.md-bq{margin:9px 0;padding:1px 0 1px 11px;border-left:2px solid var(--line2);
  color:var(--dim);line-height:1.7;line-break:strict}
.md-hr{height:1px;margin:16px 0;background:var(--line)}
/* 表格（v1.7.6 新增）：模型输出里的 | 表格不再按原文铺成一行行竖线。
   **外层负责横滑，单元格负责换行** —— 列多了滑动看，单元格里的长 token 自己折，
   两层各管一件事，页面宽度就不参与这场谈判。 */
.tablewrap{margin:10px 0;max-width:100%;min-width:0;overflow-x:auto;overflow-y:hidden;
  overscroll-behavior-x:contain;border:1px solid var(--line);border-radius:var(--dsw-radius-sm);
  background:var(--panel2);scrollbar-width:thin;scrollbar-color:var(--line2) transparent;
  -webkit-overflow-scrolling:touch}
.tablewrap::-webkit-scrollbar{height:6px}
.tablewrap::-webkit-scrollbar-track{background:transparent}
.tablewrap::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px}
.md-table{width:100%;border-collapse:collapse;font-size:13.5px;line-height:1.55;
  white-space:normal;text-align:left}
@media (max-width:380px){.md-table{font-size:12.5px}}
.md-table th,.md-table td{min-width:5.5em;max-width:17em;padding:7px 10px;
  text-align:left;vertical-align:top;white-space:normal;
  overflow-wrap:anywhere;word-break:break-word;border-bottom:1px solid var(--line)}
.md-table thead th{background:var(--panel);color:var(--dim);font-weight:600;
  font-size:13px;letter-spacing:.01em}
.md-table tbody tr:last-child td{border-bottom:0}
.bub strong{font-weight:600}
.bub code{font-family:var(--dsw-font-mono);font-size:.88em;max-width:100%;
  padding:1px var(--sp-1);border-radius:var(--dsw-radius-xs);
  background:var(--panel2);border:1px solid var(--line);
  white-space:normal;overflow-wrap:anywhere;word-break:break-word}
.bub .md-p:first-child,.bub .md-h:first-child{margin-top:0}
.bub .md-p:last-child,.bub .md-h:last-child{margin-bottom:0}
/* 2026-10-21 Markdown 层级收紧：
   标题从 600 降到 500（一屏里标题比正文多一档粗就已经在喊了），下边距 7→9px；
   行内代码改用统一令牌 --inline-code-bg，不再随所在气泡的底色深浅变化。 */
.md-h{font-weight:500;margin-bottom:9px}
.bub code{background:var(--inline-code-bg);border-color:transparent}

/* 9. 交付文件：图片直接铺进对话，PDF 之类给一张能点的卡片。
      手机上「看结果」主要就是看图、看文档：图铺满气泡宽度、点开能放大；
      文档没法内嵌预览，至少把名字 / 大小 / 类型说清楚，再给一个能点开的入口。
      点击目标都不小于 44px —— 这是手机页既定的底线。 */
/* v1.7.7：图片盒子的三条硬约束 ——
   ① 宽度永远不超过气泡（max-width + height:auto，横图竖图都不撑宽）；
   ② min-height:0：没拿到 intrinsic size 之前**不占位撑高**，加载完再长出来，
      避免"先铺一块 44px 空气、再跳一下"的布局抖动；
   ③ 圆角与边框在图片盒子上，加载失败换成提示条时形状/位置不变。 */
.md-imgwrap{display:block;position:relative;width:100%;max-width:100%;min-height:0;padding:0;margin:var(--sp-2) 0;border:0;
  background:none;text-align:left;border-radius:var(--dsw-radius-md);overflow:hidden}
.md-img{display:block;width:100%;max-width:100%;height:auto;min-height:0;border:1px solid var(--line);
  border-radius:var(--dsw-radius-md);background:var(--panel2)}
.md-imgwrap:active .md-img{opacity:.86}
/* v1.7.7：图片加载失败 → 一条 36px 的提示条（≤44px），可点打开原图 / 重试。
   绝不再留一个破图空框把正文截成两半；文字单行 ellipsis，不换行、不撑宽。 */
.imgerr{display:flex;align-items:center;gap:var(--sp-2);width:100%;max-width:100%;min-width:0;
  height:36px;max-height:44px;margin:var(--sp-2) 0;padding:0 var(--sp-3);
  border:1px solid var(--line);border-radius:var(--dsw-radius-md);background:var(--panel2);
  color:var(--dim);font-size:var(--fs-2);line-height:1;text-align:left;text-decoration:none;overflow:hidden}
.imgerr svg{width:16px;height:16px;flex:0 0 auto;fill:none;stroke:currentColor;
  stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.imgerr .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.imgerr:active{background:var(--panel);color:var(--fg)}
/* 抽屉里的字符图标（＋ / ›）现在都是内联 SVG：不再依赖字体里有没有那个字形。 */
.pill .pico{width:16px;height:16px;flex:0 0 auto;color:var(--dim);fill:none;stroke:currentColor;
  stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.pill .pchev{width:12px;height:12px;flex:0 0 auto;fill:none;stroke:currentColor;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pill .hint{display:flex;align-items:center;gap:4px}
.filecard{display:flex;align-items:flex-start;gap:var(--sp-3);width:100%;min-width:0;min-height:52px;margin:var(--sp-2) 0;
  padding:var(--sp-2) var(--sp-3);border:1px solid var(--line);border-radius:var(--dsw-radius-md);
  background:var(--panel2);color:var(--fg);text-align:left;text-decoration:none}
.filecard:active{background:var(--panel)}
/* 同 .attach-chip .kind：36px 方框里的格式徽标，字号不参与界面尺度 */
.filecard .fi{flex:0 0 auto;width:36px;height:36px;border-radius:var(--dsw-radius-sm);display:flex;
  align-items:center;justify-content:center;background:var(--panel);border:1px solid var(--line);
  font-size:10.5px;font-weight:700;letter-spacing:.02em;color:var(--dim)}
.filecard .fm{flex:1;min-width:0}
/* 长文件名（v1.7.6）：以前单行 ellipsis，手机上看到的永远是前半截，而且没有
   title 可以长按查看。现在允许换行 —— 名字再长也读得到，卡片跟着变高即可。 */
.filecard .fn{display:block;font-size:var(--fs-3);font-weight:600;line-height:1.45;
  overflow-wrap:anywhere;word-break:break-word}
.filecard .fs{display:block;font-size:var(--fs-2);color:var(--dim);margin-top:var(--sp-1);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.message-attachments{display:flex;flex-direction:column;gap:var(--sp-1);width:100%;margin:0 0 var(--sp-1)}
.row.me .message-attachments{align-items:flex-end}
.row.me .message-attachments .md-imgwrap{width:min(78vw,280px)}
.row.me .message-attachments .filecard{width:min(82vw,320px)}
/* 正文里的行内链接**不往 44px 上撑**：WCAG 2.5.8 把"句子里/段落里的行内链接"
   明确列为尺寸下限的例外。在 15.5px/1.72 的段落里把链接撑到 44px 行盒，只会把
   行距撑破、还让相邻两行的可点区互相压住，越改越容易误点。实测这行 21px 高。
   做按钮的那一类全部 ≥44（见各条注释）。 */
.md-a{color:inherit;text-decoration:underline;text-underline-offset:2px;overflow-wrap:anywhere}
#lb{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
  padding:var(--sp-3);background:rgba(6,8,12,.94)}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:var(--dsw-radius-sm)}
#lb .x{position:absolute;top:calc(var(--sp-2) + var(--safe-t));right:calc(var(--sp-2) + var(--safe-r));width:44px;height:44px;
  border-radius:50%;border:1px solid rgba(255,255,255,.34);background:rgba(255,255,255,.12);
  color:#fff;font-size:18px;line-height:1}
/* 工作区选择：新建对话前先定在哪个目录开。
   清单只有服务端能给（见 host 侧注释）—— 这层 UI 只负责"挑"，不负责"拼路径"。
   每项 52px 高，图省事把常用的放前面；路径靠右对齐截断成 …\项目名，因为 Windows
   路径的有用信息在尾巴上。 */
#wsp{position:fixed;inset:0;z-index:70;display:none;align-items:flex-end;
  background:rgba(8,10,14,.42)}
#wsp.on{display:flex}
#wsp .box{width:100%;max-height:78vh;overflow-y:auto;background:var(--panel);
  border-top:1px solid var(--line);
  border-radius:var(--dsw-radius-lg) var(--dsw-radius-lg) 0 0;
  padding:var(--sp-2) var(--sp-3) calc(var(--sp-4) + var(--safe-b));
  transform:translateY(16px);opacity:0;
  transition:transform var(--mo-base) var(--mo-ease),opacity var(--mo-base) var(--mo-ease)}
#wsp.on .box{transform:none;opacity:1}
#wsp h4{margin:var(--sp-2) var(--sp-2) var(--sp-3);font-size:var(--fs-3);font-weight:600;color:var(--dim)}
#wsp .ws-head{display:flex;align-items:center;gap:var(--sp-2);margin:var(--sp-1) var(--sp-2) var(--sp-3)}
#wsp .ws-head h4{flex:1;margin:0;color:var(--fg);font-size:var(--fs-5)}
#wsp .it{display:flex;align-items:center;gap:var(--sp-3);width:100%;min-height:52px;margin:var(--sp-2) 0;
  padding:var(--sp-2) var(--sp-3);border:1px solid var(--line);border-radius:var(--dsw-radius-md);
  background:var(--panel2);color:var(--fg);text-align:left;font:inherit;font-size:var(--fs-4);cursor:pointer}
#wsp .it:active{background:var(--panel)}
#wsp .it .txt{flex:1;min-width:0}
#wsp .it .nm{display:block;font-weight:600}
#wsp .it .pt{display:block;font-size:var(--fs-2);color:var(--dim);margin-top:var(--sp-1);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:left}
#wsp .it .tag{flex:0 0 auto;font-size:var(--fs-1);color:var(--faint);border:1px solid var(--line);
  border-radius:var(--r-pill);padding:var(--sp-1) var(--sp-2)}
@media (prefers-reduced-motion: reduce){
  #wsp .box{transition:none;transform:none;opacity:1}
}
/* ══ 10. 纸墨微动 ──────────────────────────────────────────────────────
   这一节的规矩，写给下一个改这里的人：

   · 只服务信息：在跑 / 完成 / 失败 / 有新消息 / 图正在显影。没有"为了好看"的动。
   · 位移 ≤3px，时长 120–320ms，曲线统一"起步快、末段收"（墨入纸），不做回弹过冲。
   · **所有入场动画都必须由 JS 加上的类门控**（.loading/.done/.fresh/.awake/.tick/
     .go/.inking）。这段 JS 不跑时，页面必须完全静态**且完整** —— 图片不允许被藏起来、
     失败卡片不允许反复抖、指标行不允许闪。这条是硬约束，不是风格偏好。
   · 上面那个 prefers-reduced-motion 块会把这里的一切压成瞬变，不要绕过它；
     被压平后仍然要能读出状态，见本节末尾的例外。
   ───────────────────────────────────────────────────────────────────── */
:root{
  --mo-fast:120ms; --mo-base:200ms; --mo-slow:320ms;
  --mo-ease:cubic-bezier(.22,.61,.24,1);   /* 墨入纸：起步快、末段收 */
  --mo-spring:cubic-bezier(.2,.9,.25,1);   /* 结构件：抽屉、浮标 */
  --mo-ink:rgba(15,17,21,.06);
  /* 页脚高度由行为层用 ResizeObserver 写进来（右下浮标贴在它上面）。
     默认值必须写在这里，而**不能**写成 var(--foot-h, calc(...)) —— 嵌套 calc 的
     var 回退会被判无效，整条 bottom 声明作废，浮标就退回静态位置、正好压住指标行。
     这是 2026-10-09 实测踩到的：间距 -4px，量出来才知道。 */
  --foot-h:calc(78px + var(--safe-b));
}
:root[data-theme='dark']{--mo-ink:rgba(255,255,255,.075)}

/* 按压：不是整块变灰，是从指尖洇开一点墨。.inkdot 由 JS 生成；
   没有 JS 时退化成各自的 :active 变色，功能不减。 */
.inkdot{
  position:absolute;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,var(--mo-ink) 0%,var(--mo-ink) 38%,transparent 72%);
  transform:translate(-50%,-50%) scale(.05);
}
.inkdot.go{animation:inkSpread var(--mo-slow) var(--mo-ease) forwards}
@keyframes inkSpread{
  from{transform:translate(-50%,-50%) scale(.05);opacity:1}
  to{transform:translate(-50%,-50%) scale(1);opacity:0}
}
.pillbtn,.iconbtn,#send,.item,.toolgroup .gh,.tool .more,.filecard,.md-imgwrap{
  transition:transform var(--mo-fast) var(--mo-ease),background var(--mo-base) var(--mo-ease),
             border-color var(--mo-base) var(--mo-ease),opacity var(--mo-base) var(--mo-ease);
}
.pillbtn:active,.iconbtn:active,.item:active,.toolgroup .gh:active,.tool .more:active,.filecard:active{
  transform:scale(.975);
}
#send:active{transform:scale(.94)}

/* 输入框里有字 → 发送键"醒过来"：外圈浮一层光晕（JS 加 .awake） */
#send{box-shadow:0 0 0 0 var(--ring-none)}
#send.awake{box-shadow:0 0 0 4px var(--ring-glow)}

/* 流式生成：.bub.streaming 本来就用尾部渐隐表示"还在往下长"（既有代码切换的类，
   所以这里不需要新 JS）。再加一枚呼吸的墨点，像笔尖停在纸上。 */
.bub.streaming::after{
  content:'';display:inline-block;width:6px;height:6px;margin-left:4px;border-radius:50%;
  background:currentColor;opacity:.5;vertical-align:middle;
  animation:inkBreath 1.15s var(--mo-ease) infinite;
}
@keyframes inkBreath{0%,100%{opacity:.22;transform:scale(.7)}50%{opacity:.75;transform:scale(1)}}

/* 工具卡：在跑 = 一圈墨环在转（原来是描边方块）；完成 = 勾自己画出来；失败 = 顿一下。
   .fresh 只在"状态刚刚变化"时由 JS 加上 —— 否则整段重渲染会让动画反复重放，
   那就从"灵动"变成"抽搐"了。 */
.tool.run .sp{
  width:15px;height:15px;border:0;border-radius:50%;
  background:conic-gradient(from 90deg,transparent 0 30%,var(--warn));
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2.2px),#000 calc(100% - 2.2px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 2.2px),#000 calc(100% - 2.2px));
  animation:inker .85s linear infinite;
}
@keyframes inker{to{transform:rotate(360deg)}}
.tool.fresh.ok .ti svg *{stroke-dasharray:22;animation:drawIn var(--mo-slow) var(--mo-ease) both}
@keyframes drawIn{from{stroke-dashoffset:22}to{stroke-dashoffset:0}}
.tool.fresh.no{animation:nudge var(--mo-base) var(--mo-ease) 1}
@keyframes nudge{0%,100%{transform:translateX(0)}30%{transform:translateX(-2px)}70%{transform:translateX(2px)}}

/* 图片：先落一块纸纹，显影时轻轻放大一点。注意 .loading 是 JS **之后**才加的 ——
   JS 不跑时 .md-img 完全可见，绝不留隐形图。
   2026-10-22（v1.7.8）：.md-imgwrap 必须 position:relative —— 否则下面这条
   `inset:0` 的绝对定位流光会以**视口**为包含块：长会话里只要有一张懒加载图片
   还没进入视口，它就一直带着 .loading，于是整屏出现一条 1.35s 无限循环的亮带
   （用户报的"反复闪屏"），还把它自己的 translateX(55%) 算进文档宽度，
   把 390 的页面撑到 601（横向可滚）。同时流光绝不能吃点击。 */
.md-img{transition:opacity var(--mo-slow) var(--mo-ease),transform var(--mo-slow) var(--mo-ease)}
.md-imgwrap.loading .md-img{opacity:0;transform:scale(1.012)}
.md-imgwrap.done .md-img{opacity:1;transform:none}
.md-imgwrap.loading::after{
  content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(100deg,transparent 18%,var(--mo-ink) 42%,transparent 62%);
  animation:sheen 1.35s var(--mo-ease) infinite;
}
@keyframes sheen{from{transform:translateX(-55%)}to{transform:translateX(55%)}}

/* 指标行：数值变了轻轻闪一下（数字本来就是等宽，不会左右抖） */
.stats.tick{animation:tick var(--mo-base) var(--mo-ease)}
/* 数字行轻微上浮 + 淡入，而不是整行闪一下：只在文字真的变了时由行为层加类。 */
@keyframes tick{from{opacity:.55;transform:translateY(2px)}}

/* 新增消息：120ms 淡入 + 8px 上移。只在**新追加**的那一行由 JS 加 .enter，
   重渲染/切会话不加 —— 否则每次轮询都会让整屏重放一次。 */
.row.enter{animation:msgIn 120ms var(--mo-ease) both}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}}

/* 新消息浮标：弹出来，数字跳一下 */
#tobottom.on{animation:pop var(--mo-slow) var(--mo-spring)}
@keyframes pop{from{transform:translateY(7px) scale(.9)}}
#tobottom .n:not([hidden]){animation:nPop var(--mo-base) var(--mo-spring)}
@keyframes nPop{from{transform:scale(.55)}}

/* 抽屉：像抽出一张纸，条目依次落下（每档 14ms，由 JS 设 animation-delay） */
#sheet{animation:sheetUp var(--mo-slow) var(--mo-spring)}
@keyframes sheetUp{from{transform:translateY(16px);opacity:.55}}
#sheet .item.fresh{animation:itemIn var(--mo-base) var(--mo-ease) both}
@keyframes itemIn{from{opacity:0;transform:translateY(5px)}}

/* 主题切换：像一滴墨洇开整张纸。JS 放一层 #moire，底色取的是**新**主题的
   --bg（变量是活的，所以这层墨就是"新纸"的颜色） */
#moire{
  position:fixed;inset:0;z-index:200;pointer-events:none;opacity:0;
  background:var(--bg,#fff);clip-path:circle(0 at var(--mx,50%) var(--my,50%));
}
#moire.go{animation:moire var(--mo-slow) var(--mo-ease) forwards}
@keyframes moire{
  0%{opacity:.92;clip-path:circle(0 at var(--mx,50%) var(--my,50%))}
  55%{opacity:.92;clip-path:circle(140vmax at var(--mx,50%) var(--my,50%))}
  100%{opacity:0;clip-path:circle(140vmax at var(--mx,50%) var(--my,50%))}
}

/* 空态：虎鲸轻轻呼吸（4.2 秒一次、位移 3px —— 几乎察觉不到在动，但页面不"死"） */
.empty .brand{animation:breathe 4.2s var(--mo-ease) infinite}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

/* 减小动效的例外：压成瞬变之后，"在跑"的墨环会停住、图片骨架会停在半透明 ——
   状态仍然必须读得出来，所以这里给它们静态的等价形态，而不是简单地一起关掉。 */
@media (prefers-reduced-motion:reduce){
  .row.enter{animation:none}
  .tool.run .sp{background:transparent;border:2px solid var(--warn);-webkit-mask:none;mask:none}
  .tool.run,.toolgroup.busy{animation:none;box-shadow:inset 0 1px 0 var(--hi),0 0 0 3px var(--ring-glow),var(--shadow-card)}
  #status.busy::before{animation:none}
  .md-imgwrap.loading .md-img{opacity:1;transform:none}
  .md-imgwrap.loading::after{display:none}
  .bub.streaming::after{animation:none;opacity:.5;transform:none}
}


/* ===== 竖屏牌桌（#poker）=====
   手机上的德扑：座位铺在竖椭圆上，底部是四个大按钮。
   所有尺寸都用 min()/百分比，390px 宽不横向溢出。 */
#poker{position:fixed;inset:0;z-index:70;display:none;flex-direction:column;
  background:#0d1512;color:#eaf5ee;font-size:14px;overflow:hidden}
#poker.on{display:flex}
.pk-top{display:flex;align-items:center;gap:var(--sp-3);padding:calc(10px + var(--safe-t)) var(--sp-3) 10px;
  border-bottom:1px solid rgba(255,255,255,.08);flex:0 0 auto}
.pk-top b{font-size:15px;font-weight:600}
.pk-top .pk-meta{margin-left:auto;font-size:12px;opacity:.7;text-align:right;line-height:1.35}
.pk-x{width:44px;height:44px;border:0;border-radius:var(--dsw-radius-sm);background:rgba(255,255,255,.09);
  color:inherit;font-size:17px;line-height:1;cursor:pointer}
.pk-felt{position:relative;flex:1 1 auto;margin:10px 12px;border-radius:46% / 30%;
  background:radial-gradient(ellipse at 50% 45%,#1c5f45 0%,#14453422 60%,#0d1512 100%),
    linear-gradient(#17553f,#0f3a2b);border:1px solid rgba(255,255,255,.10);
  box-shadow:inset 0 0 40px rgba(0,0,0,.35);min-height:0}
.pk-seat{position:absolute;transform:translate(-50%,-50%);width:88px;padding:5px 6px;
  border-radius:var(--dsw-radius-sm);background:rgba(0,0,0,.42);border:1px solid rgba(255,255,255,.10);
  text-align:center;line-height:1.25;overflow:hidden}
.pk-seat .nm{font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk-seat .st{font-size:11px;opacity:.78;font-variant-numeric:tabular-nums}
.pk-seat.folded{opacity:.34}
.pk-seat.turn{border-color:#ffd166;box-shadow:0 0 0 2px rgba(255,209,102,.45)}
.pk-seat.hero{background:rgba(24,90,66,.72);border-color:rgba(120,255,200,.5)}
.pk-seat .bd{position:absolute;top:-7px;left:-7px;min-width:16px;height:16px;border-radius:8px;
  background:#ffd166;color:#20160a;font-size:10px;line-height:16px;font-weight:700}
.pk-seat .cd{margin-top:3px;font-size:11px;letter-spacing:.5px;font-variant-numeric:tabular-nums}
.pk-seat .cd .cdc.red{color:#ff9a8f}
.pk-mid{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(84%,300px);
  text-align:center}
.pk-pot{font-size:12px;opacity:.85;margin-bottom:6px}
.pk-board{display:flex;justify-content:center;gap:5px;flex-wrap:wrap}
.pk-card{min-width:34px;height:46px;border-radius:var(--dsw-radius-xs);background:#f4f7f5;color:#16221c;
  font-size:15px;font-weight:600;line-height:46px;text-align:center;padding:0 4px}
.pk-card.red{color:#c0392b}
.pk-card.back{background:repeating-linear-gradient(45deg,#2a6b52,#2a6b52 4px,#215741 4px,#215741 8px);
  color:transparent}
.pk-log{flex:0 0 auto;max-height:52px;overflow-y:auto;padding:0 14px;font-size:11.5px;
  line-height:1.5;opacity:.72;overflow-wrap:anywhere}
.pk-act{flex:0 0 auto;padding:10px var(--sp-3) calc(14px + var(--safe-b));border-top:1px solid rgba(255,255,255,.08);
  background:#0b120f}
.pk-row{display:flex;gap:8px}
.pk-btn{flex:1 1 0;min-width:0;min-height:52px;border:0;border-radius:var(--dsw-radius-md);
  background:rgba(255,255,255,.12);color:inherit;font-size:15px;font-weight:600;cursor:pointer}
.pk-btn.p{background:#2fbf7f;color:#06231a}
.pk-btn.r{background:#e0574f;color:#fff}
.pk-btn:disabled{opacity:.34;cursor:default}
.pk-rate{display:flex;align-items:center;gap:var(--sp-3);margin-top:var(--sp-2)}
/* 滑杆也是可点元素：轨道本身很细，靠 min-height 把命中区撑到 44 */
.pk-rate input{flex:1 1 auto;min-width:0;min-height:44px;accent-color:#2fbf7f}
.pk-rate .amt{font-size:12px;font-variant-numeric:tabular-nums;min-width:52px;text-align:right;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk-hint{margin-top:8px;font-size:12px;opacity:.72;text-align:center;overflow-wrap:anywhere}
.pk-toast{position:fixed;left:50%;top:calc(62px + var(--safe-t));transform:translateX(-50%);z-index:80;
  max-width:78vw;padding:var(--sp-2) var(--sp-3);border-radius:var(--dsw-radius-sm);background:rgba(0,0,0,.82);
  font-size:12.5px;opacity:0;transition:opacity .18s;pointer-events:none;overflow-wrap:anywhere}
.pk-toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.pk-toast{transition:none}}
</style>
</head>
<body>

<header>
  <!-- 第一行：菜单 · 标题 · 路由胶囊（JS 插到标题后）· 连接三点 · 新建 · 月亮。
       路由胶囊由「远端/局域网」脚本自己挂进来，位置固定在标题与新建键之间；
       它不再是 header 末尾的块级元素，因此不会再压在对话内容上。 -->
  <div class="hrow" id="hrow">
    <button id="sessBtn" class="iconbtn sessbtn" aria-label="对话列表">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
    </button>
    <div class="sess">
      <span class="t" id="sessTitle">连接中…</span>
    </div>
    <button id="netq" class="netq idle" type="button" aria-label="连接质量未知" title="连接质量">
      <span class="qd" aria-hidden="true"></span><span class="qd" aria-hidden="true"></span><span class="qd" aria-hidden="true"></span>
    </button>
    <div id="poker" role="dialog" aria-label="德州扑克牌桌"></div>
    <button id="newBtn" class="iconbtn" aria-label="新建对话">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button id="themeBtn" class="iconbtn" aria-label="切换深浅色" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
    </button>
  </div>
  <!-- 第二行：工作区·模型（12.5px 次要色，不再是胶囊）+ 可点的状态卡。 -->
  <div class="subrow">
    <button id="modelBtn" class="ctxline" aria-label="切换模型">
      <span class="ws" id="workspaceLabel">默认工作区</span>
      <span class="sep" aria-hidden="true">·</span>
      <span class="model" id="modelLabel">模型未连接</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <!-- 临时提示（切模型 / 连接断开 / 新建中）放第二行，替换工作区·模型；
         标题行始终只有一行，不会因为一句状态变成三行。 -->
    <span id="sessSub" class="subnote" hidden></span>
    <button id="status" aria-label="查看任务详情" aria-expanded="false">
      <span class="dot" aria-hidden="true"></span>
      <span class="txt" id="statusTxt">正在连接…</span>
      <span class="chev" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></span>
    </button>
  </div>
</header>

<!-- 子代理工具条：只在真有子代理（或正在看子代理）时出现，44px，不常驻占位。 -->
<nav class="subbar" id="subbar" hidden aria-label="子代理会话">
  <button class="sb" id="subagentsBtn" type="button" aria-label="查看子代理会话">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3.4 19c.5-3.2 2.8-5 5.6-5s5.1 1.8 5.6 5"/><path d="M16 5.4a3 3 0 0 1 0 5.6M17.2 14.4c2 .5 3.2 2.1 3.5 4.6"/></svg>
    <span class="lbl">子代理</span>
    <span class="n" id="subagentsCount">0</span>
    <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
  </button>
  <button class="sb" id="backMainBtn" type="button" hidden aria-label="返回主对话">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    <span class="lbl">主对话</span>
  </button>
  <span class="agenttitle" id="agentTitle" hidden></span>
  <button class="sb" id="agentListBtn" type="button" hidden aria-label="打开子代理列表">
    <span class="lbl">列表</span>
  </button>
</nav>

<main id="log" role="log" aria-live="polite" aria-label="对话记录"></main>

<!-- 子代理二级页：全屏覆盖在主对话之上，返回键 = hash 回退。 -->
<section class="subview" id="subview" hidden aria-label="子代理会话列表">
  <div class="subview-head">
    <button class="iconbtn" id="subviewBack" type="button" aria-label="返回主对话">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="subview-title" id="subviewTitle">子代理</div>
  </div>
  <div class="subview-body" id="subviewBody"></div>
</section>


<!-- 回到底部：离开底部时才出现，并显示期间来了几条新消息。 -->
<button id="tobottom" type="button" aria-label="回到最新消息">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
  <span>最新</span>
  <span class="n" hidden></span>
</button>

<footer>
  <!-- 指标行：豆包把「对话 / 打电话 / AI创作」放在这一排，我们把运行数字放这儿 ——
       手机单手拿的时候，拇指自然落在这个位置，抬眼就能扫到。 -->
  <!-- 队列：宿主不支持（404）时整块 hidden，连占位都不留。 -->
  <div class="queuebar" id="queueBar" hidden>
    <button class="qsum" id="queueSummary" type="button" aria-expanded="false" aria-controls="queueList">
      <span class="qdot" aria-hidden="true"></span>
      <span class="qcount" id="queueCount">排队 0 条</span>
      <span class="qhint" id="queueHint">展开</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <div class="qlist" id="queueList" hidden></div>
    <div class="qnote" id="queueNote" role="status" aria-live="polite"></div>
  </div>
  <!-- 指标行：整行 44px 可点；点开是宿主真实返回的明细。 -->
  <button class="stats" id="stats" type="button" aria-expanded="false" aria-controls="statsDetail"></button>
  <div class="stats-detail" id="statsDetail" hidden></div>
  <div class="attachment-tray" id="attachmentTray" hidden aria-label="待发送附件"></div>
  <div class="attachment-notice" id="attachmentNotice" role="status" aria-live="polite"></div>
  <div class="composer">
    <button id="attach" type="button" aria-label="添加附件" title="添加文件或图片">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 12.5l5.7-5.7a3.2 3.2 0 014.5 4.5l-7.8 7.8a5 5 0 01-7.1-7.1l7.3-7.3a3.6 3.6 0 015.1 5.1l-7 7a2 2 0 11-2.8-2.8l6.6-6.6"/></svg>
    </button>
    <textarea id="input" rows="1" placeholder="说点什么…" autocomplete="off"
      aria-label="输入消息" enterkeyhint="send"></textarea>
    <button id="send" aria-label="发送">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M12 6l6 6-6 6"/></svg>
    </button>
  </div>
  <input id="fileInput" type="file" multiple hidden>
  <input id="imageInput" type="file" multiple hidden accept="image/png,image/jpeg,image/webp,image/gif">
</footer>

<!-- 抽屉按对话框语义标注：读屏会当成模态处理，焦点不会跑到后面的对话里。 -->
<div id="sheet" hidden role="dialog" aria-modal="true" aria-label="任务与会话">
  <div class="card" id="card"></div>
</div>

<script>
'use strict';
// ===========================================================================
// 手机对话页 —— 与宿主 /taskwatch/chat/* 路由配套。
//
// 宿主侧只是把 DSH 自己的 sessionController 转出来，LLM 与流式协议都不在本插件里，
// 所以这里也不需要任何模型概念：只认 wire 帧。
//
// 帧有三类：
//   snapshot         开场快照（含最近 N 条历史）
//   event            增量事件（user/message、assistant/message、tool/call、tool/result、
//                    step/start、step/end、turn/start、turn/end）
//   assistant-stream 逐字增量（frame.chunk.type === 'text-delta'）
// ===========================================================================

var $ = function(id){ return document.getElementById(id) }
var ESC = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return ESC[c] })
}
function hhmm(t){
  var d = t ? new Date(t) : new Date()
  return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)
}
function hms(t){
  var d = t ? new Date(t) : new Date()
  return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)+':'+('0'+d.getSeconds()).slice(-2)
}
function eventTime(ev){
  if (!ev) return 0
  var t = ev.time
