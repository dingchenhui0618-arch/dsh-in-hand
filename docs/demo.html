    else if (items[i].status === 'no') failed++
  }
  var opened = running > 0 || failed > 0

  var box = document.createElement('div')
  box.className = 'toolgroup' + (running ? ' busy' : failed ? ' bad' : '')

  var head = document.createElement('button')
  head.type = 'button'
  head.className = 'gh'
  head.setAttribute('aria-expanded', opened ? 'true' : 'false')

  var dot = document.createElement('span'); dot.className = 'dot'
  head.appendChild(dot)

  var sum = document.createElement('span'); sum.className = 'sum'
  var strong = document.createElement('b'); strong.textContent = items.length + ' 个步骤'
  sum.appendChild(strong)
  sum.appendChild(document.createTextNode(
    running ? ' · ' + running + ' 项进行中'
      : failed ? ' · ' + failed + ' 项失败'
        : ' · 全部完成'))
  head.appendChild(sum)

  var ch = document.createElement('span')
  ch.innerHTML = ICON_CHEV                       // 文件内常量，非模型文本
  var csvg = ch.firstChild
  if (csvg && csvg.setAttribute) csvg.setAttribute('class', 'ch')
  head.appendChild(ch)

  var body = document.createElement('div')
  body.className = 'gb'
  for (var k = 0; k < items.length; k++) body.appendChild(toolNode(items[k]))
  body.hidden = !opened

  head.addEventListener('click', function () {
    var collapsing = !body.hidden
    body.hidden = collapsing
    head.setAttribute('aria-expanded', collapsing ? 'false' : 'true')
  })

  box.appendChild(head)
  box.appendChild(body)
  return box
}

function messageMeta(it){
  var who = it.kind === 'user' ? '你' : (it.interrupted ? '助手 · 已中断' : '助手')
  var bits = [who]
  if (it.time) bits.push(hms(it.time))
  if (it.kind === 'assistant' && it.durationMs > 0) bits.push('用时 ' + fmtDuration(it.durationMs))
  return bits.join(' · ')
}

function nodeFor(it, idx){
  var r = rowNode(it.kind === 'user' ? 'me' : 'ai')
  r.setAttribute('data-i', String(idx))
  if (it.kind === 'tool') { r.appendChild(toolNode(it)); return r }
  var files = messageAttachmentsNode(it.attachments)
  if (files) r.appendChild(files)
  if (it.text) r.appendChild(bubNode(it.text))
  var m = document.createElement('div')
  m.className = 'meta'
  m.textContent = messageMeta(it)
  r.appendChild(m)
  return r
}

/** 分组外面那层 .row：data-i 用这一段工具的**起点**（增量更新靠它定位），
 *  另挂一个 data-g 标记"这是一行分组"，好和单条工具卡区分开。 */
function groupRow(run){
  var r = rowNode('ai')
  r.setAttribute('data-i', String(run.start))
  r.setAttribute('data-g', String(run.start))
  r.appendChild(groupNode(run))
  return r
}

/** 全量重建：只在开场快照时用。 */
function renderAll(){
  log.innerHTML = ''
  if (!S.items.length && S.chatReady) { renderEmpty(); return }
  var frag = document.createDocumentFragment()
  for (var i = 0; i < S.items.length; i++) {
    if (S.items[i].kind === 'tool') {
      var run = toolRunAt(i)
      if (run) {
        frag.appendChild(groupRow(run))
        i = run.end                 // 这一段已经收进分组，跳过剩下的
        continue
      }
    }
    frag.appendChild(nodeFor(S.items[i], i))
  }
  log.appendChild(frag)
  renderPending()
  toBottom()
}

/** 增量：按序号**就地替换**那一条。
 *
 *  S.items 只可能"尾部追加"或"原地改状态"（工具结果会把对应那张卡从进行中改成
 *  完成），所以序号是稳定的 —— 用 data-i 定位旧节点替换即可。
 *  早先的版本靠"最后一张卡的标签是否相同"来判断该替换哪张，脆弱且会插错；
 *  实测一次带工具调用的对话就能看出来，所以改成了按序号。
 */
function renderAt(idx){
  if (idx < 0 || idx >= S.items.length) return
  if (log.querySelector('.empty')) log.innerHTML = ''
  var stick = nearBottom()

  // 工具条目可能属于一个分组：那时要整段重建，而不是只换这一条。
  var run = S.items[idx].kind === 'tool' ? toolRunAt(idx) : null
  if (run) {
    var head = log.querySelector('.row[data-g="' + run.start + '"]')
    if (head) {
      head.replaceWith(groupRow(run))
    } else {
      // 这一段里可能已经单独渲染过几行（刚够格成组的那一刻），先清掉再插入 ——
      // 否则会出现「分组 + 残留旧行」同时挂在页面上，同一批步骤显示两遍。
      for (var j = run.start; j <= run.end; j++) {
        var stray = log.querySelector('.row[data-i="' + j + '"]')
        if (stray && !stray.getAttribute('data-g')) stray.remove()
      }
      var after = log.querySelector('.row[data-i="' + (run.end + 1) + '"]')
      var row = groupRow(run)
      if (after) log.insertBefore(row, after)
      else { log.appendChild(row); noteIncoming() }
    }
    renderPending()
    if (stick) toBottom()
    return
  }

  var n = nodeFor(S.items[idx], idx)
  var old = log.querySelector('[data-i="' + idx + '"]')
  if (old) old.replaceWith(n)
  else { log.appendChild(n); noteIncoming() }
  renderPending()
  if (stick) toBottom()
}

function renderEmpty(){
  log.innerHTML = ''
  var d = document.createElement('div')
  d.className = 'empty'
  // 空状态放 DSH 的虎鲸标。第一眼看不出"这是给谁用的"是最贵的成本，
  // 而一个 logo 比一句解释快得多。用 /taskwatch/icon-192.png ——
  // 中继和宿主都提供它，不额外引入一次请求。
  var logo = document.createElement('img')
  logo.className = 'brand'
  logo.src = '/taskwatch/icon-192.png'
  logo.alt = ''
  d.appendChild(logo)
  var h2 = document.createElement('h2'); h2.textContent = '在这里跟我说话就行'
  var p = document.createElement('p')
  p.innerHTML = '我会在这台电脑上干活，进度直接显示在这里。<br>想看还有几个任务在跑，点上面的状态条。'
  d.appendChild(h2); d.appendChild(p)
  var box = document.createElement('div'); box.className = 'chips'
  var says = ['现在什么情况？', '还有几个任务在跑？', '帮我看一下有没有卡住的地方']
  for (var i = 0; i < says.length; i++) {
    var c = document.createElement('button')
    c.className = 'chip'
    c.textContent = says[i]
    c.setAttribute('data-say', says[i])
    box.appendChild(c)
  }
  d.appendChild(box)
  log.appendChild(d)
  var cs = d.querySelectorAll('.chip')
  for (var k = 0; k < cs.length; k++) {
    cs[k].addEventListener('click', function(){ send(this.getAttribute('data-say')) })
  }
}

/** 已发出但还没落进日志的气泡：让"点了发送"立刻有反馈。 */
function renderPending(){
  var old = log.querySelector('.row.pending')
  if (old) old.remove()
  if (!S.pending && !S.pendingAttachments.length) return
  var r = rowNode('me')
  r.classList.add('pending')
  if (S.pendingAttachments && S.pendingAttachments.length) {
    for (var i = 0; i < S.pendingAttachments.length; i++) r.appendChild(pendingAttachmentNode(S.pendingAttachments[i]))
  }
  if (S.pending) r.appendChild(bubNode(S.pending))
  var m = document.createElement('div')
  m.className = 'meta'
  m.textContent = '发送中…'
  r.appendChild(m)
  log.appendChild(r)
  toBottom()
}
function dropPending(){
  if (!S.pending && !(S.pendingAttachments && S.pendingAttachments.length)) return
  S.pending = null
  for (var i = 0; i < S.pendingAttachments.length; i++) releaseAttachment(S.pendingAttachments[i])
  S.pendingAttachments = []
  var old = log.querySelector('.row.pending')
  if (old) old.remove()
}

/** 逐字输出：只改一个节点的文本，绝不整页重建。 */
function streamText(txt){
  if (!S.streaming) {
    var r = rowNode('ai')
    var w = bubNode('')
    r.appendChild(w)
    log.appendChild(r)
    var b = w.querySelector('.bub') || w
    b.classList.add('streaming')     // 尾部渐隐，表示"还在往下长"
    S.streaming = { row:r, bub:b, text:'' }
    noteIncoming()
  }
  S.streaming.text += txt
  S.streaming.bub.textContent = S.streaming.text
  if (nearBottom()) toBottom()
}

/** 流式收尾：**必须把临时气泡从页面上拿掉**。
 *
 *  早先的版本只把 S.streaming 置空、不删节点，而最终文本随后又会由
 *  assistant/message 作为正式条目重新渲染 —— 同一段话于是在页面上显示两遍。
 *  如果服务端始终没给正式消息（只有增量就 turn/end 了），这里补一条，
 *  免得文本凭空消失。
 */
function finishStreaming(completedAt){
  if (!S.streaming) return
  var t = S.streaming.text
  try { if (S.streaming.row && S.streaming.row.parentNode) S.streaming.row.remove() } catch (e) {}
  S.streaming = null
  if (!t) return
  var last = S.items.length ? S.items[S.items.length - 1] : null
  if (last && last.kind === 'assistant' && last.text === t) return
  var at = completedAt || Date.now()
  S.items.push({
    kind:'assistant', text:t, interrupted:false, time:at,
    durationMs:responseDurationAt(at)
  })
  S.lastAssistantIndex = S.items.length - 1
  renderAt(S.items.length - 1)
}

// ---------------------------------------------------------------------------
// 流式连接
// ---------------------------------------------------------------------------
var SEQ = 0
function openStream(){
  if (S.es) { try { S.es.close() } catch (e) {} S.es = null }
  if (!S.sessionId) return
  var mine = ++SEQ
  setSub('连接中…')
  var es = new EventSource('/taskwatch/chat/stream?sessionId=' + encodeURIComponent(S.sessionId))
  S.es = es
  es.onopen = function(){ if (mine === SEQ) setSub('') }
  es.onmessage = function(msg){
    if (mine !== SEQ) return          // 切会话后的旧连接，直接丢弃
    var f
    try { f = JSON.parse(msg.data) } catch (e) { return }
    if (!f) return
    if (f.type === 'snapshot') { applySnapshot(f); setSub(''); return }
    if (f.type === 'event') { acceptEvent(f.event); return }
    if (f.type === 'assistant-stream') {
      var fr = f.frame
      if (fr && fr.type === 'start') { S.running = true; syncSend() }
      else if (fr && fr.type === 'end') { finishStreaming() }
      else if (fr && fr.type === 'chunk' && fr.chunk
               && fr.chunk.type === 'text-delta' && typeof fr.chunk.text === 'string') {
        streamText(fr.chunk.text)
        if (!S.running) { S.running = true; syncSend() }
      }
      return
    }
    if (f.type === 'taskwatch-error') { setSub('出错：' + (f.message || '')); return }
  }
  es.onerror = function(){
    if (mine !== SEQ) return
    setSub('连接中断，重连中…')   // EventSource 自带重连，不主动再开一条
  }
}

// ---------------------------------------------------------------------------
// 交互
// ---------------------------------------------------------------------------
// 图标一律用内联 SVG，不用 ➤ ■ 这类字符：字符图标在不同字体下大小与基线都不同，
// 换台设备就变形，也没法用令牌统一控制粗细和颜色。
// 下面两个字符串是**文件内常量**，不含任何宿主或模型来的内容，所以这里用 innerHTML 安全。
var ICON_SEND = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M12 6l6 6-6 6"/></svg>'
var ICON_STOP = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>'
// 工具卡的状态图标。定义在本行、用在上面的 toolNode() 里 —— var 声明会提升，
// 而 toolNode() 是在脚本顶层跑完之后才被调用的，所以顺序没问题。
var ICON_OK   = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 13l4 4L19 7"/></svg>'
var ICON_FAIL = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg>'
var ICON_CHEV = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>'
var ICON_DOWN = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg>'
var ICON_CLOSE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>'
function syncSend(){
  var b = $('send')
  if (S.running) { b.innerHTML = ICON_STOP; b.classList.add('stop'); b.setAttribute('aria-label','停止') }
  else { b.innerHTML = ICON_SEND; b.classList.remove('stop'); b.setAttribute('aria-label','发送') }
  b.disabled = !!sendingSessions[S.sessionId]
  $('attach').disabled = !!sendingSessions[S.sessionId]
}
function setSub(t){ $('sessSub').textContent = t || '' }
function pathTail(p){
  p = String(p || '').replace(/[\\/]+$/, '')
  if (!p) return ''
  var bits = p.split(/[\\/]/)
  return bits[bits.length - 1] || p
}
function renderContext(){
  var ws = pathTail(S.workspace) || '默认工作区'
  var model = (USAGE && (USAGE.model || USAGE.modelId)) || S.model || '模型未连接'
  var wsEl = $('workspaceLabel'), modelEl = $('modelLabel')
  if (wsEl) wsEl.textContent = ws
  if (modelEl) modelEl.textContent = model
}
// 会话标题。开场快照和后续事件里都会带 session/title 帧，
// 所以冷会话一旦被选中，顶部立刻能显示真名（不必等它变热）。
function setTitle(t){
  if (!t) return
  S.title = String(t)
  $('sessTitle').textContent = S.title
}

var USAGE = null, USAGE_BUSY = false

/** 大数字压成 186M 这种写法 —— 一排指标里，位数比精度重要。 */
function fmtTok(n){
  n = Number(n) || 0
  if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B'
  if (n >= 1e6) return (n / 1e6).toFixed(0) + 'M'
  if (n >= 1e3) return (n / 1e3).toFixed(1) + 'k'
  return String(n)
}
function fmtCount(n){ return Math.max(0, Math.round(Number(n) || 0)).toLocaleString() }
function fmtRate(n){
  n = Number(n) || 0
  return n >= 100 ? Math.round(n).toLocaleString() : n.toFixed(1)
}
function fmtMs(n){
  n = Math.max(0, Number(n) || 0)
  if (n >= 60000) return (n / 60000).toFixed(1) + ' 分钟'
  if (n >= 1000) return (n / 1000).toFixed(1) + ' 秒'
  return Math.round(n) + ' ms'
}
function cacheHitPercent(u){
  if (!u) return null
  if (typeof u.cacheHitPercent === 'number' && isFinite(u.cacheHitPercent)) return u.cacheHitPercent
  var uncached = Number(u.uncachedInputTokens)
  if (!isFinite(uncached)) uncached = Number(u.inputTokens) || 0
  var read = Number(u.cacheReadTokens) || 0, write = Number(u.cacheWriteTokens) || 0
  var total = uncached + read + write
  return total > 0 ? 100 * read / total : null
}
function contextPercent(u){
  if (!u) return null
  if (typeof u.contextPercent === 'number' && isFinite(u.contextPercent)) return u.contextPercent
  var used = typeof u.contextTokens === 'number' ? u.contextTokens :
    (typeof u.projectedTokens === 'number' ? u.projectedTokens :
    (typeof u.pressureTokens === 'number' ? u.pressureTokens :
    (typeof u.surfaceTokens === 'number' ? u.surfaceTokens : NaN)))
  var window = Number(u.contextWindow) || 0
  return window > 0 && isFinite(used) ? Math.min(100, 100 * used / window) : null
}

/** 会话用量：轮 / 步 / token / 缓存命中 / 上下文占用。
 *
 *  宿主拿不到 tokenMeter 时**不会**返回这些字段 —— 那这里就什么都不显示。
 *  宁可少一行，也不写一个 0 出来：在监控页上，"0" 和 "不知道" 是两件事。
 */
async function loadUsage(){
  if (USAGE_BUSY) return
  if (!S.sessionId) { USAGE = null; renderStats(); renderContext(); return }
  USAGE_BUSY = true
  try {
    var r = await fetch('/taskwatch/chat/usage?sessionId=' + encodeURIComponent(S.sessionId) +
      '&t=' + Date.now(), { cache:'no-store' })
    var j = await r.json()
    USAGE = (j && !j.error) ? j : null
  } catch (e) { USAGE = null }
  USAGE_BUSY = false
  renderStats()
  renderContext()
}

/** 指标行（输入框上方）：只列**数得出来**的东西。
 *
 *  步数、token/s、token 消耗、缓存命中率、上下文占用来自宿主的
 *  /taskwatch/chat/usage；宿主没给就不显示，不拿前端时间猜一个速度。
 */
function renderStats(){
  var el = $('stats')
  if (!el) return
  var bits = []
  if (!lastData) { bits.push('读取中…') }
  else if (lastData.error || lastData.offline) { bits.push('读不到状态') }
  else {
    var t = lastData.totals || {}
    bits.push('会话 ' + (t.sessions || 0))
    if (t.running || t.jobsRunning) bits.push('在跑 ' + ((t.running || 0) + (t.jobsRunning || 0)))
    if (t.subagents) bits.push('子代理 ' + t.subagents)
    if (t.pending) bits.push('待处理 ' + t.pending)
  }
  if (USAGE && USAGE.live) {
    if (typeof USAGE.turns === 'number') bits.push('轮次 ' + fmtCount(USAGE.turns))
    if (typeof USAGE.steps === 'number') bits.push('步数 ' + fmtCount(USAGE.steps))
    if (typeof USAGE.tokensPerSecond === 'number' && isFinite(USAGE.tokensPerSecond)) {
      bits.push(fmtRate(USAGE.tokensPerSecond) + ' tok/s')
    }
    var consumed = typeof USAGE.tokenConsumption === 'number' ? USAGE.tokenConsumption : USAGE.totalTokens
    if (typeof consumed === 'number') bits.push('Token ' + fmtTok(consumed))
    var hit = cacheHitPercent(USAGE)
    // 向下取整，不四舍五入：99.5% 显示成 "100%" 是在往上抬，
    // 监控页宁可少报也不能多报。DSH 自己的状态栏也是这个口径（99%）。
    if (hit !== null) bits.push('缓存命中 ' + Math.floor(hit) + '%')
    var context = contextPercent(USAGE)
    if (context !== null) bits.push('上下文 ' + Math.floor(context) + '%')
  }
  el.textContent = bits.join(' · ')
}

/** 脉搏条：一格 = 一个会话。
 *
 *  只画**真实存在**的信号 —— /taskwatch/data 里确实有的 sessions[].running、
 *  totals.pending、errors；没有的东西（比如"某一步失败了"）不编，宁可少画一格。
 *  唯一需要人马上介入的信号是 pending（有待审批的事），所以那时整条转琥珀。
 *  节点用 createElement 搭，不用 innerHTML —— 和这一页其余部分同一条规矩。
 */
function renderPulse(){
  var row = $('pulseRow'), lg = $('pulseLegend')
  if (!row) return
  var d = lastData || {}
  var sess = (d.sessions || []).slice(0, 24)
  row.textContent = ''
  if (sess.length) {
    for (var i = 0; i < sess.length; i++) {
      var c = document.createElement('span')
      c.className = sess[i].running ? 'cell run' : 'cell'
      row.appendChild(c)
    }
  } else {
    row.appendChild(document.createElement('span')).className = 'cell'
  }
  var tot = d.totals || {}
  var bits = []
  if ((tot.pending || 0) > 0) bits.push('待你处理 ' + tot.pending)
  if ((tot.running || 0) > 0) bits.push('在跑 ' + tot.running)
  if ((tot.jobsRunning || 0) > 0) bits.push('作业 ' + tot.jobsRunning)
  lg.textContent = bits.join(' · ')
}

function syncStatus(){
  var t = $('statusTxt'), box = $('status')
  renderPulse()
  renderStats()
  loadUsage()
  if (!lastData) { t.textContent = '正在读取状态…'; return }
  var d = lastData
  if (d.error) { box.className = 'bad'; t.textContent = '读不到状态：' + d.error; return }
  // service worker 的离线兜底用的是 offline:true + errors[]（见 lib/sw.js）。
  // 不认这个形状的话，断网时会显示成"一切正常，没有任务在跑" —— 对监控来说，
  // 把"读不到"说成"没事"是最坏的一种错。
  if (d.offline || (d.errors && d.errors.length)) {
    box.className = 'bad'
    t.textContent = '连不上电脑：' + (d.errors && d.errors[0] ? d.errors[0] : '读不到状态')
    return
  }
  var tot = d.totals || {}
  var busy = (tot.jobsRunning || 0) + (tot.running || 0)
  var bits = []
  if ((tot.pending || 0) > 0) { box.className = 'warn'; bits.push('有 ' + tot.pending + ' 件事待桌面处理') }
  else if (busy > 0) { box.className = 'busy'; bits.push(busy + ' 个任务正在运行') }
  else { box.className = ''; bits.push('一切正常') }
  t.textContent = bits.join(' · ')
}

// ---------------------------------------------------------------------------
// 网络
// ---------------------------------------------------------------------------
async function post(url, body){
  var r = await fetch(url, {
    method:'POST',
    headers:{ 'content-type':'application/json' },
    body: JSON.stringify(body || {}),
    cache:'no-store'
  })
  if (r.status === 404) throw new Error('宿主没有注册这个接口')
  var d = await r.json().catch(function(){ return { error:'HTTP ' + r.status } })
  if (d && d.error) throw new Error(d.error)
  return d
}

async function send(text){
  text = String(text == null ? $('input').value : text)
  if (sendingSessions[S.sessionId]) return
  if (!text.trim() && !S.attachments.length) return
  if (S.attachments.some(function(a){ return a.status === 'uploading' })) { attachmentNotice('附件还在上传，请稍等'); return }
  if (S.attachments.some(function(a){ return a.status === 'error' })) { attachmentNotice('请重试或移除上传失败的附件'); return }
  if (!S.sessionId) await ensureSession()
  if (!S.sessionId) { attachmentNotice('请先新建或选择一个会话'); return }
  var sessionId = S.sessionId, draft = S.attachments, attached = draft.slice()
  sendingSessions[sessionId] = true
  S.pending = text
  S.pendingAttachments = attached
  renderPending()
  $('input').value = ''
  autoGrow(); syncSend(); attachmentNotice('')
  try {
    var result = await post('/taskwatch/chat/send', {
      sessionId: sessionId,
      text: text,
      attachments: attached.map(function(a){ return a.upload }),
      timeZone: (Intl.DateTimeFormat().resolvedOptions().timeZone || '')
    })
    if (!result || result.accepted !== true) throw new Error('宿主尚未接受消息，请重试')
    attached.forEach(function(a){ var i = draft.indexOf(a); if (i >= 0) draft.splice(i, 1) })
    if (S.sessionId === sessionId) { S.running = true; renderAttachmentTray(); wakeComposer() }
    else attached.forEach(releaseAttachment)
  } catch (e) {
    if (S.sessionId === sessionId) {
      S.pending = null; S.pendingAttachments = []; renderPending()
      attachmentNotice('发送失败：' + e.message)
      if (!$('input').value) $('input').value = text
      autoGrow()
    } else if (attachmentDrafts[sessionId]) {
      if (!attachmentDrafts[sessionId].text) attachmentDrafts[sessionId].text = text
      attachmentDrafts[sessionId].error = '发送失败：' + e.message
    }
  } finally {
    delete sendingSessions[sessionId]
    syncSend()
  }
}

async function stop(){
  try {
    await post('/taskwatch/chat/cancel', { sessionId: S.sessionId })
    S.running = false
    finishStreaming()
    syncSend()
  } catch (e) { setSub('停止失败：' + e.message) }
}

function autoGrow(){
  var el = $('input')
  el.style.height = 'auto'
  el.style.height = Math.min(132, el.scrollHeight) + 'px'
}

var MAX_ATTACHMENTS = 4
var MAX_ATTACHMENT_BYTES = 32 * 1024 * 1024
var attachmentDrafts = Object.create(null), sendingSessions = Object.create(null)
function attachmentNotice(text){ $('attachmentNotice').textContent = text || '' }
function attachmentId(){ return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2) }
function releaseAttachment(a){
  if (a && a.controller) a.controller.abort()
  if (a && a.previewURL && a.previewURL.indexOf('blob:') === 0) {
    try { URL.revokeObjectURL(a.previewURL) } catch (e) {}
  }
}
function wakeComposer(){
  var b = $('send'), i = $('input')
  if (b && i) b.classList.toggle('awake', !!i.value.trim() || S.attachments.some(function(a){ return a.status === 'ready' }))
}
function renderAttachmentTray(){
  var tray = $('attachmentTray')
  if (!tray) return
  tray.textContent = ''
  tray.hidden = !S.attachments.length
  S.attachments.forEach(function(a){
    var chip = document.createElement('div'); chip.className = 'attach-chip' + (a.status === 'error' ? ' bad' : '')
    if (a.kind === 'image') {
      var thumb = document.createElement('img'); thumb.className = 'thumb'; thumb.src = a.previewURL; thumb.alt = ''
      chip.appendChild(thumb)
    } else {
      var kind = document.createElement('span'); kind.className = 'kind'; kind.textContent = kindLabel(a.name)
      chip.appendChild(kind)
    }
    var label = document.createElement('span'); label.style.minWidth = '0'
    var name = document.createElement('span'); name.className = 'name'; name.textContent = a.name; name.title = a.name
    var state = document.createElement('span'); state.className = 'state'
    state.textContent = a.status === 'uploading' ? '上传中…' : a.status === 'error' ? (a.error || '上传失败') : fmtBytes(a.bytes) + ' · 已就绪'
    label.appendChild(name); label.appendChild(state); chip.appendChild(label)
    if (a.status === 'error') {
      var retry = document.createElement('button'); retry.type = 'button'; retry.className = 'retry'; retry.textContent = '重试'
      retry.addEventListener('click', function(){ runUpload(a) }); label.appendChild(retry)
    }
    var remove = document.createElement('button'); remove.type = 'button'; remove.className = 'remove'; remove.setAttribute('aria-label', '移除 ' + a.name)
    remove.disabled = !!sendingSessions[S.sessionId]
    remove.innerHTML = ICON_CLOSE
    remove.addEventListener('click', function(){
      var i = S.attachments.indexOf(a)
      if (i >= 0) { a.removed = true; releaseAttachment(a); S.attachments.splice(i, 1) }
      renderAttachmentTray(); wakeComposer()
    })
    chip.appendChild(remove); tray.appendChild(chip)
  })
}
async function uploadAttachment(a){
  var q = '?sessionId=' + encodeURIComponent(a.sessionId) + '&kind=' + encodeURIComponent(a.kind) +
    '&name=' + encodeURIComponent(a.name) + (a.kind === 'image' ? '&mime=' + encodeURIComponent(a.mime) : '')
  var r = await fetch('/taskwatch/chat/upload' + q, {
    method:'POST', headers:{ 'content-type':'application/octet-stream' }, body:a.file,
    signal:a.controller.signal, cache:'no-store'
  })
  var d = await r.json().catch(function(){ return { error:'HTTP ' + r.status } })
  if (!r.ok || !d || d.error || !d.upload) throw new Error((d && d.error) || ('HTTP ' + r.status))
  return d.upload
}
async function runUpload(a){
  a.status = 'uploading'; a.error = ''; a.controller = new AbortController()
  if (S.sessionId === a.sessionId) renderAttachmentTray()
  try { a.upload = await uploadAttachment(a); if (!a.removed) a.status = 'ready' }
  catch (e) { if (!a.removed) { a.status = 'error'; a.error = e.message || '上传失败' } }
  if (S.sessionId === a.sessionId) { renderAttachmentTray(); wakeComposer() }
}
function chooseFiles(list, kind){
  var files = Array.prototype.slice.call(list || []), sessionId = S.sessionId
  if (!files.length) return
  if (!sessionId) { attachmentNotice('请先新建或选择一个会话'); return }
  if (sendingSessions[sessionId]) return
  attachmentNotice('')
  var total = S.attachments.reduce(function(n,a){ return n + a.bytes }, 0)
  var images = { png:'image/png', jpg:'image/jpeg', jpeg:'image/jpeg', webp:'image/webp', gif:'image/gif' }
  var queued = []
  for (var i = 0; i < files.length; i++) {
    var f = files[i]
    if (S.attachments.length >= MAX_ATTACHMENTS) { attachmentNotice('每条消息最多添加 4 个附件'); break }
    if (f.size > MAX_ATTACHMENT_BYTES || total + f.size > MAX_ATTACHMENT_BYTES) { attachmentNotice('每条消息的附件总大小不能超过 32 MB'); continue }
    var mime = f.type || images[extOf(f.name)] || ''
    if (kind === 'image' && !/^image\/(png|jpeg|webp|gif)$/i.test(mime)) {
      attachmentNotice('图片支持 PNG、JPG、WEBP、GIF；其他格式可用“导入文件”添加'); continue
    }
    var a = { id:attachmentId(), sessionId:sessionId, kind:kind || 'file', mime:mime, name:f.name || '附件',
      bytes:f.size, file:f, status:'uploading', previewURL:URL.createObjectURL(f), upload:null, error:'' }
    S.attachments.push(a); queued.push(a); total += f.size
  }
  renderAttachmentTray(); wakeComposer()
  queued.forEach(runUpload)
}

var sheet = $('sheet'), card = $('card')
var sheetLastFocus = null
function closeSheet(){
  sheet.hidden = true
  card.innerHTML = ''
  var restore = sheetLastFocus
  sheetLastFocus = null
  if (restore && restore.focus) setTimeout(function(){ restore.focus() }, 0)
}
sheet.addEventListener('click', function(e){ if (e.target === sheet) closeSheet() })
function openSheet(html){
  if (sheet.hidden) sheetLastFocus = document.activeElement
  card.innerHTML = '<div class="grab"></div>' + html
  sheet.hidden = false
  var first = card.querySelector('button,input,textarea,[tabindex]')
  if (first) setTimeout(function(){ first.focus() }, 0)
}
sheet.addEventListener('keydown', function(e){
  if (e.key === 'Escape') { e.preventDefault(); closeSheet(); return }
  if (e.key !== 'Tab') return
  var focusable = card.querySelectorAll('button,input,textarea,[tabindex]:not([tabindex="-1"])')
  if (!focusable.length) return
  var first = focusable[0], last = focusable[focusable.length - 1]
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus() }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus() }
})

async function openSessions(){

  if (d && d.error) { openSheet(sheetHead('会话') + '<div class="note">读取失败：' + esc(d.error) + '</div>'); bindSheetClose(); return }
  S.sessions = (d && d.sessions) || []
  var h = sheetHead('会话', S.sessions.length)
  h += '<label class="sheet-search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.4"></circle><path d="m16 16 4.2 4.2"></path></svg><input id="sessionSearch" type="search" placeholder="搜索会话或工作区" autocomplete="off" aria-label="搜索会话或工作区"></label>'

    '<button class="pill navpill" data-act="automation"><span class="label">自动化</span><span class="hint">后台任务 ›</span></button></div><h3>操作</h3>'
  h += '<button class="pill" data-act="new">＋ 开一个新会话</button>'
  h += '<button class="pill" data-act="poker">实验功能：德州扑克</button>'
  h += '<button class="pill" data-act="theme"><span class="label">' +
    (document.documentElement.getAttribute('data-theme') === 'dark' ? '切换到亮色' : '切换到暗色') +
    '</span><span class="hint">外观 ›</span></button>'
  openSheet(h)
  bindSheetClose()
  function paintSessions(query){
    var list = card.querySelector('#sessionList')
    if (!list) return
    var q = String(query || '').trim().toLowerCase()
    var groups = [{ label:'运行中', rows:[] }, { label:'最近', rows:[] }]

  // 缺标题的会话：一次批量请求补齐（最多 12 个），到一条改一条。
  var need = []
  for (var n = 0; n < S.sessions.length && need.length < 12; n++) {
    if (!S.sessions[n].title && !titles[S.sessions[n].id]) need.push(S.sessions[n].id)
  }
  if (need.length) fillTitles(need)
}

/** 批量补标题：**分小批**请求，每回来一批就就地改一次标签。
 *
 *  为什么分批：宿主补一个标题要 1~2 次持久化读（实测约 0.5s/次），一批 12 个
 *  要 5 秒多。与其让用户对着 12 个 "Projects" 干等 5 秒，不如每 4 个刷一次 ——
 *  一两秒后前几条就有名字了。宿主侧和本机都有缓存，所以只有第一次会这样。
 */
async function fillTitles(ids){
  for (var i = 0; i < ids.length; i += 4) {
    var chunk = ids.slice(i, i + 4)
    var got
    try {
      var r = await fetch('/taskwatch/chat/titles?ids=' + encodeURIComponent(chunk.join(',')), { cache:'no-store' })
      if (!r.ok) continue
      got = await r.json()
    } catch (e) { continue }
    if (!got || !got.titles) continue
    for (var id in got.titles) {
      if (!got.titles[id]) continue
      titles[id] = got.titles[id]
      var el = card.querySelector('[data-sess="' + id + '"] .t')
      if (el) el.textContent = titles[id]
      if (id === S.sessionId) $('sessTitle').textContent = titles[id]
    }
    try { localStorage.setItem('taskwatch.titles', JSON.stringify(titles)) } catch (e) {}
  }
}

function selectSession(id){

  // finally 分支收尾；这样既不泄漏 blob URL，也不会把旧会话的缩略图留在新会话里。
  if (oldSession && S.pendingAttachments.length && !sendingSessions[oldSession]) dropPending()
  if (oldSession) attachmentDrafts[oldSession] = { attachments:S.attachments, text:$('input').value }
  S.sessionId = id
  var draft = attachmentDrafts[id] || { attachments:[], text:'' }
  S.attachments = draft.attachments
  $('input').value = draft.text
  attachmentNotice(draft.error || '')
  renderAttachmentTray(); autoGrow(); wakeComposer()
  try { localStorage.setItem('taskwatch.session', id) } catch (e) {}
  var label = shortId(id)
  S.workspace = ''
  for (var i = 0; i < S.sessions.length; i++) {
    if (S.sessions[i].id === id) {
      label = S.sessions[i].title || titles[id] || S.sessions[i].fallback || label
      S.workspace = S.sessions[i].cwd || S.sessions[i].workspace || ''
      break
    }
  }
  S.provider = ''; S.model = ''; USAGE = null
  S.title = label
  $('sessTitle').textContent = label
  renderContext()
  S.items = []; S.seq = 0; S.running = false; S.streaming = null; S.pending = null; S.pendingAttachments = []
  S.turnStartedAt = 0; S.stepStartedAt = 0; S.lastUserAt = 0; S.lastAssistantIndex = -1
  renderAll()
  syncSend()
  openStream()
}

async function ensureSession(){
  var r
  try {
    var res = await fetch('/taskwatch/chat/sessions', { cache:'no-store' })
    if (res.status === 404) { S.chatReady = false; setSub('对话功能不可用（宿主未注册接口）'); renderAll(); return }
    r = await res.json()
  } catch (e) {
    S.chatReady = false; setSub('对话功能不可用：' + e.message); renderAll(); return
  }
  if (r && r.error) { S.chatReady = false; setSub('对话功能不可用：' + r.error); renderAll(); return }
  S.sessions = (r && r.sessions) || []
  var saved = ''
  try { saved = localStorage.getItem('taskwatch.session') || '' } catch (e) {}
  var pick = ''
  for (var i = 0; i < S.sessions.length; i++) { if (S.sessions[i].id === saved) { pick = saved; break } }
  if (!pick && S.sessions.length) pick = S.sessions[0].id
  if (pick) selectSession(pick)
  else setSub('还没有会话，点右上角开一个')
}

function pkCardText(c){

  // 这个函数**不允许抛错**：一旦抛，整块渲染中断，牌桌就点不动了。

  var s = c.suit != null ? c.suit : (c.s != null ? c.s : (c.symbol != null ? c.symbol : null))

function pkAct(action){

  var live = PK.snap || {}

    pkToast('还没轮到你，等对手行动')

  }

  // 它对未知字段是静默忽略的 —— 猜错字段名不报错、只表现为"点了没反应"，
  // 所以两个名字一起发，哪个是它对都能生效。

    var v = +$('pkRange').value

    if (s && s.status === 'playing' && s.toAct === before.toAct &&

        .catch(function(e2){ pkToast('加注失败：' + e2.message) })

/** 新建会话并立刻切过去。path 为空 = 不指定工作区（用宿主的默认值）。 */
async function newSession(path){
  if (S.running) { setSub('当前有任务在跑，先停下再新建'); return }
  setSub('正在新建…')
  try {
    var r = await post('/taskwatch/chat/create', path ? { workspace: path } : {})
    if (!r || !r.sessionId) { setSub('新建失败：' + ((r && r.error) || '宿主没返回 sessionId')); return }
    var list = await fetch('/taskwatch/chat/sessions', { cache:'no-store' }).then(function(x){ return x.json() })
    S.sessions = (list && list.sessions) || []
    selectSession(r.sessionId)
    setSub(r.workspace ? ('已开在 ' + r.workspace) : '')
  } catch (e) { setSub('新建失败：' + e.message) }
}

// ── 深浅色切换 ────────────────────────────────────────────────────────────
// 默认跟随系统；用户手动切过之后以手动为准，并记住选择。
// 状态栏颜色从令牌里读，不在这里写死 hex —— 令牌改了它自动跟着改。
function applyTheme(t, remember){
  var dark = (t === 'dark')
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
  $('themeBtn').setAttribute('aria-pressed', dark ? 'true' : 'false')
  // 图标本身表达"当前是什么主题"，但图标没有文字标签，读屏和第一眼都容易误会，
  // 所以把当前状态和点击结果都写进 aria-label。
  $('themeBtn').setAttribute('aria-label', dark ? '当前暗色，点击切到亮色' : '当前亮色，点击切到暗色')
  var bgc = ''
  try {
    bgc = getComputedStyle(document.documentElement).getPropertyValue('--dsw-alias-bg-base').trim()
  } catch (e) {}
  if (bgc) {
    var ms = document.querySelectorAll('meta[name="theme-color"]')
    for (var i = 0; i < ms.length; i++) {
      var mm = ms[i].getAttribute('media') || ''
      // 带 media 的两个 meta 分别对应系统亮/暗；手动覆盖时改与当前主题相符的那个。
      if ((/dark/i.test(mm)) === dark) ms[i].setAttribute('content', bgc)
    }
  }
  if (remember) { try { localStorage.setItem('taskwatch.theme', dark ? 'dark' : 'light') } catch (e) {} }
}
applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light', false)
$('themeBtn').addEventListener('click', function(){
  var dark = document.documentElement.getAttribute('data-theme') === 'dark'
  applyTheme(dark ? 'light' : 'dark', true)
})
// 用户没手动选过时，跟随系统的切换。老 Safari 没有 addEventListener，用 try 兜住。
try {
  window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change', function(e){
    var saved = ''
    try { saved = localStorage.getItem('taskwatch.theme') || '' } catch (err) {}
    if (saved !== 'light' && saved !== 'dark') applyTheme(e.matches ? 'dark' : 'light', false)
  })
} catch (e) {}

// ── 统一兜住"登录没了" ────────────────────────────────────────────────────
// 任何一个请求回 401，就送去配对页。装在 fetch 上而不是散在每个调用点：
// 漏掉一处就会出现「页面永远卡在连接中」，而那种状态在手机上**没有任何自救路径**
// —— 用户既不知道该去哪，也没法清 cookie。这里一次装好，全部覆盖。
//
// 但跳之前必须确认配对页真的存在：中继可能是还没重启的旧版本，那时
// /taskwatch/pair 会 404 —— 跳过去等于把「卡在连接中」换成「一片 not found」，
// 反而更糟。新中继对该路径免鉴权回 200，旧中继回 404，所以启动探一次就够。
var pairPageOk = false
var rawFetch = window.fetch.bind(window)
rawFetch('/taskwatch/pair', { method: 'HEAD' })
  .then(function (r) { pairPageOk = (r.status === 200) })
  .catch(function () { /* 探测失败就当没有，保守降级 */ })
window.fetch = function (u, o) {
  return rawFetch(u, o).then(function (r) {
    if (r.status === 401) {
      if (pairPageOk) location.replace('/taskwatch/pair')
      throw new Error('unauthorized')
    }
    return r
  })
}

<script>
/* ── 远端 / 局域网 双入口切换（2026-10-12）─────────────────────────────────
   为什么"自动"只能这么写：浏览器禁止 https 页面探测 http:// 的局域网地址（混合内容，
   IP 主机连"可升级"都不算），而中继经 SSH 反向隧道看到的来源永远是 127.0.0.1，
   也判断不出手机在哪个网络。所以能用的信号只有两个：**这条路刚才通不通**，以及
   **你上次选了哪条**。据此：
     · 在远端这条路上，上游体检失败（隧道或 DSH 挂了）→ 自动切到局域网（若可用）
     · 在局域网这条路上，请求自己失败（手机离开 Wi-Fi）→ 自动切回远端
     · 点一下按钮可在 自动 → 固定局域网 → 固定远端 之间循环，选择会被记住
   换路不需要重输 6 位配对码：向中继要一张 60 秒、一次性、换完即作废的凭据。
   整段是独立 IIFE，任何异常只让它自己不显示，不影响页面其它功能。 */
(function () {
  try {
    var PREF_KEY = 'tw-route-pref'
    var ORIGIN = 'unknown'
    var REMOTE = ''
    var LAN = []
    var failed = false
    var upstreamOk = true
    var busy = false

    /* ROUTE-LOGIC-BEGIN */
    function decideRoute(c) {
      if (!c.hasRemote && !c.hasLan) return 'stay'
      if (c.pref === 'remote') return c.origin === 'remote' ? 'stay' : (c.hasRemote ? 'toRemote' : 'stay')
      if (c.pref === 'lan') return c.origin === 'lan' ? 'stay' : (c.hasLan ? 'toLan' : 'stay')
      // auto：只在"这条路确实不行"时才动，绝不把能用的页面换成可能打不开的地址
      if (c.origin === 'lan' && c.failed) return c.hasRemote ? 'toRemote' : 'stay'
      if (c.origin === 'remote' && c.upstreamFailed) return c.hasLan ? 'toLan' : 'stay'
      return 'stay'
    }
    /* ROUTE-LOGIC-END */

    function pref() {
      try { var v = localStorage.getItem(PREF_KEY); return (v === 'lan' || v === 'remote') ? v : 'auto' }
      catch (e) { return 'auto' }
    }
    function setPref(v) { try { localStorage.setItem(PREF_KEY, v) } catch (e) {} }

    function mount() {
      var host = document.querySelector('header') || document.body
      var el = document.getElementById('tw-route-pill')
      if (!el) {
        el = document.createElement('button')
        el.id = 'tw-route-pill'
        el.type = 'button'
        el.setAttribute('aria-label', '切换远端 / 局域网连接')
        el.addEventListener('click', function () {
          var p = pref()
          setPref(p === 'auto' ? 'lan' : (p === 'lan' ? 'remote' : 'auto'))
          apply()
        })
      }
      if (el.parentNode !== host) host.appendChild(el)
      return el
    }

    function label() {
      if (ORIGIN !== 'lan' && ORIGIN !== 'remote') return ''
      var p = pref()
      var here = ORIGIN === 'lan' ? '局域网' : '远端'
      if (p === 'lan' && ORIGIN !== 'lan') return '去局域网'
      if (p === 'remote' && ORIGIN !== 'remote') return '去远端'
      return here + ' · ' + (p === 'auto' ? '自动' : '固定')
    }

    function apply() {
      var el = mount()
      var text = label()
      if (!text) { el.style.display = 'none'; return }
      el.textContent = text
      el.style.display = 'inline-flex'
      var decision = decideRoute({
        origin: ORIGIN, pref: pref(), failed: failed, upstreamFailed: !upstreamOk,
        hasLan: LAN.length > 0, hasRemote: !!REMOTE,
      })
      if (decision === 'stay' || busy) return
      busy = true
      fetch('/taskwatch/ticket', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ to: decision === 'toLan' ? 'lan' : 'remote' }),
      }).then(function (r) { return r.json() }).then(function (j) {
        if (j && j.ok && j.url) location.href = j.url
        else busy = false
      }).catch(function () { busy = false })
    }

    function probe() {
      fetch('/taskwatch/upstream-health', { cache: 'no-store' })
        .then(function (r) { return r.json() })
        .then(function (j) { failed = false; upstreamOk = !!(j && j.ok); apply() })
        .catch(function () { failed = true; apply() })
    }

    // 样式随手挂上，不依赖页面里已有的 class（两份外壳的样式表可能不同）
    var css = document.createElement('style')
    /* 跟页面里其它胶囊同一套尺度：44 的命中区、999 的圆角、12.5px 的字、
       12 的内边距；颜色仍然只用 currentColor 混合（不依赖页面 class，
       万一被别的外壳复用，var() 取不到也不会塌成一块白底）。
       这里用 display:flex!important + margin-left:auto 让它**自成一行、靠右**：
       apply() 会写内联的 display:inline-flex，内联样式优先级高于样式表，
       而这颗胶囊是挂在 header 末尾的、不是 .hrow 的子节点，只能这么对齐。 */
    css.textContent = '#tw-route-pill{display:none;align-items:center;gap:8px;'
      + 'width:fit-content;margin:0 calc(12px + env(safe-area-inset-right,0px)) 4px auto;'
      + 'min-height:44px;padding:0 12px;border-radius:999px;'
      + 'font:600 12.5px/1.25 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",system-ui,sans-serif;'
      + 'color:inherit;background:color-mix(in srgb,currentColor 8%,transparent);'
      + 'border:1px solid color-mix(in srgb,currentColor 24%,transparent);cursor:pointer;white-space:nowrap}'
      + '#tw-route-pill[style*="inline-flex"]{display:flex!important}'
      + '#tw-route-pill:active{transform:scale(.96)}'
    document.head.appendChild(css)

    fetch('/taskwatch/entries', { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null })
      .then(function (j) {
        if (!j || !j.ok || (j.current !== 'lan' && j.current !== 'remote')) return
        ORIGIN = j.current
        REMOTE = j.remote || ''
        LAN = j.lan || []
        apply()
        probe()
        setInterval(function () { apply(); probe() }, 12000)
      })
      .catch(function () { /* 插件侧没有这些路由（例如从 DSH GUI 打开）→ 安静地不显示 */ })
  } catch (e) { console.warn('taskwatch: 双入口切换未启用', e) }
})()
</script>
