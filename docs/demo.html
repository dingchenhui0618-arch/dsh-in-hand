/* ══ 10. 纸墨微动 ──────────────────────────────────────────────────────
   这一节的规矩，写给下一个改这里的人：

   · 只服务信息：在跑 / 完成 / 失败 / 有新消息 / 图正在显影。没有"为了好看"的动。
   · 位移 ≤3px，时长 120–320ms，曲线统一"起步快、末段收"（墨入纸），不做回弹过冲。
   · **所有入场动画都必须由 JS 加上的类门控**（.loading/.done/.fresh/.awake/.tick/
     .go/.inking）。这段 JS 不跑时，页面必须完全静态**且完整** —— 图片不允许被藏起来、
     失败卡片不允许反复抖、指标行不允许闪。这条是硬约束，不是风格偏好。
   · 上面那个 prefers-reduced-motion 块会把这里的一切压成瞬变，不要绕过它；
     被压平后仍然要能读出状态，见本节末尾的例外。
   ───────────────────────────────────────────────────────────────────── */
:root{
  --mo-fast:120ms; --mo-base:200ms; --mo-slow:320ms;
  --mo-ease:cubic-bezier(.22,.61,.24,1);   /* 墨入纸：起步快、末段收 */
  --mo-spring:cubic-bezier(.2,.9,.25,1);   /* 结构件：抽屉、浮标 */
  --mo-ink:rgba(15,17,21,.06);
  /* 页脚高度由行为层用 ResizeObserver 写进来（右下浮标贴在它上面）。
     默认值必须写在这里，而**不能**写成 var(--foot-h, calc(...)) —— 嵌套 calc 的
     var 回退会被判无效，整条 bottom 声明作废，浮标就退回静态位置、正好压住指标行。
     这是 2026-10-09 实测踩到的：间距 -4px，量出来才知道。 */
  --foot-h:calc(78px + var(--safe-b));
}
:root[data-theme='dark']{--mo-ink:rgba(255,255,255,.075)}

/* 按压：不是整块变灰，是从指尖洇开一点墨。.inkdot 由 JS 生成；
   没有 JS 时退化成各自的 :active 变色，功能不减。 */
.inkdot{
  position:absolute;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,var(--mo-ink) 0%,var(--mo-ink) 38%,transparent 72%);
  transform:translate(-50%,-50%) scale(.05);
}
.inkdot.go{animation:inkSpread var(--mo-slow) var(--mo-ease) forwards}
@keyframes inkSpread{
  from{transform:translate(-50%,-50%) scale(.05);opacity:1}
  to{transform:translate(-50%,-50%) scale(1);opacity:0}
}
.pillbtn,.iconbtn,#send,.item,.toolgroup .gh,.tool .more,.filecard,.md-imgwrap{
  transition:transform var(--mo-fast) var(--mo-ease),background var(--mo-base) var(--mo-ease),
             border-color var(--mo-base) var(--mo-ease),opacity var(--mo-base) var(--mo-ease);
}
.pillbtn:active,.iconbtn:active,.item:active,.toolgroup .gh:active,.tool .more:active,.filecard:active{
  transform:scale(.975);
}
#send:active{transform:scale(.94)}

/* 输入框里有字 → 发送键"醒过来"：外圈浮一层光晕（JS 加 .awake） */
#send{box-shadow:0 0 0 0 var(--ring-none)}
#send.awake{box-shadow:0 0 0 4px var(--ring-glow)}

/* 流式生成：.bub.streaming 本来就用尾部渐隐表示"还在往下长"（既有代码切换的类，
   所以这里不需要新 JS）。再加一枚呼吸的墨点，像笔尖停在纸上。 */
.bub.streaming::after{
  content:'';display:inline-block;width:6px;height:6px;margin-left:4px;border-radius:50%;
  background:currentColor;opacity:.5;vertical-align:middle;
  animation:inkBreath 1.15s var(--mo-ease) infinite;
}
@keyframes inkBreath{0%,100%{opacity:.22;transform:scale(.7)}50%{opacity:.75;transform:scale(1)}}

/* 工具卡：在跑 = 一圈墨环在转（原来是描边方块）；完成 = 勾自己画出来；失败 = 顿一下。
   .fresh 只在"状态刚刚变化"时由 JS 加上 —— 否则整段重渲染会让动画反复重放，
   那就从"灵动"变成"抽搐"了。 */
.tool.run .sp{
  width:15px;height:15px;border:0;border-radius:50%;
  background:conic-gradient(from 90deg,transparent 0 30%,var(--warn));
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2.2px),#000 calc(100% - 2.2px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 2.2px),#000 calc(100% - 2.2px));
  animation:inker .85s linear infinite;
}
@keyframes inker{to{transform:rotate(360deg)}}
.tool.fresh.ok .ti svg *{stroke-dasharray:22;animation:drawIn var(--mo-slow) var(--mo-ease) both}
@keyframes drawIn{from{stroke-dashoffset:22}to{stroke-dashoffset:0}}
.tool.fresh.no{animation:nudge var(--mo-base) var(--mo-ease) 1}
@keyframes nudge{0%,100%{transform:translateX(0)}30%{transform:translateX(-2px)}70%{transform:translateX(2px)}}

/* 图片：先落一块纸纹，显影时轻轻放大一点。注意 .loading 是 JS **之后**才加的 ——
   JS 不跑时 .md-img 完全可见，绝不留隐形图。
   2026-10-22（v1.7.8）：.md-imgwrap 必须 position:relative —— 否则下面这条
   `inset:0` 的绝对定位流光会以**视口**为包含块：长会话里只要有一张懒加载图片
   还没进入视口，它就一直带着 .loading，于是整屏出现一条 1.35s 无限循环的亮带
   （用户报的"反复闪屏"），还把它自己的 translateX(55%) 算进文档宽度，
   把 390 的页面撑到 601（横向可滚）。同时流光绝不能吃点击。 */
.md-img{transition:opacity var(--mo-slow) var(--mo-ease),transform var(--mo-slow) var(--mo-ease)}
.md-imgwrap.loading .md-img{opacity:0;transform:scale(1.012)}
.md-imgwrap.done .md-img{opacity:1;transform:none}
.md-imgwrap.loading::after{
  content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(100deg,transparent 18%,var(--mo-ink) 42%,transparent 62%);
  animation:sheen 1.35s var(--mo-ease) infinite;
}
@keyframes sheen{from{transform:translateX(-55%)}to{transform:translateX(55%)}}

/* 指标行：数值变了轻轻闪一下（数字本来就是等宽，不会左右抖） */
.stats.tick{animation:tick var(--mo-base) var(--mo-ease)}
/* 数字行轻微上浮 + 淡入，而不是整行闪一下：只在文字真的变了时由行为层加类。 */
@keyframes tick{from{opacity:.55;transform:translateY(2px)}}

/* 新增消息：120ms 淡入 + 8px 上移。只在**新追加**的那一行由 JS 加 .enter，
   重渲染/切会话不加 —— 否则每次轮询都会让整屏重放一次。 */
.row.enter{animation:msgIn 120ms var(--mo-ease) both}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}}

/* 新消息浮标：弹出来，数字跳一下 */
#tobottom.on{animation:pop var(--mo-slow) var(--mo-spring)}
@keyframes pop{from{transform:translateY(7px) scale(.9)}}
#tobottom .n:not([hidden]){animation:nPop var(--mo-base) var(--mo-spring)}
@keyframes nPop{from{transform:scale(.55)}}

/* 抽屉：像抽出一张纸，条目依次落下（每档 14ms，由 JS 设 animation-delay） */
#sheet{animation:sheetUp var(--mo-slow) var(--mo-spring)}
@keyframes sheetUp{from{transform:translateY(16px);opacity:.55}}
#sheet .item.fresh{animation:itemIn var(--mo-base) var(--mo-ease) both}
@keyframes itemIn{from{opacity:0;transform:translateY(5px)}}

/* 主题切换：像一滴墨洇开整张纸。JS 放一层 #moire，底色取的是**新**主题的
   --bg（变量是活的，所以这层墨就是"新纸"的颜色） */
#moire{
  position:fixed;inset:0;z-index:200;pointer-events:none;opacity:0;
  background:var(--bg,#fff);clip-path:circle(0 at var(--mx,50%) var(--my,50%));
}
#moire.go{animation:moire var(--mo-slow) var(--mo-ease) forwards}
@keyframes moire{
  0%{opacity:.92;clip-path:circle(0 at var(--mx,50%) var(--my,50%))}
  55%{opacity:.92;clip-path:circle(140vmax at var(--mx,50%) var(--my,50%))}
  100%{opacity:0;clip-path:circle(140vmax at var(--mx,50%) var(--my,50%))}
}

/* 空态：虎鲸轻轻呼吸（4.2 秒一次、位移 3px —— 几乎察觉不到在动，但页面不"死"） */
.empty .brand{animation:breathe 4.2s var(--mo-ease) infinite}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

/* 减小动效的例外：压成瞬变之后，"在跑"的墨环会停住、图片骨架会停在半透明 ——
   状态仍然必须读得出来，所以这里给它们静态的等价形态，而不是简单地一起关掉。 */
@media (prefers-reduced-motion:reduce){
  .row.enter{animation:none}
  .tool.run .sp{background:transparent;border:2px solid var(--warn);-webkit-mask:none;mask:none}
  .tool.run,.toolgroup.busy{animation:none;box-shadow:inset 0 1px 0 var(--hi),0 0 0 3px var(--ring-glow),var(--shadow-card)}
  #status.busy::before{animation:none}
  .md-imgwrap.loading .md-img{opacity:1;transform:none}
  .md-imgwrap.loading::after{display:none}
  .bub.streaming::after{animation:none;opacity:.5;transform:none}
}

/* ══ 设备列表与撤销（v1.8.7，P4）══════════════════════════════════════════
   目标只有一句：让人看清「现在哪些设备在用这个入口」，并能踢掉其中一台。
   三条约束：
     1. 整屏二级页，从抽屉进入；返回键回上一页（hash 路由，系统返回手势同源）。
     2. 每行一条设备：名字（系统 · 浏览器摘要）、最近活跃、入口、撤销；当前设备
        额外标「这台设备」，撤销它走二次确认层。
     3. 长名字**截断成一行省略号**而不是换行 —— 完整 UA 摘要可达 80 字，换行会把
        一行设备撑成三行，列表就不像列表了。截断值放在 title 里，长按/悬停可看全。
  颜色全部走令牌，明暗两套自动成立；动效只有 120ms 的底色变化。 */
.devs{position:fixed;inset:0;z-index:36;display:flex;flex-direction:column;
  background:var(--bg);padding-top:var(--safe-t);padding-bottom:var(--safe-b)}
.devs[hidden]{display:none}
.devs-head{flex:0 0 auto;display:flex;align-items:center;gap:var(--sp-2);
  padding:var(--sp-2) calc(var(--sp-3) + var(--safe-r)) var(--sp-2) calc(var(--sp-1) + var(--safe-l));
  border-bottom:1px solid var(--line);background:var(--panel)}
.devs-title{flex:1;min-width:0;font-size:var(--fs-4);font-weight:600;letter-spacing:-.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.devs-title small{display:block;margin-top:1px;font-size:var(--fs-1);font-weight:400;
  color:var(--faint);letter-spacing:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.devs-body{flex:1;min-width:0;overflow-y:auto;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  padding:var(--sp-3) calc(var(--sp-3) + var(--safe-r)) var(--sp-4) calc(var(--sp-3) + var(--safe-l))}
.devs-intro{margin:0 0 var(--sp-3);font-size:var(--fs-2);color:var(--dim);line-height:1.65;

.devs-empty strong,.devs-error strong{color:var(--fg);font-size:var(--fs-4)}

  background:var(--panel2);color:var(--fg);font-size:var(--fs-3)}
.devs-foot{margin:var(--sp-4) 0 0;font-size:var(--fs-1);color:var(--faint);
  line-height:1.7;text-align:center}
#devConfirm{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.5);
  display:flex;align-items:center;justify-content:center;padding:var(--sp-4)}
#devConfirm[hidden]{display:none}
/* 焦点先落到卡片本身（读屏会念 aria-label），而不是直接压在主操作键上：
   触屏下那圈黑色 focus-visible 描边会被误读成"这个按钮被选中了"。 */
#devConfirmCard:focus{outline:none}
/* 被撤销的独立屏：它是 401 之后唯一的出口，所以不复用 SPA 的任何取数逻辑。 */
#revoked{position:fixed;inset:0;z-index:70;display:grid;place-items:center;
  padding:calc(var(--sp-5) + var(--safe-t)) calc(var(--sp-4) + var(--safe-r))
  calc(var(--sp-5) + var(--safe-b)) calc(var(--sp-4) + var(--safe-l));background:var(--bg)}
#revoked[hidden]{display:none}
.revoked-card{width:100%;max-width:360px;padding:var(--sp-5) var(--sp-4);
  border:1px solid color-mix(in srgb,var(--bad) 34%,var(--line));
  border-radius:var(--dsw-radius-lg);background:var(--panel);box-shadow:var(--shadow-card)}
.revoked-card .rv-dot{display:block;width:10px;height:10px;border-radius:50%;
  background:var(--bad);margin-bottom:var(--sp-3)}
.revoked-card h2{margin:0 0 var(--sp-2);font-size:var(--fs-5);color:var(--fg);letter-spacing:0}
.revoked-card p{margin:0 0 var(--sp-4);font-size:var(--fs-3);color:var(--dim);line-height:1.65;
  overflow-wrap:anywhere}
.revoked-card .rv-pair{display:flex;align-items:center;justify-content:center;min-height:48px;
  border-radius:var(--dsw-radius-md);background:var(--fg);color:var(--bg);
  text-decoration:none;font-size:var(--fs-4);font-weight:600}
.revoked-card .rv-hint{margin:var(--sp-3) 0 0;font-size:var(--fs-1);color:var(--faint)}
@media (prefers-reduced-motion:reduce){
  .devrow,.dev-revoke{transition:none}
}
</style>
</head>
<body>

<header>
  <!-- 第一行：菜单 · 标题 · 路由胶囊（JS 插到标题后）· 连接三点 · 新建 · 月亮。
       路由胶囊由「远端/局域网」脚本自己挂进来，位置固定在标题与新建键之间；
       它不再是 header 末尾的块级元素，因此不会再压在对话内容上。 -->
  <div class="hrow" id="hrow">
    <button id="sessBtn" class="iconbtn sessbtn" aria-label="全部会话">
      <svg id="sessMenuIco" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
      <!-- 会话视图里它就是「返回首页」：不靠系统返回手势，也不再多占一行标题。 -->
      <svg id="sessBackIco" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="sess">
      <span class="t" id="sessTitle">连接中…</span>
    </div>
    <button id="netq" class="netq idle" type="button" aria-label="连接质量未知" title="连接质量">
      <span class="qd" aria-hidden="true"></span><span class="qd" aria-hidden="true"></span><span class="qd" aria-hidden="true"></span>
      <!-- v1.8.4：状态不再只靠颜色。稳定时仍是三点（省标题行宽度），
           重连中 / 离线时这格会展开成带字的胶囊；文案由 renderNet 写入。 -->
      <span class="nt" id="netqText" aria-hidden="true"></span>
    </button>
    <div id="poker" role="dialog" aria-label="德州扑克牌桌"></div>
    <button id="newBtn" class="iconbtn" aria-label="新建对话">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button id="themeBtn" class="iconbtn" aria-label="切换深浅色" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
    </button>
  </div>
  <!-- 第二行：工作区·模型（12.5px 次要色，不再是胶囊）+ 可点的状态卡。 -->
  <div class="subrow">
    <button id="modelBtn" class="ctxline" aria-label="切换模型">
      <span class="ws" id="workspaceLabel">默认工作区</span>
      <span class="sep" aria-hidden="true">·</span>
      <span class="model" id="modelLabel">模型未连接</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <!-- 临时提示（切模型 / 连接断开 / 新建中）放第二行，替换工作区·模型；
         标题行始终只有一行，不会因为一句状态变成三行。 -->
    <span id="sessSub" class="subnote" hidden></span>
    <button id="status" aria-label="查看任务详情" aria-expanded="false">
      <span class="dot" aria-hidden="true"></span>
      <span class="txt" id="statusTxt">正在连接…</span>
      <span class="chev" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></span>
    </button>
  </div>
</header>

<!-- 子代理工具条：只在真有子代理（或正在看子代理）时出现，44px，不常驻占位。 -->
<nav class="subbar" id="subbar" hidden aria-label="子代理会话">
  <button class="sb" id="subagentsBtn" type="button" aria-label="查看子代理会话">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3.4 19c.5-3.2 2.8-5 5.6-5s5.1 1.8 5.6 5"/><path d="M16 5.4a3 3 0 0 1 0 5.6M17.2 14.4c2 .5 3.2 2.1 3.5 4.6"/></svg>
    <span class="lbl">子代理</span>
    <span class="n" id="subagentsCount">0</span>
    <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
  </button>
  <button class="sb" id="backMainBtn" type="button" hidden aria-label="返回主对话">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    <span class="lbl">主对话</span>
  </button>
  <span class="agenttitle" id="agentTitle" hidden></span>
  <button class="sb" id="agentListBtn" type="button" hidden aria-label="打开子代理列表">
    <span class="lbl">列表</span>
  </button>
</nav>

<!-- 首页（P1）：待办优先。没有 hash 时看到的是这一屏，`#session/<id>` 才是对话。
     顺序刻意如此：在等你 → 在跑 → 计数一行 → 入口。 -->
<section id="home" class="home" aria-label="概览">
  <div id="homeTodo" class="home-todo"></div>
  <div class="home-sec">
    <div class="home-sec-h">在跑</div>
    <div id="homeRun" class="home-run"></div>
  </div>
  <div class="home-counts" id="homeCounts"></div>
  <div class="home-entry">
    <button id="homeResume" type="button" class="primary">继续上次会话</button>
    <button id="homeAll" type="button">全部会话</button>
  </div>
  <div class="home-err" id="homeErr" hidden><span></span></div>
</section>

<main id="log" role="log" aria-live="polite" aria-label="对话记录" hidden></main>

<!-- 子代理二级页：全屏覆盖在主对话之上，返回键 = hash 回退。 -->
<section class="subview" id="subview" hidden aria-label="子代理会话列表">
  <div class="subview-head">
    <button class="iconbtn" id="subviewBack" type="button" aria-label="返回主对话">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="subview-title" id="subviewTitle">子代理</div>
  </div>
  <div class="subview-body" id="subviewBody"></div>
</section>

<!-- 设备页（v1.8.7，P4）：从抽屉的「设备」进入，整屏覆盖；hash 路由 #devices。 -->
<section class="devs" id="devicesView" hidden aria-label="设备列表">
  <div class="devs-head">
    <button class="iconbtn" id="devicesBack" type="button" aria-label="返回">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="devs-title">设备
      <small>最近用过这个入口的手机与电脑</small>
    </div>
  </div>
  <div class="devs-body" id="devicesBody"></div>
</section>

<!-- 撤销「这台设备」的二次确认层：默认设备名不写用户名，只说后果与需要重配对。 -->
<div id="devConfirm" hidden role="dialog" aria-modal="true" aria-label="确认撤销这台设备">
  <div class="confirm-card" id="devConfirmCard" tabindex="-1">
    <h3>撤销这台设备？</h3>
    <p id="devConfirmText">撤销后这台手机需要重新配对才能继续使用。</p>
    <div class="approval-actions">
      <button class="approval-cancel" type="button" id="devConfirmCancel">取消</button>
      <button class="approval-reject" type="button" id="devConfirmOk">撤销这台设备</button>
    </div>
  </div>
</div>

<!-- 被撤销后的独立出口（v1.8.7）：数据接口 401 时由页面翻出这一屏。
     页面本身被 401 时看到的是服务端同名文案的静态页，两条路都指向 /taskwatch?pair=1。 -->
<section id="revoked" hidden aria-label="设备已被撤销">
  <div class="revoked-card">
    <span class="rv-dot" aria-hidden="true"></span>
    <h2>此设备已被撤销</h2>
    <p>这台设备上的会话已经销毁，不能再读取任务与对话。</p>
    <a class="rv-pair" href="/taskwatch?pair=1">重新配对</a>
    <p class="rv-hint">如果这不是你做的，请在桌面端打开设备列表检查。</p>
  </div>
</section>


<!-- 回到底部：离开底部时才出现，并显示期间来了几条新消息。 -->
<button id="tobottom" type="button" aria-label="回到最新消息">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
  <span>最新</span>
  <span class="n" hidden></span>
</button>

<!-- 会话页问答条（v1.8.3）：当前会话有待回答的选项式提问时，压在输入框上方。
     与首页待办区、任务详情抽屉共用 questionCardHtml —— 不是第二套 UI，
     所以选项高度、明暗、倒计时、409/410 文案天然一致。 -->
<div id="askBar" class="askbar" hidden aria-label="等待回答的提问"></div>

<footer>
  <!-- 断线提示（v1.8.4）：保留上次内容，只在这里说明「这是旧的、正在重试」。
       role=status 但 aria-live=off：文案里的秒数每秒都在变，交给读屏会刷屏；
       状态本身由标题行的三点胶囊朗读。 -->
  <div class="netbanner" id="netBanner" role="status" aria-live="off" hidden>
    <span class="nbdot" aria-hidden="true"></span>
    <span class="nbtxt" id="netBannerText">连接已断开 · 正在重试</span>
    <button class="nbretry" id="netRetry" type="button">立即重试</button>
  </div>
  <!-- 指标行：豆包把「对话 / 打电话 / AI创作」放在这一排，我们把运行数字放这儿 ——
       手机单手拿的时候，拇指自然落在这个位置，抬眼就能扫到。 -->
  <!-- 队列：宿主不支持（404）时整块 hidden，连占位都不留。 -->
  <div class="queuebar" id="queueBar" hidden>
    <button class="qsum" id="queueSummary" type="button" aria-expanded="false" aria-controls="queueList">
      <span class="qdot" aria-hidden="true"></span>
      <span class="qcount" id="queueCount">排队 0 条</span>
      <span class="qhint" id="queueHint">展开</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <div class="qlist" id="queueList" hidden></div>
    <div class="qnote" id="queueNote" role="status" aria-live="polite"></div>
  </div>
  <!-- 指标行：整行 44px 可点；点开是宿主真实返回的明细。 -->
  <button class="stats" id="stats" type="button" aria-expanded="false" aria-controls="statsDetail"></button>
  <div class="stats-detail" id="statsDetail" hidden></div>
  <div class="attachment-tray" id="attachmentTray" hidden aria-label="待发送附件"></div>
  <div class="attachment-notice" id="attachmentNotice" role="status" aria-live="polite"></div>
  <div class="composer">
    <button id="attach" type="button" aria-label="添加附件" title="添加文件或图片">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 12.5l5.7-5.7a3.2 3.2 0 014.5 4.5l-7.8 7.8a5 5 0 01-7.1-7.1l7.3-7.3a3.6 3.6 0 015.1 5.1l-7 7a2 2 0 11-2.8-2.8l6.6-6.6"/></svg>
    </button>
    <textarea id="input" rows="1" placeholder="说点什么…" autocomplete="off"
      aria-label="输入消息" enterkeyhint="send"></textarea>
    <button id="send" aria-label="发送">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M12 6l6 6-6 6"/></svg>
    </button>
  </div>
  <input id="fileInput" type="file" multiple hidden>
  <input id="imageInput" type="file" multiple hidden accept="image/png,image/jpeg,image/webp,image/gif">
</footer>

<!-- 抽屉按对话框语义标注：读屏会当成模态处理，焦点不会跑到后面的对话里。 -->
<div id="sheet" hidden role="dialog" aria-modal="true" aria-label="任务与会话">
  <div class="card" id="card"></div>
</div>
<!-- 高危确认展开时的遮罩：点空白处 = 取消。正在确认的那张卡被抬到它上面
     （.pending-card.risk-open），所以周围变暗、案卷本身仍然完整可读。 -->
<div id="riskMask" hidden></div>
<!-- 批准一次的二次确认。放在抽屉外面，这样截图与读屏都只看到这一层。 -->
<div id="approveConfirm" hidden role="dialog" aria-modal="true" aria-label="确认允许一次">
  <div class="confirm-card">
    <h3>确认允许一次？</h3>
    <p id="approveConfirmText"></p>
    <div class="approval-actions">
      <button type="button" class="approval-cancel" data-confirm-cancel>取消</button>
      <button type="button" class="approval-allow" data-confirm-ok>允许一次</button>
    </div>
  </div>
</div>

<script>
'use strict';
// ===========================================================================
// 手机对话页 —— 与宿主 /taskwatch/chat/* 路由配套。
//
// 宿主侧只是把 DSH 自己的 sessionController 转出来，LLM 与流式协议都不在本插件里，
// 所以这里也不需要任何模型概念：只认 wire 帧。
//
// 帧有三类：
//   snapshot         开场快照（含最近 N 条历史）
//   event            增量事件（user/message、assistant/message、tool/call、tool/result、
//                    step/start、step/end、turn/start、turn/end）
//   assistant-stream 逐字增量（frame.chunk.type === 'text-delta'）
// ===========================================================================

var $ = function(id){ return document.getElementById(id) }
var ESC = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return ESC[c] })
}
function hhmm(t){
  var d = t ? new Date(t) : new Date()
  return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)
}
function hms(t){
  var d = t ? new Date(t) : new Date()
  return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)+':'+('0'+d.getSeconds()).slice(-2)
}
function eventTime(ev){
  if (!ev) return 0
  var t = ev.time
  if (typeof t === 'number' && isFinite(t)) return t
  if (typeof t === 'string') {
    var n = Date.parse(t)
    if (isFinite(n)) return n
  }
  return 0
}
function fmtDuration(ms){
  ms = Math.max(0, Number(ms) || 0)
  if (ms < 1000) return Math.max(1, Math.round(ms)) + ' ms'
  if (ms < 10000) return (ms / 1000).toFixed(1) + ' 秒'
  if (ms < 60000) return Math.round(ms / 1000) + ' 秒'
  var min = Math.floor(ms / 60000)
  var sec = Math.round((ms % 60000) / 1000)
  return min + ' 分 ' + sec + ' 秒'
}
function responseStartAt(){
  return S.stepStartedAt || S.turnStartedAt || S.lastUserAt || 0
}
function responseDurationAt(at){
  var start = responseStartAt()
  return start && at && at >= start ? at - start : 0
}
function finalizeTurn(at, repaint){
  var i = S.lastAssistantIndex
  if (i < 0 || !S.turnStartedAt || !at || at < S.turnStartedAt) return
  S.items[i].durationMs = at - S.turnStartedAt
  if (repaint) renderAt(i)
}
function shortId(id){ id = String(id||''); return id.length > 12 ? id.slice(0,8)+'…' : id }

// 工具名 → 人话。表里没有就显示原名，不隐藏、不猜。
var TOOL = {
  pwsh:'运行命令', read:'读取文件', write:'写入文件', edit:'修改文件',
  glob:'查找文件', grep:'搜索内容', web_search:'联网搜索', web_fetch:'打开网页',
  subagent:'派发子任务', subagent_fork:'派发子任务', todo_write:'更新任务清单',
  skill:'加载技能', job_output:'读取后台任务', job_kill:'结束后台任务',
  job_list:'查看后台任务', create_goal:'建立目标', update_goal:'更新目标',
  present:'交付文件', ask_user_question:'向你提问', read_image:'看图',
  cordis_define:'定义插件', cordis_run:'启动插件', cordis_inspect_self:'检查插件',
  workflow:'运行工作流', ralph:'运行迭代循环'
}
function toolLabel(name){ return TOOL[name] || name || '操作' }

// 从工具参数里挑出**完整原文**（命令 / 路径 / 提示词…）。
// 2026-10-21 改动：摘要态不再显示它，所以这里不再截 160 字、也不再压掉换行 ——
// 展开后要看到的就是"当时真正发出去的那段命令"，复制拿到的也必须是全文。
function argHint(raw){
  var s = '', o = null
  if (raw && typeof raw === 'object') o = raw
  else {
    s = String(raw == null ? '' : raw)
    if (!s) return ''
    try { o = JSON.parse(s) } catch (e) { /* 不是 JSON：按原文 */ }
  }
  if (o && typeof o === 'object') {
    var keys = ['command','file_path','path','pattern','query','url','prompt','description','id','name']
    for (var i = 0; i < keys.length; i++) {
      var v = o[keys[i]]
      if (typeof v === 'string' && v) return v
    }
    var ks = Object.keys(o)
    if (ks.length && typeof o[ks[0]] === 'string') return o[ks[0]]
    try { return JSON.stringify(o) } catch (e2) { return s }
  }
  return s
}

// 只认 text 块；其它类型不硬塞成文字。
function blocksText(blocks){
  var out = ''
  if (!Array.isArray(blocks)) return out
  for (var i = 0; i < blocks.length; i++) {
    var b = blocks[i]
    if (b && b.type === 'text' && typeof b.text === 'string') out += (out ? '\n' : '') + b.text
  }
  return out
}

// ---------------------------------------------------------------------------
// 状态
// ---------------------------------------------------------------------------
var S = {
  sessionId: '',
  // 主对话所在的根会话；看子代理时 sessionId 会变，但它保持不变，返回时靠它。
  rootId: '',
  // 正在二级视图里查看的子代理 id（空 = 主对话）。路由 #subagents/<id> 与它对应。
  viewingAgent: '',
  // 当前显示的是首页（true）还是会话页（false）。无 hash = 首页。
  home: true,
  // 子代理对话是**只读历史快照**（宿主 /taskwatch/session），不走 SSE，也不能发消息。
  agentView: false,
  inputPh: '',
  // 每次切会话 +1：异步回包凭它判断"这还是不是当初那次请求"。
  epoch: 0,
  // 上一次会话与其中最后一条正文的开头：自检用它断言"切完没有残留"。
  prevSessionId: '',
  prevSessionSample: '',
  title: '',
  workspace: '',
  provider: '',
  model: '',
  sessions: [],
  items: [],
  seq: 0,
  running: false,
  es: null,
  // 连接质量（三点指示器）：事件流是否开着、最近一帧的时间、成功重连次数。
  esOpen: false,
  esEverOpen: false,
  esError: false,
  lastFrameAt: 0,
  reconnects: 0,
  httpOk: true,
  streaming: null,
  pending: null,
  pendingAttachments: [],
  attachments: [],
  chatReady: true,
  // 只看对话：隐藏工具步骤与注入上下文（偏好存 localStorage['tw-chat-only']）。
  chatOnly: false,
  // DSH 的事件时间是 epoch ms。step 优先于 turn，这样助手气泡显示的是本步耗时；
  // 没有 step 帧时退回整轮，流式兜底也能给出真实的用时。
  turnStartedAt: 0,
  stepStartedAt: 0,
  lastUserAt: 0,
  lastAssistantIndex: -1
}

// 消息队列（宿主 /taskwatch/chat/queue）的本地视图。
// supported === false 表示宿主没注册这条路由（404）—— 整块 UI 不渲染，也不报错。
// state: 'unknown' | 'ok' | 'error' | 'off'
var Q = {
  sid: '', supported: null, state: 'unknown', checkedSid: '',
  running: false, items: [], steering: [], counts: { queued: 0, steering: 0 },
  truncated: false, open: false, busy: false, note: '', noteBad: false
}

// 冷会话标题缓存。
//
// 宿主侧 SessionSummary **没有** title 字段，所以列表里冷会话只能退化成目录名
// （实测 60 条全叫 "Projects"，完全没法挑）。真标题要从事件日志里取一次
// （/taskwatch/chat/titles）。结果缓存在本机 localStorage：
// 只有第一次打开列表会慢一下，之后直接命中。
var titles = {}
try { titles = JSON.parse(localStorage.getItem('taskwatch.titles') || '{}') || {} } catch (e) { titles = {} }

// ---------------------------------------------------------------------------
// 归一化
// ---------------------------------------------------------------------------
function contentAttachments(blocks){
  var out = []
  if (!Array.isArray(blocks)) return out
  for (var i = 0; i < blocks.length; i++) {
    var b = blocks[i]
    if (!b || typeof b !== 'object' || !b.attachment || typeof b.attachment !== 'object') continue
    var ref = b.attachment
    if (!ref.attachmentId) continue
    if (b.type === 'image') out.push({ kind:'image', id:String(ref.attachmentId), name:String(ref.name || '图片'), mime:String(ref.mediaType || 'image/png') })
    else if (b.type === 'file') out.push({ kind:'file', id:String(ref.attachmentId), name:String(ref.name || '文件'), bytes:Number(ref.bytes) || 0 })
  }
  return out
}
/** 判断一条 role:'user' 消息是不是**宿主注入的上下文**，而不是用户打的字。
 *
 *  这不是内容审查：命中时原文完整保留，只是在气泡里默认收起（点开照读）。
 *  判据只认几种开头，宁可漏判也不误折叠用户自己写的话 —— 误判的代价是
 *  "我说的东西被藏起来了"，比多显示一段注入更难接受。 */
function injectionKind(text){
  var s = String(text == null ? '' : text).replace(/^\s+/, '')
  if (/^<system-reminder>/i.test(s)) return '系统注入'
  if (/^<available_skills>/i.test(s)) return '技能清单'
  if (/^This is an automatically generated checkpoint/i.test(s)) return '会话摘要'
  if (/^<compacted-summary>/i.test(s)) return '会话摘要'
  if (/^Current runtime context\./i.test(s)) return '运行上下文'
  if (/^Time sampled (while|at) /i.test(s)) return '运行上下文'
  if (/^Current working directory:/i.test(s)) return '运行上下文'
  return ''
}
function normUser(d, ev){
  // 工具结果同样是 role:'user'，但它不是"人说的话"，必须挡掉。
  if (d && d.source && d.source.kind === 'tool') return null
  var text = blocksText(d && d.content)
  var attachments = contentAttachments(d && d.content)
  if (!text && !attachments.length) return null
  return { kind:'user', text:text, attachments:attachments, time:eventTime(ev), injected:injectionKind(text) }
}
function normAssistant(d, ev){
  var m = d && d.message
  var text = blocksText(m && m.content)
  if (!text) return null
  var at = eventTime(ev)
  return {
    kind:'assistant', text:text, interrupted: !!(d && d.interrupted), time:at,
    durationMs: responseDurationAt(at)
  }
}
// collapsed 只活在内存里（S.items[i].collapsed），不进 localStorage：
// 展开/收起是"这一眼看什么"的临时选择，不是跨设备偏好。
// 默认 true = 收成一行摘要；markTool 只改 status、不碰 collapsed，
// 所以同一 callId 从 pending → ok/no 时，用户展开过的卡不会被弹回折叠。
function toolItem(name, args, callId, status, time){
  return {
    kind:'tool', callId:String(callId||''), name:name||'', hint:argHint(args),
    status:status, time:Number(time) || 0, collapsed:true
  }
}
// tool/result 的 callId 在 data.message.source.callId —— **不在顶层**。
// 2026-09-22 实测踩过：按顶层 d.callId 读会拿到 undefined，于是每来一个工具结果
// 都会新插一张错卡，而不是把原来那张改成「完成」。这类错误静态检查看不见，
// 只有真跑一轮带工具调用的对话才会暴露。
function resultCallId(d){
  if (!d) return ''
  if (d.message && d.message.source && d.message.source.callId) return String(d.message.source.callId)
  var c = d.message && Array.isArray(d.message.content) ? d.message.content : null
  if (c && c[0] && c[0].toolCallId) return String(c[0].toolCallId)
  return ''
}
function markTool(callId, failed, time){
  var id = String(callId||'')
  for (var i = S.items.length - 1; i >= 0; i--) {
    if (S.items[i].kind === 'tool' && S.items[i].callId === id) {
      S.items[i].status = failed ? 'no' : 'ok'
      if (time) S.items[i].time = Number(time) || S.items[i].time
      return i
    }
  }
  S.items.push(toolItem('', '', id, failed ? 'no' : 'ok', time))
  return S.items.length - 1
}

function acceptEvent(ev, sid){
  if (!ev || typeof ev !== 'object') return
  // 旧会话的 SSE 帧绝不能落进新会话（切会话的竞态就靠这一行 + SEQ 双保险）。
  if (sid && sid !== S.sessionId) return
  var t = ev.type, d = ev.data
  if (typeof ev.seq === 'number' && ev.seq > S.seq) S.seq = ev.seq
  if (t === 'user/message') {
    var u = normUser(d, ev)
    if (u && u.time) S.lastUserAt = u.time
    if (u) { S.items.push(u); dropPending(); renderAt(S.items.length - 1) }
  } else if (t === 'assistant/message') {
    var a = normAssistant(d, ev)
    // 顺序很重要：先落进 S.items，再收流式气泡。反过来 finishStreaming() 会以为
    // 服务端没给正式消息而补一条，同一段话于是建两条。
    if (a) { S.items.push(a); S.lastAssistantIndex = S.items.length - 1 }
    finishStreaming()
    if (a) renderAt(S.items.length - 1)
  } else if (t === 'tool/call') {
    S.items.push(toolItem(d && d.name, d && d.arguments, d && d.callId, 'run', eventTime(ev)))
    renderAt(S.items.length - 1)
  } else if (t === 'tool/result') {
    renderAt(markTool(resultCallId(d), !!(d && d.error), eventTime(ev)))
  } else if (t === 'session/title') {
    setTitle(d && d.title)
  } else if (t === 'step/start') {
    S.stepStartedAt = eventTime(ev) || Date.now()
  } else if (t === 'step/end') {
    // assistant/message 已经用 step/start → message.time 算出耗时；这里只保留
    // stepStartedAt，供没有正式消息、只有流式增量的兜底路径使用。
  } else if (t === 'turn/start') {
    S.turnStartedAt = eventTime(ev) || Date.now()
    S.stepStartedAt = 0
    S.lastAssistantIndex = -1
    S.running = true; syncSend()
  } else if (t === 'turn/end') {
    var endedAt = eventTime(ev) || Date.now()
    S.running = false; finishStreaming(endedAt); finalizeTurn(endedAt, true); syncSend()
    S.turnStartedAt = 0
    S.stepStartedAt = 0
    S.lastAssistantIndex = -1
  }
}

function applySnapshot(f, sid){
  // 快照是整段替换：回包如果属于旧会话，直接丢，绝不能拿它覆盖新会话的列表。
  if (sid && sid !== S.sessionId) return
  S.items = []
  S.seq = typeof f.cursor === 'number' ? f.cursor : 0
  S.turnStartedAt = 0
  S.stepStartedAt = 0
  S.lastUserAt = 0
  S.lastAssistantIndex = -1
  var recs = Array.isArray(f.records) ? f.records : []
  for (var i = 0; i < recs.length; i++) {
    var r = recs[i]
    if (!r || r.type !== 'event' || !r.event) continue
    var ev = r.event, d = ev.data
    if (typeof ev.seq === 'number' && ev.seq > S.seq) S.seq = ev.seq
    if (ev.type === 'user/message') { var u = normUser(d, ev); if (u) { if (u.time) S.lastUserAt = u.time; S.items.push(u) } }
    else if (ev.type === 'assistant/message') { var a = normAssistant(d, ev); if (a) { S.items.push(a); S.lastAssistantIndex = S.items.length - 1 } }
    else if (ev.type === 'tool/call') S.items.push(toolItem(d && d.name, d && d.arguments, d && d.callId, 'run', eventTime(ev)))
    else if (ev.type === 'tool/result') markTool(resultCallId(d), !!(d && d.error), eventTime(ev))
    else if (ev.type === 'session/title') pendingTitle = d && d.title
    else if (ev.type === 'step/start') S.stepStartedAt = eventTime(ev) || S.turnStartedAt
    else if (ev.type === 'step/end') { /* 见 acceptEvent：正式消息已计算耗时 */ }
    else if (ev.type === 'turn/start') { S.turnStartedAt = eventTime(ev) || 0; S.stepStartedAt = 0; S.lastAssistantIndex = -1; S.running = true }
    else if (ev.type === 'turn/end') { finalizeTurn(eventTime(ev), false); S.running = false; S.turnStartedAt = 0; S.stepStartedAt = 0; S.lastAssistantIndex = -1 }
  }
  S.pending = null
  S.streaming = null
  renderAll()
  if (pendingTitle) setTitle(pendingTitle)
  pendingTitle = ''
  syncSend()
}

var log = $('log')
var pendingTitle = ''

function nearBottom(){ return log.scrollHeight - log.scrollTop - log.clientHeight < 90 }
function toBottom(){ log.scrollTop = log.scrollHeight }

// ── 回到底部 ──────────────────────────────────────────────────────────────
// 长对话被冲到下面之后，必须有个东西能一键回到最新，并告诉用户期间来了几条。
// 这里的 scroll 监听是 **passive + requestAnimationFrame 节流** 的：每次滚动
// 最多做一次布尔判断，既不读也不写布局，所以不会拖慢滚动。
var unseen = 0
var tbTick = 0
function tbEl(){ return document.getElementById('tobottom') }
function syncUnseen(){
  var b = tbEl(); if (!b) return
  var n = b.querySelector('.n'); if (!n) return
  if (unseen > 0) { n.hidden = false; n.textContent = unseen > 99 ? '99+' : String(unseen) }
  else n.hidden = true
}
function syncToBottom(){
  var b = tbEl(); if (!b) return
  if (nearBottom()) { b.classList.remove('on'); unseen = 0; syncUnseen() }
  else b.classList.add('on')
}
/** 有新内容落进日志时调用：没贴在底部就累计未读，并让按钮浮出来。 */
function noteIncoming(){
  if (!nearBottom()) { unseen++; syncUnseen() }
  syncToBottom()
}
log.addEventListener('scroll', function(){
  if (tbTick) return
  tbTick = requestAnimationFrame(function(){ tbTick = 0; syncToBottom() })
}, { passive:true })
if (tbEl()) tbEl().addEventListener('click', function(){ toBottom(); unseen = 0; syncUnseen(); syncToBottom() })
function rowNode(cls){ var r = document.createElement('div'); r.className = 'row ' + cls; return r }
/** 复制到剪贴板。navigator.clipboard 在非 HTTPS 或旧 WebView 里可能不存在，
 *  所以留一条 execCommand 的老路；两条都失败就明说"复制失败"，不假装成功。 */
function copyText(s, btn){
  function done(ok){
    if (!btn) return
    var old = btn.getAttribute('data-label') || btn.textContent
    btn.setAttribute('data-label', old)
    btn.textContent = ok ? '已复制' : '复制失败'
    setTimeout(function(){ btn.textContent = old }, 1500)
  }
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(s).then(function(){ done(true) }, function(){ done(false) })
      return
    }
  } catch (e) {}
  try {
    var ta = document.createElement('textarea')
    ta.value = s; ta.setAttribute('readonly','')
    ta.style.position = 'fixed'; ta.style.top = '-1000px'
    document.body.appendChild(ta); ta.select()
    var ok = document.execCommand('copy')
    document.body.removeChild(ta); done(ok)
  } catch (e) { done(false) }
}

/** 代码块：``` 围栏之间的内容，放进一个自己会横竖滚的 <pre>，头上一行可复制。
 *  内容依旧走 textContent —— "模型文本绝不进 innerHTML" 这条铁律不变。 */
function codeNode(lang, body, fold){
  var box = document.createElement('div'); box.className = 'code'
  var bar = document.createElement('div'); bar.className = 'codebar'
  var lg = document.createElement('span'); lg.className = 'lang'
  lg.textContent = lang || '代码'
  var cp = document.createElement('button')
  cp.type = 'button'; cp.setAttribute('aria-label','复制这段代码')
  cp.textContent = '复制'
  cp.addEventListener('click', function(){ copyText(body, cp) })
  bar.appendChild(lg)
  // 长行给一句明说。手机上横向滚动没有滚动条，不提示的话用户会以为
  // 那一行"本来就是这么断的"。只在真有长行时才出现，不占常驻空间。
  var lines = String(body).split('\n'), longLine = false
  for (var i = 0; i < lines.length; i++) if (lines[i].length > 46) { longLine = true; break }
  // 用户气泡里的代码转储（>3 行）默认只露 3 行：先给行数，点开看全。
  // 不删字、不截断数据，只是把可视高度收起来。
  if (fold && lines.length > 3) {
    box.classList.add('clip')
    var cx = document.createElement('button')
    cx.type = 'button'; cx.className = 'cx'
    cx.setAttribute('aria-expanded','false')
    cx.setAttribute('aria-label','展开这段代码（共 ' + lines.length + ' 行）')
    cx.textContent = '展开'
    cx.addEventListener('click', function(){
      var open = box.classList.toggle('open')
      cx.setAttribute('aria-expanded', open ? 'true' : 'false')
      cx.setAttribute('aria-label', (open ? '收起' : '展开') + '这段代码（共 ' + lines.length + ' 行）')
      cx.textContent = open ? '收起' : '展开'
    })
    bar.appendChild(cx)
  }
  if (longLine) {
    var sh = document.createElement('span')
    sh.className = 'scrollhint'
    sh.textContent = '可横滑'
    bar.appendChild(sh)
  }
  bar.appendChild(cp)
  var pre = document.createElement('pre'); pre.textContent = body
  box.appendChild(bar); box.appendChild(pre)
  return box
}

/** 折叠按钮：默认收起，点开看全文。aria-expanded 让读屏知道当前状态。 */
function foldBtn(bub, chars){
  var btn = document.createElement('button')
  btn.type = 'button'
  btn.className = 'foldbtn'
  btn.setAttribute('aria-expanded','false')
  btn.innerHTML = ICON_CHEV          // 文件内常量，非模型文本
  btn.appendChild(document.createTextNode('展开全文（约 ' + chars + ' 字）'))
  btn.addEventListener('click', function(){
    var open = bub.classList.toggle('open')
    btn.setAttribute('aria-expanded', open ? 'true' : 'false')
    btn.lastChild.nodeValue = open ? '收起' : ('展开全文（约 ' + chars + ' 字）')
  })
  return btn
}

var FOLD_CHARS = 620

/** 从**文件内**的 SVG 常量造一个节点。html 参数只接受上面的 ICON_*，
 *  模型文本与宿主文本永远不走这里（那两类只走 textContent）。 */
function iconSvg(html){
  var box = document.createElement('span')
  box.innerHTML = html
  return box.firstChild || document.createTextNode('')
}

/** 气泡。返回的是 .bubwrap 包裹层（里面才是 .bub），这样折叠按钮不会被
 *  max-height 一起裁掉。
 *
 *  两种渲染：
 *   - 不含 ``` 围栏：整段一个文本节点。流式期间只改 textContent，代价最低。
 *   - 含围栏：拆成「文字 · 代码块 · 文字」，代码块自己会滚，不用把页面顶宽。 */
/** 行内标记：`代码`、**粗体**，以及**交付文件**（图片 / 链接 / 裸路径）。
 *
 *  安全要点（不变）：模型文本**永远不进 innerHTML**，全部走 createTextNode / textContent。
 *  这里用一次 exec 扫描，而不是多次 split —— 多次 split 会互相破坏：先按 ** 切开、
 *  再按 ` 切，粗体里的反引号就会把标记配错，页面上冒出半截星号。
 *
 *  路径识别只做一件事：把「看起来是这台电脑上的文件」的文本换成同源的
 *  /taskwatch/file 链接。**能不能读由服务端白名单裁决** —— 不在白名单里的路径，
 *  info 探测会失败，页面原样保留那段文字，看不出任何差别。
 */
/** 长 token（URL / 路径 / 哈希 / 文件名）的断行点：在分隔符后插 <wbr>。
 *
 *  为什么不是只靠 overflow-wrap:anywhere：anywhere 允许在**任意字符**间断，
 *  中文混排时会把 URL 拦腰截成两段（`https://exa` / `mple.com/...`）。
 *  <wbr> 只在 / \ _ - ? & = # . : 之后给机会，既能换行又保住可读的分段。
 *  <wbr> 不产生字符，textContent 与复制内容都不变。
 *  只对 ≥28 字符的连续非空白串动手，短 token 保持原样。

function appendLongToken(el, tok){

    if (end - last < 8) continue          // 太密的分隔符不插，免得一段字碎成十几块
    el.appendChild(document.createTextNode(tok.slice(last, end)))
    el.appendChild(document.createElement('wbr'))

    appendLongToken(el, m[0])
    last = m.index + m[0].length
  }
  if (last < text.length) el.appendChild(document.createTextNode(text.slice(last)))
}

function inlineInto(el, text){
  var re = /(!\[[^\]\n]*\]\([^)\n]+\))|(\[[^\]\n]+\]\([^)\n]+\))|(`[^`\n]+`)|(\*\*[^*\n]+\*\*)|((?:[A-Za-z]:[\\/]|~[\\/])[^\s<>"'`)\]]+\.(?:png|jpe?g|webp|gif|pdf|txt|md|json|csv|log|mp4|zip))/gi

// ── 交付文件 ────────────────────────────────────────────────────────────────
//
// 为什么值得做：手机上「生成了一张图」如果只表现为一个文件名，等于没看见结果；
// PDF 这类没法内嵌预览的，至少要把名字、大小、类型讲清楚，再给一个能点开的入口。
//
// 为什么路径探测要缓存：一段回复里可能有十几个路径，而流式渲染每帧都会重跑

var FILE_ROUTE = '/taskwatch/file'

var PATH_CACHE = {}          // 路径|会话 -> info 对象 / {err} / 0（已知不可读）
var FILE_ERR_NOT_REF = '该文件未被本会话引用'

function fmtBytes(n){

  if (b < 1048576) return (b / 1024).toFixed(b < 10240 ? 1 : 0) + ' KB'

}
function extOf(p){

}

  var e = extOf(p)

function baseName(p){
  var s = String(p == null ? '' : p).replace(/[\\/]+$/, '')

function looksLikeFile(p){ return /^[A-Za-z]:[\\/]/.test(p) || /^~[\\/]/.test(p) }

function fileUrlFor(p){

/** 把 403 / 413 翻成一句人话。403 里只有"没被本会话引用 / 穿越 / 符号链接逃逸"这几种

function fileErrText(status, body){
  if (status === 413 || (body && body.error === 'too-large')) return FILE_ERR_LARGE
  if (status === 403) {
    var reason = body && body.reason
    if (!reason || reason === 'not-referenced' || reason === 'traversal' || reason === 'symlink-escape') {
      return FILE_ERR_NOT_REF
    }

/** 图片加载失败但不知道原因时，补问一次 info：只为拿到 403/413 的区分文案。
 *  失败就回调空串 —— 提示条照旧显示（绝不把破图留在 DOM 里）。 */
function describeFileError(url, cb){
  if (String(url).indexOf(FILE_ROUTE) !== 0) { cb(''); return }
  try {
    fetch(url + (url.indexOf('?') >= 0 ? '&' : '?') + 'info=1', { cache: 'no-store' })
      .then(function(r){
        return r.json().catch(function(){ return null }).then(function(b){
          return { ok: r.ok, status: r.status, body: b }
        })
      })
      .then(function(res){ cb(res.ok ? '' : fileErrText(res.status, res.body)) })
      .catch(function(){ cb('') })
  } catch (e) { cb('') }
}
/** 裸路径：先问服务端能不能读；读得到换成图或卡片；403/413 给出可区分的提示条

function probePath(p){
  var holder = document.createElement('span')
  holder.textContent = p
  if (!looksLikeFile(p)) return holder
  var url = fileUrlFor(p)
  var key = pathCacheKey(p)
  var cached = PATH_CACHE[key]
  if (cached === 0) return holder
  if (cached && cached.err) return fileCard(url, p, kindLabel(p), { err: cached.err })
  if (cached) {
    return cached.kind === 'image' ? imgNode(url, cached.name || p) : fileCard(url, cached.name || p, kindLabel(p))
  }
  try {
    fetch(url + '&info=1', { cache: 'no-store' })
      .then(function(r){
        return r.json().catch(function(){ return null }).then(function(b){
          return { ok: r.ok, status: r.status, body: b }
        })
      })
      .then(function(res){
        if (!res.ok) {
          var text = fileErrText(res.status, res.body)
          PATH_CACHE[key] = { err: text }
          if (holder.parentNode) holder.parentNode.replaceChild(fileCard(url, p, kindLabel(p), { err: text }), holder)
          return
        }
        var j = res.body
        if (!j || j.error) { PATH_CACHE[key] = 0; return }
        PATH_CACHE[key] = j
        if (!holder.parentNode) return
        var node = j.kind === 'image' ? imgNode(url, j.name || p) : fileCard(url, j.name || p, kindLabel(p))
        holder.parentNode.replaceChild(node, holder)

/** 把失败的 <img>（连同它的 .md-imgwrap）换成提示条。幂等：已被换掉就什么都不做。

  if (wrap && !wrap.parentNode) return false      // 已经换过一次了，别再动

  if (!known) {
    describeFileError(url, function(text){

function imgNode(url, alt, knownErr){

  a.target = '_blank'

  fs.className = 'fs'
  fs.textContent = '点开查看'
  fm.appendChild(fn)
  fm.appendChild(fs)
  a.appendChild(ic)
  a.appendChild(fm)

function fillInfo(fs, url, card){
  try {
    fetch(url + (url.indexOf('?') >= 0 ? '&' : '?') + 'info=1', { cache: 'no-store' })
      .then(function(r){
        return r.json().catch(function(){ return null }).then(function(b){
          return { ok: r.ok, status: r.status, body: b }
        })
      })
      .then(function(res){
        if (!res.ok) {
          fs.textContent = fileErrText(res.status, res.body) + ' · 点开原路径'
          if (card) card.className = 'filecard filecard-err'
          return
        }
        var j = res.body
        if (!j || j.error) return
        var bits = []
        if (j.kind) bits.push(String(j.kind).toUpperCase())
        if (j.bytes) bits.push(fmtBytes(j.bytes))
        if (j.width && j.height) bits.push(j.width + '×' + j.height)
        if (bits.length) fs.textContent = bits.join(' · ')
      })
      .catch(function(){ /* 拿不到就保持"点开查看" */ })
  } catch (e) { /* 忽略 */ }
}
function brokenFileNode(label){

/** 点图放大。手机上原图往往只有几百像素宽，看不清代码截图里的字。 */
function openLightbox(url, alt){
  var lb = document.getElementById('lb')
  if (!lb) {
    lb = document.createElement('div')
    lb.id = 'lb'

    big.alt = ''

function messageAttachmentNode(a){

/** GFM 表格（v1.7.6）：`| 列 | 列 |` + `| --- | --- |` + 若干行。
 *
 *  以前这些行按普通段落逐行铺开，手机上看到的是 `| 字段 | 值 |` 一串竖线，
 *  列一多就横向挤成一条。现在包进 .tablewrap：**列宽由内容决定，放不下时

  var s = String(line).trim()

  if (s.charAt(s.length - 1) === '|') s = s.slice(0, -1)

  wrap.setAttribute('role', 'region')

  }

  table.appendChild(thead)

  for (var r = 0; r < rowLines.length; r++) {
    var cells = tableCells(rowLines[r]), tr = document.createElement('tr')

      tr.appendChild(td)

  return wrap
}

/** 块级标记：`## 标题`、`- 列表项`、空行留白。
 *
 *  只认这几种。每多认一种就多一处可能显示错的地方，而这几种覆盖了模型输出的绝大
 *  多数；真正的重活（代码块）由 bubNode 按 ``` 分流处理，不走这里。
 */
function blocksInto(el, text){
  var lines = String(text).split('\n')
  for (var i = 0; i < lines.length; i++) {
    var ln = lines[i]
    if (!ln.trim()) {
      var gap = document.createElement('div'); gap.className = 'md-blank'
      el.appendChild(gap); continue
    }
    // 表格先判：表头 + 分隔行 + 连续带 | 的行。列数按表头对齐，
    // 多出来的单元格不丢（第 4 列仍渲染），少的部分补空 td。
    if (ln.indexOf('|') >= 0 && i + 1 < lines.length && isTableSep(lines[i + 1]) &&
        tableCells(ln).length === tableCells(lines[i + 1]).length) {
      var rows = [], j = i + 2
      while (j < lines.length && lines[j].trim() && lines[j].indexOf('|') >= 0) {
        rows.push(lines[j]); j++
      }
      el.appendChild(tableNode(ln, rows))
      i = j - 1
      continue
    }
    var h = /^(#{1,4})\s+(.+)$/.exec(ln)
    if (h) {
      var hd = document.createElement('div'); hd.className = 'md-h'
      hd.setAttribute('data-lv', String(h[1].length))
      el.appendChild(inlineInto(hd, h[2])); continue
    }
    var li = /^\s*[-*]\s+(.+)$/.exec(ln)
    if (li) {
      var it = document.createElement('div'); it.className = 'md-li'
      el.appendChild(inlineInto(it, li[1])); continue
    }
    // 引用与分隔线：以前它们会原样显示成 "> 某句话" / "---"，是"密密麻麻"的一部分。
    var bq = /^>\s?(.*)$/.exec(ln)
    if (bq) {
      var qt = document.createElement('div'); qt.className = 'md-bq'
      el.appendChild(inlineInto(qt, bq[1])); continue
    }
    if (/^\s*(?:-{3,}|\*{3,}|_{3,})\s*$/.test(ln)) {
      var hr = document.createElement('div'); hr.className = 'md-hr'
      el.appendChild(hr); continue
    }
    var p = document.createElement('div'); p.className = 'md-p'
    el.appendChild(inlineInto(p, ln))
  }
  return el
}

/* DSH 把「用户贴了一个附件」序列化成一段**信封文本**给模型看：
     <path>C:\…\a.png</path><type>image</type><content>image/png image, 1398x1542 px, 437517 bytes</content>
   这段协议在手机上也原样显示过 —— 用户看到的是 XML 标签（2026-10-22 的
   「Token Router 说明书与印刷 PDF」会话，第一条消息整条都是它）。v1.7.8 解析成
   真正的图片 / 文件卡（同样走 imgNode 的失败兜底），文本里不再留标签。 */
var ENVELOPE_RE = /<path>([\s\S]*?)<\/path>\s*<type>\s*(image|file)\s*<\/type>\s*<content>([\s\S]*?)<\/content>/g
function splitAttachmentEnvelopes(text){
  var images = [], files = []
  var clean = String(text == null ? '' : text).replace(ENVELOPE_RE, function(all, p, kind, meta){
    var path = String(p || '').trim()
    if (!path) return ''
    var info = { path:path, meta:String(meta || '').replace(/\s+/g, ' ').trim() }
    if (kind === 'image') images.push(info)
    else files.push(info)
    return ''
  })
  return {
    text: clean.replace(/\n{3,}/g, '\n\n').replace(/^\s+|\s+$/g, ''),
    images: images,
    files: files
  }
}
function envelopeAttachmentsNode(env){
  var wrap = document.createElement('div'); wrap.className = 'message-attachments'
  var i
  for (i = 0; i < env.images.length; i++) {
    var a = env.images[i]
    var node = imgNode(fileUrlFor(a.path), baseName(a.path))
    if (a.meta) node.title = (node.title ? node.title + ' · ' : '') + a.meta
    wrap.appendChild(node)
  }
  for (i = 0; i < env.files.length; i++) {
    var f = env.files[i]
    wrap.appendChild(fileCard(fileUrlFor(f.path), baseName(f.path), '文件'))
  }
  return wrap.children.length ? wrap : null
}

function bubNode(text, opts){

  var wrap = document.createElement('div'); wrap.className = 'bubwrap'
  var b = document.createElement('div')
  b.className = 'bub'
  var s = String(text == null ? '' : text)
  var env = splitAttachmentEnvelopes(s)
  if (env.images.length || env.files.length) s = env.text
  var attach = envelopeAttachmentsNode(env)
  if (attach) b.appendChild(attach)
  var parts = s.split('```')
  if (parts.length > 1) {
    for (var i = 0; i < parts.length; i++) {
      if (i % 2 === 0) {
        var plain = parts[i].replace(/^\n+|\n+$/g, '')
        if (plain.trim()) blocksInto(b, plain)
      } else {
        var seg = parts[i]
        var nl = seg.indexOf('\n')
        var lang = nl >= 0 ? seg.slice(0, nl).trim() : ''
        var body = nl >= 0 ? seg.slice(nl + 1) : seg
        b.appendChild(codeNode(lang, body.replace(/\n+$/, ''), !!o.foldCode))
      }
    }
  } else {
    blocksInto(b, s)
  }
  wrap.appendChild(b)
  if (!o.noFold && s.length > FOLD_CHARS) {
    b.classList.add('fold')
    wrap.appendChild(foldBtn(b, s.length))
  }
  return wrap
}

/** 注入上下文：一行摘要 + 默认 hidden 的原文。
 *  和工具卡的折叠同一条原则：收起时正文真的不在可视树里（hidden），
 *  但一个字都不删 —— 点开就能读，复制/选区的行为也和普通气泡一致。 */
function injectionNode(it){
  var wrap = document.createElement('div'); wrap.className = 'bubwrap injwrap'
  var open = !!it.injOpen
  var head = document.createElement('button')
  head.type = 'button'; head.className = 'injhead'
  head.setAttribute('aria-expanded', open ? 'true' : 'false')
  head.setAttribute('aria-label', (open ? '收起' : '展开') + '注入上下文（' + it.injected + '）')

  var ic = document.createElement('span'); ic.className = 'ic'
  ic.appendChild(iconSvg(ICON_CTX))
  head.appendChild(ic)

  var tag = document.createElement('span'); tag.className = 'tag'
  tag.textContent = it.injected || '注入内容'
  head.appendChild(tag)

  var cnt = document.createElement('span'); cnt.className = 'cnt'
  cnt.textContent = '约 ' + String(it.text).length + ' 字'
  head.appendChild(cnt)

  var act = document.createElement('span'); act.className = 'act'
  var actTxt = document.createElement('span')
  actTxt.textContent = open ? '收起' : '展开'
  act.appendChild(actTxt)
  act.appendChild(iconSvg(ICON_CHEV))
  head.appendChild(act)

  var body = bubNode(it.text, { noFold:true })
  body.hidden = !open

  head.addEventListener('click', function(){
    it.injOpen = !it.injOpen
    body.hidden = !it.injOpen
    head.setAttribute('aria-expanded', it.injOpen ? 'true' : 'false')
    head.setAttribute('aria-label', (it.injOpen ? '收起' : '展开') + '注入上下文（' + it.injected + '）')
    actTxt.textContent = it.injOpen ? '收起' : '展开'
  })

  wrap.appendChild(head)
  wrap.appendChild(body)
  return wrap
}
function toolNode(it){
  // 收起 = 默认。it.collapsed 只由用户点击改写；markTool 只改 status，
  // 所以 pending → ok/no 的重渲染会照原样恢复展开/收起。
  var collapsed = it.collapsed !== false
  var d = document.createElement('div')
  d.className = 'tool ' + (it.status === 'run' ? 'run' : it.status === 'no' ? 'no' : 'ok') + (collapsed ? '' : ' open')

  var label = toolLabel(it.name)
  var statusTxt = it.status === 'run' ? '进行中' : (it.status === 'no' ? '失败' : '完成')
  var hasBody = !!it.hint
  var lineCount = hasBody ? String(it.hint).split('\n').length : 0
  var head = document.createElement(hasBody ? 'button' : 'div')
  head.className = 'th'
  if (hasBody) {
    head.type = 'button'
    head.setAttribute('aria-expanded', collapsed ? 'false' : 'true')
    // 摘要在收起态**不出现命令正文**；读屏拿到的是工具名 + 状态 + 时间 + 行数。
    head.setAttribute('aria-label', (collapsed ? '展开完整内容：' : '收起完整内容：') +
      label + ' · ' + statusTxt + (it.time ? ' · ' + hhmm(it.time) : '') +
      (lineCount ? ' · ' + lineCount + ' 行' : ''))
    head.title = label + ' · ' + statusTxt
  }

  if (it.status === 'run') {
    var sp = document.createElement('span'); sp.className = 'sp'; head.appendChild(sp)
  } else {
    // 状态图标同样用 SVG —— 字符 ✓ ✕ 在不同字体下粗细和垂直位置都不一样。
    var ic = document.createElement('span')
    ic.className = 'ti'
    ic.appendChild(iconSvg(it.status === 'no' ? ICON_FAIL : ICON_OK))
    head.appendChild(ic)
  }
  var nm = document.createElement('span'); nm.className = 'n'; nm.textContent = toolLabel(it.name)
  head.appendChild(nm)
  if (it.time) {
    var tm = document.createElement('span'); tm.className = 'tm'; tm.textContent = hhmm(it.time)
    head.appendChild(tm)
  }
  // 「N 行」：展开前就知道这块有多长，比「展开」两个字有用。
  if (lineCount) {
    var ln = document.createElement('span'); ln.className = 'lines'
    ln.textContent = lineCount + ' 行'
    head.appendChild(ln)
  }

  var body = null
  if (hasBody) {
    var ch = document.createElement('span'); ch.className = 'ch'
    ch.appendChild(iconSvg(ICON_CHEV))
    head.appendChild(ch)

    body = document.createElement('div')
    body.className = 'tb'
    body.hidden = collapsed

    var a = document.createElement('div'); a.className = 'a'
    var codeEl = document.createElement('code'); codeEl.textContent = it.hint
    a.appendChild(codeEl)
    body.appendChild(a)

    // 复制的是**完整原文**，不是摘要。按钮留在展开后的正文块里。
    var acts = document.createElement('div'); acts.className = 'acts'
    var cp = document.createElement('button')
    cp.type = 'button'; cp.className = 'more'
    cp.setAttribute('aria-label','复制这条命令')
    cp.textContent = '复制'
    cp.addEventListener('click', function(){ copyText(it.hint, cp) })
    acts.appendChild(cp)
    body.appendChild(acts)

    head.addEventListener('click', function(){
      it.collapsed = !it.collapsed
      body.hidden = it.collapsed
      d.classList.toggle('open', !it.collapsed)
      head.setAttribute('aria-expanded', it.collapsed ? 'false' : 'true')
      head.setAttribute('aria-label', (it.collapsed ? '展开完整内容：' : '收起完整内容：') +
        label + ' · ' + statusTxt + (it.time ? ' · ' + hhmm(it.time) : '') +
        (lineCount ? ' · ' + lineCount + ' 行' : ''))
    })
  }

  d.appendChild(head)
  if (body) d.appendChild(body)
  return d
}
/** 连续工具调用的分组阈值：连续 ≥3 个才收成一组，1~2 个直接平铺（收起反而多一次点击）。 */
var TOOL_GROUP_MIN = 3

/** 取 idx 所在的"连续工具段"。返回 null 表示这段不够长、不该分组。 */
function toolRunAt(idx){
  if (idx < 0 || idx >= S.items.length || S.items[idx].kind !== 'tool') return null
  var start = idx, end = idx
  while (start > 0 && S.items[start - 1].kind === 'tool') start--
  while (end + 1 < S.items.length && S.items[end + 1].kind === 'tool') end++
  if (end - start + 1 < TOOL_GROUP_MIN) return null
  return { start: start, end: end }
}

/** 把一段连续工具调用收成一行摘要。
 *
 *  默认展开还是收起，按状态定（这是"小白也看得懂"的关键，不是装饰）：
 *    有步骤在跑 → 默认展开，看得见进度
 *    有失败      → 默认展开，**失败绝不能被折叠藏起来**
 *    全部完成    → 默认收起成一行，把屏幕让给对话
 */
function groupNode(run){
  var items = S.items.slice(run.start, run.end + 1)
  var running = 0, failed = 0
  for (var i = 0; i < items.length; i++) {
    if (items[i].status === 'run') running++
    else if (items[i].status === 'no') failed++
  }
  var opened = running > 0 || failed > 0

  var box = document.createElement('div')
  box.className = 'toolgroup' + (running ? ' busy' : failed ? ' bad' : '')

  var head = document.createElement('button')
  head.type = 'button'
  head.className = 'gh'
  head.setAttribute('aria-expanded', opened ? 'true' : 'false')

  var dot = document.createElement('span'); dot.className = 'dot'
  head.appendChild(dot)

  var sum = document.createElement('span'); sum.className = 'sum'
  var strong = document.createElement('b'); strong.textContent = items.length + ' 个步骤'
  sum.appendChild(strong)
  sum.appendChild(document.createTextNode(
    running ? ' · ' + running + ' 项进行中'
      : failed ? ' · ' + failed + ' 项失败'
        : ' · 全部完成'))
  head.appendChild(sum)

  var ch = document.createElement('span')
  ch.innerHTML = ICON_CHEV                       // 文件内常量，非模型文本
  var csvg = ch.firstChild
  if (csvg && csvg.setAttribute) csvg.setAttribute('class', 'ch')
  head.appendChild(ch)

  var body = document.createElement('div')
  body.className = 'gb'
  for (var k = 0; k < items.length; k++) body.appendChild(toolNode(items[k]))
  body.hidden = !opened

  head.addEventListener('click', function () {
    var collapsing = !body.hidden
    body.hidden = collapsing
    head.setAttribute('aria-expanded', collapsing ? 'false' : 'true')
  })

  box.appendChild(head)
  box.appendChild(body)
  return box
}

function messageMeta(it){
  var who = it.kind === 'user'
    ? (it.injected || '你')
    : (it.interrupted ? '助手 · 已中断' : '助手')
  var bits = [who]
  if (it.time) bits.push(hms(it.time))
  if (it.kind === 'assistant' && it.durationMs > 0) bits.push('用时 ' + fmtDuration(it.durationMs))
  return bits.join(' · ')
}

/** 找「视觉上」的上一条：只看对话时工具行与注入上下文都不渲染，分组要把它们跳过去。 */
function prevVisibleItem(idx){
  var i = idx - 1
  if (S.chatOnly) {
    while (i >= 0 && (S.items[i].kind === 'tool' || S.items[i].injected)) i--
  }
  return i >= 0 ? S.items[i] : null
}

function nodeFor(it, idx){
  var r = rowNode(it.kind === 'user' ? 'me' : 'ai')
  r.setAttribute('data-i', String(idx))
  if (it.kind !== 'tool') {
    // 消息分组：同一发送者连续多条 → 组内 8px、只在组首留时间 meta；
    // 换发送者 → 组间 24px。工具步骤不算「发送者」，它们前后沿用默认 12px。
    var prev = prevVisibleItem(idx)
    var same = prev && prev.kind === it.kind && !it.injected && !prev.injected
    if (same) r.classList.add('group-next')
    else if (prev && prev.kind !== 'tool') r.classList.add('group-first')
  }
  if (it.kind === 'tool') { r.appendChild(toolNode(it)); return r }
  var files = messageAttachmentsNode(it.attachments)
  if (files) r.appendChild(files)
  if (it.text) {
    if (it.injected) r.appendChild(injectionNode(it))
    // 用户气泡里的代码转储（>3 行）默认折 3 行；助手正文不动 —— 那是要读的内容。
    else r.appendChild(bubNode(it.text, it.kind === 'user' ? { foldCode:true } : null))
  }
  var m = document.createElement('div')
  m.className = 'meta'
  m.textContent = messageMeta(it)
  r.appendChild(m)
  return r
}

/** 分组外面那层 .row：data-i 用这一段工具的**起点**（增量更新靠它定位），
 *  另挂一个 data-g 标记"这是一行分组"，好和单条工具卡区分开。 */
function groupRow(run){
  var r = rowNode('ai')
  r.setAttribute('data-i', String(run.start))
  r.setAttribute('data-g', String(run.start))
  r.appendChild(groupNode(run))
  return r
}

/** 全量重建：只在开场快照时用。 */
function renderAll(){
  // data-session 是"这一屏属于哪个会话"的唯一凭据：自检和排障都读它，
  // 任何异步回包覆盖之前，先看它还是不是当前会话。
  log.setAttribute('data-session', String(S.sessionId || ''))
  log.innerHTML = ''
  if (!S.items.length && S.chatReady) { renderEmpty(); return }
  var frag = document.createDocumentFragment()
  for (var i = 0; i < S.items.length; i++) {
    var item = S.items[i]
    if (S.chatOnly && (item.kind === 'tool' || item.injected)) continue
    if (item.kind === 'tool') {
      var run = toolRunAt(i)
      if (run) {
        frag.appendChild(groupRow(run))
        i = run.end                 // 这一段已经收进分组，跳过剩下的
        continue
      }
    }
    frag.appendChild(nodeFor(item, i))
  }
  log.appendChild(frag)
  // 「只看对话」把工具步骤全藏掉时，可能一行都不剩：给一句说明，不留白屏。
  if (S.chatOnly && !log.children.length && S.chatReady) {
    var note = document.createElement('div')
    note.className = 'note'
    note.textContent = '这个会话目前只有工具步骤 · 在「对话」抽屉里关掉「只看对话」可查看'
    log.appendChild(note)
  }
  renderPending()
  toBottom()
}

/** 排版 / 会话隔离自检（v1.7.6）。
 *
 *  为什么把它放进页面而不是只写测试脚本：手机上的真实溢出只在真机的视口、
 *  字体、安全区下出现；把断言暴露成一个函数，真机连 USB / 用 CDP 就能跑同一套。
 *  只读 DOM 与 S，不写任何状态，失败也不抛错。
 *
 *  用法：twSelfCheck() → { ok, width, checks:[{name,ok,detail}] }
 */
function twSelfCheckRun(){
  var checks = []
  function ck(name, ok, detail){
    checks.push({ name:name, ok:!!ok, detail:String(detail == null ? '' : detail).slice(0, 240) })
  }
  var vw = Math.round(window.innerWidth)
  var doc = document.documentElement, body = document.body
  var box = $('log')
  ck('document.scrollWidth ≤ innerWidth', doc.scrollWidth <= vw + 1, doc.scrollWidth + ' / ' + vw)
  ck('body.scrollWidth ≤ innerWidth', body.scrollWidth <= vw + 1, body.scrollWidth + ' / ' + vw)
  if (box) {
    ck('对话容器无横向滚动', box.scrollWidth <= box.clientWidth + 1, box.scrollWidth + ' / ' + box.clientWidth)
    ck('只显示当前会话', String(box.getAttribute('data-session') || '') === String(S.sessionId || ''),
      (box.getAttribute('data-session') || '(空)') + ' vs ' + (S.sessionId || '(空)'))
    // 内容块不许越出对话区的左右边界。.code pre / .tablewrap 内部可以自己滚，
    // 所以这里只看容器盒，不看它们的 scrollWidth —— 那正是"允许横滑"的地方。
    var r0 = box.getBoundingClientRect()
    var nodes = box.querySelectorAll('.row,.bubwrap,.bub,.tool,.toolgroup,.md-table,.tablewrap,.filecard,.message-attachments')
    var spill = []
    for (var i = 0; i < nodes.length; i++) {
      var r = nodes[i].getBoundingClientRect()
      if (!r.width && !r.height) continue
      if (r.left < r0.left - 0.5 || r.right > r0.right + 0.5) {
        spill.push((nodes[i].className || nodes[i].tagName) + ' ' + Math.round(r.left) + '–' + Math.round(r.right))
      }
    }
    ck('内容块不越出对话区', spill.length === 0, spill.slice(0, 3).join(' | '))
    // 左基线：助手正文 / 流式行 / 工具卡三者左缘必须一致（v1.7.6 的核心排版约束）。
    var edges = []
    var bub = box.querySelector('.row.ai > .bubwrap')
    if (bub) edges.push(['正文', bub.getBoundingClientRect().left])
    var st = box.querySelector('.row.stream > .bubwrap')
    if (st) edges.push(['流式', st.getBoundingClientRect().left])
    var tool = box.querySelector('.row.ai > .tool,.row.ai > .toolgroup')
    if (tool) edges.push(['工具', tool.getBoundingClientRect().left])
    var same = true
    for (var e = 1; e < edges.length; e++) if (Math.abs(edges[e][1] - edges[0][1]) > 1) same = false
    ck('助手正文/流式/工具卡同一左基线', same,
      edges.map(function(x){ return x[0] + ':' + Math.round(x[1]) }).join(' '))
    // 助手内容一律左对齐（用户气泡允许右对齐，不在此列）。
    var leftAligned = true
    var texts = box.querySelectorAll('.row.ai .bub,.row.stream .bub,.row.ai .tool,.row.ai .toolgroup')
    for (var t = 0; t < texts.length; t++) {
      if (getComputedStyle(texts[t]).textAlign !== 'left') leftAligned = false
    }
    ck('助手内容 text-align:left', leftAligned, texts.length + ' 个节点')
  }
  // 切会话残留：拿上一次会话最后一条正文的前 48 字去当前 DOM 里找。
  if (S.prevSessionId && S.prevSessionId !== S.sessionId && S.prevSessionSample) {
    var has = box ? box.textContent.indexOf(S.prevSessionSample) >= 0 : false
    ck('切会话后 DOM 不含上一会话正文', !has, has ? ('残留：' + S.prevSessionSample.slice(0, 24)) : '干净')
  }
  var ok = true
  for (var k = 0; k < checks.length; k++) if (!checks[k].ok) ok = false
  var out = { ok:ok, width:vw, session:S.sessionId, checks:checks }
  try { window.__twSelfCheck = out } catch (e) {}
  return out
}
try { window.twSelfCheck = twSelfCheckRun } catch (e) {}

/** 增量：按序号**就地替换**那一条。
 *
 *  S.items 只可能"尾部追加"或"原地改状态"（工具结果会把对应那张卡从进行中改成
 *  完成），所以序号是稳定的 —— 用 data-i 定位旧节点替换即可。
 *  早先的版本靠"最后一张卡的标签是否相同"来判断该替换哪张，脆弱且会插错；
 *  实测一次带工具调用的对话就能看出来，所以改成了按序号。
 */
function renderAt(idx){
  if (idx < 0 || idx >= S.items.length) return
  // 「只看对话」期间工具与注入上下文不进 DOM —— 但状态仍在 S.items 里照常更新，
  // 关掉开关后 renderAll() 会把它们按真实顺序补回来。
  if (S.chatOnly && (S.items[idx].kind === 'tool' || S.items[idx].injected)) return
  if (log.querySelector('.empty')) log.innerHTML = ''
  var stick = nearBottom()

  // 工具条目可能属于一个分组：那时要整段重建，而不是只换这一条。
  var run = S.items[idx].kind === 'tool' ? toolRunAt(idx) : null
  if (run) {
    var head = log.querySelector('.row[data-g="' + run.start + '"]')
    if (head) {
      head.replaceWith(groupRow(run))
    } else {
      // 这一段里可能已经单独渲染过几行（刚够格成组的那一刻），先清掉再插入 ——
      // 否则会出现「分组 + 残留旧行」同时挂在页面上，同一批步骤显示两遍。
      for (var j = run.start; j <= run.end; j++) {
        var stray = log.querySelector('.row[data-i="' + j + '"]')
        if (stray && !stray.getAttribute('data-g')) stray.remove()
      }
      var after = log.querySelector('.row[data-i="' + (run.end + 1) + '"]')
      var row = groupRow(run)
      if (after) log.insertBefore(row, after)
      else { log.appendChild(row); noteIncoming() }
    }
    renderPending()
    if (stick) toBottom()
    return
  }

  var n = nodeFor(S.items[idx], idx)
  var old = log.querySelector('[data-i="' + idx + '"]')
  if (old) old.replaceWith(n)
  else {
    log.appendChild(n)
    // 只有新追加的消息才淡入；替换（工具状态变化、流式收尾）不重放。
    if (S.items[idx].kind !== 'tool') {
      n.classList.add('enter')
      setTimeout(function(){ n.classList.remove('enter') }, 200)
    }
    noteIncoming()
  }
  renderPending()
  if (stick) toBottom()
}

function renderEmpty(){
  log.innerHTML = ''
  var d = document.createElement('div')
  d.className = 'empty'
  // 空状态放 DSH 的虎鲸标。第一眼看不出"这是给谁用的"是最贵的成本，
  // 而一个 logo 比一句解释快得多。用 /taskwatch/icon-192.png ——
  // 中继和宿主都提供它，不额外引入一次请求。
  var logo = document.createElement('img')
  logo.className = 'brand'
  logo.src = '/taskwatch/icon-192.png'
  logo.alt = ''
  d.appendChild(logo)
  var h2 = document.createElement('h2'); h2.textContent = '在这里跟我说话就行'
  var p = document.createElement('p')
  p.innerHTML = '我会在这台电脑上干活，进度直接显示在这里。<br>想看还有几个任务在跑，点上面的状态条。'
  d.appendChild(h2); d.appendChild(p)
  var box = document.createElement('div'); box.className = 'chips'
  var says = ['现在什么情况？', '还有几个任务在跑？', '帮我看一下有没有卡住的地方']
  for (var i = 0; i < says.length; i++) {
    var c = document.createElement('button')
    c.className = 'chip'
    c.textContent = says[i]
    c.setAttribute('data-say', says[i])
    box.appendChild(c)
  }
  d.appendChild(box)
  log.appendChild(d)
  var cs = d.querySelectorAll('.chip')
  for (var k = 0; k < cs.length; k++) {
    cs[k].addEventListener('click', function(){ send(this.getAttribute('data-say')) })
  }
}

/** 已发出但还没落进日志的气泡：让"点了发送"立刻有反馈。 */
function renderPending(){
  // 会话页问答条跟着会话重绘走：它不属于对话正文，但必须与正文同一帧更新。
  renderSessionAsk()
  var old = log.querySelector('.row.pending')
  if (old) old.remove()
  if (!S.pending && !S.pendingAttachments.length) return
  var r = rowNode('me')
  r.classList.add('pending')

// ---------------------------------------------------------------------------
// 连接与重连（v1.8.4，P2）
//
// 三件事共用一套「退避 + 单飞」规则，不再各写一份：
//   1. /taskwatch/data 快照轮询；
//   2. 会话事件流（EventSource，逐字跟随）；
//   3. 审批 / 提问事件流。
//
// 为什么不能交给浏览器 EventSource 自带的自动重连：它的间隔不可见、不可调，
// 页面无法在 document.hidden 时暂停，也没法在 online / visible 时立刻重试；
// 而手机切网、锁屏回来恰恰是这两个信号最可靠。所以这里自己关、自己排期。
//
// 退避序列固定 1s → 2s → 5s → 10s → 30s（每档 ±20% 抖动，封顶 30s）；
// 失败期间不允许固定 5 秒轮询再叠一次，所有入口都先过 NET.inflight。
// ---------------------------------------------------------------------------
var BACKOFF_STEPS = [1000, 2000, 5000, 10000, 30000]
function backoffDelay(attempt){
  var base = BACKOFF_STEPS[Math.min(Math.max(attempt, 1) - 1, BACKOFF_STEPS.length - 1)]
  var jitter = base * 0.2
  var ms = Math.round(base + (Math.random() * 2 - 1) * jitter)
  // 抖动后仍保持严格单调：1.0s < 1.6s < 4s < 8s < 24s；末档按任务书 30s 封顶。
  return Math.max(1000, Math.min(30000, ms))
}
function pageHidden(){
  return document.hidden === true || document.visibilityState === 'hidden'
}
var NET = {
  pollMs: 5000,
  // 「陈旧」= 3 个轮询周期（15 秒）没有一次成功。这个门槛和 tick 共用，
  // 以后把 pollMs 调快/调慢，提示的迟到时间会跟着一起变。
  staleMs: 15000,
  bootAt: Date.now(),
  lastOkAt: 0,
  inflight: false,
  promise: null,
  attempts: 0,        // 连续失败次数（退避序号）
  reconnects: 0,      // 本次加载里自动重试过多少次（成功后不清零）
  nextAt: 0,          // 下一次允许自动重试的墙钟时间
  retryTimer: 0,
  history: [],        // 实际用过的退避毫秒数（自检用）
  offline: (navigator.onLine === false),
  failure: '',
  sse: { attempts: 0, reconnects: 0, history: [] }

function netAge(){
  var t = NET.lastOkAt || NET.bootAt
  return Math.max(0, Date.now() - t)
}
function netStale(){
  return netAge() > NET.staleMs
}
function netAgoText(){
  if (!NET.lastOkAt) return ''
  var s = Math.floor(netAge() / 1000)
  if (s <= 1) return '1 秒前'
  if (s < 60) return s + ' 秒前'
  var m = Math.floor(s / 60)
  if (m < 60) return m + ' 分钟前'
  return Math.floor(m / 60) + ' 小时前'
}

/** 一条自管生命周期的 EventSource。
 *  - 出错先 close，再按退避重开（不叠加浏览器自己的重试）；
 *  - hidden 时不排期、不重开，visible 后由调用方 resume；
 *  - 只有真正 onopen 才算恢复，失败一律继续退避。 */
function makeLink(opts){
  var L = {
    url: opts.url, sid: opts.sid || '', es: null, timer: 0,
    attempts: 0, reconnects: 0, history: [], nextAt: 0,
    stopped: false, paused: false, everOpen: false
  }
  function schedule(){
    if (L.stopped || L.paused || pageHidden() || NET.offline) return
    var d = backoffDelay(L.attempts)
    L.history.push(d)
    if (L.history.length > 8) L.history.shift()
    NET.sse.history.push(d)
    if (NET.sse.history.length > 12) NET.sse.history.shift()
    L.nextAt = Date.now() + d
    clearTimeout(L.timer)
    L.timer = setTimeout(function(){ L.timer = 0; L.start(true) }, d)
  }
  L.start = function(force){
    if (L.es || L.stopped || pageHidden()) return
    if (!force && L.attempts > 0 && Date.now() < L.nextAt) return
    clearTimeout(L.timer); L.timer = 0
    try {
      L.es = new EventSource(L.url)
    } catch (e) {
      L.attempts++; L.reconnects++; NET.sse.reconnects++
      if (opts.onerror) opts.onerror()
      schedule()
      return
    }
    var es = L.es
    es.onopen = function(){
      if (es !== L.es) return
      L.attempts = 0
      L.nextAt = 0
      if (L.everOpen) L.reconnects++
      L.everOpen = true
      if (opts.onopen) opts.onopen()
    }
    es.onerror = function(){
      if (es !== L.es) return
      try { es.close() } catch (e) {}
      L.es = null
      L.attempts++
      L.reconnects++
      NET.sse.attempts++
      NET.sse.reconnects++
      if (opts.onerror) opts.onerror()
      schedule()
    }
    es.onmessage = function(msg){
      if (es !== L.es) return
      if (opts.onmessage) opts.onmessage(msg)
    }
    if (opts.events) {
      for (var t in opts.events) {

  L.pause = function(){
    L.paused = true
    clearTimeout(L.timer); L.timer = 0
  }
  L.resume = function(force){
    L.paused = false
    L.stopped = false
    L.nextAt = 0
    L.start(force !== false)
  }

    L.stopped = true
    L.paused = true
    clearTimeout(L.timer); L.timer = 0
    if (L.es) { try { L.es.close() } catch (e) {} L.es = null }

}

  if (S.agentView) { loadAgentTranscript(); return }
  var mine = ++SEQ
  var sid = S.sessionId
  var link = makeLink({
    url: '/taskwatch/chat/stream?sessionId=' + encodeURIComponent(sid),
    sid: sid,
    onopen: function(){
      if (mine !== SEQ || sid !== S.sessionId) return
      S.esOpen = true
      S.esError = false
      S.lastFrameAt = Date.now()

      S.esEverOpen = true
      setSub('')
      renderNet()
    },
    // 错误由 makeLink 统一 close + 退避；这里只更新页面状态。
    onerror: function(){
      if (mine !== SEQ || sid !== S.sessionId) return
      S.esOpen = false
      S.esError = true
      setSub('连接已断开，正在重连…')
      renderNet()
    },
    onmessage: function(msg){
      // 双保险：SEQ 拦「同一页面里又开了一条」，sid 拦「会话已经换了」。
      // 后者是 EventSource 关闭前最后一帧仍可能排队进来的窗口 —— 只靠 SEQ 时，
      // 极端时序下旧帧会落进新会话，这正是"切会话还残留上一条"的来源。
      if (mine !== SEQ || sid !== S.sessionId) return
      S.esOpen = true
      S.lastFrameAt = Date.now()

      try { f = JSON.parse(msg.data) } catch (e) { return }
      if (!f) return
      if (f.type === 'snapshot') { applySnapshot(f, sid); setSub(''); return }
      if (f.type === 'event') { acceptEvent(f.event, sid); return }
      if (f.type === 'assistant-stream') {
        var fr = f.frame
        if (fr && fr.type === 'start') { S.running = true; syncSend() }
        else if (fr && fr.type === 'end') { finishStreaming(undefined, sid) }
        else if (fr && fr.type === 'chunk' && fr.chunk
                 && fr.chunk.type === 'text-delta' && typeof fr.chunk.text === 'string') {
          streamText(fr.chunk.text, sid)
          if (!S.running) { S.running = true; syncSend() }
        }
        return
      }
      if (f.type === 'taskwatch-error') { setSub('出错：' + (f.message || '')); return }
    }
  })

  link.start(true)
  S.es = link.es
}

 *  稳定 / 重连中 / 离线；灰点只留给「还没有会话」这种未知态。
 *  绿点不展开文字（标题行宽度付不起），黄/红会展开成带字的胶囊，

  }

    return {
      state:'yellow', text:'重连中',
