function setView(v){
  var home = v === 'home'
  S.home = home
  var h = $('home')
  if (h) h.hidden = !home
  log.hidden = home
  var foot = document.querySelector('footer')
  if (foot) foot.hidden = home
  var tb = $('tobottom')
  if (tb && home) tb.hidden = true
  // header 最左边那颗按钮在两种视图里是两件事：全部会话 / 返回首页。
  // 注意：这两个图标是 <svg>，不是 HTMLElement —— `el.hidden = true` 只会在
  // 对象上挂一个属性，既不改 DOM 也不改样式，必须走 setAttribute。
  var icon = $('sessBtn')
  var menu = $('sessMenuIco'), back = $('sessBackIco')
  if (menu) { if (home) menu.removeAttribute('hidden'); else menu.setAttribute('hidden', '') }
  if (back) { if (home) back.setAttribute('hidden', ''); else back.removeAttribute('hidden') }
  if (icon) icon.setAttribute('aria-label', home ? '全部会话' : '返回首页')
  if (home) {
    renderHome()
    renderSubagentBar()
  } else {
    // 从首页直接落到 #session/<id>（深链接 / 刷新 / 返回手势）时，selectSession
    // 可能因为「已经是这个会话」而提前返回；标题位必须在这里补回来，否则会话页
    // 顶上还挂着首页的「在等你 N 件」。
    if (S.title) $('sessTitle').textContent = S.title
    renderSubagentBar()
    if (S.sessionId) { renderAll() }
  }
  // 状态胶囊的文案随视图变（首页是「点按看全部任务」，会话页是「N 件事待你处理」），
  // 两种视图都刷一次，别让它挂着上一个视图的说法等到下一次轮询。
  syncStatus()
  // 问答条只属于会话页：切回首页时必须收起，否则会压住首页底部。
  if (home && $('askBar')) $('askBar').hidden = true
  renderSessionAsk()
}

/** 用户动作：进某个会话。首页进来压一条历史，会话之间换只替换当前条目。 */
function openSession(id, opts){
  id = String(id || '')
  if (!id) return
  var o = opts || {}
  var hash = '#session/' + encodeURIComponent(id)
  var agent = !!o.agent || (!o.root && isSubAgentId(id))
  if (S.home) {
    try { history.pushState({ tw:'session', id:id }, '', hash) } catch (e) { location.hash = hash }
    NAV_DEPTH = 1
  } else if (String(location.hash || '') !== hash) {
    try { history.replaceState({ tw:'session', id:id }, '', hash) } catch (e) { location.hash = hash }
  }
  setView('session')
  if (S.sessionId === id && !S.viewingAgent) { renderSubagentBar(); return }
  if (agent) selectSession(id, { agent:true })
  else selectSession(id, { root:true })
}

/** 回到首页。有自己压上去的那条历史就用返回（系统返回手势走的是同一条路），
 *  没有（深链接 / 刷新）就替换成无 hash 的地址。 */
function goHome(){
  if (NAV_DEPTH > 0) {
    NAV_DEPTH = 0
    try { history.back(); return } catch (e) { /* 下面走替换 */ }
  }
  if (String(location.hash || '')) {
    try { history.replaceState({ tw:'home' }, '', location.pathname + location.search) } catch (e) { location.hash = '' }
  }
  applyRoute()
}

function applyRoute(){
  var r = currentRoute()
  if (r.view === 'devices') {
    showDevices()
    return
  }
  // 离开设备页：先收起整屏，再按原路由落地（不改变底层是首页还是会话页）。
  var dv = $('devicesView')
  if (dv) dv.hidden = true
  if (r.view === 'list') {
    // 列表页盖在**主对话**上：先把会话切回根会话，再显示列表。
    if (!S.sessionId) { setView('home'); return }
    setView('session')
    if (S.viewingAgent || isSubAgentId(S.sessionId)) {
      var root = S.rootId || firstRootId()
      S.viewingAgent = ''
      if (root && root !== S.sessionId) selectSession(root, { root:true })
    }
    showSubagentsList()
    return
  }
  hideSubagentsList()
  if (r.view === 'agent') {
    setView('session')
    if (!r.id) { restoreRoot(); return }
    if (S.sessionId !== r.id) selectSession(r.id, { agent:true })
    else { S.viewingAgent = r.id; renderSubagentBar() }
    return
  }
  if (r.view === 'session') {
    if (!r.id) { setView('home'); return }
    setView('session')
    if (S.sessionId === r.id && !S.viewingAgent) { renderSubagentBar(); return }
    if (isSubAgentId(r.id)) selectSession(r.id, { agent:true })
    else selectSession(r.id, { root:true })
    return
  }
  // 无 hash = 首页。停在子代理里的话先退回根会话，首页不显示二级视图。
  if (S.viewingAgent || isSubAgentId(S.sessionId)) restoreRoot()
  setView('home')
}
/** 演示页与测试用的直入口：切到某个会话并进入会话视图（不改地址、不压历史）。 */
function showSession(id, opts){
  setView('session')
  selectSession(id, opts || {})
}
function openSubagents(){
  if (String(location.hash || '') === '#subagents') { showSubagentsList(); return }
  location.hash = '#subagents'
  showSubagentsList()          // hashchange 稍后才到，先给一指的即时反馈
}
function openSubagent(id){
  if (!id) return
  hideSubagentsList()
  var next = '#subagents/' + encodeURIComponent(id)
  if (String(location.hash || '') !== next) location.hash = next
  applyRoute()
}
function closeSubagents(){
  if (String(location.hash || '').indexOf('#subagents') === 0) {
    location.hash = ''
    applyRoute()
  } else {
    hideSubagentsList()
  }
}
function backToMain(){
  S.viewingAgent = ''
  if (String(location.hash || '')) location.hash = ''
  restoreRoot()
}

// ---------------------------------------------------------------------------
// 状态轮询（复用只读的 /taskwatch/data）
// ---------------------------------------------------------------------------
var lastData = null, TIMER = null
// 手机端审批：倒计时定时器与「手机在线」的 SSE。页面隐藏时一起收掉，
// 让宿主立刻知道手机不在了，审批不必空等满 120 秒。
var APPROVAL_TIMER = 0, APPROVAL_LINK = null
function startApprovalStream(){
  if (typeof EventSource === 'undefined') return
  if (location.protocol !== 'http:' && location.protocol !== 'https:') return
  if (APPROVAL_LINK) { APPROVAL_LINK.resume(true); return }
  APPROVAL_LINK = makeLink({
    url: '/taskwatch/approvals/stream',
    // v1.8.3：同一条流上的提问事件。答案是页面提交的，等的是宿主那边
    // 被桌面先处理 / 超时交还，所以收到就重取一次状态。
    events: {
      approval: function(){ tick() },
      question: function(){ tick() }
    },
    onopen: function(){ renderNet() },
    onerror: function(){ renderNet() }
  })
  APPROVAL_LINK.start(true)
}
function stopApprovalStream(){
  if (!APPROVAL_LINK) return
  APPROVAL_LINK.stop()
  APPROVAL_LINK = null
}
/** 一键重试：清掉剩余退避，立刻取一次快照，并让两条事件流马上重开。
 *  点和自动重试走同一个入口，只是 force=true。 */
function retryNow(){
  NET.nextAt = 0
  if (NET.retryTimer) { clearTimeout(NET.retryTimer); NET.retryTimer = 0 }
  if (!pageHidden()) {
    var p = tick(true)
    if (CHAT_LINK) CHAT_LINK.resume(true)
    if (APPROVAL_LINK) APPROVAL_LINK.resume(true)
    else startApprovalStream()
    renderNet()
    return p
  }
  return Promise.resolve()
}
/** 快照轮询的唯一入口。
 *
 *  - 单飞：同一时刻只允许一个 /taskwatch/data 在飞，重复调用直接复用同一个 promise；
 *  - 失败退避：attempts 未清零且还没到 nextAt 时，定时器和 5 秒 tick 都直接跳过，
 *    不会出现「退避之外再按固定周期补一枪」的请求风暴；
 *  - 隐藏不排期：visible 之后由 visibilitychange 强制补一次。 */
async function tick(force){
  // v1.8.7：被撤销后不再取数。切回前台 / 恢复网络的处理器会再调一次 tick，
  // 这里挡住它，避免每 5 秒撞一次 401。
  if (revokedShown()) return
  if (NET.inflight) return NET.promise
  // 页面不可见时不取数、不排期：手机锁屏后既省电，也避免宿主把
  // 「一个还在后台刷新状态的页面」误判成有人在线。
  if (pageHidden()) return
  if (!force) {
    if (NET.offline) return
    if (NET.attempts > 0 && Date.now() < NET.nextAt) return
  } else {
    NET.nextAt = 0
  }
  if (NET.retryTimer) { clearTimeout(NET.retryTimer); NET.retryTimer = 0 }
  NET.inflight = true
  var p = (async function(){
    var ok = false, err = ''
    // fetch 没有默认超时：中继黑洞（TCP 活着但不回包）会让 inflight 永远为真，
    // 退避和 visible 补拉就都失效了。8 秒没结果按一次失败处理，交给退避。
    var ctl = typeof AbortController !== 'undefined' ? new AbortController() : null
    var to = ctl ? setTimeout(function(){ try { ctl.abort() } catch (e) {} }, 8000) : 0
    try {
      var r = await fetch('/taskwatch/data?view=phone', {
        cache:'no-cache', signal: ctl ? ctl.signal : undefined
      })
      // v1.8.7：被撤销的设备从这里开始一律 401。这不是断网，不能进退避重试
      // （重试一晚上也不会好），直接翻到「重新配对」说明屏并停掉轮询。
      if (r.status === 401) {
        var denied = null
        try { denied = await r.json() } catch (e0) { denied = null }
        if (denied && denied.code === 'device-revoked') { showRevoked(); return }
      }
      if (!r.ok) throw new Error('HTTP ' + r.status)
      var d = await r.json()
      // 服务 worker 断网时回的是一份显式的空快照（offline:true + errors[]）。
      // 它不能覆盖「上次读到的好数据」—— 首页要显示的是旧状态 + 一条错误条，
      // 而不是"一切正常、什么都没有"。
      if (homeBroken(d)) {
        err = d.error || (d.errors && d.errors[0]) || '读不到状态'
        lastData = d
        S.httpOk = false
      } else {
        HOME_GOOD = d
        HOME_GOOD_AT = Date.now()
        lastData = d
        S.httpOk = true
        ok = true
      }
    } catch (e) {
      err = (e && e.name === 'AbortError') ? '请求超时' : ((e && e.message) || '网络错误')
      lastData = { error: err }
      S.httpOk = false
    } finally {
      if (to) clearTimeout(to)
    }
    if (ok) {
      NET.attempts = 0
      NET.nextAt = 0
      NET.lastOkAt = Date.now()
      NET.failure = ''
      // 成功后必须清掉可能还挂着的退避定时器，否则它到点会再补一枪，
      // 恰好在「已经恢复」之后制造一次多余请求（自检里表现为 2 个请求）。
      if (NET.retryTimer) { clearTimeout(NET.retryTimer); NET.retryTimer = 0 }
    } else {
      if (NET.attempts === 0) NET.history = []
      NET.attempts++
      NET.reconnects++
      NET.failure = err
      var delay = backoffDelay(NET.attempts)
      NET.history.push(delay)
      if (NET.history.length > 8) NET.history.shift()
      NET.nextAt = Date.now() + delay
      if (!pageHidden() && !NET.offline) {
        NET.retryTimer = setTimeout(function(){
          NET.retryTimer = 0
          // attempts 已被一次手动成功清零时，这个旧定时器不该再发请求。
          if (!pageHidden() && !NET.offline && NET.attempts > 0) tick(true)
        }, delay)
      }
    }
    syncStatus()
    renderNet()
    refreshQueue(true)
    renderHome()
    // 会话页问答条不归 renderHome 管（它只在首页跑），这里单独刷一次。
    renderSessionAsk()
  })()
  NET.promise = p
  try { await p } finally { NET.inflight = false }
}
function startPolling(){
  if (revokedShown()) return
  if (!TIMER) TIMER = setInterval(function(){ tick() }, NET.pollMs)
  startApprovalStream()
}
function stopPolling(){
  if (TIMER) { clearInterval(TIMER); TIMER = null }
  stopApprovalStream()
}

/* ===== 竖屏牌桌：读同源 /dsh-holdem，会话与 CSRF 走响应头 =====
   注意：宿主上这条路由是插件提供的（前缀转发），本页不新增任何路由。 */
var PK = { on: false, sid: '', csrf: '', snap: null, timer: 0, busy: false, seen: '' }
function pkEl(){ return $('poker') }
function pkToast(msg){
  var el = $('pkToast'); if (!el) return
  el.textContent = msg; el.classList.add('on')
  clearTimeout(pkToast.t); pkToast.t = setTimeout(function(){ el.classList.remove('on') }, 2600)
}
function pkHdr(res){
  try {
    var s = res.headers.get('x-holdem-session'); if (s) PK.sid = s
    var c = res.headers.get('x-csrf-token'); if (c) PK.csrf = c
  } catch (e) {}
}
function pkCall(path, body){
  var opt = { method: body ? 'POST' : 'GET', credentials: 'same-origin', headers: {} }
  if (PK.sid) opt.headers['X-Holdem-Session'] = PK.sid
  if (PK.csrf) opt.headers['X-CSRF-Token'] = PK.csrf
  if (body) { opt.headers['content-type'] = 'application/json'; opt.body = JSON.stringify(body) }
  return fetch('/dsh-holdem' + path, opt).then(function(res){
    pkHdr(res)
    return res.text().then(function(t){
      var data = null
      try { data = t ? JSON.parse(t) : null } catch (e) {}
      if (!res.ok) throw new Error((data && (data.message || data.error)) || ('HTTP ' + res.status))
      return data
    })
  })
}
function pkOpen(){
  PK.on = true; pkEl().classList.add('on')
  pkToast('正在连牌桌...')
  pkPoll(0)
}
function pkClose(){
  PK.on = false; pkEl().classList.remove('on')
  clearTimeout(PK.timer); PK.timer = 0
}
function pkDraw(){
  // 渲染出错不能被报成"连不上牌桌"：上次就是这么把界面 bug 伪装成网络问题的。
  try { pkRender(PK.snap) } catch (e) { pkToast('界面出错：' + e.message) }
}
function pkPoll(delay){
  clearTimeout(PK.timer)
  PK.timer = setTimeout(function(){
    if (!PK.on) return
    pkCall('').then(function(s){ PK.snap = s; PK.seen = ''; pkDraw() })
      .catch(function(err){ pkToast('牌桌连不上：' + err.message) })
      .then(function(){ if (PK.on) pkPoll(1800) })
  }, delay || 1800)
}
// 插件下发的牌是 {r:2..14, s:'s'|'h'|'d'|'c'}（src/cards.js:2-3）。
// 真机上直接把 r、s 拼起来就是 "13h 14d" —— 谁在牌桌上看这个都读不出来，
// 所以照插件自家客户端的映射（client.cjs:170-171）翻成 K♥ / A♦。
var PK_RANK = { 14:'A', 13:'K', 12:'Q', 11:'J', 10:'10', 9:'9', 8:'8', 7:'7', 6:'6', 5:'5', 4:'4', 3:'3', 2:'2' }
var PK_SUIT = { s:'♠', h:'♥', d:'♦', c:'♣' }
function pkRankTxt(r){ return r == null ? '' : (PK_RANK[r] != null ? PK_RANK[r] : String(r)) }
function pkSuitTxt(s){ return s == null ? '' : (PK_SUIT[s] != null ? PK_SUIT[s] : String(s)) }
function pkCardText(c){
  // 牌面可能是 "Ah" 这样的字符串，也可能是 {r,s} 这样的对象（真机就是这样）。
  // 这个函数**不允许抛错**：一旦抛，整块渲染中断，牌桌就点不动了。
  if (c == null) return ""
  if (typeof c === "string") return c
  if (typeof c === "number") return String(c)
  if (typeof c !== "object") return "?"
  var r = c.rank != null ? c.rank : (c.value != null ? c.value : (c.v != null ? c.v : (c.r != null ? c.r : null)))
  var s = c.suit != null ? c.suit : (c.s != null ? c.s : (c.symbol != null ? c.symbol : null))
  if (r != null || s != null) return pkRankTxt(r) + pkSuitTxt(s)
  try {
    // 字段名没见过就按值顺序拼出来 —— 宁可显示得难看，也绝不显示 [object Object]。
    return Object.keys(c).map(function(k){ return String(c[k]) }).join("")
  } catch (e) { return "?" }
}
function pkCardList(v){
  if (!v) return []
  if (Array.isArray(v)) return v.map(pkCardText)
  if (typeof v === "string") return v.trim() ? v.trim().split(/\s+/) : []
  return [pkCardText(v)]
}
function pkCard(code, hidden){
  var txt = hidden ? '??' : String(code || '')
  // 红桃/方块标红：牌桌上这是最省一次辨认的约定。
  var cls = 'pk-card' + (hidden ? ' back' : '') + (!hidden && /[♥♦]/.test(txt) ? ' red' : '')
  return '<div class="' + cls + '">' + pkEsc(txt) + '</div>'
}
function pkEsc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c]
  })
}
function pkSeatPos(i){
  // 竖椭圆：0 号在正下方（自己），其余逆时针铺开。
  var pts = [[50,86],[17,68],[17,33],[50,15],[83,33],[83,68]]
  return pts[i % 6]
}
function pkRender(s){
  if (!s) return
  var me = null, i, list = s.players || []
  var legal = s.legal || {}
  var html = '', pos
  for (i = 0; i < list.length; i++){
    var p = list[i] || {}
    pos = pkSeatPos(p.seat == null ? i : p.seat)

    var seatNo = (p.seat == null ? i : p.seat)

    var badge = ''
    if (p.isDealer || i === s.dealer) badge = 'D'
    else if (p.isSb || i === s.sb) badge = 'SB'
    else if (p.isBb || i === s.bb) badge = 'BB'
    var cards = ''
    var pcs = pkCardList(p.cards)
    // 座位里的牌是纯文本（比公共牌小一号），所以红桃/方块要在这里单独标红 ——
    // 公共牌走的是 pkCard()，那里已经有 red 类，两边都要照顾到。
    if (pcs.length) cards = '<div class="cd">' + pcs.map(function(t){
      return '<span class="cdc' + (/[♥♦]/.test(t) ? ' red' : '') + '">' + pkEsc(t) + '</span>'

      (badge ? '<div class="bd">' + badge + '</div>' : '') +

  }

    (s.street ? ' | ' + pkEsc(s.street) : '') + (s.handNo ? ' | 第 ' + pkEsc(s.handNo) + ' 手' : '') +

    // 以前这里标成「你的牌：底牌」，纯属把人绕晕。牌面已经在座位上画出来了。
    (s.heroHand && s.heroHand !== '底牌' ? '<div class="pk-hint">牌型：' + pkEsc(s.heroHand) + '</div>' : '')
  var log = (s.log || []).slice(-3).map(function(l){

  $('pkLog').innerHTML = log
  // 动作区：**只有轮到你**才谈得上"你能做什么"。
  // 快照里的 legal 描述的是**当前行动者**（host.js:231 取 players[state.toAct]），
  // 而那个行动者多半是正在思考的 AI —— 拿它开按钮，就是"按钮亮着、点了没反应"：

  // 插件自家客户端用的判据是 toAct === 0（client.cjs:577），这里照抄同一条。
  var myTurn = s.status === 'playing' && s.toAct === 0
  var can = !PK.busy && myTurn
  var waiting = !can && !s.gameOver
  $('pkFold').disabled = !can || !legal.fold
  // 过牌与跟注共用一个按钮：轮到你时 legal 才是你的（任一合法就该可点）。
  $('pkCheck').disabled = !can || !(legal.check || legal.call)
  $('pkCheck').textContent = legal.check ? '过牌' : (legal.call ? ('跟注 ' + (legal.callAmount || '')) : '过牌')
  var raisable = !!legal.raise

  $('pkAmt').textContent = raisable ? (r.value + '') : ''

function pkAct(action){
  if (PK.busy) return
  // 先自己拦一道。插件对"轮不到你"的动作是**静默 no-op 且照样回 200**，
  // "点了没反应又不说原因"是最难查的一类坏体验：这里当场把原因说清楚。
  var live = PK.snap || {}
  if (!(live.status === 'playing' && live.toAct === 0)) {
    pkToast('还没轮到你，等对手行动')
    return
  }
  var before = { toAct: live.toAct, log: live.log ? live.log.length : 0 }
  PK.busy = true; pkDraw()
  // 插件读的是 type（源码 host.js:922 取 args.type）与 amount；action 只是别名。
  // 它对未知字段是静默忽略的 —— 猜错字段名不报错、只表现为"点了没反应"，
  // 所以两个名字一起发，哪个是它对都能生效。
  var body = { type: action, action: action }
  if (action === 'raise') {
    var v = +$('pkRange').value
    body.amount = v
    body.to = v
  }
  pkCall('/act', body).then(function(s){
    PK.snap = s; pkDraw()
    // 真链路上仍可能"刚好轮到别人"：200 不等于生效，如实说出来，不装作点过了。
    if (s && s.status === 'playing' && s.toAct === before.toAct &&
        (s.log ? s.log.length : 0) === before.log) pkToast('这一下没生效：刚轮到别人')
  })
    // 插件的加注金额字段名若是 to 而不是 amount，这里兜一次，免得手机上"加注"永远失败。
    .catch(function(err){
      if (action !== 'raise') { pkToast('操作失败：' + err.message); return null }
      var b2 = { action: 'raise', to: +$('pkRange').value }
      return pkCall('/act', b2).then(function(s){ PK.snap = s; pkDraw() })
        .catch(function(e2){ pkToast('加注失败：' + e2.message) })
    })
    .then(function(){ PK.busy = false; if (PK.snap) pkDraw(); pkPoll(400) })
}
function pkStart(){
  if (PK.busy) return
  PK.busy = true
  pkCall('/start', {}).then(function(s){ PK.snap = s; pkDraw() })
    .catch(function(err){ pkToast('开局失败：' + err.message) })
    .then(function(){ PK.busy = false; if (PK.snap) pkDraw(); pkPoll(400) })
}

}

/** 右上角「+」：先选工作区，再新建并切过去。
 *
 *  清单来自 /taskwatch/chat/workspaces，是**服务端列出来的**：客户端能挑，但挑不了清单外的
 *  路径（宿主侧只采纳逐字命中的那一条）。所以"手机上想开在哪儿"和"手机能碰哪些磁盘"
 *  是两件事，后者仍然由服务端决定。
 */
async function openWsPicker(){
  if (S.running) { setSub('当前有任务在跑，先停下再新建'); return }
  var el = $('wsp')
  if (!el) {
    el = document.createElement('div')
    el.id = 'wsp'
    el.innerHTML = '<div class="box" role="dialog" aria-modal="true" aria-label="选择新对话的工作区">' +
      '<div class="ws-head"><h4>新对话开在哪个工作区</h4><button class="sheet-close" type="button" data-ws-close aria-label="关闭">' + ICON_CLOSE + '</button></div><div class="list"></div></div>'
    el.addEventListener('click', function(e){ if (e.target === el) closeWsPicker() })
    el.querySelector('[data-ws-close]').addEventListener('click', closeWsPicker)
    document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeWsPicker() })
    document.body.appendChild(el)
  }
  var list = el.querySelector('.list')
  list.textContent = ''
  setSub('正在取工作区…')
  var rows = []
  try {
    var r = await fetch('/taskwatch/chat/workspaces', { cache:'no-store' }).then(function(x){ return x.json() })
    rows = (r && r.workspaces) || []
    setSub(rows.length ? '' : ((r && r.error) ? ('取工作区失败：' + r.error) : '没有可选工作区，只能用默认'))
  } catch (e) { setSub('取工作区失败：' + e.message) }

  var mkItem = function(label, sub, tag, path){
    var b = document.createElement('button')
    b.type = 'button'
    b.className = 'it'
    var txt = document.createElement('span'); txt.className = 'txt'
    var nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = label
    txt.appendChild(nm)
    if (sub) { var p = document.createElement('span'); p.className = 'pt'; p.textContent = sub; txt.appendChild(p) }
    b.appendChild(txt)
    if (tag) { var t = document.createElement('span'); t.className = 'tag'; t.textContent = tag; b.appendChild(t) }
    b.addEventListener('click', function(){ closeWsPicker(); newSession(path) })
    return b
  }
  rows.forEach(function(w){
    list.appendChild(mkItem(w.name || w.path, w.path, w.why === 'pinned' ? '常用' : '最近', w.path))
  })
  list.appendChild(mkItem('默认工作区', '不指定 —— 交给宿主决定', '', ''))
  el.classList.add('on')
}

/** 新建会话并立刻切过去。path 为空 = 不指定工作区（用宿主的默认值）。 */
async function newSession(path){
  if (S.running) { setSub('当前有任务在跑，先停下再新建'); return }
  setSub('正在新建…')
  try {
    var r = await post('/taskwatch/chat/create', path ? { workspace: path } : {})
    if (!r || !r.sessionId) { setSub('新建失败：' + ((r && r.error) || '宿主没返回 sessionId')); return }
    var list = await fetch('/taskwatch/chat/sessions', { cache:'no-store' }).then(function(x){ return x.json() })
    S.sessions = (list && list.sessions) || []
    openSession(r.sessionId)
    if (r.workspace) flashSub('已开在 ' + r.workspace)
    else setSub('')
  } catch (e) { setSub('新建失败：' + e.message) }
}

// ── 深浅色切换 ────────────────────────────────────────────────────────────
// 默认跟随系统；用户手动切过之后以手动为准，并记住选择。
// 状态栏颜色从令牌里读，不在这里写死 hex —— 令牌改了它自动跟着改。
function applyTheme(t, remember){
  var dark = (t === 'dark')
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
  $('themeBtn').setAttribute('aria-pressed', dark ? 'true' : 'false')
  // 图标本身表达"当前是什么主题"，但图标没有文字标签，读屏和第一眼都容易误会，
  // 所以把当前状态和点击结果都写进 aria-label。
  $('themeBtn').setAttribute('aria-label', dark ? '当前暗色，点击切到亮色' : '当前亮色，点击切到暗色')
  var bgc = ''
  try {
    bgc = getComputedStyle(document.documentElement).getPropertyValue('--dsw-alias-bg-base').trim()
  } catch (e) {}
  if (bgc) {
    var ms = document.querySelectorAll('meta[name="theme-color"]')
    for (var i = 0; i < ms.length; i++) {
      var mm = ms[i].getAttribute('media') || ''
      // 带 media 的两个 meta 分别对应系统亮/暗；手动覆盖时改与当前主题相符的那个。
      if ((/dark/i.test(mm)) === dark) ms[i].setAttribute('content', bgc)
    }
  }
  if (remember) { try { localStorage.setItem('taskwatch.theme', dark ? 'dark' : 'light') } catch (e) {} }
}
applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light', false)
// 字号与「只看对话」的偏好：由 <head> 的引导脚本先设好 data-font，这里只同步状态。
applyFont(document.documentElement.getAttribute('data-font') || 'medium', false)

  applyTheme(dark ? 'light' : 'dark', true)
})
// 用户没手动选过时，跟随系统的切换。老 Safari 没有 addEventListener，用 try 兜住。
try {
  window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change', function(e){
    var saved = ''
    try { saved = localStorage.getItem('taskwatch.theme') || '' } catch (err) {}
    if (saved !== 'light' && saved !== 'dark') applyTheme(e.matches ? 'dark' : 'light', false)
  })
} catch (e) {}

document.addEventListener('visibilitychange', function(){
  if (pageHidden()) {
    // 隐藏时停止轮询并**暂停所有重连排期**：锁屏 10 分钟不该攒下一串重试。
    // 审批 SSE 照旧收掉（宿主据此立刻交还审批，不空等 120 秒）；
    // 会话 SSE 留在原处，回来时若已断，openStream 会接着退避序列重开。
    stopPolling()
    if (NET.retryTimer) { clearTimeout(NET.retryTimer); NET.retryTimer = 0 }

    if (APPROVAL_LINK) APPROVAL_LINK.pause()

  // 同时把停掉的事件流接上。顺序是先恢复轮询，再强制一次。
  startPolling()
  retryNow()
  if (S.sessionId) openStream()
  renderNet()
})

// ── 统一兜住"登录没了" ────────────────────────────────────────────────────
// 任何一个请求回 401，就送去配对页。装在 fetch 上而不是散在每个调用点：
// 漏掉一处就会出现「页面永远卡在连接中」，而那种状态在手机上**没有任何自救路径**
// —— 用户既不知道该去哪，也没法清 cookie。这里一次装好，全部覆盖。
//
// 但跳之前必须确认配对页真的存在：中继可能是还没重启的旧版本，那时
// /taskwatch/pair 会 404 —— 跳过去等于把「卡在连接中」换成「一片 not found」，
// 反而更糟。新中继对该路径免鉴权回 200，旧中继回 404，所以启动探一次就够。
var pairPageOk = false
var rawFetch = window.fetch.bind(window)
rawFetch('/taskwatch/pair', { method: 'HEAD' })
  .then(function (r) { pairPageOk = (r.status === 200) })
  .catch(function () { /* 探测失败就当没有，保守降级 */ })
window.fetch = function (u, o) {
  return rawFetch(u, o).then(function (r) {
    if (r.status === 401) {
      if (pairPageOk) location.replace('/taskwatch/pair')
      throw new Error('unauthorized')
    }
    return r
  })
}

/* ── 纸墨微动 · 行为层 ──────────────────────────────────────────────────
   这一层只管"什么时候"，不管"长什么样"（长什么样在上面第 10 节 CSS 里）。

   它是纯渐进增强：整段不执行时，页面必须**完全静态且完整** —— 图片不会被藏起来、
   失败卡片不会反复抖、指标行不会闪。所以这里没有"先隐藏、等 JS 显示"的写法：
   所有动画类都是这里加上去的，CSS 里默认一个都没有。
   ───────────────────────────────────────────────────────────────────── */
;(function () {
  var doc = document
  var RM = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)

  /* 1. 按压：从指尖洇开一点墨。用事件委托，所以将来新加的按钮只要写进选择器
        就自动有这个反馈，不用一个个挂事件。 */
  var INKY = '#send,.pillbtn,.iconbtn,.item,.toolgroup .gh,.tool .more,.filecard'
  doc.addEventListener('pointerdown', function (e) {
    if (RM || !e.target || !e.target.closest) return
    var t = e.target.closest(INKY)
    if (!t) return
    var r = t.getBoundingClientRect()
    if (getComputedStyle(t).position === 'static') t.style.position = 'relative'
    t.style.overflow = 'hidden'
    var d = doc.createElement('span')
    d.className = 'inkdot'
    var s = Math.max(r.width, r.height) * 2.4
    d.style.width = s + 'px'
    d.style.height = s + 'px'
    d.style.left = (e.clientX - r.left) + 'px'
    d.style.top = (e.clientY - r.top) + 'px'
    t.appendChild(d)
    /* 下一帧再加 .go：同一帧里插入并加类，动画的 from 帧会被跳过，
       看起来像"凭空出现"而不是"洇开"。 */
    requestAnimationFrame(function () { d.classList.add('go') })
    setTimeout(function () { try { d.remove() } catch (err) {} }, 460)
  }, { passive: true })

  /* 2. 主题切换的那一滴墨。主题按钮是唯一带 aria-pressed 的 .iconbtn，所以不必
        知道它的 id；在捕获阶段先摆好墨滴，再让原来的处理器翻主题 —— CSS 变量是
        活的，这层墨取到的就是**新**主题的底色。 */
  var moire = null
  doc.addEventListener('pointerdown', function (e) {
    if (RM || !e.target || !e.target.closest) return
    if (!e.target.closest('.iconbtn[aria-pressed]')) return
    if (!moire) {
      moire = doc.createElement('div')
      moire.id = 'moire'
      doc.body.appendChild(moire)
    }
    moire.style.setProperty('--mx', e.clientX + 'px')
    moire.style.setProperty('--my', e.clientY + 'px')

   往返，手机看到的就是地址栏来回变、页面反复刷新。

    1. 读一次 GET /taskwatch/entries，把两条路列进胶囊菜单 —— 只渲染，不导航；
    2. 用户点另一个入口 → 向中继签一张换路票据 → 跳一次；整个脚本只有这一处

   经隧道看到的来源又永远是 127.0.0.1，页面拿不到「手机在哪个网络」这种事实。

(function () {

    var JUMP_KEY = 'tw-route-jump'

    var locked = ''         // 票据落地后锁定的入口；锁定期间只信它

    var lastJumpAt = 0      // 同文档内的第二道保险（sessionStorage 不可用时仍有效）

      try { u = new URL(location.href) } catch (e) { return false }
      var params = u.searchParams
      if (!params.has('t') && !params.has('T')) return false
      params.delete('t')
      params.delete('T')
      var search = params.toString()
      var clean = u.pathname + (search ? '?' + search : '') + u.hash
      try { history.replaceState(null, '', clean) } catch (e) {}
      return true

      var raw = readSession(JUMP_KEY)
      if (!raw) return null
      try {
        var j = JSON.parse(raw)
        return j && typeof j.at === 'number' ? j : null
      } catch (e) { return null }
    }

    /** 8 秒护栏还差多久（毫秒）。0 = 现在可以跳。时钟回拨按「刚刚跳过」处理。 */
    function guardWait() {
      var now = Date.now()
      var wait = 0
      var j = readJump()
      if (j) {
        wait = j.at > now ? JUMP_GUARD_MS : Math.max(0, JUMP_GUARD_MS - (now - j.at))
      }
      if (lastJumpAt) {
        var mem = lastJumpAt > now ? JUMP_GUARD_MS : Math.max(0, JUMP_GUARD_MS - (now - lastJumpAt))
        if (mem > wait) wait = mem
      }
      return wait
    }

    /** 换路的唯一出口：先过护栏、写带时间戳的标记，然后才跳。 */
    function navigateOnce(url, kind) {

      if (wait > 0) {

        status('刚刚切换过，' + Math.ceil(wait / 1000) + ' 秒后才能再切')
        return false

      var at = Date.now()
      lastJumpAt = at
      writeSession(JUMP_KEY, JSON.stringify({ at: at, to: kind }))

    function isGone(code) { return code === 404 || code === 405 }

      if (here) return here
      if (locked && hasKind(locked)) return locked

    }
    function hasKind(kind) {
      for (var i = 0; i < items.length; i++) if (items[i].kind === kind) return true
      return false
    }
    function itemOf(kind) {
      for (var i = 0; i < items.length; i++) if (items[i].kind === kind) return items[i]
      return null
    }
    function hasChoice() { return items.length >= 2 }

    /** 兼容两种 entries 形状：中继的 {remote, lan, current} 与新契约的
     *  {entries:[{kind, label, url, current}]}。同一份页面在中继和宿主下都能跑。 */
    function parseEntries(j) {
      if (!j || j.ok !== true) return false
      var list = []
      var declared = ''
      if (Array.isArray(j.entries)) {
        var seenKind = {}
        for (var i = 0; i < j.entries.length; i++) {
          var e = j.entries[i]
          if (!e || typeof e.url !== 'string') continue
          if (e.kind !== 'remote' && e.kind !== 'lan') continue
          if (seenKind[e.kind]) continue
          var url = withRoute(e.url)
          if (!url) continue
          seenKind[e.kind] = true
          list.push({
            kind: e.kind,
            label: typeof e.label === 'string' ? e.label : '',
            url: url,
          })
          if (e.current === true) declared = e.kind

      } else {
        var remote = withRoute(j.remote)
        if (remote) list.push({ kind: 'remote', label: '', url: remote })
        if (Array.isArray(j.lan)) {
          var seen = {}
          for (var k = 0; k < j.lan.length; k++) {
            var lanUrl = withRoute(j.lan[k])
            if (!lanUrl || seen[lanUrl]) continue
            seen[lanUrl] = true
            list.push({ kind: 'lan', label: '', url: lanUrl })
            break   // 胶囊只需要一条局域网入口，多网卡不在这里堆
          }
        }
        declared = asKind(j.current)
      }
      if (!list.length) return false
      // 远端永远排第一，局域网第二：顺序稳定，用户不必每次重新找。
      list.sort(function (a, b) {

        return a.kind === 'remote' ? -1 : 1

      current = guessCurrent() || declared

      for (var i = 0; i < items.length; i++) {

    function status(message) {

    function noteHtml() {
      if (!degraded) return ''
      var last = rememberedRemote()
      var text = '当前页面由插件宿主提供，远端切换需要中继接口'
      if (last) text += '；也可直接打开 <a href="' + esc(last) + '">' + esc(last) + '</a>'
      return '<div class="note route-note">' + text + '</div>'
    }
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {

      var host = document.getElementById('hrow') || document.querySelector('.hrow') || document.querySelector('header') || document.body
      var before = document.getElementById('netq') || document.getElementById('newBtn') || null
      if (!pill) {
        pill = document.createElement('button')
        pill.id = 'tw-route-pill'
        pill.type = 'button'
        pill.setAttribute('aria-haspopup', 'dialog')

      scrim = document.createElement('div')

      scrim.setAttribute('aria-hidden', 'true')
      scrim.addEventListener('click', closeMenu)
      document.body.appendChild(scrim)

      menu.id = 'tw-route-menu'
      menu.setAttribute('role', 'dialog')
      menu.setAttribute('aria-label', '连接入口')
      var head = document.createElement('div')
      head.className = 'tw-mhead'
      head.textContent = '连接入口'
      var list = document.createElement('div')
      list.className = 'tw-mlist'
      var foot = document.createElement('div')
      foot.className = 'tw-mfoot'

      var list = menu.querySelector('.tw-mlist')

      for (var i = 0; i < items.length; i++) {
        var it = items[i]
        var isHere = it.kind === here
        var row = document.createElement('button')
        row.type = 'button'
        row.className = 'tw-entry'
        row.setAttribute('data-kind', it.kind)
        row.setAttribute('aria-current', isHere ? 'true' : 'false')

        kind.className = 'tw-kind'
        kind.textContent = it.label || (it.kind === 'lan' ? '局域网' : '远端')

        url.className = 'tw-url'
        url.textContent = shortUrl(it.url)
        var chip = document.createElement('span')
        chip.className = 'tw-chip'
        chip.textContent = isHere ? '当前' : '切换'
        row.appendChild(kind)
        row.appendChild(url)
        row.appendChild(chip)
        if (!isHere) row.addEventListener('click', onPick)
        list.appendChild(row)

      var foot = menu.querySelector('.tw-mfoot')
      foot.textContent = locked && locked === here

        : '只在你点选时切换；页面不会自动跳转。'
    }

    function positionMenu() {
      if (!menu || !pill) return
      var r = pill.getBoundingClientRect()
      var top = Math.round(r.bottom + 6)
      if (top < 8) top = 8
      // 右对齐到胶囊，但**必须夹在视口内**：胶囊在标题行中间偏右，直接按它右对齐
      // 会把 330px 宽的菜单推到屏幕左侧外面（390 宽实测会裁掉入口名）。
      var margin = 12
      var width = menu.offsetWidth || Math.min(330, window.innerWidth - margin * 2)
      var right = Math.max(margin, Math.round(window.innerWidth - r.right))
      if (window.innerWidth - right - width < margin) {

      menu.style.right = right + 'px'
      menu.style.left = 'auto'
      menu.style.maxHeight = Math.max(180, Math.round(window.innerHeight - top - margin)) + 'px'

      if (degraded || !hasChoice()) return

    }

    function jump(kind) {

      var target = itemOf(kind)
      if (!target) { status('这条入口现在不可用'); return }
      if (kind === currentKind()) { status('已经在这个入口上'); return }
      // 同源目标跳过去只是刷新一次页面，没有意义（也会绕开 8 秒护栏的直觉）。
      if (originOf(target.url) === location.origin) {
        status('这条入口和当前地址是同一个源，无需切换')
        return
      }
      // 护栏提前到签票之前：被拦下时连票都不该签。
      var wait = guardWait()
      if (wait > 0) {
        status('刚刚切换过，' + Math.ceil(wait / 1000) + ' 秒后才能再切')
        return
      }
      busy = true
      status('正在签票…')
      fetch('/taskwatch/ticket', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ to: kind }),
      }).then(function (r) {

        if (isGone(r.status)) { degrade(); return null }
        if (!r.ok) throw new Error('HTTP ' + r.status)
        return r.json()
      }).then(function (j) {
        if (j === null) return
        if (!j || j.ok !== true || typeof j.url !== 'string' || !/^https?:\/\//i.test(j.url)) {
          busy = false
          status((j && j.error) || '没有拿到换路地址')
          return
        }
        if (kind === 'remote') rememberRemote(j.url)
        navigateOnce(j.url, kind)
      }).catch(function (e) {
        busy = false
        status('切换失败：' + ((e && e.message) || '网络错误'))
      })
    }

    function apply() {

    css.textContent = '#tw-route-pill{display:none;align-items:center;gap:5px;'
      + 'flex:0 0 auto;margin:0;max-width:38vw;overflow:hidden;'
      + 'height:44px;min-height:44px;line-height:1;padding:0 10px;border-radius:999px;'
      + 'font:600 12.5px/1.25 ' + FONT + ';'
      + 'color:inherit;background:color-mix(in srgb,currentColor 8%,transparent);'
      + 'border:1px solid color-mix(in srgb,currentColor 24%,transparent);cursor:pointer;white-space:nowrap}'

      + '#tw-route-scrim{position:fixed;inset:0;z-index:70;background:rgba(8,10,14,.22);display:none}'
      + '#tw-route-scrim.on{display:block}'

      + 'width:min(330px,calc(100vw - 20px));padding:8px;overflow-y:auto;'
      + 'border-radius:16px;background:var(--panel,Canvas);color:inherit;'
      + 'border:1px solid color-mix(in srgb,currentColor 16%,transparent);'
      + 'box-shadow:0 18px 44px -12px rgba(0,0,0,.38),0 2px 8px rgba(0,0,0,.12);'
      + 'font:400 13px/1.4 ' + FONT + '}'
      + '#tw-route-menu.on{display:block}'
      + '#tw-route-menu .tw-mhead{padding:5px 10px 8px;font:600 11.5px/1 ' + FONT + ';'
      + 'letter-spacing:.06em;color:color-mix(in srgb,currentColor 48%,transparent)}'
      + '#tw-route-menu .tw-entry{display:flex;align-items:center;gap:8px;width:100%;'
      + 'min-height:56px;padding:8px 10px;border:0;border-radius:12px;background:none;'
      + 'color:inherit;text-align:left;cursor:pointer;font:inherit}'
      + '#tw-route-menu .tw-entry+.tw-entry{margin-top:2px}'
      + '#tw-route-menu .tw-kind{flex:0 0 auto;font-weight:600;font-size:13.5px}'
      + '#tw-route-menu .tw-url{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;'
      + 'white-space:nowrap;font-size:11.5px;color:color-mix(in srgb,currentColor 55%,transparent);'
      + 'font-variant-numeric:tabular-nums}'
      + '#tw-route-menu .tw-chip{flex:0 0 auto;padding:4px 8px;border-radius:999px;'
      + 'font-size:11.5px;font-weight:600;white-space:nowrap;'
      + 'border:1px solid color-mix(in srgb,currentColor 20%,transparent)}'
      + '#tw-route-menu .tw-entry[aria-current="true"]{background:color-mix(in srgb,currentColor 6%,transparent)}'
      + '#tw-route-menu .tw-entry[aria-current="true"] .tw-chip{background:color-mix(in srgb,currentColor 10%,transparent);border-color:transparent}'
      + '#tw-route-menu .tw-entry:not([aria-current="true"]) .tw-chip{color:var(--accent,#2f6df6)}'
      + '#tw-route-menu .tw-entry:not([aria-current="true"]):active{background:color-mix(in srgb,currentColor 10%,transparent)}'
      + '#tw-route-menu .tw-mfoot{padding:8px 10px 4px;font-size:11.5px;line-height:1.45;'
      + 'color:color-mix(in srgb,currentColor 52%,transparent)}'
      + '#tw-route-menu .tw-mstatus{padding:6px 10px 4px;font-size:11.5px;line-height:1.4;'
      + 'color:var(--warn,#a35b00)}'
      + '#tw-route-menu .tw-mstatus:empty{display:none}'
      + '@media (prefers-reduced-motion:reduce){#tw-route-pill:active{transform:none}}'
    document.head.appendChild(css)

    // ?t= 落地：先把参数清掉并把入口锁成这一项，再去做任何别的事。
    landed = stripTicketParam()
    locked = asKind(readSession(LOCK_KEY))
    if (landed) {
      var jumped = readJump()
      var jumpKind = jumped ? asKind(jumped.to) : ''
      if (jumpKind) locked = jumpKind
      if (locked) writeSession(LOCK_KEY, locked)
    }

    // 入口清单只取一次：404/405 → 静态降级并不再重试；其它错误 → 记一条日志后收手。
    // 这里只渲染。没有任何分支会改地址，所以初始加载路径上不可能发生导航。
    fetch('/taskwatch/entries', { cache: 'no-store' })
      .then(function (r) {
        if (isGone(r.status)) { degrade(); return null }
        if (!r.ok) throw new Error('HTTP ' + r.status)
        return r.json()
      })
      .then(function (j) {
        if (j === null) return
        if (!parseEntries(j)) { console.warn('taskwatch: 入口清单形状不认识，双入口胶囊不显示'); return }
        apply()
      })
      .catch(function (e) {
        console.warn('taskwatch: 入口清单读取失败', (e && e.message) || e)
      })
  } catch (e) { console.warn('taskwatch: 双入口切换未启用', e) }
})()
/* ROUTE-SAFETY-END */
</script>
</body>
</html>
