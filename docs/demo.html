  if (n >= 1e6) return (n / 1e6).toFixed(0) + 'M'
  if (n >= 1e3) return (n / 1e3).toFixed(1) + 'k'
  return String(n)
}
function fmtCount(n){ return Math.max(0, Math.round(Number(n) || 0)).toLocaleString() }
function fmtRate(n){
  n = Number(n) || 0
  return n >= 100 ? Math.round(n).toLocaleString() : n.toFixed(1)
}
function fmtMs(n){
  n = Math.max(0, Number(n) || 0)
  if (n >= 60000) return (n / 60000).toFixed(1) + ' 分钟'
  if (n >= 1000) return (n / 1000).toFixed(1) + ' 秒'
  return Math.round(n) + ' ms'
}
function cacheHitPercent(u){
  if (!u) return null
  if (typeof u.cacheHitPercent === 'number' && isFinite(u.cacheHitPercent)) return u.cacheHitPercent
  var uncached = Number(u.uncachedInputTokens)
  if (!isFinite(uncached)) uncached = Number(u.inputTokens) || 0
  var read = Number(u.cacheReadTokens) || 0, write = Number(u.cacheWriteTokens) || 0
  var total = uncached + read + write
  return total > 0 ? 100 * read / total : null
}
function contextPercent(u){
  if (!u) return null
  if (typeof u.contextPercent === 'number' && isFinite(u.contextPercent)) return u.contextPercent
  var used = typeof u.contextTokens === 'number' ? u.contextTokens :
    (typeof u.projectedTokens === 'number' ? u.projectedTokens :
    (typeof u.pressureTokens === 'number' ? u.pressureTokens :
    (typeof u.surfaceTokens === 'number' ? u.surfaceTokens : NaN)))
  var window = Number(u.contextWindow) || 0
  return window > 0 && isFinite(used) ? Math.min(100, 100 * used / window) : null
}

/** 会话用量：轮 / 步 / token / 缓存命中 / 上下文占用。
 *
 *  宿主拿不到 tokenMeter 时**不会**返回这些字段 —— 那这里就什么都不显示。
 *  宁可少一行，也不写一个 0 出来：在监控页上，"0" 和 "不知道" 是两件事。
 */
async function loadUsage(){
  // 子代理页没有独立的 usage：宿主按 sessionId 查会回父会话的数字，
  // 显示在只读页上会让人误以为是子代理自己的消耗。宁可不显示。
  if (S.agentView) { USAGE = null; renderStats(); renderContext(); return }
  if (USAGE_BUSY) return
  if (!S.sessionId) { USAGE = null; renderStats(); renderContext(); return }
  var sid = S.sessionId
  USAGE_BUSY = true
  try {
    var r = await fetch('/taskwatch/chat/usage?sessionId=' + encodeURIComponent(sid) +
      '&t=' + Date.now(), { cache:'no-store' })
    var j = await r.json()
    if (S.sessionId !== sid) return      // 旧会话的用量不能写到新会话的指标行上
    USAGE = (j && !j.error) ? j : null
  } catch (e) { if (S.sessionId === sid) USAGE = null }
  finally { USAGE_BUSY = false }
  if (S.sessionId !== sid) return
  renderStats()
  renderContext()
}

/** 指标行（输入框上方）：只列**数得出来**的东西。
 *
 *  步数、token/s、token 消耗、缓存命中率、上下文占用来自宿主的
 *  /taskwatch/chat/usage；宿主没给就不显示，不拿前端时间猜一个速度。
 */
function statsAdd(el, text, strong){
  var s = document.createElement('span')
  s.className = 'si' + (strong ? ' strong' : '')
  s.textContent = text
  el.appendChild(s)
}

function renderStats(){
  var el = $('stats')
  if (!el) return
  el.textContent = ''
  if (!lastData) statsAdd(el, '读取中…', false)
  else if (lastData.error || lastData.offline) statsAdd(el, '读不到状态', false)
  else {
    var t = lastData.totals || {}
    statsAdd(el, '会话 ' + (t.sessions || 0), false)
    // 「在跑」是这三个加粗项里最该先看到的：它回答"现在有没有活儿"。
    if (t.running || t.jobsRunning) statsAdd(el, '在跑 ' + ((t.running || 0) + (t.jobsRunning || 0)), true)
    if (t.subagents) statsAdd(el, '子代理 ' + t.subagents, false)
    if (t.pending) statsAdd(el, '待处理 ' + t.pending, false)
  }
  if (USAGE && USAGE.live) {
    if (typeof USAGE.turns === 'number') statsAdd(el, '轮次 ' + fmtCount(USAGE.turns), false)
    if (typeof USAGE.steps === 'number') statsAdd(el, '步数 ' + fmtCount(USAGE.steps), false)
    if (typeof USAGE.tokensPerSecond === 'number' && isFinite(USAGE.tokensPerSecond)) {
      statsAdd(el, fmtRate(USAGE.tokensPerSecond) + ' tok/s', false)
    }
    var consumed = typeof USAGE.tokenConsumption === 'number' ? USAGE.tokenConsumption : USAGE.totalTokens
    if (typeof consumed === 'number') statsAdd(el, 'Token ' + fmtTok(consumed), false)
    var context = contextPercent(USAGE)
    if (context !== null) statsAdd(el, '上下文 ' + Math.floor(context) + '%', true)
    var hit = cacheHitPercent(USAGE)
    // 向下取整，不四舍五入：99.5% 显示成 "100%" 是在往上抬，
    // 监控页宁可少报也不能多报。DSH 自己的状态栏也是这个口径（99%）。
    if (hit !== null) statsAdd(el, '缓存命中 ' + Math.floor(hit) + '%', true)
  }
  // 展开箭头是这条可点行的唯一提示；aria-expanded 跟明细面板同步。
  var box = $('statsDetail')
  var open = !!(box && !box.hidden)
  var chev = document.createElement('span')
  chev.className = 'schev'
  chev.appendChild(iconSvg(ICON_CHEV))
  el.appendChild(chev)
  el.setAttribute('aria-expanded', open ? 'true' : 'false')
  el.setAttribute('aria-label', '指标：' + el.textContent.replace(/\s+/g, ' ').trim() +
    (open ? '。收起明细' : '。点按查看明细'))
  if (open) renderStatsDetail()
}

/** 指标明细：只显示宿主**真的返回**的字段；缺的项不补 0、不猜。 */
function renderStatsDetail(){
  var box = $('statsDetail')
  if (!box || box.hidden) return
  box.textContent = ''
  var rows = 0
  function row(k, v){
    if (v === null || v === undefined || v === '') return
    var d = document.createElement('div'); d.className = 'sd-row'
    var kk = document.createElement('span'); kk.className = 'k'; kk.textContent = k
    var vv = document.createElement('span'); vv.className = 'v'; vv.textContent = String(v)
    d.appendChild(kk); d.appendChild(vv); box.appendChild(d); rows++
  }
  var d = lastData || {}
  var t = d.totals || {}
  if (!d.error && !d.offline) {
    row('会话', t.sessions)
    row('在跑', (Number(t.running) || 0) + (Number(t.jobsRunning) || 0))
    row('子代理', t.subagents)
    row('待处理', t.pending)
  }
  if (USAGE && USAGE.live) {
    if (typeof USAGE.turns === 'number') row('轮次', fmtCount(USAGE.turns))
    if (typeof USAGE.steps === 'number') row('步数', fmtCount(USAGE.steps))
    if (typeof USAGE.toolCalls === 'number') row('工具调用', fmtCount(USAGE.toolCalls) + ' 次')
    if (typeof USAGE.tokensPerSecond === 'number') row('生成速度', fmtRate(USAGE.tokensPerSecond) + ' tok/s')
    if (typeof USAGE.tokenConsumption === 'number') row('Token 消耗', fmtCount(USAGE.tokenConsumption))
    else if (typeof USAGE.totalTokens === 'number') row('Token 合计', fmtCount(USAGE.totalTokens))
    if (typeof USAGE.uncachedInputTokens === 'number') row('未缓存输入', fmtCount(USAGE.uncachedInputTokens))
    else if (typeof USAGE.inputTokens === 'number') row('输入 token', fmtCount(USAGE.inputTokens))
    if (typeof USAGE.outputTokens === 'number') row('输出 token', fmtCount(USAGE.outputTokens))
    if (typeof USAGE.cacheReadTokens === 'number') row('缓存读取', fmtCount(USAGE.cacheReadTokens))
    if (typeof USAGE.cacheWriteTokens === 'number') row('缓存写入', fmtCount(USAGE.cacheWriteTokens))
    var hit = cacheHitPercent(USAGE)
    if (hit !== null) row('缓存命中', Math.floor(hit) + '%')
    var used = typeof USAGE.contextTokens === 'number' ? USAGE.contextTokens :
      (typeof USAGE.projectedTokens === 'number' ? USAGE.projectedTokens : USAGE.pressureTokens)
    var cp = contextPercent(USAGE)
    row('上下文', (typeof used === 'number' ? fmtCount(used) : '') +
      (USAGE.contextWindow ? ' / ' + fmtCount(USAGE.contextWindow) : '') +
      (cp === null ? '' : ' · ' + Math.floor(cp) + '%'))
    if (typeof USAGE.llmMs === 'number') row('模型用时', fmtMs(USAGE.llmMs))
    if (typeof USAGE.toolMs === 'number') row('工具用时', fmtMs(USAGE.toolMs))
    if (typeof USAGE.ttftMs === 'number') {
      row('平均首 token', fmtMs(USAGE.ttftSteps > 0 ? USAGE.ttftMs / USAGE.ttftSteps : USAGE.ttftMs))
    }
  }
  if (!rows) {
    var hint = document.createElement('div'); hint.className = 'hint'
    hint.textContent = '宿主还没有返回可用的指标'
    box.appendChild(hint)
  } else {
    var src = document.createElement('div'); src.className = 'hint'
    src.textContent = '只显示宿主真实返回的字段；没给的不补 0。'
    box.appendChild(src)
  }
}

function syncStatus(){
  var t = $('statusTxt'), box = $('status')
  renderStats()
  // 子代理入口跟着 /taskwatch/data 的最新一次心跳走（没有子代理时整条隐藏）。
  renderSubagentBar()
  loadUsage()
  if (!lastData) {
    box.className = ''
    t.textContent = '正在读取状态…'
    box.title = '正在读取状态'
    return
  }
  var d = lastData
  if (d.error) {
    box.className = 'bad'
    t.textContent = '读不到状态'
    box.title = '读不到状态：' + d.error
    return
  }
  // service worker 的离线兜底用的是 offline:true + errors[]（见 lib/sw.js）。
  // 不认这个形状的话，断网时会显示成"一切正常，没有任务在跑" —— 对监控来说，
  // 把"读不到"说成"没事"是最坏的一种错。
  if (d.offline || (d.errors && d.errors.length)) {
    box.className = 'bad'
    t.textContent = '连不上电脑'
    box.title = '连不上电脑：' + (d.errors && d.errors[0] ? d.errors[0] : '读不到状态')
    return
  }
  var tot = d.totals || {}
  var busy = (tot.jobsRunning || 0) + (tot.running || 0)
  if ((tot.pending || 0) > 0) {
    box.className = 'warn'
    // 首页的标题位已经写着「在等你 N 件」了，这颗胶囊不再重复同一个数字 ——
    // 同一屏出现两遍「2 件」看起来像两个不同的数。改成入口语义，点它还是抽屉。
    t.textContent = S.home ? '点按看全部任务' : (tot.pending + ' 件事待你处理')
    box.title = '有 ' + tot.pending + ' 件事待桌面处理 · 点按查看详情'
  } else if (busy > 0) {
    box.className = 'busy'
    t.textContent = busy + ' 个任务正在运行'
    box.title = busy + ' 个任务正在运行 · 点按查看详情'
  } else {
    box.className = ''
    t.textContent = '没有任务在运行'
    box.title = '当前没有任务在运行 · 点按查看详情'
  }
  box.setAttribute('aria-expanded', sheet && !sheet.hidden ? 'true' : 'false')
}

// ---------------------------------------------------------------------------
// 网络
// ---------------------------------------------------------------------------
async function postRaw(url, body){
  var r = await fetch(url, {
    method:'POST',
    headers:{ 'content-type':'application/json' },
    body: JSON.stringify(body || {}),
    cache:'no-store'
  })
  var d = await r.json().catch(function(){ return { error:'HTTP ' + r.status } })
  return { status:r.status, ok:r.ok, data:d }
}

async function post(url, body){
  var res = await postRaw(url, body)
  var d = res.data
  if (res.status === 404) throw new Error('宿主没有注册这个接口')
  if (!res.ok || (d && d.error)) {
    var e = new Error((d && d.error) || ('HTTP ' + res.status))
    e.status = res.status
    e.code = d && d.code
    e.data = d
    throw e
  }
  return d
}

/** opts: { now:true } 插队但不打断；{ now:true, interrupt:true } 先打断再发。
 *  后者失败时消息**没有发出**，提示必须如实说"没发出"，不能假装成功。 */
async function send(text, opts){
  var o = opts || {}
  text = String(text == null ? $('input').value : text)
  if (S.agentView) { notice('子代理会话只读，不能发送', 2000); return }
  if (sendingSessions[S.sessionId]) return
  if (!text.trim() && !S.attachments.length) return
  if (S.attachments.some(function(a){ return a.status === 'uploading' })) { attachmentNotice('附件还在上传，请稍等'); return }
  if (S.attachments.some(function(a){ return a.status === 'error' })) { attachmentNotice('请重试或移除上传失败的附件'); return }
  if (!S.sessionId) await ensureSession()
  if (!S.sessionId) { attachmentNotice('请先新建或选择一个会话'); return }
  var sessionId = S.sessionId, draft = S.attachments, attached = draft.slice()
  sendingSessions[sessionId] = true
  S.pending = text
  S.pendingAttachments = attached
  renderPending()
  $('input').value = ''
  autoGrow(); syncSend(); attachmentNotice('')
  try {
    var payload = {
      sessionId: sessionId,
      text: text,
      attachments: attached.map(function(a){ return a.upload }),
      timeZone: (Intl.DateTimeFormat().resolvedOptions().timeZone || '')
    }
    if (o.now) payload.now = true
    if (o.now && o.interrupt) payload.interrupt = true
    var result = await post('/taskwatch/chat/send', payload)
    if (!result || result.accepted !== true) throw new Error('宿主尚未接受消息，请重试')
    attached.forEach(function(a){ var i = draft.indexOf(a); if (i >= 0) draft.splice(i, 1) })
    // 发送成功才清草稿：失败时下面会把原文放回输入框，草稿必须还在。
    clearDraft(sessionId)
    if (S.sessionId === sessionId) { S.running = true; renderAttachmentTray(); wakeComposer() }
    else attached.forEach(releaseAttachment)
    refreshQueue(true)
  } catch (e) {
    if (S.sessionId === sessionId) {
      S.pending = null; S.pendingAttachments = []; renderPending()
      if (e.code === 'interrupt-timeout') {
        notice('打断超时，消息没有发出；可以先停止再发', 6000)
        setSub('打断超时，消息没有发出')
      } else {
        attachmentNotice('发送失败：' + e.message)
      }
      if (!$('input').value) $('input').value = text
      autoGrow()
      queueDraftSave()
    } else if (attachmentDrafts[sessionId]) {
      if (!attachmentDrafts[sessionId].text) attachmentDrafts[sessionId].text = text
      attachmentDrafts[sessionId].error = '发送失败：' + e.message
    }
  } finally {
    delete sendingSessions[sessionId]
    syncSend()
  }
}

async function stop(){
  var sid = S.sessionId
  try {
    await post('/taskwatch/chat/cancel', { sessionId: sid })
    if (S.sessionId === sid) {
      S.running = false
      finishStreaming()
      syncSend()
      refreshQueue(true)
    }
    notice('已停止当前任务', 1800)
  } catch (e) {
    // 失败不静默：按钮留在停止态（任务可能还在跑），并在输入框上方说清原因。
    notice('停止失败：' + e.message, 4000)
    setSub('停止失败：' + e.message)
  }
}

function autoGrow(){
  var el = $('input')
  el.style.height = 'auto'
  el.style.height = Math.min(132, el.scrollHeight) + 'px'
}

var MAX_ATTACHMENTS = 4
var MAX_ATTACHMENT_BYTES = 32 * 1024 * 1024
var attachmentDrafts = Object.create(null), sendingSessions = Object.create(null)
function attachmentNotice(text){ $('attachmentNotice').textContent = text || '' }
/** 一句中文提示，可定时收回。失败一律走这里，不靠 console。 */
var NOTICE_TIMER = 0
function notice(text, ms){
  var el = $('attachmentNotice')
  if (!el) return
  el.textContent = text || ''
  clearTimeout(NOTICE_TIMER)
  if (text && ms) {
    NOTICE_TIMER = setTimeout(function(){
      if (el.textContent === text) el.textContent = ''
    }, ms)
  }
}
// ── 草稿自动保存（按 sessionId）─────────────────────────────────────────
// 输入框内容在切会话 / 刷新后恢复；发送成功才删。附件草稿仍只在内存里
// （附件有一次性 token，跨会话持久化会拿到失效引用，不如不存）。
var DRAFT_TIMER = 0
function draftKey(id){ return 'tw-draft:' + id }
function getDraft(id){
  if (!id) return ''
  try { return localStorage.getItem(draftKey(id)) || '' } catch (e) { return '' }
}
function clearDraft(id){
  if (!id) return
  try { localStorage.removeItem(draftKey(id)) } catch (e) {}
}
function saveDraftNow(){
  if (!S.sessionId) return
  var v = $('input') ? $('input').value : ''
  try {
    if (v) localStorage.setItem(draftKey(S.sessionId), v)
    else localStorage.removeItem(draftKey(S.sessionId))
  } catch (e) {}
}
function queueDraftSave(){
  clearTimeout(DRAFT_TIMER)
  DRAFT_TIMER = setTimeout(saveDraftNow, 250)
}

// ── 字号三档 / 只看对话 ──────────────────────────────────────────────────
var FONT_NAMES = { small:'小', medium:'中', large:'大' }
function applyFont(v, remember){
  if (!FONT_NAMES[v]) v = 'medium'
  // 字号变化会让同一段文字重新折行：原本停在底部的，改完还得停在底部，
  // 否则会突然停在半截消息上（还会冒出「最新」浮标挡住正文）。
  var wasBottom = nearBottom()
  document.documentElement.setAttribute('data-font', v)
  if (remember) { try { localStorage.setItem('tw-font', v) } catch (e) {} }
  var btns = document.querySelectorAll('.segbtn[data-font]')
  for (var i = 0; i < btns.length; i++) {
    btns[i].setAttribute('aria-pressed', btns[i].getAttribute('data-font') === v ? 'true' : 'false')
  }
  autoGrow()
  requestAnimationFrame(function(){ if (wasBottom) toBottom() })
}
function setChatOnly(on, remember){
  S.chatOnly = !!on
  if (remember) { try { localStorage.setItem('tw-chat-only', S.chatOnly ? '1' : '0') } catch (e) {} }
  renderAll()

// ── 消息队列 UI ──────────────────────────────────────────────────────────
function qSources(item){
  var bits = []
  if (item && item.images) bits.push(item.images + ' 图')
  if (item && item.files) bits.push(item.files + ' 文件')
  return bits.join(' · ')
}
function queueOrderFromIds(ids){
  var by = Object.create(null)
  for (var i = 0; i < Q.items.length; i++) by[String(Q.items[i].id)] = Q.items[i]
  var out = []
  for (var j = 0; j < ids.length; j++) {
    var it = by[String(ids[j])]
    if (it) { out.push(it); delete by[String(ids[j])] }
  }
  for (var k = 0; k < Q.items.length; k++) {
    var id = String(Q.items[k].id)
    if (by[id]) { out.push(Q.items[k]); delete by[id] }
  }
  return out
}
function qMoveBtn(dir, disabled, id, label){
  var b = document.createElement('button')
  b.type = 'button'; b.className = 'qmove'; b.disabled = !!disabled
  b.setAttribute('aria-label', label); b.title = label
  b.appendChild(iconSvg(dir < 0 ? ICON_UP : ICON_DOWN))
  b.addEventListener('click', function(){ moveQueue(id, dir) })
  return b
}
function renderQueue(){
  var bar = $('queueBar')
  if (!bar) return
  if (Q.supported !== true) { bar.hidden = true; Q.open = false; return }
  var sum = $('queueSummary'), list = $('queueList'), note = $('queueNote')
  if (Q.state === 'error') {
    bar.hidden = false; sum.hidden = true; list.hidden = true
    note.textContent = Q.note || '队列暂时不可用'
    note.className = 'qnote' + (Q.noteBad ? ' bad' : '')
    return
  }
  var n = Q.items.length, s = Q.steering.length
  if (!n && !s && !Q.running) { bar.hidden = true; Q.open = false; return }
  bar.hidden = false; sum.hidden = false
  var count = $('queueCount')
  count.textContent = n ? ('排队 ' + n + ' 条' + (s ? ' · 已插队 ' + s + ' 条' : ''))
    : (Q.running ? '正在运行 · 队列为空' : '队列为空')
  $('queueHint').textContent = Q.open ? '收起' : '展开'
  sum.setAttribute('aria-expanded', Q.open ? 'true' : 'false')
  list.hidden = !Q.open
  note.textContent = Q.note || ''
  note.className = 'qnote' + (Q.noteBad ? ' bad' : '')
  if (!Q.open) return
  list.textContent = ''
  function row(item, idx, canMove){
    var r = document.createElement('div'); r.className = 'qitem'
    var no = document.createElement('span'); no.className = 'qidx'; no.textContent = String(idx + 1)
    r.appendChild(no)
    var t = document.createElement('span'); t.className = 'qt'
    t.textContent = item.text ? String(item.text) : '（无文本）'
    t.title = item.text ? String(item.text) : ''
    r.appendChild(t)
    var meta = qSources(item)
    if (meta) { var m = document.createElement('span'); m.className = 'qmeta'; m.textContent = meta; r.appendChild(m) }
    if (canMove) {
      r.appendChild(qMoveBtn(-1, idx === 0, String(item.id), '上移这条排队消息'))
      r.appendChild(qMoveBtn(1, idx === Q.items.length - 1, String(item.id), '下移这条排队消息'))
    }
    list.appendChild(r)
  }
  for (var i = 0; i < n; i++) row(Q.items[i], i, Q.items[i].source === 'user')
  if (s) {
    var sh = document.createElement('div'); sh.className = 'qempty'
    sh.textContent = '已插队 · 由宿主决定顺序'
    list.appendChild(sh)
    for (var j = 0; j < s; j++) {
      var st = Q.steering[j]
      var sr = document.createElement('div'); sr.className = 'qitem'
      var sn = document.createElement('span'); sn.className = 'qidx'; sn.textContent = '·'

async function refreshQueue(silent){
  if (!S.chatReady || !S.sessionId) { Q.supported = null; Q.state = 'off'; renderQueue(); return }
  if (Q.sid !== S.sessionId) {
    Q.sid = S.sessionId; Q.supported = null; Q.state = 'unknown'
    Q.open = false; Q.checkedSid = ''; Q.items = []; Q.steering = []
    Q.running = false; Q.note = ''
  }
  // 404 之后不再每 5 秒打一次：宿主没这条路由，重试没有意义，只等切会话再试。
  if (Q.supported === false && Q.checkedSid === S.sessionId) return
  if (Q.busy) return
  var sid = S.sessionId
  Q.busy = true
  try {
    var r = await fetch('/taskwatch/chat/queue?sessionId=' + encodeURIComponent(sid) +
      '&t=' + Date.now(), { cache:'no-store' })
    // 队列也是会话私有的：切走之后，旧回包只允许丢掉，不许写进新会话的队列条。
    if (sid !== S.sessionId) return
    if (r.status === 404) {
      Q.supported = false; Q.state = 'off'; Q.checkedSid = sid
      Q.items = []; Q.steering = []; Q.running = false; Q.note = ''
      renderQueue(); return
    }
    var j = await r.json().catch(function(){ return null })
    if (sid !== S.sessionId) return
    if (!r.ok) {
      Q.supported = true; Q.state = 'error'
      var lead = r.status === 501 ? '宿主不支持消息队列：'
        : r.status === 409 ? '队列暂时不可用：'
        : r.status === 400 ? '请求无效：' : '读取队列失败：'
      Q.note = lead + ((j && j.error) || ('HTTP ' + r.status))
      Q.noteBad = true
      renderQueue(); return
    }
    if (!j || j.ok !== true) {
      // 200 但形状不对：当作「这个宿主没有队列接口」，整块隐藏。
      // 404 之外的失败才会有上面那段中文说明；这里不制造占位噪音。
      Q.supported = false; Q.state = 'off'; Q.checkedSid = sid
      renderQueue(); return
    }
    Q.supported = true; Q.state = 'ok'
    Q.running = !!j.running
    Q.items = Array.isArray(j.items) ? j.items : []
    Q.steering = Array.isArray(j.steering) ? j.steering : []
    Q.counts = j.counts || { queued: Q.items.length, steering: Q.steering.length }
    Q.truncated = !!j.truncated
    if (!Q.noteBad) Q.note = ''
    renderQueue()
  } catch (e) {
    if (!silent) {
      Q.supported = true; Q.state = 'error'; Q.note = '读取队列失败：' + e.message; Q.noteBad = true
      renderQueue()
    }
  } finally { Q.busy = false }
}
async function moveQueue(id, delta){
  var idx = -1
  for (var i = 0; i < Q.items.length; i++) if (String(Q.items[i].id) === String(id)) { idx = i; break }
  var to = idx + delta
  if (idx < 0 || to < 0 || to >= Q.items.length) return
  var before = Q.items.slice()
  var next = Q.items.slice()
  var tmp = next[idx]; next[idx] = next[to]; next[to] = tmp
  Q.items = next
  Q.note = ''; Q.noteBad = false
  renderQueue()                             // 乐观更新：先动 UI
  try {
    var res = await postRaw('/taskwatch/chat/queue/reorder', {
      sessionId: S.sessionId,
      ids: Q.items.map(function(x){ return String(x.id) })
    })
    if (res.status === 404) {
      Q.supported = false; Q.state = 'off'; Q.items = before; renderQueue()
      notice('宿主没有注册队列重排接口', 4000)
      return
    }
    var j = res.data || {}
    if (res.status === 409 && j.code === 'queue-changed' && Array.isArray(j.current)) {
      Q.items = queueOrderFromIds(j.current)
      Q.note = '队列已变化，已按最新顺序显示'; Q.noteBad = true
      renderQueue()
      return
    }
    if (!res.ok || j.error) throw new Error(j.error || ('HTTP ' + res.status))
    if (Array.isArray(j.items)) Q.items = j.items
    if (Array.isArray(j.steering)) Q.steering = j.steering
    if (j.counts) Q.counts = j.counts
    Q.running = !!j.running
    Q.note = ''; Q.noteBad = false
    renderQueue()
  } catch (e) {
    Q.items = before                        // 失败回滚到乐观更新前的顺序
    Q.note = '重排失败：' + e.message; Q.noteBad = true
    renderQueue()
  }
}

async function uploadAttachment(a){
  var q = '?sessionId=' + encodeURIComponent(a.sessionId) + '&kind=' + encodeURIComponent(a.kind) +
    '&name=' + encodeURIComponent(a.name) + (a.kind === 'image' ? '&mime=' + encodeURIComponent(a.mime) : '')
  var r = await fetch('/taskwatch/chat/upload' + q, {
    method:'POST', headers:{ 'content-type':'application/octet-stream' }, body:a.file,
    signal:a.controller.signal, cache:'no-store'
  })
  var d = await r.json().catch(function(){ return { error:'HTTP ' + r.status } })

  catch (e) { if (!a.removed) { a.status = 'error'; a.error = e.message || '上传失败' } }
  if (S.sessionId === a.sessionId) { renderAttachmentTray(); wakeComposer() }
}
function chooseFiles(list, kind){

  if (sendingSessions[sessionId]) return

  var total = S.attachments.reduce(function(n,a){ return n + a.bytes }, 0)
  var images = { png:'image/png', jpg:'image/jpeg', jpeg:'image/jpeg', webp:'image/webp', gif:'image/gif' }
  var queued = []
  for (var i = 0; i < files.length; i++) {

    if (f.size > MAX_ATTACHMENT_BYTES || total + f.size > MAX_ATTACHMENT_BYTES) { attachmentNotice('每条消息的附件总大小不能超过 32 MB'); continue }
    var mime = f.type || images[extOf(f.name)] || ''

  if (cancelRiskOpen()) return

})

  if (sheet.hidden) sheetLastFocus = document.activeElement
  card.innerHTML = '<div class="grab"></div>' + html

  if (first) setTimeout(function(){ first.focus() }, 0)
}
sheet.addEventListener('keydown', function(e){
  if (e.key === 'Escape') {
    e.preventDefault()
    // 先收高危确认层（如果开着），再关抽屉：Esc 一次只退一步。
    if (cancelRiskOpen()) return
    closeSheet()
    return
  }
  if (e.key !== 'Tab') return
  var focusable = card.querySelectorAll('button,input,textarea,[tabindex]:not([tabindex="-1"])')
  if (!focusable.length) return
  var first = focusable[0], last = focusable[focusable.length - 1]
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus() }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus() }
})

      if (act === 'new') {
        closeSheet()
        openWsPicker()
      } else if (act === 'workspace') {
        closeSheet()
        openWsPicker()
      } else if (act === 'plugins') {
        openCapability('plugins')
      } else if (act === 'automation') {
        openCapability('automation')
      } else if (act === 'theme') {
        closeSheet()
        var dark = document.documentElement.getAttribute('data-theme') === 'dark'
        applyTheme(dark ? 'light' : 'dark', true)
      } else if (act === 'chatonly') {
        setChatOnly(!S.chatOnly, true)
        closeSheet()
        notice(S.chatOnly ? '只看对话：开（工具步骤已隐藏）' : '只看对话：关', 2000)
      } else if (act === 'poker') { closeSheet(); pkOpen() }
      else if (act === 'devices') { openDevices() }
      else if (act === 'subagents') { closeSheet(); openSubagents() }
    })
  }
  // 缺标题的会话：一次批量请求补齐（最多 12 个），到一条改一条。
  var need = []
  for (var n = 0; n < S.sessions.length && need.length < 12; n++) {
    if (!S.sessions[n].title && !titles[S.sessions[n].id]) need.push(S.sessions[n].id)
  }
  if (need.length) fillTitles(need)
}

/** 批量补标题：**分小批**请求，每回来一批就就地改一次标签。
 *
 *  为什么分批：宿主补一个标题要 1~2 次持久化读（实测约 0.5s/次），一批 12 个
 *  要 5 秒多。与其让用户对着 12 个 "Projects" 干等 5 秒，不如每 4 个刷一次 ——
 *  一两秒后前几条就有名字了。宿主侧和本机都有缓存，所以只有第一次会这样。
 */
async function fillTitles(ids){
  for (var i = 0; i < ids.length; i += 4) {
    var chunk = ids.slice(i, i + 4)
    var got
    try {
      var r = await fetch('/taskwatch/chat/titles?ids=' + encodeURIComponent(chunk.join(',')), { cache:'no-store' })
      if (!r.ok) continue
      got = await r.json()
    } catch (e) { continue }
    if (!got || !got.titles) continue
    for (var id in got.titles) {
      if (!got.titles[id]) continue
      titles[id] = got.titles[id]
      var el = card.querySelector('[data-sess="' + id + '"] .t')
      if (el) el.textContent = titles[id]
      if (id === S.sessionId) $('sessTitle').textContent = titles[id]
    }
    try { localStorage.setItem('taskwatch.titles', JSON.stringify(titles)) } catch (e) {}
  }
}

// ---------------------------------------------------------------------------
// 手机端一次性审批（v1.8.0）
// ---------------------------------------------------------------------------
// v1.8.8：高危动作的第二步。risk 完全由宿主算好，页面只读 'high' | 'normal'；
// 这里**没有**任何按文案/工具名猜风险的正则 —— 页面无权自己决定什么叫危险。
// 打开状态按 pending id 记在 RISK_OPEN 里：卡片每 5 秒会按数据重建，状态放在
// DOM 上的话，手指还没抬起来确认层就被轮询刷没了。
var RISK_OPEN = Object.create(null)

function riskIsHigh(p){ return String((p && p.risk) || '') === 'high' }
function riskConfirmEnabled(){
  var d = homeData()
  return !d || d.riskConfirm !== false
}
function riskOpenOf(id){ return !!(id && RISK_OPEN[String(id)]) }
function riskNoteHtml(p){
  return riskIsHigh(p)
    ? '<span class="summary risk-note">这条会改动文件或发布，确认前请看清</span>'
    : ''
}
/** 卡片内的确认层。默认带 hidden，由 RISK_OPEN 决定展开；重建后状态不丢。
 *  文案里刻意把「工具」与「原因」分开列：原因可能很长，单独一行才读得清。 */
function riskConfirmHtml(p, id){
  if (!riskIsHigh(p)) return ''
  var open = riskOpenOf(id)
  var tool = String(p.title || '工具调用')
  var reason = String(p.detail || '').trim()
  var h = '<div class="risk-confirm" data-risk-confirm role="group" aria-label="高危操作确认"'
    + (open ? '' : ' hidden') + '>' +
    '<p class="risk-confirm-title">确认执行？此操作不可撤销</p>' +
    '<p class="risk-confirm-line"><span class="risk-key">工具</span>' +
      '<span class="risk-val">' + esc(tool) + '</span></p>'
  if (reason) {
    h += '<p class="risk-confirm-line"><span class="risk-key">原因</span>' +
      '<span class="risk-val">' + esc(reason) + '</span></p>'
  }
  h += '<span class="approval-actions">' +
      '<button type="button" class="approval-cancel" data-risk-cancel="' + esc(id) + '">取消</button>' +
      '<button type="button" class="risk-ok" data-risk-ok="' + esc(id) + '">确认执行</button>' +
    '</span></div>'
  return h
}
/** 审批动作行 + 可能展开的确认层。确认层展开时主按钮 disabled（不是隐藏）：
 *  用户仍看得到"我本来要点的是批准"，但按不动。 */
function approvalActionsHtml(p, id){
  var locked = riskOpenOf(id) ? ' disabled' : ''
  return '<span class="approval-actions">' +
    '<button type="button" class="approval-allow" data-approve="' + esc(id) + '"' + locked + '>批准一次</button>' +
    '<button type="button" class="approval-reject" data-reject="' + esc(id) + '"' + locked + '>拒绝</button>' +
  '</span>' + riskConfirmHtml(p, id)
}
function syncRiskMask(){
  var on = false
  for (var k in RISK_OPEN) {
    if (Object.prototype.hasOwnProperty.call(RISK_OPEN, k)) { on = true; break }
  }
  var mask = $('riskMask')
  if (mask) mask.hidden = !on
}
/** 待办已经不在快照里（被桌面处理 / 过期）时，别留下一个打不开的遮罩。 */
function pruneRiskState(){
  var list = (homeData() && homeData().pending) || []
  var live = Object.create(null)
  for (var i = 0; i < list.length; i++) {
    if (list[i] && list[i].id) live[String(list[i].id)] = true
  }
  for (var k in RISK_OPEN) if (!live[k]) delete RISK_OPEN[k]
  syncRiskMask()
}
function focusRiskButton(id, selector){
  var el = findApprovalCard(id)
  if (!el) return
  var b = el.querySelector(selector)
  if (!b || typeof b.focus !== 'function') return
  try { b.focus() } catch (e) { /* focus 失败不影响交互 */ }
}
function setRiskOpen(id, open){
  id = String(id || '')
  if (!id) return false
  if (open) RISK_OPEN[id] = true
  else delete RISK_OPEN[id]
  var roots = approvalRoots()
  for (var r = 0; r < roots.length; r++) {
    var cards = roots[r].querySelectorAll('[data-pending-id]')
    for (var i = 0; i < cards.length; i++) {
      if (String(cards[i].getAttribute('data-pending-id')) !== id) continue
      cards[i].classList.toggle('risk-open', open)
      var box = cards[i].querySelector('[data-risk-confirm]')
      if (box) box.hidden = !open
      var acts = cards[i].querySelectorAll('[data-approve],[data-reject]')
      for (var j = 0; j < acts.length; j++) acts[j].disabled = open
    }
  }
  syncRiskMask()
  // 焦点落在更安全的那个键上：展开时是「取消」，收起时回到「批准一次」。
  focusRiskButton(id, open ? '[data-risk-cancel]' : '[data-approve]')
  return true
}
function cancelRiskOpen(){
  var ids = []
  for (var k in RISK_OPEN) if (Object.prototype.hasOwnProperty.call(RISK_OPEN, k)) ids.push(k)
  if (!ids.length) return false
  for (var i = 0; i < ids.length; i++) setRiskOpen(ids[i], false)
  return true
}
/** 只有「确认执行」真的发请求；取消 / 遮罩 / Esc 都只收层。 */
function openRiskConfirm(id){ return setRiskOpen(id, true) }
function confirmRiskAllow(id){
  setRiskOpen(id, false)
  submitApproval(id, 'allow')
}
function fmtApprovalLeft(ms){
  var total = Math.max(0, Math.ceil(ms / 1000))
  return String(Math.floor(total / 60)).padStart(2, '0') + ':' + String(total % 60).padStart(2, '0')
}
function findApprovalCard(id){
  // 同一件事可能同时画在首页与「任务详情」抽屉里：两张卡都指向同一个 decision id，
  // 谁被点就更新谁，但查的时候两边都要找得到。
  var roots = approvalRoots()
  for (var r = 0; r < roots.length; r++) {
    var cards = roots[r].querySelectorAll('[data-pending-id]')
    for (var i = 0; i < cards.length; i++) {
      if (cards[i].getAttribute('data-pending-id') === String(id)) return cards[i]
    }
  }
  return null
}
function pendingItem(id){
  // 首页在断网时会继续显示**上次读到的好数据**，所以这里也必须从同一份数据里取 ——
  // 否则那条卡上的「批准一次」会因为 lastData 被离线空快照覆盖而静默失效。
  var list = (homeData() && homeData().pending) || []
  for (var i = 0; i < list.length; i++) if (String(list[i].id) === String(id)) return list[i]
  return null
}
function stopApprovalTimer(){
  if (APPROVAL_TIMER) { clearInterval(APPROVAL_TIMER); APPROVAL_TIMER = 0 }
}
function expireApprovalCard(el){
  if (!el) return
  el.removeAttribute('data-expires')
  var pid = el.getAttribute('data-pending-id')
  var p = pid ? pendingItem(pid) : null
  if (p) p.canDecide = false
  if (pid) { delete RISK_OPEN[String(pid)]; syncRiskMask() }
  el.classList.remove('risk-open')
  if (pid) homeSettled(pid, '已退回桌面', true)
  if (String(el.className || '').indexOf('q-card') >= 0) {
    // 提问卡：所有同 id 的卡一起收起，选项与自定义输入一并禁用。
    var qcards = questionCardsOf(pid)
    for (var q = 0; q < qcards.length; q++) finishQuestionCard(qcards[q], '已退回桌面', true, '已退回')
    return
  }
  var badge = el.querySelector('.badge')
  if (badge) { badge.textContent = '已退回'; badge.className = 'badge handled' }
  var left = el.querySelector('[data-left]')
  var actions = el.querySelector('.approval-actions')
  var hint = el.querySelector('[data-hint]')
  var state = el.querySelector('[data-state]')
  if (left) left.hidden = true
  if (actions) actions.hidden = true
  if (hint) hint.hidden = true
  if (state) {
    state.hidden = false
    state.className = 'approval-state delegated'
    state.textContent = '已退回桌面'
  }
}
function refreshApprovalCountdown(){
  var roots = approvalRoots()
  var active = 0
  for (var r = 0; r < roots.length; r++) {
    var cards = roots[r].querySelectorAll('[data-expires]')
    for (var i = 0; i < cards.length; i++) {
      var el = cards[i]
      var exp = Number(el.getAttribute('data-expires'))
      if (!exp) continue
      var left = exp - Date.now()
      if (left <= 0) { expireApprovalCard(el); continue }
      active++
      var label = el.querySelector('[data-left]')
      if (label) label.textContent = '剩余 ' + fmtApprovalLeft(left)
    }
  }
  if (!active) stopApprovalTimer()
  else if (!APPROVAL_TIMER) APPROVAL_TIMER = setInterval(refreshApprovalCountdown, 1000)
}
function bindApprovals(){
  var roots = approvalRoots()
  for (var r = 0; r < roots.length; r++) {
    var allows = roots[r].querySelectorAll('[data-approve]')
    for (var i = 0; i < allows.length; i++) {
      if (allows[i].getAttribute('data-tw-bound')) continue
      allows[i].setAttribute('data-tw-bound', '1')
      allows[i].addEventListener('click', function(){
        requestApprovalConfirm(this.getAttribute('data-approve'))
      })
    }
    var rejects = roots[r].querySelectorAll('[data-reject]')
    for (var j = 0; j < rejects.length; j++) {
      if (rejects[j].getAttribute('data-tw-bound')) continue
      rejects[j].setAttribute('data-tw-bound', '1')
      rejects[j].addEventListener('click', function(){
        // 拒绝不放行任何东西，不弹二次确认；批准才弹。
        submitApproval(this.getAttribute('data-reject'), 'reject')
      })
    }
    // ── 高危确认层（v1.8.8）──
    var riskOks = roots[r].querySelectorAll('[data-risk-ok]')
    for (var ro = 0; ro < riskOks.length; ro++) {
      if (riskOks[ro].getAttribute('data-tw-bound')) continue
      riskOks[ro].setAttribute('data-tw-bound', '1')
      riskOks[ro].addEventListener('click', function(){
        confirmRiskAllow(this.getAttribute('data-risk-ok'))
      })
    }
    var riskCancels = roots[r].querySelectorAll('[data-risk-cancel]')
    for (var rc = 0; rc < riskCancels.length; rc++) {
      if (riskCancels[rc].getAttribute('data-tw-bound')) continue
      riskCancels[rc].setAttribute('data-tw-bound', '1')
      riskCancels[rc].addEventListener('click', function(){
        cancelRiskOpen()
      })
    }
    var answers = roots[r].querySelectorAll('[data-answer]')
    for (var k = 0; k < answers.length; k++) {
      if (answers[k].getAttribute('data-tw-bound')) continue
      answers[k].setAttribute('data-tw-bound', '1')
      answers[k].addEventListener('click', function(){
        // 未知类型待办的去处；选项式提问已经能在这里直接回答，不再走这条路。
        openSession(this.getAttribute('data-answer'))
      })
    }
    // ── 选项式提问（v1.8.3）──
    var qopts = roots[r].querySelectorAll('[data-qopt]')
    for (var qo = 0; qo < qopts.length; qo++) {
      if (qopts[qo].getAttribute('data-tw-bound')) continue
      qopts[qo].setAttribute('data-tw-bound', '1')
      qopts[qo].addEventListener('click', function(){ onQuestionOption(this) })
    }
    var qtoggles = roots[r].querySelectorAll('[data-qcustom-toggle]')
    for (var qt = 0; qt < qtoggles.length; qt++) {
      if (qtoggles[qt].getAttribute('data-tw-bound')) continue
      qtoggles[qt].setAttribute('data-tw-bound', '1')
      qtoggles[qt].addEventListener('click', function(){ onQuestionCustomToggle(this) })
    }
    var qplains = roots[r].querySelectorAll('[data-qplain]')
    for (var qp = 0; qp < qplains.length; qp++) {
      if (qplains[qp].getAttribute('data-tw-bound')) continue
      qplains[qp].setAttribute('data-tw-bound', '1')
      qplains[qp].addEventListener('input', function(){ onQuestionCustomInput(this) })
    }
    var qsubs = roots[r].querySelectorAll('[data-qsubmit]')
    for (var qs = 0; qs < qsubs.length; qs++) {
      if (qsubs[qs].getAttribute('data-tw-bound')) continue
      qsubs[qs].setAttribute('data-tw-bound', '1')
      qsubs[qs].addEventListener('click', function(){ submitAnswer(this.getAttribute('data-qsubmit')) })
    }
  }
  pruneRiskState()
  refreshApprovalCountdown()
}
function closeApprovalConfirm(){
  var el = $('approveConfirm')
  if (el) el.hidden = true
}
function requestApprovalConfirm(id){
  var p = pendingItem(id)
  if (!p) return
  if (riskIsHigh(p)) {
    // 高危：就地展开确认层，不直接发请求。关掉 riskConfirm 时只剩徽标，
    // 点击直接提交 —— 这是配置明确要求的取舍，README 写清了会失去什么。
    if (!riskConfirmEnabled()) { submitApproval(id, 'allow'); return }
    openRiskConfirm(id)
    return
  }
  var text = String(p.title || '工具调用')
  var detail = String(p.detail || '').trim()
  if (detail) text += ' · ' + (detail.length > 160 ? detail.slice(0, 160) + '…' : detail)
  $('approveConfirmText').textContent = text
  var el = $('approveConfirm')
  el.hidden = false
  var ok = el.querySelector('[data-confirm-ok]')
  if (ok) ok.onclick = function(){ closeApprovalConfirm(); submitApproval(id, 'allow') }
}
$('approveConfirm').addEventListener('click', function(e){
  if (e.target === this || (e.target.closest && e.target.closest('[data-confirm-cancel]'))) closeApprovalConfirm()
})
// 点遮罩 = 取消：只收起确认层，不发请求，卡片回到可操作态。
$('riskMask').addEventListener('click', function(){ cancelRiskOpen() })
document.addEventListener('keydown', function(e){
  if (e.key !== 'Escape') return
  if (!$('approveConfirm').hidden) { e.preventDefault(); closeApprovalConfirm(); return }
  if (cancelRiskOpen()) e.preventDefault()
})
function finishApproval(el, text){
  if (!el) return
  el.removeAttribute('data-expires')
  var pid = el.getAttribute('data-pending-id')
  var p = pid ? pendingItem(pid) : null
  if (p) p.canDecide = false
  // 处理完 / 过期后确认层必须一起收掉，否则会留下一个指向已结束决定的空壳。
  if (pid) { delete RISK_OPEN[String(pid)]; syncRiskMask() }
  el.classList.remove('risk-open')
  var riskBox = el.querySelector('[data-risk-confirm]')
  if (riskBox) riskBox.hidden = true
  // 首页每次轮询都会按数据重建卡片；把"刚刚发生了什么"记在这张卡对应的 id 上，
  // 重建之后仍然显示「已处理 · 已提交」，不会又冒出两颗按钮。
  if (pid) homeSettled(pid, text, false)
  var badge = el.querySelector('.badge')
  if (badge) { badge.textContent = '已处理'; badge.className = 'badge handled' }
  var actions = el.querySelector('.approval-actions')
  var left = el.querySelector('[data-left]')
  var hint = el.querySelector('[data-hint]')
  var state = el.querySelector('[data-state]')
  if (actions) actions.hidden = true
  if (left) left.hidden = true
  if (hint) hint.hidden = true
  if (state) {
    state.hidden = false
    state.className = 'approval-state'
    state.textContent = text
  }
  refreshApprovalCountdown()
}
async function submitApproval(id, decision){
  var el = findApprovalCard(id)
  if (!el) return
  var buttons = el.querySelectorAll('.approval-actions button')
  for (var i = 0; i < buttons.length; i++) buttons[i].disabled = true
  var hint = el.querySelector('[data-hint]')
  try {
    var r = await fetch('/taskwatch/approve', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ id: id, decision: decision }),
    })
    var j = {}
    try { j = await r.json() } catch (e) {}
    if (r.ok && j && j.ok) {
      finishApproval(el, decision === 'allow' ? '已提交 · 允许一次' : '已提交 · 拒绝')
      return
    }
    if (r.status === 409 || r.status === 410) {
      finishApproval(el, '已由桌面处理')
      return
    }
    throw new Error((j && j.error) || ('HTTP ' + r.status))
  } catch (e) {
    for (var k = 0; k < buttons.length; k++) buttons[k].disabled = false
    if (hint) {
      hint.hidden = false
      hint.className = 'approval-hint bad'
      hint.textContent = '提交失败，可重试 · 120 秒无响应会退回桌面'
    }
  }
}

// ---------------------------------------------------------------------------
// 选项式提问 / 计划审批（v1.8.3，P0 第二类）
//
// 宿主把 pending 里的 kind:'question' 交给这一组函数：单题 / 多题、单选 / 多选、
// 计划审批、自定义回答、倒计时、409/410 全部走同一个 renderer + submitter。
// 首页待办区、任务详情抽屉、会话页问答条共用 questionCardHtml —— 三处不是三套 UI。
//
// 状态（选中项 / 自定义草稿 / 展开与否）放在 QSTATE 里、按 pending id 索引：
// 页面每 5 秒轮询一次会重建 innerHTML，状态放 DOM 上的话手指还没抬起来就丢了。
// ---------------------------------------------------------------------------
var QSTATE = Object.create(null)

function isQuestionItem(p){ return String((p && p.kind) || '') === 'question' }
function questionItemsOf(p){
  if (p && Array.isArray(p.questions) && p.questions.length) return p.questions
  // 兼容只带扁平字段的快照（旧宿主 / 中继中转）：当成一道题。
  if (p && Array.isArray(p.options)) {
    return [{
      id: String(p.questionId || p.id || 'q'),
      question: String(p.detail || p.title || ''),
      header: '',
      options: p.options,
      multiSelect: p.multiSelect === true,
      intent: p.intent || null
    }]
  }
  return []
}
function qStateOf(id){
  if (!QSTATE[id]) QSTATE[id] = { sel:{}, custom:{}, open:{}, busy:false }
  return QSTATE[id]
}
function qSelectedOf(st, qi){ return (st && st.sel && st.sel[qi]) || [] }
function qCustomOf(st, qi){ return String((st && st.custom && st.custom[qi]) || '') }
/** 一道题算不算答完：选了选项，或者写了自定义回答。只展开输入框不算。 */
function qItemAnswered(item, st, qi){
  if (!item) return false
  return qSelectedOf(st, qi).length > 0 || qCustomOf(st, qi).trim().length > 0
}
function qAllAnswered(p, st){
  var items = questionItemsOf(p)
  if (!items.length) return false
  for (var i = 0; i < items.length; i++) if (!qItemAnswered(items[i], st, i)) return false
  return true
}
function qPlanOf(p, item){
  var intent = (item && item.intent) || (p && p.intent) || null
  return intent && intent.kind === 'plan-review' ? intent : null
}

/** 一张提问卡。选项是 ≥44px 的整行按钮，description 是第二行小字。
 *  multiSelect 只换 .q-mark 的形状（圆 / 方），不换交互模型 —— 点按仍然是切换。 */
function questionCardHtml(p){
  p = p || {}
  var id = String(p.id || '')
  var items = questionItemsOf(p)
  var st = qStateOf(id)
  var plan = qPlanOf(p)
  var canDecide = p.canDecide === true && !!id
  var left = fmtApprovalLeft(Number(p.expiresAt) - Date.now())
  var h = '<div class="pending-card q-card" data-pending-id="' + esc(id) + '"' +
    (canDecide ? ' data-expires="' + esc(String(p.expiresAt || 0)) + '"' : '') + '>' +
    '<span class="badge">待回答</span><span class="body">' +
    '<span class="q-titleline">' +
      '<span class="title">' + esc(p.title || '一个问题') + '</span>' +
      (plan ? '<span class="q-plan">计划审批</span>' : '') +
    '</span>'
  var detail = String(p.detail || '')
  if (detail && detail !== String(p.title || '')) {
    h += '<span class="summary">' + esc(detail) + '</span>'
  }
  h += '<div class="q-list">'
  for (var i = 0; i < items.length; i++) {
    var item = items[i] || {}
    var multi = item.multiSelect === true
    var planItem = qPlanOf(p, item)
    var selected = qSelectedOf(st, i)
    var answered = qItemAnswered(item, st, i)
    var head = String(item.header || '')
    var text = String(item.question || '')
    h += '<div class="q-item' + (multi ? ' q-multi' : '') + '" data-qitem="' + i + '">'
    if (items.length > 1 || head || text) {
      // 第一题的 header 就是卡片标题，再写一遍是重复；只在多题里用它区分题号。
      var showHead = head && head !== String(p.title || '')
      h += '<div class="q-question">' +
        (showHead ? '<span class="q-h">' + esc(head) + '</span>' : '') +
        (text && text !== String(p.title || '') ? '<span>' + esc(text) + '</span>' : '') +
        '<span class="q-need"' + (answered ? ' hidden' : '') + ' data-qneed="' + i + '">待回答</span>' +
        '</div>'
    }
    h += '<div class="q-options" role="group" aria-label="' + esc(head || text || p.title || '选项') + '">'
    var opts = Array.isArray(item.options) ? item.options : []
    for (var k = 0; k < opts.length; k++) {
      var o = opts[k] || {}
      var label = String(o.label || '')
      if (!label) continue
      var on = selected.indexOf(label) >= 0
      var primary = Boolean(planItem && planItem.approve && label === planItem.approve)
      h += '<button type="button" class="q-opt' + (primary ? ' q-primary' : '') + '"' +
        ' data-qopt="' + i + '" data-qval="' + esc(label) + '" aria-pressed="' + (on ? 'true' : 'false') + '">' +
        '<span class="q-mark" aria-hidden="true"></span>' +
        '<span class="q-text"><span class="q-label">' + esc(label) +
          (primary ? '<span class="q-tag">计划审批</span>' : '') + '</span>' +
        (o.description ? '<span class="q-desc">' + esc(o.description) + '</span>' : '') +
        '</span></button>'
    }
    h += '</div>' +
      '<button type="button" class="q-custom-toggle" data-qcustom-toggle="' + i + '"' +
      ' aria-expanded="' + (st.open[i] ? 'true' : 'false') + '">' +
      '<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true" focusable="false">' +
        '<path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.6"' +
        ' stroke-linecap="round" stroke-linejoin="round"/></svg>' +
      '<span data-qctext>' + (st.open[i] ? '收起自定义回答' : '自定义回答') + '</span>' +
      '<span class="q-hint"' + (st.open[i] ? ' hidden' : '') + '>可选，也可以写一句话</span>' +
      '</button>' +
      '<div class="q-custom" data-qcustom="' + i + '"' + (st.open[i] ? '' : ' hidden') + '>' +
      '<textarea class="q-custom-input" data-qplain="' + i + '" rows="2" maxlength="2000"' +
      ' placeholder="直接写下你的回答…" aria-label="自定义回答">' + esc(qCustomOf(st, i)) + '</textarea>' +
      '</div>'
    h += '</div>'
  }
  h += '</div>'
  if (items.length > 1) {
    var done = 0
    for (var d = 0; d < items.length; d++) if (qItemAnswered(items[d], st, d)) done++
    h += '<span class="q-count" data-qcount>' + done + ' / ' + items.length + ' 题已回答</span>'
  }
  h += '<span class="approval-left" data-left>剩余 ' + esc(left) + '</span>' +
    '<span class="q-actions"><button type="button" class="q-submit" data-qsubmit="' + esc(id) + '"' +
    (canDecide && qAllAnswered(p, st) ? '' : ' disabled') + '>提交回答</button></span>' +
    '<span class="approval-hint" data-hint>' + (items.length > 1 ? '答完所有题目才能提交 · ' : '') +
    '倒计时结束会退回桌面</span>' +
    '<span class="approval-state" data-state hidden></span>' +
    '</span></div>'
  return h
}

/** 找出某个 id 的所有卡（首页 / 抽屉 / 会话条可能同时有）。 */
function questionCardsOf(id){
  var roots = approvalRoots()
  var want = String(id)
  var out = []
  for (var r = 0; r < roots.length; r++) {
    var cards = roots[r].querySelectorAll('.q-card')
    for (var i = 0; i < cards.length; i++) {
      if (cards[i].getAttribute('data-pending-id') === want) out.push(cards[i])
    }
  }
  return out
}

/** 把 QSTATE 写回 DOM：选中态、待回答标记、题数、提交键可用性。
 *  故意**不**回写 textarea 的 value —— 那会在打字时跳光标。 */
function qSyncCard(card){
  if (!card) return
  var id = card.getAttribute('data-pending-id')
  var p = pendingItem(id)
  if (!p) return
  var items = questionItemsOf(p)
  var st = qStateOf(id)
  var done = 0
  for (var i = 0; i < items.length; i++) {
    var answered = qItemAnswered(items[i] || {}, st, i)
    if (answered) done++
    var opts = card.querySelectorAll('[data-qopt="' + i + '"]')
    var selected = qSelectedOf(st, i)
    for (var k = 0; k < opts.length; k++) {
      var label = opts[k].getAttribute('data-qval')
      opts[k].setAttribute('aria-pressed', selected.indexOf(label) >= 0 ? 'true' : 'false')
    }
    var need = card.querySelector('[data-qneed="' + i + '"]')
    if (need) need.hidden = answered
    var wrap = card.querySelector('[data-qcustom="' + i + '"]')
    var open = st.open[i] === true
    if (wrap) wrap.hidden = !open
    var toggle = card.querySelector('[data-qcustom-toggle="' + i + '"]')
    if (toggle) {
      toggle.setAttribute('aria-expanded', open ? 'true' : 'false')
      // 只换文案，别用 textContent 整段覆盖 —— 那会把箭头 SVG 与提示一起抹掉。
      var label = toggle.querySelector('[data-qctext]')
      if (label) label.textContent = open ? '收起自定义回答' : '自定义回答'
      var hint = toggle.querySelector('.q-hint')
      if (hint) hint.hidden = open
    }
  }
  var submit = card.querySelector('[data-qsubmit]')
  if (submit) submit.disabled = st.busy || p.canDecide !== true || !qAllAnswered(p, st)
  var count = card.querySelector('[data-qcount]')
  if (count) count.textContent = done + ' / ' + items.length + ' 题已回答'
}

function onQuestionOption(btn){
  var card = btn.closest ? btn.closest('.q-card') : null
  if (!card) return
  var id = card.getAttribute('data-pending-id')
  var p = pendingItem(id)
  if (!p || p.canDecide !== true) return
  var items = questionItemsOf(p)
  var qi = Number(btn.getAttribute('data-qopt')) || 0
  var item = items[qi] || {}
  var label = btn.getAttribute('data-qval') || ''
  if (!label) return
  var st = qStateOf(id)
  var cur = qSelectedOf(st, qi).slice()
  if (item.multiSelect === true) {
    var at = cur.indexOf(label)
    if (at >= 0) cur.splice(at, 1)
    else cur.push(label)
  } else {
    // 单选：点一下就选中，再点同一下也只是保持选中 —— 取消选择没有意义，
    // 误触的代价应该是"改了选择"，而不是"交了白卷"。
    cur = [label]
  }
  st.sel[qi] = cur
  qSyncCard(card)
}

function onQuestionCustomToggle(btn){
  var card = btn.closest ? btn.closest('.q-card') : null
  if (!card) return
  var id = card.getAttribute('data-pending-id')
  var qi = Number(btn.getAttribute('data-qcustom-toggle')) || 0
  var st = qStateOf(id)
  st.open[qi] = st.open[qi] !== true
  qSyncCard(card)
  if (st.open[qi]) {
    var ta = card.querySelector('[data-qplain="' + qi + '"]')
    if (ta) { try { ta.focus() } catch (e) {} }
  }
}

function onQuestionCustomInput(el){
  var card = el.closest ? el.closest('.q-card') : null
  if (!card) return
  var id = card.getAttribute('data-pending-id')
  var qi = Number(el.getAttribute('data-qplain')) || 0
  var st = qStateOf(id)
  st.custom[qi] = String(el.value || '')
  qSyncCard(card)
}

/** 收起一张卡并写一行状态。badgeText 允许区分「已处理 / 已退回」。 */
function finishQuestionCard(card, text, delegated, badgeText){
  if (!card) return
  card.removeAttribute('data-expires')
  card.classList.add('q-done')
  var badge = card.querySelector('.badge')
  if (badge) {
    badge.textContent = badgeText || '已处理'
    badge.className = 'badge handled'
  }
  var actions = card.querySelector('.q-actions')
  var left = card.querySelector('[data-left]')
  var hint = card.querySelector('[data-hint]')
  var state = card.querySelector('[data-state]')
  if (actions) actions.hidden = true
  if (left) left.hidden = true
  if (hint) hint.hidden = true
  if (state) {
    state.hidden = false
    state.className = 'approval-state' + (delegated ? ' delegated' : '')
    state.textContent = text
  }
  var inputs = card.querySelectorAll('[data-qopt],[data-qcustom-toggle],[data-qplain],[data-qsubmit]')
  for (var i = 0; i < inputs.length; i++) { try { inputs[i].disabled = true } catch (e) {} }
}

/** 一次提问的终局：三处同 id 的卡一起收起，并记进 HOME.settled 让轮询重建时不再复活。 */
function finishQuestion(id, text, delegated, badgeText){
  var p = pendingItem(id)
  if (p) p.canDecide = false
  var cards = questionCardsOf(id)
  for (var i = 0; i < cards.length; i++) finishQuestionCard(cards[i], text, delegated, badgeText)
  homeSettled(id, text, delegated)
  refreshApprovalCountdown()
}

function qHintAll(id, text, bad){
  var cards = questionCardsOf(id)
  for (var i = 0; i < cards.length; i++) {
    var hint = cards[i].querySelector('[data-hint]')
    if (!hint) continue
    hint.hidden = false
    hint.className = 'approval-hint' + (bad ? ' bad' : '')
    hint.textContent = text
  }
}

async function submitAnswer(id){
  var p = pendingItem(id)
  if (!p || p.canDecide !== true) return
  if (!qAllAnswered(p, qStateOf(id))) {
    qHintAll(id, '还有题目没回答，答完才能提交', true)
    return
  }
  var items = questionItemsOf(p)
  var st = qStateOf(id)
  var answers = []
  for (var i = 0; i < items.length; i++) {
    var selected = qSelectedOf(st, i).slice()
    var custom = qCustomOf(st, i).trim()
    var a = { id: String(items[i].id || ''), selected: selected }
    if (custom) a.custom = custom.slice(0, 2000)
    answers.push(a)
  }
  st.busy = true
  var cards = questionCardsOf(id)
  for (var c = 0; c < cards.length; c++) {
    var btns = cards[c].querySelectorAll('[data-qopt],[data-qcustom-toggle],[data-qplain],[data-qsubmit]')
    for (var k = 0; k < btns.length; k++) btns[k].disabled = true
    qSyncCard(cards[c])
  }
  qHintAll(id, '提交中…', false)
  try {
    var r = await fetch('/taskwatch/answer', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ id: id, answers: answers })
    })
    var j = {}
    try { j = await r.json() } catch (e) {}
    // 409 = 已经答过（重复提交）；410 = 过期或已交还桌面。两者对用户的含义一样：
    // 这件事不再需要你在手机上处理。
    if (r.status === 409 || r.status === 410) {
      finishQuestion(id, '已由桌面处理', true)
      return
    }
    if (!r.ok || !j || !j.ok) throw new Error((j && j.error) || ('HTTP ' + r.status))
    finishQuestion(id, '已提交', false)
  } catch (e) {
    // 网络失败：保留已选内容与自定义草稿，重新放开按钮让用户再试一次。
    st.busy = false
    var again = questionCardsOf(id)
    for (var c2 = 0; c2 < again.length; c2++) {
      var btns2 = again[c2].querySelectorAll('[data-qopt],[data-qcustom-toggle],[data-qplain]')
      for (var k2 = 0; k2 < btns2.length; k2++) btns2[k2].disabled = false
      qSyncCard(again[c2])
    }
    qHintAll(id, '提交失败，可重试 · 倒计时结束会退回桌面', true)
  }
}

/** 会话页问答条：当前会话的待答提问压在输入框上方。
 *  用内容指纹去重 —— 流式输出期间 renderAll 很频繁，每帧重建会打断输入。 */
var ASK_SIG = ''
function renderSessionAsk(){
  var box = $('askBar')
  if (!box) return
  var show = !S.home && !S.agentView && !!S.sessionId
  var list = []
  if (show) {
    var pend = homeData().pending || []
    for (var i = 0; i < pend.length; i++) {
      var p = pend[i]
      if (!isQuestionItem(p) || p.canDecide !== true) continue
      if (!questionItemsOf(p).length) continue
      if (String(p.session || '') && String(p.session) !== String(S.sessionId)) continue
      list.push(p)
    }
  }
  var sig = ''
  for (var k = 0; k < list.length; k++) sig += String(list[k].id) + ':' + String(list[k].expiresAt || 0) + '|'
  if (sig === ASK_SIG && box.hidden === !list.length) return
  ASK_SIG = sig
  if (!list.length) { box.hidden = true; box.textContent = ''; return }
  var h = ''
  for (var m = 0; m < list.length; m++) h += questionCardHtml(list[m])
  box.innerHTML = h
  box.hidden = false
  bindApprovals()
}

// ---------------------------------------------------------------------------
// 首页：待办优先（v1.8.2，P1）
//
// 第一性原理：离屏的人打开手机，想知道的是「现在有什么在等我 / 值不值得我介入」，
// 不是某段对话的正文。所以首页只回答四个问题，进入会话是第二层：
//   1. 在等你 N 件（header 标题位）→ 能直接点的待办卡；
//   2. 在跑的是哪几条、跑到哪一步、跑了多久；
//   3. 后台任务 / 子代理 / 今日轮次，一行说完；
//   4. 继续上次会话 / 全部会话。
//
// 两条硬约束写在这里，省得以后有人顺手加个横幅：
//   · 首屏（390×844）不滚动就要看到「在等你 N 件」与第一张待办卡；
//   · 待办卡复用 .pending-card + v1.8.0 的 submitApproval / 二次确认 / 倒计时，
//     首页不另写一套审批逻辑（approvalRoots() 让同一份处理函数管两个容器）。
// ---------------------------------------------------------------------------
var HOME = { more:false, settled:Object.create(null), todoSig:'', dirty:false, view:true }

/** 最近一次「读到的好数据」。断网时 service worker 回的是空快照，
 *  直接拿它渲染等于把首页清空 —— 而首页要的恰恰是「上次看到的状态」。 */
var HOME_GOOD = null, HOME_GOOD_AT = 0

function homeBroken(d){
  d = d || {}
  return !!d.error || d.offline === true || !!(d.errors && d.errors.length)
}
function homeData(){
  if (HOME_GOOD && homeBroken(lastData)) return HOME_GOOD
  return lastData || {}
}
function homeStale(){
  if (!HOME_GOOD || !homeBroken(lastData)) return null
  var d = lastData || {}
  var why = d.error || (d.errors && d.errors[0]) || '连不上电脑'
  return { at:HOME_GOOD_AT, error:String(why) }
}
/** 审批 / 提问处理函数要扫的容器：首页待办区、任务详情抽屉、会话页问答条。
 *  三处共用同一份处理函数，新增容器只改这一处。 */
function approvalRoots(){
  var out = []
  var h = $('homeTodo')
  if (h) out.push(h)
  var c = $('card')
  if (c) out.push(c)
  var a = $('askBar')
  if (a) out.push(a)
  return out
}
/** 记下某张待办卡的结局（id → 文案）。首页重建时据此显示「已处理」。 */
function homeSettled(id, text, delegated){
  if (!id) return
  HOME.settled[String(id)] = { text:String(text || '已处理'), delegated:!!delegated }
  HOME.dirty = true                    // 下一次轮询强制重建一次，卡片状态跟上
}

function homePending(){
  var d = homeData()
  var list = Array.isArray(d.pending) ? d.pending.slice() : []
  // 能直接决定的排最前：首页第一眼要看到的是「能点的那件事」。
  list.sort(function(a, b){
    var ac = a && a.canDecide === true ? 0 : 1
    var bc = b && b.canDecide === true ? 0 : 1
    if (ac !== bc) return ac - bc
    return (Number(a && a.at) || 0) - (Number(b && b.at) || 0)
  })
  return list
}
function homeIsApproval(p){ return String((p && p.kind) || '').indexOf('approval') === 0 }
function homeSessionOf(p){ return String((p && (p.session || p.sessionId)) || '') }

/** 一张待办卡。可决定的审批与抽屉里那套结构逐字一致（data-approve / data-reject /
 *  data-expires），所以按钮、二次确认、倒计时、409/410 文案全部共用一条代码路径。
 *
 *  v1.8.3：kind:'question' 走 questionCardHtml（选项行 / 多题 / 计划审批 / 自定义），
 *  同一张卡在首页、抽屉、会话问答条里长得一样。 */
function homeCardHtml(p){
  p = p || {}
  var isApproval = homeIsApproval(p)
  var isQuestion = isQuestionItem(p)
  var id = String(p.id || '')
  var settled = id ? HOME.settled[id] : null
  var canDecide = (isApproval || isQuestion) && p.canDecide === true && !!id && !settled
  var summary = String(p.detail || p.summary ||
    (isApproval ? '请在桌面端批准后继续'
      : (isQuestion ? '请在桌面端补充回答后继续' : '请在桌面端处理')))
  var who = String(p.sessionTitle || shortId(homeSessionOf(p)) || '')
  var high = !settled && riskIsHigh(p)
  var badge = settled ? '已处理' : (isApproval ? (high ? '高危' : '待批准') : '待回答')
  var head = '<div class="pending-card approval-card' + (riskOpenOf(id) ? ' risk-open' : '') +
    '" data-pending-id="' + esc(id) + '"' +
    (canDecide ? ' data-expires="' + esc(String(p.expiresAt || 0)) + '"' : '') + '>' +
    '<span class="badge' + (settled ? ' handled' : (high ? ' risk' : '')) + '">' + esc(badge) + '</span>' +
    '<span class="body"><span class="title">' + esc(p.title || (isApproval ? '工具调用' : '一个问题')) + '</span>' +
    '<span class="summary">' + esc(summary) + '</span>' +
    (settled ? '' : riskNoteHtml(p)) +
    (who ? '<span class="summary">' + esc((isApproval ? '需要批准' : '需要回答') + ' · ' + who) + '</span>' : '')
  if (settled) {
    return head + '<span class="approval-state' + (settled.delegated ? ' delegated' : '') + '">' +
      esc(settled.text) + '</span></span></div>'
  }
  if (isQuestion) {
    if (canDecide && questionItemsOf(p).length) {
      // 提问卡自己带 badge / 倒计时 / 提交键，复用同一套结构。
      return questionCardHtml(p)
    }
    return head + '<span class="approval-hint">这道题需要到桌面回答</span></span></div>'
  }
  if (!isApproval) {
    // 未知类型的待办：给一个明确的去处，不假装能在这里处理。
    return head + '<span class="approval-actions"><button type="button" class="approval-allow" data-answer="' +
      esc(homeSessionOf(p)) + '">去处理</button></span></span></div>'
  }
  if (!canDecide) {
    return head + '<span class="approval-hint">这件事需要到桌面确认</span></span></div>'
  }
  var timeoutMs = Number(p.timeoutMs) > 0 ? Number(p.timeoutMs) : 120000
  return head +
    '<span class="approval-left" data-left>剩余 ' + esc(fmtApprovalLeft(Number(p.expiresAt) - Date.now())) + '</span>' +
    approvalActionsHtml(p, id) +
    '<span class="approval-hint" data-hint>' + esc(Math.round(timeoutMs / 1000)) + ' 秒无响应会退回桌面</span>' +
    '<span class="approval-state" data-state hidden></span>' +
    '</span></div>'
}

/** 待办区。多件时只展开第一件：其余折成一行「还有 N 件」，点开才展开。
 *  轮询每 5 秒一次，所以按内容指纹去重 —— 否则手指还没抬起来，按钮就被重建了。 */
function renderHomeTodo(force){
  var box = $('homeTodo')
  if (!box) return
  var list = homePending()
  var sig = list.map(function(p){
    var id = String((p && p.id) || '')
    return id + ':' + (p && p.canDecide === true ? '1' : '0') + ':' +
      (Number(p && p.expiresAt) || 0) + ':' + (HOME.settled[id] ? 's' : '') + ':' + HOME.more
  }).join('|')
  // 只有内容真的变了才重建：每 5 秒轮询一次，重建会打断正在按下的手指。
  // dirty 是"刚处理过一张卡"的显式标记，不能靠清空 sig 表达 —— 空列表的 sig 也是
  // 空字符串，会被当成"和上次一样"而原地不动。
  if (!force && !HOME.dirty && sig === HOME.todoSig && box.childNodes.length) return
  HOME.todoSig = sig
  HOME.dirty = false
  box.textContent = ''
  if (!list.length) { HOME.more = false; return }

  var first = document.createElement('div')
  first.className = 'home-todo'
  first.innerHTML = homeCardHtml(list[0])
  box.appendChild(first)

  if (list.length > 1) {
    var rest = document.createElement('div')
    rest.className = 'home-more'
    rest.id = 'homeTodoMore'
    rest.hidden = !HOME.more
    var restInner = document.createElement('div')
    restInner.className = 'home-todo'
    var h = ''
    for (var i = 1; i < list.length; i++) h += homeCardHtml(list[i])
    restInner.innerHTML = h
    rest.appendChild(restInner)
    box.appendChild(rest)

    var more = document.createElement('button')
    more.type = 'button'
    more.id = 'homeMoreBtn'
    more.className = 'home-more-btn'
    more.setAttribute('aria-expanded', HOME.more ? 'true' : 'false')
    more.setAttribute('aria-controls', 'homeTodoMore')
    more.innerHTML = '<span class="n">' + (HOME.more ? '收起' : '还有 ' + (list.length - 1) + ' 件') + '</span>' +
      '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>'
    more.addEventListener('click', function(){
      HOME.more = !HOME.more
      renderHomeTodo(true)
      bindApprovals()
    })
    box.appendChild(more)
  }
  bindApprovals()
}

/** 在跑区：最多三条，标题 + 一句最新动作 + 已运行时长；点进去看会话。 */
function homeRunning(){
  var arr = (homeData().sessions || []).filter(function(s){ return s && s.running === true })
  arr.sort(function(a, b){ return (Number(b.lastActivity) || 0) - (Number(a.lastActivity) || 0) })
  return arr.slice(0, 3)
}
function homeRunText(s){
  var bits = []
  var tool = String(s.lastTool || '')
  if (tool) bits.push(toolLabel(tool))
  if (typeof s.stepsInTurn === 'number' && s.stepsInTurn > 0) bits.push('第 ' + s.stepsInTurn + ' 步')
  if (!bits.length) bits.push('正在运行')
  if (typeof s.activeJobs === 'number' && s.activeJobs > 0) bits.push(s.activeJobs + ' 个后台任务')
  return bits.join(' · ')
}
function homeRunDur(s){
  var start = Number(s.turnStartedAt) || 0
  if (start > 0) return '已跑 ' + fmtDuration(Date.now() - start)
  var last = Number(s.lastActivity) || 0
  return last ? '活跃 ' + hhmm(last) : ''
}
function renderHomeRun(){
  var box = $('homeRun')
  if (!box) return
  box.textContent = ''
  var list = homeRunning()
  if (!list.length) {
    var idle = document.createElement('div')
    idle.className = 'home-idle'
    idle.textContent = lastData ? '现在没有会话在跑' : '读取中…'
    box.appendChild(idle)
    return
  }
  for (var i = 0; i < list.length; i++) {
    var s = list[i]
    var row = document.createElement('button')
    row.type = 'button'
    row.className = 'runrow'
    row.setAttribute('data-sess', String(s.id))
    var g = document.createElement('span')
    g.className = 'g'
    var t = document.createElement('span')
    t.className = 't'
    t.textContent = String(s.title || titles[s.id] || shortId(s.id))
    var m = document.createElement('span')
    m.className = 'm'
    m.textContent = homeRunText(s)
    g.appendChild(t); g.appendChild(m)
    var d = document.createElement('span')
    d.className = 'd'
    d.textContent = homeRunDur(s)
    row.appendChild(g); row.appendChild(d)
    var chev = document.createElement('svg')
    chev.setAttribute('viewBox', '0 0 24 24')
    chev.setAttribute('aria-hidden', 'true')
    var path = document.createElement('path')
    path.setAttribute('d', 'M9 6l6 6-6 6')
    chev.appendChild(path)
    row.appendChild(chev)
    row.setAttribute('aria-label', '进入会话：' + t.textContent + '，' + m.textContent)
    ;(function(id){
      row.addEventListener('click', function(){ openSession(id) })
    })(String(s.id))
    box.appendChild(row)
  }
}

/** 其他计数：一行说完，不做仪表盘。宿主没给的项不补 0。 */
function renderHomeCounts(){
  var box = $('homeCounts')
  if (!box) return
  var d = homeData()
  var t = d.totals || {}
  var bits = []
  if (t.jobs) bits.push('后台任务 ' + (t.jobsRunning || 0) + ' 在跑 / 共 ' + t.jobs)
  if (t.subagents) bits.push('子代理 ' + t.subagents)
  var today = d.today
  if (today && !today.partial && (today.turns || today.steps)) {
    bits.push('今日 ' + fmtCount(today.turns || 0) + ' 轮 / ' + fmtCount(today.steps || 0) + ' 步')
  }
  box.textContent = bits.join(' · ')
  box.hidden = bits.length === 0
}

/** 「继续上次会话」认的是 selectSession 写进 localStorage 的那一条；
 *  没有记录就退到当前会话、再退到第一个根会话。 */
function lastSessionId(){
  var id = ''
  try { id = localStorage.getItem('taskwatch.session') || '' } catch (e) {}
  if (!id) id = S.sessionId || ''
  if (!id) id = firstRootId()
  return String(id || '')
}
function renderHomeEntry(){
  var btn = $('homeResume')
  if (!btn) return
  var id = lastSessionId()
  btn.disabled = !id
  var label = ''
  for (var i = 0; i < S.sessions.length; i++) {
    if (String(S.sessions[i].id) === id) { label = S.sessions[i].title || titles[id] || ''; break }
  }
  if (!label) label = titles[id] || ''
  btn.setAttribute('aria-label', '继续上次会话' + (label ? '：' + label : ''))
  btn.textContent = '继续上次会话'
}
function renderHomeErr(){
  var box = $('homeErr')
  if (!box) return
  var st = homeStale()
  box.hidden = !st
  if (!st) return
  var span = box.querySelector('span')
  if (span) {
    span.textContent = st.error + ' · 下面是你上次看到的状态' + (st.at ? '（' + hhmm(st.at) + '）' : '')
  }
}
function renderHomeTitle(){
  var el = $('sessTitle')
  if (!el) return
  var n = homePending().length
  el.textContent = n > 0 ? ('在等你 ' + n + ' 件') : '暂时没有需要你的'
  el.classList.toggle('home-n', n > 0)
}
function renderHome(){
  if (!S.home) return
  renderHomeTitle()
  renderHomeTodo(false)
  renderHomeRun()
  renderHomeCounts()
  renderHomeEntry()
  renderHomeErr()
}

// ---------------------------------------------------------------------------
// 会话切换
// ---------------------------------------------------------------------------
/** 切会话。opts.agent 明确表示"这是子代理二级视图"（路由进来时用），
 *  opts.root 表示"回到主对话"。两者都不传时按会话自身的 origin/depth 判断。
 *
 *  只显示当前会话的保证分三层：
 *   1. 同步清空 S.items 与 DOM（renderAll），旧条目不可能继续挂着；
 *   2. S.epoch +1 并打 data-session 戳，异步回包凭它丢弃；
 *   3. SSE 的 SEQ 与 sid 双保险（见 openStream）。
 */
function selectSession(id, opts){
  var o = opts || {}
  var oldSession = S.sessionId
  // 自检取样：切走之前，记住旧会话最后一条正文的开头。下一次自检据此断言
  // 新会话的 DOM 里**不含**这段文字（不是"看起来没混"，而是能算出来的断言）。
  S.prevSessionId = oldSession || ''
  S.prevSessionSample = ''
  if (S.items.length) {
    var lastIt = S.items[S.items.length - 1]
    var sample = String((lastIt && lastIt.text) || '').replace(/\s+/g, ' ').trim()
    if (sample.length >= 8) S.prevSessionSample = sample.slice(0, Math.min(48, sample.length))
  }
  var agent = !!o.agent || (!o.root && isSubAgentId(id))
  // 切会话时清掉尚未交给服务端的临时预览。正在发送的请求由 send() 的
  // finally 分支收尾；这样既不泄漏 blob URL，也不会把旧会话的缩略图留在新会话里。
  if (oldSession && S.pendingAttachments.length && !sendingSessions[oldSession]) dropPending()
  if (oldSession) {
    saveDraftNow()                       // 先按旧 sessionId 落盘，再切
    attachmentDrafts[oldSession] = { attachments:S.attachments, text:$('input').value }
  }
  S.sessionId = id
  S.epoch++
  S.agentView = agent
  // 看子代理时不动 rootId：返回主对话要回到原来那条根会话。
  if (agent) S.viewingAgent = id
  else { S.viewingAgent = ''; S.rootId = id }
  // 子代理对话只读：宿主拒绝往子代理会话发 prompt，输入框留着只会让人白试一次。
  var inp = $('input')
  if (inp) {
    if (!S.inputPh) S.inputPh = inp.getAttribute('placeholder') || ''
    inp.disabled = agent
    inp.setAttribute('placeholder', agent ? '子代理会话 · 只读' : S.inputPh)
  }
  // 草稿优先取内存里的（同一页面内切来切去），没有就取 localStorage（刷新后恢复）。
  var draft = attachmentDrafts[id] || { attachments:[], text:getDraft(id) }
  S.attachments = draft.attachments
  $('input').value = draft.text || getDraft(id)
  attachmentNotice(draft.error || '')
  renderAttachmentTray(); autoGrow(); wakeComposer()
  try { localStorage.setItem('taskwatch.session', id) } catch (e) {}
  var label = shortId(id)
  S.workspace = ''
  for (var i = 0; i < S.sessions.length; i++) {
    if (S.sessions[i].id === id) {
      label = S.sessions[i].title || titles[id] || S.sessions[i].fallback || label
      S.workspace = S.sessions[i].cwd || S.sessions[i].workspace || ''
      break
    }
  }
  // 子代理会话不在 /chat/sessions 里（宿主有意过滤），标题得从 /taskwatch/data 取，
  // 否则顶栏只剩一串 uuid 前缀。
  if (agent) {
    var info = liveSessionById(id)
    if (info) {
      label = info.title || titles[id] || info.fallback || label
      S.workspace = info.cwd || info.workspace || ''
    } else {
      var entries = subagentEntries()
      for (var k = 0; k < entries.length; k++) if (entries[k].id === String(id)) { label = entries[k].label || label; break }
    }
  }
  S.provider = ''; S.model = ''; USAGE = null
  S.title = label
  // 首页的标题位写的是「在等你 N 件」：后台预热会话不该把它改成会话名。
  if (!S.home) $('sessTitle').textContent = label
  renderContext()
  S.items = []; S.seq = 0; S.running = false; S.streaming = null; S.pending = null; S.pendingAttachments = []
  S.turnStartedAt = 0; S.stepStartedAt = 0; S.lastUserAt = 0; S.lastAssistantIndex = -1
  renderAll()
  // 空会话时 renderAll 会提前返回（不经过 renderPending），这里补一次问答条。
  renderSessionAsk()
  // USAGE 在上面的分支里被清掉了；这里要立刻把指标行重画一遍，否则切到子代理后
  // 底栏还挂着父会话的 tok/s / 上下文，看起来像子代理自己的消耗。
  renderStats()
  syncSend()
  openStream()
  // 队列跟会话走：换会话就重新问一次（404 的宿主不会因为重复请求变成可用）。
  if (agent) {
    // 子代理会话没有可发消息的队列；把上一条会话的队列条清掉，不留假 UI。
    Q.items = []; Q.steering = []; Q.running = false; Q.note = ''; Q.noteBad = false
    renderQueue()
  } else {
    Q.sid = ''
    refreshQueue(true)
    loadUsage()
  }
  renderSubagentBar()
}

/** 子代理对话：只读历史快照。

 *  会直接回 `subagent Sessions require their durable parent address`。
 *  但只读的 /taskwatch/session?id= 走的是内存 store，**活的子代理会话读得到**
 *  （已用真实 DSH 验证：193 条消息），所以子代理页用这份快照渲染，不发、不流式。
 *

        hint: '', status: 'ok', time: at

    }
    var text = String(m.text == null ? '' : m.text)

async function ensureSession(){
  var r
  try {
    var res = await fetch('/taskwatch/chat/sessions', { cache:'no-store' })
    if (res.status === 404) { S.chatReady = false; setSub('对话功能不可用（宿主未注册接口）'); renderAll(); return }
    r = await res.json()
  } catch (e) {
    S.chatReady = false; setSub('对话功能不可用：' + e.message); renderAll(); return
  }
  if (r && r.error) { S.chatReady = false; setSub('对话功能不可用：' + r.error); renderAll(); return }
  S.sessions = (r && r.sessions) || []
  var saved = ''
  try { saved = localStorage.getItem('taskwatch.session') || '' } catch (e) {}
  // 主界面只自动落到**根会话**上；子代理会话只能从「子代理」入口进，
  // 否则刷新一次就可能把二级视图当成主对话，返回键也就无处可回。
  var roots = S.sessions.filter(function(s){ return !isSubSession(s) })
  var pool = roots.length ? roots : S.sessions
  var pick = ''
  for (var i = 0; i < pool.length; i++) { if (pool[i].id === saved) { pick = saved; break } }
  if (!pick && pool.length) pick = pool[0].id
  if (pick) selectSession(pick, { root:true })
  else setSub('还没有会话，点右上角开一个')
  renderSubagentBar()
}

// ---------------------------------------------------------------------------
// 子代理：工具条入口 + 全屏二级页（v1.7.6）
//
// 数据来源是真实的，不猜字段：
//   /taskwatch/data 的 sessions[] 带 origin / parent / depth（宿主 lib/index.js:540-553），
//   子代理会话 = origin === 'subagent' 或 depth > 0；
//   data.subagents[] 是 subagents 服务投影出来的子代理清单（agent 侧可能有、会话侧未必有）。
// 两边按 id 去重合并：有会话的可以点进去看，没有会话的只显示状态，不伪造对话。
//
// 路由：#subagents（列表）/ #subagents/<id>（该子代理的对话）。
// 看子代理对话时主界面的 sessionId 就是它，返回时切回 S.rootId —— 会话隔离仍然
// 由 selectSession 的同一套清空 + 戳记保证，不另开一条渲染管线。
// ---------------------------------------------------------------------------
function isSubSession(s){
  if (!s) return false
  if (String(s.origin || '') === 'subagent') return true
  return (Number(s.depth) || 0) > 0
}
function sessionById(id){
  var sid = String(id || '')
  for (var i = 0; i < S.sessions.length; i++) if (String(S.sessions[i].id) === sid) return S.sessions[i]
  return null
}
function liveSessionById(id){
  var sid = String(id || '')
  var arr = (lastData && Array.isArray(lastData.sessions)) ? lastData.sessions : []
  for (var i = 0; i < arr.length; i++) if (String(arr[i].id) === sid) return arr[i]
  return null
}
function isSubAgentId(id){ return isSubSession(sessionById(id)) }
function firstRootId(){
  for (var i = 0; i < S.sessions.length; i++) if (!isSubSession(S.sessions[i])) return S.sessions[i].id
  return S.sessions.length ? S.sessions[0].id : ''
}
function subagentEntries(){
  var out = [], seen = Object.create(null)
  function addSession(s){
    if (!isSubSession(s)) return
    var sid = String(s.id)
    if (seen[sid]) return
    seen[sid] = 1
    out.push({
      id: sid,
      label: s.title || titles[sid] || s.fallback || shortId(sid),
      activity: s.running ? 'running' : 'idle',
      running: !!s.running,
      parent: s.parent ? String(s.parent) : '',
      depth: Number(s.depth) || 1,
      hasSession: true
    })
  }
  // S.sessions 来自 /chat/sessions，宿主**故意过滤掉**子代理（lib/index.js:1143）；
  // /taskwatch/data 的 sessions 才是含子代理的完整 live 列表，必须并进来，
  // 否则「子代理」页只能看到状态、点不进任何一条对话。
  for (var i = 0; i < S.sessions.length; i++) addSession(S.sessions[i])
  var live = (lastData && Array.isArray(lastData.sessions)) ? lastData.sessions : []
  for (var j = 0; j < live.length; j++) addSession(live[j])
  var agents = (lastData && Array.isArray(lastData.subagents)) ? lastData.subagents : []
  for (var k = 0; k < agents.length; k++) {
    var a = agents[k] || {}
    var id = String(a.id || '')
    if (!id || seen[id]) continue
    seen[id] = 1
    out.push({
      id: id,
      label: a.label || (a.mode === 'workflow' ? '工作流子代理' : '子代理'),
      activity: a.activity || '',
      running: a.activity === 'running',
      parent: a.parent ? String(a.parent) : '',
      depth: Number(a.depth) || 1,
      // 只有登记在 live sessions 里的子代理才读得到对话（见 loadAgentTranscript）。
      hasSession: false
    })
  }
  out.sort(function(x, y){
    if (x.running !== y.running) return x.running ? -1 : 1
    return String(x.label) < String(y.label) ? -1 : String(x.label) > String(y.label) ? 1 : 0
  })
  return out
}

function devRel(t){
  var n = Number(t) || 0
  if (!n) return '最近活跃时间未知'
  var s = Math.max(0, Math.floor((Date.now() - n) / 1000))
  if (s < 45) return '刚刚活跃'
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + ' 分钟前'
  if (s < 86400) return Math.max(1, Math.round(s / 3600)) + ' 小时前'
  return Math.max(1, Math.round(s / 86400)) + ' 天前'

async function loadDevices(){
  if (DV.loading) return
  DV.loading = true
  DV.error = ''

    var r = await fetch('/taskwatch/devices', { cache:'no-store', credentials:'same-origin' })
    var d = null
    try { d = await r.json() } catch (e0) { d = null }
    if (r.status === 401) {
      if (d && d.code === 'device-revoked') { showRevoked(); return }
      throw new Error('HTTP 401')

    if (!r.ok) throw new Error('HTTP ' + r.status)
    if (!d || d.ok !== true) throw new Error((d && d.error) || '读取失败')

    DV.loaded = true
